<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/admin.css">
    <script src="/appearance.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Hashtag Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg-page); color: var(--text); min-height: 100vh; }

        .header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.3rem; font-weight: 600; }
        .header h1 span { color: var(--accent); }
        .nav { display: flex; gap: 0.75rem; }
        .nav a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s; }
        .nav a:hover { color: var(--text); background: var(--bg-raised); }

        .container { max-width: 960px; margin: 0 auto; padding: 1.5rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; }
        .card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 1rem; }

        .btn { padding: 0.6rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-raised); color: var(--text); font-size: 0.85rem; cursor: pointer; transition: all 0.2s; text-align: center; }
        .btn:hover { border-color: var(--accent); background: var(--accent-bg); }

        .hashtag-list { display: flex; flex-wrap: wrap; gap: 0.4rem; max-height: 300px; overflow-y: auto; }
        .hashtag-pill { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.6rem; border-radius: 20px; font-size: 0.8rem; cursor: default; }
        .hashtag-pill .tag { font-weight: 600; }
        .hashtag-pill .count { opacity: 0.7; font-size: 0.75rem; }
        .hashtag-pill .ban-btn { background: none; border: none; color: inherit; opacity: 0.5; cursor: pointer; font-size: 0.75rem; padding: 0 0.15rem; }
        .hashtag-pill .ban-btn:hover { opacity: 1; }
        .hashtag-pill.active { background: var(--accent-bg); border: 1px solid var(--border); color: var(--accent); }
        .hashtag-pill.banned { background: var(--danger-soft-bg); border: 1px solid color-mix(in srgb, var(--danger) 31%, transparent); color: var(--danger); }
        .hashtag-pill.banned .unban-btn { background: none; border: none; color: var(--danger); opacity: 0.6; cursor: pointer; font-size: 0.75rem; padding: 0 0.15rem; }
        .hashtag-pill.banned .unban-btn:hover { opacity: 1; }

        .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--accent-strong); color: white; padding: 0.75rem 1.25rem; border-radius: 8px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
        .toast.show { opacity: 1; }

        .nav .dropdown { position: relative; display: flex; align-items: center; }
        .nav .dropdown-toggle { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s; cursor: pointer; display: block; }
        .nav .dropdown-toggle:hover { color: var(--text); background: var(--bg-raised); }
        .nav .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.4rem 0; min-width: 180px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .nav .dropdown::after { content: ''; position: absolute; top: 100%; left: 0; right: 0; height: 8px; }
        .nav .dropdown:hover .dropdown-menu { display: block; }
        .nav .dropdown-menu a { display: block; padding: 0.5rem 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; transition: all 0.15s; }
        .nav .dropdown-menu a:hover { color: var(--text); background: var(--bg-raised); }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>StreamPulse <span>Hashtag Manager</span></h1>
        <div id="main-nav" class="nav"></div>
        <script src="/nav.js"></script>
    </div>

    <div class="container">
        <!-- Hashtag Moderation -->
        <div class="card">
            <h2>Hashtag Moderation</h2>
            <div style="display:flex;justify-content:flex-end;margin-bottom:0.75rem;">
                <a class="btn" href="/hashtag-stats.html"># View Hashtag Stats</a>
            </div>
            <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                <input type="text" id="ban-input" placeholder="#hashtag" style="flex: 1; padding: 0.5rem 0.75rem; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.9rem;">
                <button class="btn" onclick="banHashtag()" style="white-space: nowrap;">🚫 Ban</button>
            </div>

            <div id="banned-list" style="margin-bottom: 1.25rem;"></div>

            <h3 style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.75rem;">Active Hashtags (Session)</h3>
            <div id="session-hashtags" class="hashtag-list">
                <div style="color: var(--border-strong); text-align: center; padding: 0.5rem; font-size: 0.85rem;">No hashtags yet</div>
            </div>
        </div>

        <div class="card">
            <h2>Overlay</h2>
            <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:.6rem;">Build hashtag overlay URLs (scroll, grid or cloud) in the Overlay URL Wizard.</p>
            <a class="btn" href="/overlay-url-wizard.html?overlay=hashtags">Open Hashtag overlay wizard</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Hashtag moderation
    function renderBannedHashtags(banned) {
        const el = document.getElementById('banned-list');
        if (banned.length === 0) {
            el.innerHTML = '<div style="color: var(--border-strong); font-size: 0.8rem;">No banned hashtags</div>';
            return;
        }
        el.innerHTML = '<div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.5rem;">Banned</div>' +
            '<div class="hashtag-list">' + banned.map(tag =>
                `<span class="hashtag-pill banned">
                    <span class="tag">${escapeHtml(tag)}</span>
                    <button class="unban-btn" onclick="unbanHashtag('${escapeHtml(tag)}')" title="Unban">✕</button>
                </span>`
            ).join('') + '</div>';
    }

    function renderSessionHashtags(hashtags, banned) {
        const el = document.getElementById('session-hashtags');
        const filtered = hashtags.filter(h => !banned.includes(h.tag));
        if (filtered.length === 0) {
            el.innerHTML = '<div style="color: var(--border-strong); text-align: center; padding: 0.5rem; font-size: 0.85rem;">No hashtags yet</div>';
            return;
        }
        el.innerHTML = filtered.map(h =>
            `<span class="hashtag-pill active">
                <span class="tag">${escapeHtml(h.tag)}</span>
                <span class="count">×${h.count}</span>
                <button class="ban-btn" onclick="banHashtagDirect('${escapeHtml(h.tag)}')" title="Ban">🚫</button>
            </span>`
        ).join('');
    }

    async function refresh() {
        try {
            const hashRes = await fetch('/api/hashtags/banned');
            if (hashRes.ok) {
                const hashData = await hashRes.json();
                renderBannedHashtags(hashData.banned || []);
                renderSessionHashtags(hashData.session || [], hashData.banned || []);
            }
        } catch { /* ignore */ }
    }

    async function banHashtag() {
        const input = document.getElementById('ban-input');
        const tag = input.value.trim();
        if (!tag) return;
        try {
            const res = await fetch('/api/hashtags/banned', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tag })
            });
            const data = await res.json();
            if (data.status === 'banned') {
                showToast(`Banned ${data.tag}`);
                input.value = '';
                refresh();
            } else {
                showToast(data.error || 'Failed');
            }
        } catch { showToast('Ban failed'); }
    }

    async function banHashtagDirect(tag) {
        try {
            const res = await fetch('/api/hashtags/banned', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tag })
            });
            const data = await res.json();
            if (data.status === 'banned') {
                showToast(`Banned ${data.tag}`);
                refresh();
            }
        } catch { showToast('Ban failed'); }
    }

    async function unbanHashtag(tag) {
        try {
            const res = await fetch('/api/hashtags/banned', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tag })
            });
            const data = await res.json();
            if (data.status === 'unbanned') {
                showToast(`Unbanned ${data.tag}`);
                refresh();
            }
        } catch { showToast('Unban failed'); }
    }

    document.getElementById('ban-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') banHashtag();
    });

    refresh();
    setInterval(refresh, 5000);
    </script>
</body>
</html>

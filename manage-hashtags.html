<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Hashtag Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; }

        .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.3rem; font-weight: 600; }
        .header h1 span { color: #58a6ff; }
        .nav { display: flex; gap: 0.75rem; }
        .nav a { color: #8b949e; text-decoration: none; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s; }
        .nav a:hover { color: #e1e4e8; background: #21262d; }

        .container { max-width: 960px; margin: 0 auto; padding: 1.5rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.25rem; }
        .card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; color: #8b949e; margin-bottom: 1rem; }

        .btn { padding: 0.6rem 1rem; border: 1px solid #30363d; border-radius: 6px; background: #21262d; color: #e1e4e8; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; text-align: center; }
        .btn:hover { border-color: #58a6ff; background: #1a2332; }

        .hashtag-list { display: flex; flex-wrap: wrap; gap: 0.4rem; max-height: 300px; overflow-y: auto; }
        .hashtag-pill { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.6rem; border-radius: 20px; font-size: 0.8rem; cursor: default; }
        .hashtag-pill .tag { font-weight: 600; }
        .hashtag-pill .count { opacity: 0.7; font-size: 0.75rem; }
        .hashtag-pill .ban-btn { background: none; border: none; color: inherit; opacity: 0.5; cursor: pointer; font-size: 0.75rem; padding: 0 0.15rem; }
        .hashtag-pill .ban-btn:hover { opacity: 1; }
        .hashtag-pill.active { background: #1a2332; border: 1px solid #30363d; color: #58a6ff; }
        .hashtag-pill.banned { background: #2d1b1e; border: 1px solid #f8514950; color: #f85149; }
        .hashtag-pill.banned .unban-btn { background: none; border: none; color: #f85149; opacity: 0.6; cursor: pointer; font-size: 0.75rem; padding: 0 0.15rem; }
        .hashtag-pill.banned .unban-btn:hover { opacity: 1; }

        .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1f6feb; color: white; padding: 0.75rem 1.25rem; border-radius: 8px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
        .toast.show { opacity: 1; }

        .nav .dropdown { position: relative; display: flex; align-items: center; }
        .nav .dropdown-toggle { color: #8b949e; text-decoration: none; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s; cursor: pointer; display: block; }
        .nav .dropdown-toggle:hover { color: #e1e4e8; background: #21262d; }
        .nav .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 0.4rem 0; min-width: 180px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .nav .dropdown::after { content: ''; position: absolute; top: 100%; left: 0; right: 0; height: 8px; }
        .nav .dropdown:hover .dropdown-menu { display: block; }
        .nav .dropdown-menu a { display: block; padding: 0.5rem 1rem; color: #8b949e; text-decoration: none; font-size: 0.85rem; transition: all 0.15s; }
        .nav .dropdown-menu a:hover { color: #e1e4e8; background: #21262d; }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>StreamPulse <span>Hashtag Manager</span></h1>
        <div id="main-nav" class="nav"></div>
        <script src="/nav.js"></script>
    </div>

    <div class="container">
        <!-- Hashtag Moderation -->
        <div class="card">
            <h2>Hashtag Moderation</h2>
            <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                <input type="text" id="ban-input" placeholder="#hashtag" style="flex: 1; padding: 0.5rem 0.75rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8; font-size: 0.9rem;">
                <button class="btn" onclick="banHashtag()" style="white-space: nowrap;">🚫 Ban</button>
            </div>

            <div id="banned-list" style="margin-bottom: 1.25rem;"></div>

            <h3 style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: #8b949e; margin-bottom: 0.75rem;">Active Hashtags (Session)</h3>
            <div id="session-hashtags" class="hashtag-list">
                <div style="color: #484f58; text-align: center; padding: 0.5rem; font-size: 0.85rem;">No hashtags yet</div>
            </div>
        </div>

        <!-- Hashtag Overlay Builder -->
        <div class="card">
            <h2>Hashtag Overlay Builder</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem;">
                <div>
                    <label style="font-size: 0.75rem; color: #8b949e; display: block; margin-bottom: 0.25rem;">View Mode</label>
                    <select id="ht-view" onchange="updateHashtagUrl()" style="width: 100%; padding: 0.4rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8;">
                        <option value="scroll">Scroll (credits-style)</option>
                        <option value="grid">Grid / Cloud</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: #8b949e; display: block; margin-bottom: 0.25rem;">Sort By</label>
                    <select id="ht-sort" onchange="updateHashtagUrl()" style="width: 100%; padding: 0.4rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8;">
                        <option value="count">Most Used</option>
                        <option value="alpha">Alphabetical</option>
                        <option value="recent">Most Recent</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: #8b949e; display: block; margin-bottom: 0.25rem;">Columns (scroll)</label>
                    <select id="ht-columns" onchange="updateHashtagUrl()" style="width: 100%; padding: 0.4rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8;">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3" selected>3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: #8b949e; display: block; margin-bottom: 0.25rem;">Size</label>
                    <select id="ht-size" onchange="updateHashtagUrl()" style="width: 100%; padding: 0.4rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8;">
                        <option value="sm">Small</option>
                        <option value="md" selected>Medium</option>
                        <option value="lg">Large</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: #8b949e; display: block; margin-bottom: 0.25rem;">Limit (0 = all)</label>
                    <input type="number" id="ht-limit" value="0" min="0" onchange="updateHashtagUrl()" style="width: 100%; padding: 0.4rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8;">
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: #8b949e; display: block; margin-bottom: 0.25rem;">Min Count (0 = all)</label>
                    <input type="number" id="ht-min" value="0" min="0" onchange="updateHashtagUrl()" style="width: 100%; padding: 0.4rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8;">
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: #8b949e; display: block; margin-bottom: 0.25rem;">Last N Days (0 = all)</label>
                    <input type="number" id="ht-days" value="0" min="0" onchange="updateHashtagUrl()" style="width: 100%; padding: 0.4rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8;">
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: #8b949e; display: block; margin-bottom: 0.25rem;">From Date</label>
                    <input type="date" id="ht-from" onchange="updateHashtagUrl()" style="width: 100%; padding: 0.4rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8;">
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: #8b949e; display: block; margin-bottom: 0.25rem;">To Date</label>
                    <input type="date" id="ht-to" onchange="updateHashtagUrl()" style="width: 100%; padding: 0.4rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8;">
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: #8b949e; display: block; margin-bottom: 0.25rem;">Title</label>
                    <input type="text" id="ht-title" value="All Hashtags" onchange="updateHashtagUrl()" style="width: 100%; padding: 0.4rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8;">
                </div>
                <div id="ht-duration-wrap">
                    <label style="font-size: 0.75rem; color: #8b949e; display: block; margin-bottom: 0.25rem;">Duration (0 = auto)</label>
                    <input type="number" id="ht-duration" value="0" min="0" onchange="updateHashtagUrl()" style="width: 100%; padding: 0.4rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8;">
                </div>
            </div>
            <div style="display: flex; gap: 0.75rem; margin-top: 0.75rem; align-items: center; flex-wrap: wrap;">
                <label style="font-size: 0.8rem; color: #8b949e; display: flex; align-items: center; gap: 0.3rem;">
                    <input type="checkbox" id="ht-counts" checked onchange="updateHashtagUrl()"> Show counts
                </label>
                <label id="ht-weight-wrap" style="font-size: 0.8rem; color: #8b949e; display: none; align-items: center; gap: 0.3rem;">
                    <input type="checkbox" id="ht-weight" onchange="updateHashtagUrl()"> Weighted sizing (cloud)
                </label>
                <label id="ht-scroll-wrap" style="font-size: 0.8rem; color: #8b949e; display: none; align-items: center; gap: 0.3rem;">
                    <input type="checkbox" id="ht-autoscroll" onchange="updateHashtagUrl()"> Auto-scroll overflow
                </label>
            </div>
            <div style="margin-top: 0.75rem; padding: 0.6rem 0.75rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; display: flex; align-items: center; gap: 0.5rem;">
                <code id="ht-url" style="flex: 1; font-size: 0.8rem; color: #58a6ff; word-break: break-all; font-family: monospace; text-shadow: none;"></code>
                <button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('ht-url').textContent); showToast('URL copied!')" style="white-space: nowrap; font-size: 0.75rem;">📋 Copy</button>
                <button class="btn" onclick="window.open(document.getElementById('ht-url').textContent, '_blank')" style="white-space: nowrap; font-size: 0.75rem;">🔗 Preview</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Overlay URL builder
    function updateHashtagUrl() {
        const view = document.getElementById('ht-view').value;
        const isGrid = view === 'grid';

        document.getElementById('ht-weight-wrap').style.display = isGrid ? 'flex' : 'none';
        document.getElementById('ht-scroll-wrap').style.display = isGrid ? 'flex' : 'none';
        document.getElementById('ht-duration-wrap').style.display = isGrid ? 'none' : '';

        const params = new URLSearchParams();
        params.set('view', view);
        params.set('sort', document.getElementById('ht-sort').value);
        if (!isGrid) params.set('columns', document.getElementById('ht-columns').value);
        params.set('size', document.getElementById('ht-size').value);

        const limit = parseInt(document.getElementById('ht-limit').value) || 0;
        if (limit > 0) params.set('limit', limit);

        const min = parseInt(document.getElementById('ht-min').value) || 0;
        if (min > 0) params.set('min', min);

        const days = parseInt(document.getElementById('ht-days').value) || 0;
        if (days > 0) params.set('days', days);

        const from = document.getElementById('ht-from').value;
        const to = document.getElementById('ht-to').value;
        if (from) params.set('from', from);
        if (to) params.set('to', to);

        const title = document.getElementById('ht-title').value;
        if (title && title !== 'All Hashtags') params.set('title', title);

        const duration = parseInt(document.getElementById('ht-duration').value) || 0;
        if (!isGrid && duration > 0) params.set('duration', duration);

        if (!document.getElementById('ht-counts').checked) params.set('counts', 'false');
        if (isGrid && document.getElementById('ht-weight').checked) params.set('weight', 'true');
        if (isGrid && document.getElementById('ht-autoscroll').checked) params.set('scroll', 'true');

        const base = `${location.protocol}//${location.host}/hashtags.html`;
        document.getElementById('ht-url').textContent = `${base}?${params.toString()}`;
    }

    // Hashtag moderation
    function renderBannedHashtags(banned) {
        const el = document.getElementById('banned-list');
        if (banned.length === 0) {
            el.innerHTML = '<div style="color: #484f58; font-size: 0.8rem;">No banned hashtags</div>';
            return;
        }
        el.innerHTML = '<div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: #8b949e; margin-bottom: 0.5rem;">Banned</div>' +
            '<div class="hashtag-list">' + banned.map(tag =>
                `<span class="hashtag-pill banned">
                    <span class="tag">${escapeHtml(tag)}</span>
                    <button class="unban-btn" onclick="unbanHashtag('${escapeHtml(tag)}')" title="Unban">✕</button>
                </span>`
            ).join('') + '</div>';
    }

    function renderSessionHashtags(hashtags, banned) {
        const el = document.getElementById('session-hashtags');
        const filtered = hashtags.filter(h => !banned.includes(h.tag));
        if (filtered.length === 0) {
            el.innerHTML = '<div style="color: #484f58; text-align: center; padding: 0.5rem; font-size: 0.85rem;">No hashtags yet</div>';
            return;
        }
        el.innerHTML = filtered.map(h =>
            `<span class="hashtag-pill active">
                <span class="tag">${escapeHtml(h.tag)}</span>
                <span class="count">×${h.count}</span>
                <button class="ban-btn" onclick="banHashtagDirect('${escapeHtml(h.tag)}')" title="Ban">🚫</button>
            </span>`
        ).join('');
    }

    async function refresh() {
        try {
            const hashRes = await fetch('/api/hashtags/banned');
            if (hashRes.ok) {
                const hashData = await hashRes.json();
                renderBannedHashtags(hashData.banned || []);
                renderSessionHashtags(hashData.session || [], hashData.banned || []);
            }
        } catch { /* ignore */ }
    }

    async function banHashtag() {
        const input = document.getElementById('ban-input');
        const tag = input.value.trim();
        if (!tag) return;
        try {
            const res = await fetch('/api/hashtags/banned', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tag })
            });
            const data = await res.json();
            if (data.status === 'banned') {
                showToast(`Banned ${data.tag}`);
                input.value = '';
                refresh();
            } else {
                showToast(data.error || 'Failed');
            }
        } catch { showToast('Ban failed'); }
    }

    async function banHashtagDirect(tag) {
        try {
            const res = await fetch('/api/hashtags/banned', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tag })
            });
            const data = await res.json();
            if (data.status === 'banned') {
                showToast(`Banned ${data.tag}`);
                refresh();
            }
        } catch { showToast('Ban failed'); }
    }

    async function unbanHashtag(tag) {
        try {
            const res = await fetch('/api/hashtags/banned', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tag })
            });
            const data = await res.json();
            if (data.status === 'unbanned') {
                showToast(`Unbanned ${data.tag}`);
                refresh();
            }
        } catch { showToast('Unban failed'); }
    }

    document.getElementById('ban-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') banHashtag();
    });

    refresh();
    updateHashtagUrl();
    setInterval(refresh, 5000);
    </script>
</body>
</html>

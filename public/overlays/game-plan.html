<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse Game Plan Overlay</title>
    <style>
        :root {
            --gp-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --gp-bg: rgba(13, 17, 23, 0.88);
            --gp-border: rgba(255, 255, 255, 0.12);
            --gp-text: #f0f6fc;
            --gp-muted: #8b949e;
            --gp-accent: #3b82f6;
            --gp-now-bg: rgba(35, 134, 54, 0.25);
            --gp-now-border: #238636;
            --gp-now-text: #3fb950;
            --gp-font-scale: 1;
            --gp-cover-scale: 1;
            --gp-cover-fit: cover;
        }

        .ico {
            width: 1em;
            height: 1em;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            vertical-align: -0.15em;
            flex-shrink: 0;
            display: inline-block;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: var(--gp-font);
            color: var(--gp-text);
            -webkit-font-smoothing: antialiased;
        }

        /* Container */
        #container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(6px, 1.8vmin, 18px);
            box-sizing: border-box;
            min-width: 0;
            min-height: 0;
            container-type: size;
        }

        /* Theme Variants */
        body.theme-glass {
            --gp-bg: rgba(15, 23, 42, 0.72);
            --gp-border: rgba(255, 255, 255, 0.16);
        }
        body.theme-dark {
            --gp-bg: #0d1117;
            --gp-border: #30363d;
        }
        body.theme-purple {
            --gp-bg: #130e24;
            --gp-border: #3b2a68;
            --gp-accent: #8b5cf6;
        }
        body.theme-emerald {
            --gp-bg: #0a1813;
            --gp-border: #164635;
            --gp-accent: #10b981;
        }
        body.theme-sunset {
            --gp-bg: #1c0e18;
            --gp-border: #4d1d36;
            --gp-accent: #f43f5e;
        }
        body.theme-cyberpunk {
            --gp-bg: #080d1a;
            --gp-border: #1a2a4e;
            --gp-accent: #06b6d4;
        }
        body.theme-light {
            --gp-bg: #ffffff;
            --gp-border: #d0d7de;
            --gp-text: #1f2328;
            --gp-muted: #656d76;
            --gp-now-bg: #dafbe1;
            --gp-now-border: #1a7f37;
            --gp-now-text: #1a7f37;
        }
        body.theme-transparent {
            --gp-bg: transparent;
            --gp-border: transparent;
        }
        body.theme-custom {
            /* Inherits custom background, border, text and accent variables from inline styles */
        }
        body.theme-glass:not(.no-blur) .card, body.theme-glass:not(.no-blur) .ticker-bar, body.theme-glass:not(.no-blur) .schedule-card, body.theme-glass:not(.no-blur) .checklist-item,
        body.has-blur .card, body.has-blur .ticker-bar, body.has-blur .schedule-card, body.has-blur .checklist-item {
            backdrop-filter: blur(var(--gp-blur, 12px));
            -webkit-backdrop-filter: blur(var(--gp-blur, 12px));
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }
        body.no-blur .card, body.no-blur .ticker-bar, body.no-blur .schedule-card, body.no-blur .checklist-item {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        body.theme-transparent:not(.has-custom-bg) .card, 
        body.theme-transparent:not(.has-custom-bg) .ticker-bar, 
        body.theme-transparent:not(.has-custom-bg) .schedule-card, 
        body.theme-transparent:not(.has-custom-bg) .checklist-item {
            background: transparent !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        body.theme-transparent:not(.has-custom-border) .card, 
        body.theme-transparent:not(.has-custom-border) .ticker-bar, 
        body.theme-transparent:not(.has-custom-border) .schedule-card, 
        body.theme-transparent:not(.has-custom-border) .checklist-item {
            border-color: transparent !important;
        }

        /* Common Elements */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: calc(clamp(0.68rem, max(1.8vmin, 12cqh, 12vh), 1.6rem) * var(--gp-font-scale));
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: clamp(2px, 0.5vmin, 6px) clamp(6px, 1.4vmin, 14px);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--gp-muted);
            white-space: nowrap;
        }
        .badge-now {
            background: var(--gp-now-bg);
            border: 1px solid var(--gp-now-border);
            color: var(--gp-now-text);
            animation: pulse-glow 2s infinite ease-in-out;
        }
        .badge-next, .badge-tonight {
            background: color-mix(in srgb, var(--gp-accent) 18%, transparent);
            border: 1px solid color-mix(in srgb, var(--gp-accent) 45%, transparent);
            color: color-mix(in srgb, var(--gp-accent) 75%, #ffffff);
        }
        .badge-done {
            background: rgba(139, 148, 158, 0.2);
            color: var(--gp-muted);
            text-decoration: line-through;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.03); }
        }

        .cover-img {
            width: calc(clamp(38px, max(6vmin, 55cqh, 55vh), 130px) * var(--gp-cover-scale, 1));
            height: calc(clamp(52px, max(8vmin, 75cqh, 75vh), 180px) * var(--gp-cover-scale, 1));
            object-fit: var(--gp-cover-fit, cover);
            border-radius: clamp(4px, 1vmin, 8px);
            flex-shrink: 0;
            background: #161b22;
            border: 1px solid var(--gp-border);
        }
        .cover-img.small {
            width: calc(clamp(26px, max(4.5vmin, 38cqh, 38vh), 90px) * var(--gp-cover-scale, 1));
            height: calc(clamp(34px, max(6vmin, 50cqh, 50vh), 120px) * var(--gp-cover-scale, 1));
            object-fit: var(--gp-cover-fit, cover);
            border-radius: clamp(3px, 0.8vmin, 6px);
        }

        /* VIEW 1: TICKER (Lower-Third bar) */
        .view-ticker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
        }
        .ticker-bar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 2vmin, 20px);
            background: var(--gp-bg);
            border: 1px solid var(--gp-border);
            border-radius: clamp(8px, 1.8vmin, 16px);
            padding: clamp(6px, 1.6vmin, 14px) clamp(12px, 2.5vmin, 24px);
            max-width: 100%;
            box-sizing: border-box;
            flex-wrap: wrap;
        }
        .ticker-segment {
            display: flex;
            align-items: center;
            gap: clamp(6px, 1.5vmin, 14px);
            min-width: 0;
        }
        .ticker-divider {
            width: 1px;
            height: clamp(20px, 4vmin, 36px);
            background: var(--gp-border);
            margin: 0 clamp(2px, 0.6vmin, 6px);
            flex-shrink: 0;
        }
        .ticker-title {
            font-size: calc(clamp(0.95rem, max(2.8vmin, 24cqh, 24vh), 3.5rem) * var(--gp-font-scale));
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ticker-sub {
            font-size: calc(clamp(0.75rem, max(1.8vmin, 15cqh, 15vh), 2.2rem) * var(--gp-font-scale));
            color: var(--gp-muted);
            white-space: nowrap;
        }

        /* VIEW 2: SCHEDULE (Horizontal Cards Strip) */
        .view-schedule {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: clamp(8px, 2vmin, 18px);
            width: 100%;
            height: 100%;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            box-sizing: border-box;
            flex-wrap: wrap;
        }
        .schedule-card {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vmin, 16px);
            background: var(--gp-bg);
            border: 1px solid var(--gp-border);
            border-radius: clamp(8px, 1.8vmin, 14px);
            padding: clamp(8px, 2vmin, 18px) clamp(10px, 2.2vmin, 20px);
            flex: 1 1 clamp(180px, 24vmin, 340px);
            max-width: 440px;
            min-width: 0;
            position: relative;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .schedule-card.active {
            border-color: var(--gp-now-border);
            background: color-mix(in srgb, var(--gp-now-bg) 35%, var(--gp-bg));
            box-shadow: 0 0 16px rgba(35, 134, 54, 0.3);
        }
        .schedule-card.tonight:not(.active) {
            border-color: color-mix(in srgb, var(--gp-accent) 45%, var(--gp-border));
            box-shadow: 0 4px 18px color-mix(in srgb, var(--gp-accent) 14%, transparent);
        }
        .schedule-card.played {
            opacity: 0.65;
        }
        .schedule-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
            min-width: 0;
            flex: 1;
        }
        .schedule-title {
            font-size: calc(clamp(0.85rem, max(2.5vmin, 15cqh, 15vh), 2.6rem) * var(--gp-font-scale));
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .schedule-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* VIEW 3: CHECKLIST (Vertical Stack) */
        .view-checklist {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(6px, 1.6vmin, 12px);
            width: 100%;
            height: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        .checklist-item {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vmin, 14px);
            background: var(--gp-bg);
            border: 1px solid var(--gp-border);
            border-radius: clamp(6px, 1.5vmin, 12px);
            padding: clamp(6px, 1.8vmin, 14px) clamp(10px, 2vmin, 18px);
            position: relative;
            box-sizing: border-box;
        }
        .checklist-item.active {
            border-color: var(--gp-now-border);
            background: color-mix(in srgb, var(--gp-now-bg) 40%, var(--gp-bg));
            box-shadow: 0 0 14px rgba(35, 134, 54, 0.35);
        }
        .checklist-item.tonight:not(.active) {
            border-color: color-mix(in srgb, var(--gp-accent) 45%, var(--gp-border));
            box-shadow: 0 2px 14px color-mix(in srgb, var(--gp-accent) 12%, transparent);
        }
        .checklist-item.played {
            opacity: 0.6;
        }
        .checklist-idx {
            font-size: calc(clamp(0.75rem, max(2vmin, 8cqh, 8vh), 1.8rem) * var(--gp-font-scale));
            font-weight: 700;
            color: color-mix(in srgb, var(--gp-accent) 70%, var(--gp-muted));
            min-width: 20px;
        }
        .checklist-info {
            flex: 1;
            overflow: hidden;
            min-width: 0;
        }
        .checklist-title {
            font-size: calc(clamp(0.85rem, max(2.4vmin, 9cqh, 9vh), 2.4rem) * var(--gp-font-scale));
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .checklist-note {
            font-size: calc(clamp(0.72rem, max(1.8vmin, 7cqh, 7vh), 1.8rem) * var(--gp-font-scale));
            color: var(--gp-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .checklist-status {
            flex-shrink: 0;
        }

        .empty-placeholder {
            font-size: calc(clamp(0.85rem, max(2.2vmin, 8cqh, 8vh), 2.2rem) * var(--gp-font-scale));
            color: var(--gp-muted);
            padding: 8px 14px;
            background: var(--gp-bg);
            border: 1px dashed var(--gp-border);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <script src="/overlay-visibility.js" data-key="game-plan"></script>
    <script src="/url-params.js"></script>
    <script src="/overlay-theme.js"></script>
    <script>
    (function() {
        const params = overlayParams();
        const container = document.getElementById('container');

        const view = (params.get('view') || params.get('mode') || 'schedule').toLowerCase();
        const listFilter = params.get('list') || 'scheduled';
        const periodFilter = params.get('period') || '';
        const maxItems = Math.max(1, parseInt(params.get('max') || '5', 10));
        const showCovers = params.get('covers') !== '0';
        const showNotes = params.get('notes') !== '0';
        const showStatus = params.get('status') !== '0';
        const showGroups = params.get('groups') !== '0';
        const showDates = params.get('dates') !== '0';
        const theme = (params.get('theme') || 'glass').toLowerCase();
        const accent = params.get('accent') || '';
        const fontScaleParam = parseFloat(params.get('fontscale') || params.get('fontScale') || params.get('scale') || '1');
        const coverScaleParam = parseFloat(params.get('coverScale') || params.get('coverscale') || params.get('cscale') || '1');
        const coverFitParam = (params.get('coverFit') || params.get('coverfit') || '').toLowerCase();
        const align = (params.get('align') || 'center').toLowerCase();
        const sortMode = (params.get('sort') || 'plan').toLowerCase();

        if (!isNaN(coverScaleParam) && coverScaleParam > 0) {
            document.documentElement.style.setProperty('--gp-cover-scale', coverScaleParam);
            document.body.style.setProperty('--gp-cover-scale', coverScaleParam);
        }
        if (['cover', 'contain', 'fill'].includes(coverFitParam)) {
            document.documentElement.style.setProperty('--gp-cover-fit', coverFitParam);
            document.body.style.setProperty('--gp-cover-fit', coverFitParam);
        }

        if (['glass', 'dark', 'light', 'transparent', 'purple', 'emerald', 'sunset', 'cyberpunk', 'custom'].includes(theme)) {
            document.body.className = `theme-${theme}`;
        }

        const bgParam = params.get('bg');
        if (bgParam) {
            const val = decodeURIComponent(bgParam);
            document.documentElement.style.setProperty('--gp-bg', val);
            document.body.style.setProperty('--gp-bg', val);
            document.body.classList.add('has-custom-bg');
        }
        const borderParam = params.get('border');
        if (borderParam) {
            const val = decodeURIComponent(borderParam);
            document.documentElement.style.setProperty('--gp-border', val);
            document.body.style.setProperty('--gp-border', val);
            document.body.classList.add('has-custom-border');
        }
        const textParam = params.get('text');
        if (textParam) {
            const val = decodeURIComponent(textParam);
            document.documentElement.style.setProperty('--gp-text', val);
            document.body.style.setProperty('--gp-text', val);
            document.body.classList.add('has-custom-text');
        }
        const blurParam = params.get('blur');
        if (blurParam !== null && blurParam !== '') {
            const b = parseFloat(blurParam);
            if (!isNaN(b)) {
                document.documentElement.style.setProperty('--gp-blur', `${b}px`);
                document.body.style.setProperty('--gp-blur', `${b}px`);
                if (b > 0) {
                    document.body.classList.add('has-blur');
                    document.body.classList.remove('no-blur');
                } else {
                    document.body.classList.remove('has-blur');
                    document.body.classList.add('no-blur');
                }
            }
        }

        if (align === 'left' || align === 'start') {
            container.style.justifyContent = 'flex-start';
        } else if (align === 'right' || align === 'end') {
            container.style.justifyContent = 'flex-end';
        }
        if (accent) {
            const val = accent.startsWith('#') ? accent : `#${accent}`;
            document.documentElement.style.setProperty('--gp-accent', val);
            document.body.style.setProperty('--gp-accent', val);
        }
        if (!isNaN(fontScaleParam) && fontScaleParam > 0) {
            document.documentElement.style.setProperty('--gp-font-scale', fontScaleParam);
            document.body.style.setProperty('--gp-font-scale', fontScaleParam);
        }

        const fontParam = params.get('font');
        if (fontParam) {
            document.documentElement.style.setProperty('--gp-font', `"${fontParam}", system-ui, sans-serif`);
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(fontParam).replace(/%20/g, '+')}:wght@300;400;500;600;700;900&display=swap`;
            document.head.appendChild(link);
        }
        const weightParam = params.get('weight');
        if (weightParam) {
            const style = document.createElement('style');
            style.textContent = `body, body * { font-weight: ${weightParam} !important; }`;
            document.head.appendChild(style);
        }

        // Apply shared overlay theme from server config
        fetch('/api/config', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(cfg => {
            if (cfg?.theme) {
                applyOverlayTheme(cfg.theme, {
                    font: '--gp-font',
                    text: '--gp-text',
                    accent: '--gp-accent',
                    scale: '--gp-font-scale'
                }, { defaultFont: 'Segoe UI', fontFallback: 'system-ui, sans-serif' });
                if (accent) {
                    const val = accent.startsWith('#') ? accent : `#${accent}`;
                    document.documentElement.style.setProperty('--gp-accent', val);
                    document.body.style.setProperty('--gp-accent', val);
                }
                if (bgParam) {
                    const val = decodeURIComponent(bgParam);
                    document.documentElement.style.setProperty('--gp-bg', val);
                    document.body.style.setProperty('--gp-bg', val);
                }
                if (borderParam) {
                    const val = decodeURIComponent(borderParam);
                    document.documentElement.style.setProperty('--gp-border', val);
                    document.body.style.setProperty('--gp-border', val);
                }
                if (textParam) {
                    const val = decodeURIComponent(textParam);
                    document.documentElement.style.setProperty('--gp-text', val);
                    document.body.style.setProperty('--gp-text', val);
                }
            }
        }).catch(() => {});

        let currentPlan = null;

        const ICONS = {
            play: '<svg class="ico" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
            skip: '<svg class="ico" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>',
            bolt: '<svg class="ico" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
            calendar: '<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
            check: '<svg class="ico" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
            tag: '<svg class="ico" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>'
        };

        function esc(str) {
            return String(str || '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function renderTicker(items, playing) {
            if (!items.length && !playing) {
                container.innerHTML = '<div class="empty-placeholder">No games scheduled</div>';
                return;
            }

            const upNext = items.find(i => !i.playingNow && i.status !== 'played');
            let html = '<div class="view-ticker"><div class="ticker-bar">';

            if (playing) {
                html += `
                    <div class="ticker-segment">
                        <span class="badge badge-now">${ICONS.play} Playing Now</span>
                        ${showCovers && playing.cover ? `<img class="cover-img small" src="${esc(playing.cover)}" alt="">` : ''}
                        <div>
                            <div class="ticker-title">${esc(playing.name)}</div>
                            ${playing.period ? `<div class="ticker-sub">${esc(playing.period)}</div>` : ''}
                        </div>
                    </div>
                `;
            }

            if (playing && upNext) {
                html += '<div class="ticker-divider"></div>';
            }

            if (upNext) {
                html += `
                    <div class="ticker-segment">
                        <span class="badge badge-next">${ICONS.skip} Up Next</span>
                        ${showCovers && upNext.cover ? `<img class="cover-img small" src="${esc(upNext.cover)}" alt="">` : ''}
                        <div>
                            <div class="ticker-title">${esc(upNext.name)}</div>
                            ${upNext.period ? `<div class="ticker-sub">${esc(upNext.period)}</div>` : ''}
                        </div>
                    </div>
                `;
            }

            html += '</div></div>';
            container.innerHTML = html;
        }

        function renderSchedule(items, playing) {
            if (!items.length) {
                container.innerHTML = '<div class="empty-placeholder">No games scheduled</div>';
                return;
            }

            const listMap = new Map((currentPlan?.lists || []).map(l => [l.id, l.name]));

            let html = '<div class="view-schedule">';
            items.slice(0, maxItems).forEach(item => {
                const isNow = Boolean(item.playingNow);
                const isPlayed = item.status === 'played';
                const isTonight = item.status === 'tonight';
                const isOneOff = item.gameType === 'one-off';
                const customListName = listMap.get(item.status) || (item.extraLists || []).map(id => listMap.get(id)).find(Boolean) || '';

                const statusBadge = !showStatus ? '' : isNow ? `<span class="badge badge-now">${ICONS.play} Playing</span>` : (isPlayed ? `<span class="badge badge-done">${ICONS.check} Done</span>` : (isTonight ? '<span class="badge badge-tonight">Tonight</span>' : '<span class="badge">Scheduled</span>'));
                const groupBadge = showGroups && customListName ? `<span class="badge" style="background:rgba(139,92,246,0.2);color:#c084fc;border:1px solid rgba(139,92,246,0.4);">${ICONS.tag} ${esc(customListName)}</span>` : '';
                const typeBadge = isOneOff ? `<span class="badge" style="background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.35);">${ICONS.bolt} One-Off</span>` : '';
                const dateBadge = showDates && item.streamDate ? `<span class="badge">${ICONS.calendar} ${esc(item.streamDate)}</span>` : '';
                const periodBadge = showGroups && item.period ? `<span class="badge">${esc(item.period)}</span>` : '';

                html += `
                    <div class="schedule-card${isNow ? ' active' : ''}${isTonight ? ' tonight' : ''}${isPlayed ? ' played' : ''}">
                        ${showCovers && item.cover ? `<img class="cover-img" src="${esc(item.cover)}" alt="">` : ''}
                        <div class="schedule-info">
                            <div class="schedule-meta">
                                ${statusBadge}
                                ${groupBadge}
                                ${typeBadge}
                                ${dateBadge}
                                ${periodBadge}
                            </div>
                            <div class="schedule-title" title="${esc(item.name)}">${esc(item.name)}</div>
                            ${showNotes && item.note ? `<div class="checklist-note">${esc(item.note)}</div>` : ''}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function renderChecklist(items, playing) {
            if (!items.length) {
                container.innerHTML = '<div class="empty-placeholder">No games scheduled</div>';
                return;
            }

            const listMap = new Map((currentPlan?.lists || []).map(l => [l.id, l.name]));

            let html = '<div class="view-checklist">';
            items.slice(0, maxItems).forEach((item, idx) => {
                const isNow = Boolean(item.playingNow);
                const isPlayed = item.status === 'played';
                const isTonight = item.status === 'tonight';
                const isOneOff = item.gameType === 'one-off';
                const customListName = listMap.get(item.status) || (item.extraLists || []).map(id => listMap.get(id)).find(Boolean) || '';

                const statusBadge = !showStatus ? '' : isNow ? `<span class="badge badge-now">${ICONS.play} Now</span>` : (isPlayed ? `<span class="badge badge-done">${ICONS.check}</span>` : (isTonight ? '<span class="badge badge-tonight">Tonight</span>' : '<span class="badge">Next</span>'));
                const groupBadge = showGroups && customListName ? `<span class="badge" style="background:rgba(139,92,246,0.2);color:#c084fc;">${ICONS.tag} ${esc(customListName)}</span>` : '';
                const typeBadge = isOneOff ? `<span class="badge" style="background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.35);">${ICONS.bolt}</span>` : '';
                const dateText = showDates && item.streamDate ? `${item.streamDate}` : '';

                html += `
                    <div class="checklist-item${isNow ? ' active' : ''}${isTonight ? ' tonight' : ''}${isPlayed ? ' played' : ''}">
                        <span class="checklist-idx">${idx + 1}</span>
                        ${showCovers && item.cover ? `<img class="cover-img small" src="${esc(item.cover)}" alt="">` : ''}
                        <div class="checklist-info">
                            <div class="checklist-title">${esc(item.name)} ${typeBadge} ${groupBadge}</div>
                            ${showNotes && (item.note || item.period || dateText) ? `<div class="checklist-note">${esc([dateText, item.period, item.note].filter(Boolean).join(' · '))}</div>` : ''}
                        </div>
                        <div class="checklist-status">
                            ${statusBadge}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function matchesPeriodToken(item, token) {
            if (!item || !token) return true;
            const t = String(token).trim().toLowerCase();
            if (!t || t === 'all') return true;

            const itemDates = [
                item.streamDate,
                ...(Array.isArray(item.streamDates) ? item.streamDates.map(d => typeof d === 'string' ? d : d?.date) : [])
            ].filter(Boolean);

            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

            const tom = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const tomorrowStr = `${tom.getFullYear()}-${pad(tom.getMonth() + 1)}-${pad(tom.getDate())}`;

            const dayOfWeek = now.getDay();
            const diffToMon = (dayOfWeek + 6) % 7;
            const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMon);
            const weekStartStr = `${mon.getFullYear()}-${pad(mon.getMonth() + 1)}-${pad(mon.getDate())}`;
            const sun = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMon + 6);
            const weekEndStr = `${sun.getFullYear()}-${pad(sun.getMonth() + 1)}-${pad(sun.getDate())}`;

            const periodLower = String(item.period || '').trim().toLowerCase();

            if (t === '@today' || t === 'today' || t === 'tonight') {
                return item.status === 'tonight' ||
                       periodLower === 'tonight' ||
                       periodLower === 'today' ||
                       itemDates.includes(todayStr);
            }
            if (t === '@tomorrow' || t === 'tomorrow' || t === 'next-stream' || t === 'next stream') {
                return periodLower === 'next stream' ||
                       periodLower === 'next-stream' ||
                       periodLower === 'tomorrow' ||
                       itemDates.includes(tomorrowStr);
            }
            if (t === '@this-week' || t === 'this-week' || t === 'thisweek' || t === 'this week') {
                return periodLower === 'this week' ||
                       periodLower === 'weekend' ||
                       itemDates.some(d => d >= weekStartStr && d <= weekEndStr);
            }
            if (t === '@upcoming' || t === 'upcoming') {
                return itemDates.some(d => d >= todayStr) ||
                       Boolean(item.streamRecurring) ||
                       (periodLower && !['played', 'backlog'].includes(periodLower) && !['played', 'backlog'].includes(item.status));
            }
            if (t === '@unscheduled' || t === 'unscheduled' || t === 'none' || t === 'no-period' || t === 'undated') {
                return !periodLower && itemDates.length === 0;
            }

            if (t.startsWith('!')) {
                const notToken = t.slice(1).trim().toLowerCase();
                return periodLower !== notToken;
            }

            return periodLower === t;
        }

        function matchesPeriodFilter(item, wantedTokens) {
            if (!item) return false;
            if (!wantedTokens || !wantedTokens.length) return true;
            const tokens = (Array.isArray(wantedTokens) ? wantedTokens : String(wantedTokens).split(','))
                .map(t => String(t).trim())
                .filter(Boolean);
            if (!tokens.length) return true;

            const pos = tokens.filter(t => !t.startsWith('!'));
            const neg = tokens.filter(t => t.startsWith('!'));

            if (neg.some(t => !matchesPeriodToken(item, t))) {
                return false;
            }
            if (!pos.length) return true;
            return pos.some(t => matchesPeriodToken(item, t));
        }

        function render() {
            if (!currentPlan || !Array.isArray(currentPlan.items)) return;

            let items = currentPlan.items;

            // Filter by list (e.g. 'tonight', 'scheduled', 'scheduled-only', 'up-next', 'backlog', 'all', or custom list id)
            if (listFilter) {
                if (listFilter === 'scheduled') {
                    items = items.filter(i => i.status === 'scheduled' || i.status === 'tonight' || (i.extraLists || []).includes('scheduled'));
                } else if (listFilter === 'scheduled-only') {
                    items = items.filter(i => (i.status === 'scheduled' || (i.extraLists || []).includes('scheduled')) && i.status !== 'tonight');
                } else if (listFilter !== 'all') {
                    items = items.filter(i => i.status === listFilter || (i.extraLists || []).includes(listFilter));
                }
            }

            // Filter by period if specified
            if (periodFilter) {
                items = items.filter(i => matchesPeriodFilter(i, periodFilter));
            }

            // Sort items if sort param is specified
            const order = (currentPlan?.periods || []).map(name => String(name).toLowerCase());
            const rank = item => { const at = order.indexOf(String(item.period || '').toLowerCase()); return at < 0 ? order.length : at; };
            const listMap = new Map((currentPlan?.lists || []).map(l => [l.id, l.name]));
            const dateVal = item => item.streamDate || item.finished || (Array.isArray(item.played) ? item.played[0] : '') || '';
            const groupVal = item => listMap.get(item.status) || (item.extraLists || []).map(id => listMap.get(id)).find(Boolean) || item.period || '';
            const STATUS_PRIORITY = { tonight: 1, scheduled: 2, 'up-next': 3, backlog: 4, played: 5 };

            if (sortMode === 'date' || sortMode === 'date-asc') {
                items = [...items].sort((a, b) => {
                    const dA = dateVal(a), dB = dateVal(b);
                    if (dA && dB) return dA.localeCompare(dB) || String(a.name).localeCompare(String(b.name));
                    if (dA && !dB) return -1;
                    if (!dA && dB) return 1;
                    return rank(a) - rank(b) || String(a.name).localeCompare(String(b.name));
                });
            } else if (sortMode === 'date-desc') {
                items = [...items].sort((a, b) => {
                    const dA = dateVal(a), dB = dateVal(b);
                    if (dA && dB) return dB.localeCompare(dA) || String(a.name).localeCompare(String(b.name));
                    if (dA && !dB) return -1;
                    if (!dA && dB) return 1;
                    return rank(a) - rank(b) || String(a.name).localeCompare(String(b.name));
                });
            } else if (sortMode === 'group' || sortMode === 'collection') {
                items = [...items].sort((a, b) => {
                    const gA = groupVal(a), gB = groupVal(b);
                    if (gA && gB && gA !== gB) return gA.localeCompare(gB);
                    if (gA && !gB) return -1;
                    if (!gA && gB) return 1;
                    const dA = dateVal(a), dB = dateVal(b);
                    return (dA && dB ? dA.localeCompare(dB) : 0) || String(a.name).localeCompare(String(b.name));
                });
            } else if (sortMode === 'status') {
                items = [...items].sort((a, b) => {
                    const sA = STATUS_PRIORITY[a.status] || 50;
                    const sB = STATUS_PRIORITY[b.status] || 50;
                    if (sA !== sB) return sA - sB;
                    const dA = dateVal(a), dB = dateVal(b);
                    return (dA && dB ? dA.localeCompare(dB) : 0) || String(a.name).localeCompare(String(b.name));
                });
            } else if (sortMode === 'name' || sortMode === 'name-asc') {
                items = [...items].sort((a, b) => String(a.name).localeCompare(String(b.name)));
            } else if (sortMode === 'name-desc') {
                items = [...items].sort((a, b) => String(b.name).localeCompare(String(a.name)));
            } else if (sortMode === 'rating') {
                items = [...items].sort((a, b) => (b.rating || 0) - (a.rating || 0) || String(a.name).localeCompare(String(b.name)));
            }

            // Determine playing now game
            const playing = currentPlan.items.find(i => Boolean(i.playingNow)) || null;

            if (view === 'ticker') {
                renderTicker(items, playing);
            } else if (view === 'checklist') {
                renderChecklist(items, playing);
            } else {
                renderSchedule(items, playing);
            }
        }

        async function fetchPlan() {
            try {
                const res = await fetch('/api/game-plan', { cache: 'no-store' });
                if (res.ok) {
                    currentPlan = await res.json();
                    render();
                }
            } catch (e) {
                console.warn('[Game Plan Overlay] Fetch error:', e);
            }
        }

        function connectWs() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${proto}//${location.host}`);
            ws.onmessage = evt => {
                try {
                    const msg = JSON.parse(evt.data);
                    if (msg.type === 'game-plan-update') {
                        currentPlan = msg.plan;
                        render();
                    }
                } catch {}
            };
            ws.onclose = () => {
                setTimeout(connectWs, 5000);
            };
        }

        fetchPlan();
        connectWs();
        setInterval(fetchPlan, 10000); // Polling heartbeat
    })();
    </script>

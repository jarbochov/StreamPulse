<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Milestones & Streaks Overlay</title>
    <style>
        :root {
            --ms-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --ms-bg: rgba(13, 17, 23, 0.82);
            --ms-border: rgba(48, 54, 61, 0.9);
            --ms-text: #f0f6fc;
            --ms-muted: #8b949e;
            --ms-accent: #8b5cf6;
            --ms-accent-bg: rgba(139, 92, 246, 0.15);
            --ms-fire: #f59e0b;
            --ms-font-scale: 1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: var(--ms-font);
            color: var(--ms-text);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(4px, 1.8vmin, 16px);
        }

        /* Themes */
        body.theme-glass .ms-container {
            background: rgba(15, 20, 32, 0.72) !important;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }

        body.theme-dark .ms-container {
            background: #0d1117 !important;
            border: 1px solid #30363d !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        body.theme-transparent .ms-container {
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
        }

        body.theme-neon .ms-container {
            background: rgba(10, 10, 20, 0.9) !important;
            border: 1.5px solid var(--ms-accent) !important;
            box-shadow: 0 0 24px color-mix(in srgb, var(--ms-accent) 45%, transparent), inset 0 0 12px color-mix(in srgb, var(--ms-accent) 15%, transparent);
        }

        body.theme-light .ms-container {
            background: #ffffff !important;
            border: 1px solid #d0d7de !important;
            color: #1f2328 !important;
            --ms-text: #1f2328;
            --ms-muted: #57606a;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        /* Base Container */
        .ms-container {
            background: var(--ms-bg);
            border: 1px solid var(--ms-border);
            border-radius: clamp(8px, 2vmin, 16px);
            transition: all 0.25s ease;
            box-sizing: border-box;
            min-width: 0;
            min-height: 0;
            max-width: 100%;
            max-height: 100%;
            container-type: size;
        }

        /* Mode: Card (Default) */
        .mode-card {
            width: 100%;
            height: 100%;
            padding: clamp(8px, 3.2vmin, 26px) clamp(12px, 4vmin, 34px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(6px, 2vmin, 14px);
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: clamp(6px, 1.5vmin, 12px);
            min-width: 0;
        }

        .card-title {
            font-size: calc(clamp(0.75rem, max(2vmin, 9cqh, 9vh), 2.4rem) * var(--ms-font-scale));
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            color: var(--ms-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .streak-pill {
            display: inline-flex;
            align-items: center;
            gap: clamp(3px, 0.8vmin, 6px);
            padding: clamp(2px, 0.6vmin, 6px) clamp(6px, 1.5vmin, 12px);
            border-radius: 999px;
            font-size: calc(clamp(0.72rem, max(2vmin, 8.5cqh, 8.5vh), 2.2rem) * var(--ms-font-scale));
            font-weight: 700;
            background: rgba(245, 158, 11, 0.14);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: var(--ms-fire);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .streak-pill .icon {
            font-size: 1.1em;
        }

        .card-main {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: clamp(8px, 2vmin, 16px);
            min-width: 0;
        }

        .stream-num {
            font-size: calc(clamp(1.4rem, max(5.8vmin, 24cqh, 24vh), 6.5rem) * var(--ms-font-scale));
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--ms-accent);
            line-height: 1.1;
            white-space: nowrap;
        }

        .stream-hours {
            font-size: calc(clamp(0.85rem, max(2.8vmin, 12cqh, 12vh), 3.2rem) * var(--ms-font-scale));
            font-weight: 600;
            color: var(--ms-text);
            display: inline-flex;
            align-items: center;
            gap: clamp(3px, 0.8vmin, 6px);
            white-space: nowrap;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2.5vmin, 18px);
            font-size: calc(clamp(0.7rem, max(2vmin, 8.5cqh, 8.5vh), 2.2rem) * var(--ms-font-scale));
            color: var(--ms-muted);
            flex-wrap: wrap;
            min-width: 0;
        }

        .card-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .goal-section {
            display: flex;
            flex-direction: column;
            gap: clamp(4px, 1.2vmin, 8px);
            padding-top: clamp(4px, 1.2vmin, 8px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            min-width: 0;
        }

        body.theme-light .goal-section {
            border-top-color: #e1e4e8;
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: calc(clamp(0.72rem, max(2vmin, 9cqh, 9vh), 2.2rem) * var(--ms-font-scale));
            gap: 6px;
            min-width: 0;
        }

        .goal-name {
            font-weight: 600;
            color: var(--ms-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .goal-rem {
            color: var(--ms-muted);
            font-size: calc(clamp(0.68rem, max(1.8vmin, 8cqh, 8vh), 1.8rem) * var(--ms-font-scale));
            white-space: nowrap;
            flex-shrink: 0;
        }

        .goal-bar {
            height: calc(clamp(6px, max(1.8vmin, 6cqh, 6vh), 24px) * var(--ms-font-scale));
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        body.theme-light .goal-bar {
            background: #e1e4e8;
        }

        .goal-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--ms-accent), color-mix(in srgb, var(--ms-accent) 70%, #fff));
            border-radius: 999px;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Mode: Pill */
        .mode-pill {
            width: 100%;
            height: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 2.5vmin, 24px);
            padding: clamp(6px, 2vmin, 16px) clamp(14px, 3.5vmin, 32px);
            border-radius: 999px;
            white-space: nowrap;
            flex-wrap: wrap;
        }

        .mode-pill .stream-pill-item {
            display: inline-flex;
            align-items: center;
            gap: clamp(4px, 1vmin, 8px);
            font-size: calc(clamp(0.85rem, max(2.8vmin, 22cqh, 22vh), 3.5rem) * var(--ms-font-scale));
            font-weight: 600;
            white-space: nowrap;
        }

        .mode-pill .stream-pill-item.accent {
            color: var(--ms-accent);
            font-weight: 700;
        }

        .mode-pill .sep {
            color: var(--ms-muted);
            opacity: 0.5;
        }

        /* Mode: Streak Minimal */
        .mode-streak {
            width: 100%;
            height: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 2vmin, 16px);
            padding: clamp(6px, 2vmin, 16px) clamp(12px, 3vmin, 24px);
            border-radius: 999px;
            white-space: nowrap;
        }

        .mode-streak .streak-val {
            font-size: calc(clamp(1.4rem, max(5vmin, 38cqh, 38vh), 6.5rem) * var(--ms-font-scale));
            font-weight: 800;
            color: var(--ms-fire);
        }

        .mode-streak .streak-sub {
            font-size: calc(clamp(0.8rem, max(2.4vmin, 18cqh, 18vh), 2.8rem) * var(--ms-font-scale));
            font-weight: 600;
            color: var(--ms-muted);
        }

        /* Mode: Stream Number Minimal */
        .mode-stream_num {
            width: 100%;
            height: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 2vmin, 16px);
            padding: clamp(6px, 2vmin, 16px) clamp(12px, 3vmin, 24px);
            border-radius: clamp(6px, 1.5vmin, 14px);
            font-size: calc(clamp(1.4rem, max(5vmin, 38cqh, 38vh), 6.5rem) * var(--ms-font-scale));
            font-weight: 800;
            color: var(--ms-accent);
            white-space: nowrap;
        }

        /* Mode: Goal Focused */
        .mode-goal {
            width: 100%;
            height: 100%;
            padding: clamp(8px, 2.5vmin, 24px) clamp(12px, 3vmin, 28px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(6px, 1.8vmin, 14px);
        }

        .mode-goal .goal-header {
            font-size: calc(clamp(0.8rem, max(2.4vmin, 14cqh, 14vh), 2.5rem) * var(--ms-font-scale));
        }

        .mode-goal .goal-name {
            font-size: calc(clamp(0.95rem, max(3.2vmin, 20cqh, 20vh), 3.6rem) * var(--ms-font-scale));
            font-weight: 700;
        }

        .mode-goal .goal-rem {
            font-size: calc(clamp(0.75rem, max(2.4vmin, 14cqh, 14vh), 2.2rem) * var(--ms-font-scale));
        }

        .mode-goal .goal-bar {
            height: calc(clamp(8px, max(2.6vmin, 14cqh, 14vh), 32px) * var(--ms-font-scale));
        }
    </style>
</head>
<body>
    <div id="ms-root" class="ms-container mode-card">
        <!-- Rendered dynamically -->
    </div>

    <script src="/overlay-visibility.js" data-key="milestones"></script>
    <script src="/url-params.js"></script>
    <script src="/overlay-theme.js"></script>
    <script>
    const params = overlayParams();
    const mode = (params.get('mode') || 'card').toLowerCase();
    const theme = (params.get('theme') || 'glass').toLowerCase();
    const customAccent = params.get('color') || params.get('accent');
    const fontScaleParam = parseFloat(params.get('fontscale') || params.get('fontScale') || params.get('scale') || '1');
    const align = (params.get('align') || 'center').toLowerCase();
    const customTitle = params.get('title') || 'BROADCAST STATS';
    const goalType = (params.get('goal') || 'streams').toLowerCase();
    const hideStreak = params.has('hideStreak') || params.get('streak') === '0';
    const hideHours = params.has('hideHours') || params.get('hours') === '0';
    const hideGoal = params.has('hideGoal') || params.get('showGoal') === '0';
    const hideStats = params.has('hideStats') || params.get('stats') === '0';

    const root = document.getElementById('ms-root');
    document.body.className = `theme-${theme}`;
    root.className = `ms-container mode-${mode}`;

    if (align === 'left' || align === 'start') {
        document.body.style.justifyContent = 'flex-start';
    } else if (align === 'right' || align === 'end') {
        document.body.style.justifyContent = 'flex-end';
    }

    if (customAccent) {
        document.documentElement.style.setProperty('--ms-accent', customAccent.startsWith('#') ? customAccent : `#${customAccent}`);
    }
    if (!isNaN(fontScaleParam) && fontScaleParam > 0) {
        document.documentElement.style.setProperty('--ms-font-scale', fontScaleParam);
    }

    const fontParam = params.get('font');
    if (fontParam) {
        document.documentElement.style.setProperty('--ms-font', `"${fontParam}", system-ui, sans-serif`);
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(fontParam).replace(/%20/g, '+')}:wght@300;400;500;600;700;900&display=swap`;
        document.head.appendChild(link);
    }
    const weightParam = params.get('weight');
    if (weightParam) {
        const style = document.createElement('style');
        style.textContent = `body, body * { font-weight: ${weightParam} !important; }`;
        document.head.appendChild(style);
    }

    // Apply shared overlay theme (font, text, accent, scale) from server config if present
    fetch('/api/config', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(cfg => {
        if (cfg?.theme) {
            applyOverlayTheme(cfg.theme, {
                font: '--ms-font',
                text: '--ms-text',
                accent: '--ms-accent',
                scale: '--ms-font-scale'
            }, { defaultFont: 'Segoe UI', fontFallback: 'system-ui, sans-serif' });
            if (customAccent) {
                document.documentElement.style.setProperty('--ms-accent', customAccent.startsWith('#') ? customAccent : `#${customAccent}`);
            }
        }
    }).catch(() => {});

    let currentData = null;

    function render(data) {
        if (!data) return;
        currentData = data;

        const streamNum = data.stream_number || 0;
        const totalTime = data.total_time || `${data.total_hours || 0}h`;
        const streakDays = data.streak_days || 0;
        const streakWeeks = data.streak_weeks || 0;
        const chatters = Number(data.lifetime_chatters || 0).toLocaleString();
        const messages = Number(data.lifetime_messages || 0).toLocaleString();

        // Calculate Goal info
        let goalTitle = `Stream #${data.next_stream_goal || 50}`;
        let goalCur = streamNum;
        let goalTarget = data.next_stream_goal || 50;
        let goalUnit = 'streams';

        if (goalType === 'hours') {
            goalTitle = `${data.next_hours_goal || 100} Broadcast Hours`;
            goalCur = data.total_hours || 0;
            goalTarget = data.next_hours_goal || 100;
            goalUnit = 'hours';
        } else if (goalType === 'chatters') {
            const chattersGoal = (data.milestones || []).find(m => m.type === 'chatters');
            goalTitle = chattersGoal ? chattersGoal.title : 'Chatters Goal';
            goalCur = data.lifetime_chatters || 0;
            goalTarget = chattersGoal ? chattersGoal.target : 50;
            goalUnit = 'chatters';
        }

        const goalRem = Math.max(0, goalTarget - goalCur);
        const goalPct = Math.min(100, Math.max(0, Math.round((goalCur / goalTarget) * 100)));

        const ICONS = {
            fire: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:3px;"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>',
            clock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:3px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
            chat: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:3px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>',
            mail: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:3px;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>',
            calendar: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:3px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>',
            stream: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:3px;"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>',
            target: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:3px;"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>',
            trophy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:3px;"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H7v2h10v-2h-2c-.55 0-1-.45-1-1v-2.34c3.27-.47 5.8-3.15 5.98-6.49L20 4H4l.02 4.17c.18 3.34 2.71 6.02 5.98 6.49z"></path></svg>'
        };

        if (mode === 'card') {
            root.innerHTML = `
                <div class="card-top">
                    <span class="card-title">${customTitle}</span>
                    ${!hideStreak ? `
                        <div class="streak-pill" title="${streakDays} consecutive broadcast days">
                            <span class="icon">${ICONS.fire}</span>
                            <span>${streakDays} ${streakDays === 1 ? 'Day' : 'Days'}</span>
                        </div>
                    ` : ''}
                </div>
                <div class="card-main">
                    <div class="stream-num">Stream #${streamNum}</div>
                    ${!hideHours ? `<div class="stream-hours"><span>${ICONS.clock}</span> ${totalTime}</div>` : ''}
                </div>
                ${!hideStats ? `
                    <div class="card-meta">
                        <span>${ICONS.chat} ${chatters} Chatters</span>
                        <span>${ICONS.mail} ${messages} Msgs</span>
                        ${streakWeeks > 1 ? `<span>${ICONS.calendar} ${streakWeeks} Wk Streak</span>` : ''}
                    </div>
                ` : ''}
                ${!hideGoal ? `
                    <div class="goal-section">
                        <div class="goal-header">
                            <span class="goal-name">Target: ${goalTitle}</span>
                            <span class="goal-rem">${goalRem > 0 ? `${goalRem} ${goalUnit} to go (${goalPct}%)` : `${ICONS.trophy} Reached!`}</span>
                        </div>
                        <div class="goal-bar">
                            <div class="goal-fill" style="width: ${goalPct}%;"></div>
                        </div>
                    </div>
                ` : ''}
            `;
        } else if (mode === 'pill') {
            root.innerHTML = `
                <div class="stream-pill-item accent">${ICONS.stream} Stream #${streamNum}</div>
                ${!hideStreak ? `
                    <span class="sep">•</span>
                    <div class="stream-pill-item" style="color:var(--ms-fire)">${ICONS.fire} ${streakDays} ${streakDays === 1 ? 'Day' : 'Days'}</div>
                ` : ''}
                ${!hideHours ? `
                    <span class="sep">•</span>
                    <div class="stream-pill-item">${ICONS.clock} ${totalTime}</div>
                ` : ''}
            `;
        } else if (mode === 'streak') {
            root.innerHTML = `
                <span style="display:inline-flex; align-items:center; justify-content:center;">${ICONS.fire}</span>
                <span class="streak-val">${streakDays}</span>
                <span class="streak-sub">${streakDays === 1 ? 'Day Streak' : 'Days Streak'}</span>
            `;
        } else if (mode === 'stream_num') {
            root.innerHTML = `
                <span>${ICONS.stream}</span>
                <span>Stream #${streamNum}</span>
            `;
        } else if (mode === 'goal') {
            root.innerHTML = `
                <div class="goal-header" style="font-size:0.85rem">
                    <span class="goal-name" style="font-size:1rem; font-weight:700">${ICONS.target} ${goalTitle}</span>
                    <span class="goal-rem" style="font-size:0.8rem"><b>${goalCur}</b> / ${goalTarget} ${goalUnit} (${goalRem} to go)</span>
                </div>
                <div class="goal-bar" style="height:12px">
                    <div class="goal-fill" style="width: ${goalPct}%;"></div>
                </div>
            `;
        }
    }

    async function loadData() {
        try {
            const res = await fetch('/api/milestones');
            if (res.ok) {
                render(await res.json());
            }
        } catch (err) {
            console.warn('[Milestones overlay] Fetch error:', err);
        }
    }

    // Connect WebSocket for reactive live updates
    function connectWS() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        let ws;
        try {
            ws = new WebSocket(`${proto}//${location.host}`);
        } catch (e) {
            return;
        }

        ws.onmessage = evt => {
            try {
                const msg = JSON.parse(evt.data);
                if (msg.type === 'status' && msg.data?.milestones) {
                    render(msg.data.milestones);
                } else if (msg.type === 'milestone-update') {
                    render(msg.data);
                }
            } catch (e) {}
        };

        ws.onclose = () => {
            setTimeout(connectWS, 5000);
        };
    }

    loadData();
    connectWS();
    // Background polling fallback every 25s
    setInterval(loadData, 25000);
    </script>
</body>
</html>

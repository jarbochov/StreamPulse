            // ----------------------------------------------------------------
            // FLIP Animation Engine
            // ----------------------------------------------------------------

            function recordCardPositions() {
                const rectMap = new Map();
                document.querySelectorAll('.card[data-item-id]').forEach(el => {
                    rectMap.set(el.dataset.itemId, el.getBoundingClientRect());
                });
                return rectMap;
            }

            function playFLIPAnimations(firstRects) {
                document.querySelectorAll('.card[data-item-id]').forEach(el => {
                    const itemId = el.dataset.itemId;
                    const firstRect = firstRects.get(itemId);
                    if (!firstRect) {
                        el.style.opacity = '0';
                        el.style.transform = 'scale(0.8)';
                        requestAnimationFrame(() => {
                            el.style.transition = 'transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease';
                            el.style.opacity = '1';
                            el.style.transform = 'scale(1)';
                        });
                        return;
                    }

                    const lastRect = el.getBoundingClientRect();
                    const deltaX = firstRect.left - lastRect.left;
                    const deltaY = firstRect.top - lastRect.top;

                    if (Math.abs(deltaX) > 0.5 || Math.abs(deltaY) > 0.5) {
                        el.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                        el.style.transition = 'none';
                        el.offsetHeight;

                        requestAnimationFrame(() => {
                            el.style.transition = 'transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.65s ease';
                            el.style.transform = 'translate(0, 0)';
                        });
                    }
                });
            }

            // ----------------------------------------------------------------
            // Render State
            // ----------------------------------------------------------------

            function renderOverlay(newState) {
                const firstRects = recordCardPositions();
                currentState = newState;

                const cfg = resolveConfig(newState);
                applyAppearance(cfg);

                const effectiveState = (IS_PREVIEW && cfg.useSampleData)
                    ? buildPreviewSampleState(newState)
                    : newState;

                const effectiveTitle = (previewOverrides.title !== undefined && previewOverrides.title !== '')
                    ? previewOverrides.title
                    : (newState.title || 'Community Tier List');
                $('overlay-title').textContent = effectiveTitle;

                const boardEl = $('overlay-board');
                boardEl.innerHTML = '';

                (effectiveState.tiers || []).forEach(tier => {
                    const row = document.createElement('div');
                    row.className = 'overlay-row';
                    row.dataset.tierId = tier.id;

                    const tierItems = (effectiveState.items || [])
                        .filter(i => i.tierId === tier.id)
                        .sort((a, b) => (a.order || 0) - (b.order || 0));

                    const textColor = getContrastColor(tier.color);
                    const textShadow = textColor === '#111827'
                        ? '0 1px 2px rgba(255,255,255,0.4)'
                        : '0 1px 2px rgba(0,0,0,0.45)';
                    row.innerHTML = `
                        <div class="overlay-row-header" style="background-color: ${esc(tier.color)}; color: ${textColor}; text-shadow: ${textShadow};">
                            <div class="overlay-row-label">${esc(tier.label)}</div>
                            ${tier.description ? `<div class="overlay-row-sub">${esc(tier.description)}</div>` : ''}
                        </div>
                        <div class="overlay-row-items" data-tier-id="${esc(tier.id)}">
                            ${tierItems.map(item => renderOverlayCard(item, effectiveState)).join('')}
                        </div>
                    `;
                    boardEl.appendChild(row);
                });

                const unrankedEl = $('overlay-unranked-items');
                if (!cfg.hideUnranked) {
                    const unrankedItems = (effectiveState.items || [])
                        .filter(i => !i.tierId)
                        .sort((a, b) => (a.order || 0) - (b.order || 0));

                    unrankedEl.innerHTML = unrankedItems.map(item => renderOverlayCard(item, effectiveState)).join('');
                    $('overlay-unranked').style.display = unrankedItems.length === 0 ? 'none' : 'flex';
                } else {
                    $('overlay-unranked').style.display = 'none';
                }

                renderVoteSpotlight(newState.activeVote, cfg);
                updateVotingHint(newState, cfg);
                renderFocusStage(effectiveState, cfg);

                if (!document.hidden) {
                    applyAutoFit(cfg);
                    fitRowHeaders();
                    fitAllCardCaptions(cfg);
                }

                playFLIPAnimations(firstRects);
            }

            function getContrastColor(hexColor) {
                if (!hexColor || typeof hexColor !== 'string') return '#ffffff';
                let hex = hexColor.replace('#', '');
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                if (hex.length !== 6) return '#ffffff';
                const r = parseInt(hex.substr(0, 2), 16);
                const g = parseInt(hex.substr(2, 2), 16);
                const b = parseInt(hex.substr(4, 2), 16);
                const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
                return yiq >= 140 ? '#111827' : '#ffffff';
            }

            function formatCountdown(seconds) {
                const s = Math.max(0, Math.round(Number(seconds) || 0));
                if (s >= 60) {
                    const mins = Math.floor(s / 60);
                    const secs = s % 60;
                    return `${mins}:${String(secs).padStart(2, '0')}`;
                }
                return `${s}s`;
            }

            function buildCommandPromptHtml(tiers, { compact = false, includeCodeId = false } = {}) {
                const tierList = Array.isArray(tiers) ? tiers : [];
                const exampleLabel = tierList[0]?.label || 'S';
                const maxChips = compact ? 4 : 6;
                const shownTiers = tierList.slice(0, maxChips);
                const extraCount = Math.max(0, tierList.length - shownTiers.length);
                const chipsHtml = shownTiers.map(t => {
                    const textColor = getContrastColor(t.color);
                    return `<span class="tier-choice-chip" style="background-color:${esc(t.color)};color:${textColor};">${esc(t.label)}</span>`;
                }).join('');
                const extraHtml = extraCount > 0
                    ? `<span class="tier-choice-chip" style="background-color:rgba(255,255,255,0.14);color:var(--tl-text);">+${extraCount}</span>`
                    : '';
                const codeAttr = includeCodeId ? ' id="hud-cmd-syntax"' : '';
                return `<span>Type</span> <code${codeAttr}>!tier</code> ${chipsHtml}${extraHtml} <span class="cmd-example">e.g. <strong>!tier ${esc(exampleLabel)}</strong></span>`;
            }

            function updateVotingHint(state, cfg = activeCfg) {
                const hintEl = $('overlay-how-to-vote');
                if (!hintEl || !state) return;

                const votingEnabled = previewOverrides.chatVotingEnabled !== undefined
                    ? Boolean(previewOverrides.chatVotingEnabled)
                    : (state.settings?.chatVotingEnabled !== false);
                const mode = String(cfg.howToVote ?? 'auto').toLowerCase();
                const isExplicitOff = ['0', 'false', 'none', 'hide'].includes(mode);
                const isExplicitAlways = ['always', 'test'].includes(mode);
                const isVoteActive = Boolean(state.activeVote && (state.activeVote.status === 'ACTIVE' || state.activeVote.status === 'LOCKED'));

                // Never show the top hint ribbon when voting is off, hidden, OR when the active vote card is already on screen
                const shouldShow = votingEnabled && !isExplicitOff && !isVoteActive && isExplicitAlways;
                if (!shouldShow) {
                    hintEl.classList.remove('visible');
                    return;
                }

                hintEl.classList.add('visible');

                const labelEl = $('how-to-vote-label');
                const cmdWrap = $('how-to-vote-cmd');
                const choicesEl = $('how-to-vote-choices');

                if (cfg.hintText) {
                    if (labelEl) labelEl.textContent = cfg.hintText;
                    if (cmdWrap) cmdWrap.style.display = 'none';
                    if (choicesEl) choicesEl.innerHTML = '';
                    return;
                }

                if (labelEl) labelEl.textContent = 'Vote in chat:';
                if (cmdWrap) {
                    cmdWrap.style.display = 'inline-block';
                    const exampleLabel = state.tiers?.[0]?.label || 'S';
                    cmdWrap.innerHTML = `<code>!tier ${esc(exampleLabel)}</code>`;
                }
                if (choicesEl) {
                    if (state.tiers && state.tiers.length > 0) {
                        const shown = state.tiers.slice(0, 6);
                        const extra = Math.max(0, state.tiers.length - shown.length);
                        choicesEl.innerHTML = shown.map(t => {
                            const textColor = getContrastColor(t.color);
                            return `<span class="tier-choice-chip" style="background-color:${esc(t.color)};color:${textColor};">${esc(t.label)}</span>`;
                        }).join('') + (extra > 0 ? `<span class="tier-choice-chip" style="background-color:rgba(255,255,255,0.14);color:var(--tl-text);">+${extra}</span>` : '');
                    } else {
                        choicesEl.innerHTML = '';
                    }
                }
            }

            function renderOverlayCard(item, effectiveState) {
                const st = effectiveState || currentState;
                const votingEnabled = previewOverrides.chatVotingEnabled !== undefined
                    ? Boolean(previewOverrides.chatVotingEnabled)
                    : (st?.settings?.chatVotingEnabled !== false);
                const isVoting = votingEnabled && st && st.activeVote && st.activeVote.itemId === item.id;
                const isFocused = st && st.focusedItemId && st.focusedItemId === item.id;
                const defaultThumb = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' fill='%2321262d'><rect width='100' height='100'/></svg>";
                const imgSrc = item.imageUrl || defaultThumb;

                return `
                    <div class="card${(isVoting || isFocused) ? ' spotlight' : ''}" data-item-id="${esc(item.id)}">
                        <img src="${esc(imgSrc)}" alt="${esc(item.name)}" onerror="this.src='${defaultThumb}'">
                        <div class="card-caption">${esc(item.name)}</div>
                    </div>
                `;
            }

            function renderFocusStage(state, cfg = activeCfg) {
                const stageEl = $('overlay-focus-stage');
                const backdropEl = $('overlay-focus-backdrop');
                if (!stageEl || !backdropEl) return;

                if (!cfg.focusEnlarge || !state) {
                    stageEl.classList.remove('active');
                    backdropEl.classList.remove('active');
                    document.body.classList.remove('focus-enlarge-active');
                    return;
                }

                const votingEnabled = previewOverrides.chatVotingEnabled !== undefined
                    ? Boolean(previewOverrides.chatVotingEnabled)
                    : (state.settings?.chatVotingEnabled !== false);
                const activeVote = (votingEnabled && state.activeVote && (state.activeVote.status === 'ACTIVE' || state.activeVote.status === 'LOCKED'))
                    ? state.activeVote
                    : null;

                let targetItem = null;
                let badgeText = 'Selected';
                if (activeVote) {
                    targetItem = (state.items || []).find(i => i.id === activeVote.itemId) || {
                        id: activeVote.itemId,
                        name: activeVote.itemName,
                        imageUrl: activeVote.itemImage,
                        note: ''
                    };
                    badgeText = activeVote.status === 'LOCKED' ? 'Vote Locked' : 'Now Voting';
                } else if (state.focusedItemId) {
                    targetItem = (state.items || []).find(i => i.id === state.focusedItemId) || null;
                    badgeText = 'Selected';
                }

                if (!targetItem) {
                    stageEl.classList.remove('active');
                    backdropEl.classList.remove('active');
                    document.body.classList.remove('focus-enlarge-active');
                    return;
                }

                const defaultThumb = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' fill='%23161b22'><rect width='240' height='240'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%238b949e' font-size='20' font-family='sans-serif'>No Image</text></svg>";
                const imgEl = $('focus-stage-img');
                if (imgEl) {
                    imgEl.src = targetItem.imageUrl || defaultThumb;
                    imgEl.alt = targetItem.name || 'Focused Item';
                }
                const badgeEl = $('focus-stage-badge');
                if (badgeEl) badgeEl.textContent = badgeText;
                const titleEl = $('focus-stage-title');
                if (titleEl) titleEl.textContent = targetItem.name || 'Selected Item';
                const noteEl = $('focus-stage-note');
                if (noteEl) {
                    if (targetItem.note) {
                        noteEl.textContent = targetItem.note;
                        noteEl.style.display = 'block';
                    } else {
                        noteEl.style.display = 'none';
                    }
                }

                stageEl.classList.add('active');
                backdropEl.classList.add('active');
                document.body.classList.add('focus-enlarge-active');
            }

            function renderVoteSpotlight(vote, cfg = activeCfg) {
                const hudEl = $('vote-hud-overlay');
                const badgeEl = $('overlay-vote-badge');
                const statusEl = $('overlay-vote-status');
                const votingEnabled = previewOverrides.chatVotingEnabled !== undefined
                    ? Boolean(previewOverrides.chatVotingEnabled)
                    : (currentState?.settings?.chatVotingEnabled !== false);
                if (!votingEnabled) vote = null;

                if (!vote || (vote.status !== 'ACTIVE' && vote.status !== 'LOCKED')) {
                    if (lastVoteId && !lastVoteLocked && !lastVoteCancelled) {
                        TierAudio.voteLock();
                    }
                    lastVoteId = null;
                    lastVoteLocked = false;
                    lastVoteCancelled = false;
                    lastTickedSecond = null;
                    hudEl.classList.remove('active');
                    badgeEl.classList.remove('active', 'is-locked');
                    document.body.classList.remove('has-active-vote');
                    if (hudInterval) {
                        clearInterval(hudInterval);
                        hudInterval = null;
                    }
                    updateVotingHint(currentState, cfg);
                    return;
                }

                if (vote.id !== lastVoteId) {
                    lastVoteCancelled = false;
                    lastVoteId = vote.id;
                    lastVoteLocked = false;
                    lastTickedSecond = null;
                    TierAudio.voteStart();
                }

                if (vote.status === 'LOCKED' && !lastVoteLocked) {
                    lastVoteLocked = true;
                    TierAudio.voteLock();
                }

                hudEl.classList.add('active');
                badgeEl.classList.add('active');
                badgeEl.classList.toggle('is-locked', vote.status === 'LOCKED');
                if (statusEl) statusEl.textContent = vote.status === 'LOCKED' ? 'Vote Locked' : 'Live Vote';
                document.body.classList.add('has-active-vote');

                $('hud-name').textContent = vote.itemName;
                const hudImg = $('hud-img');
                if (hudImg) {
                    if (vote.itemImage) {
                        hudImg.src = vote.itemImage;
                        hudImg.style.display = 'block';
                    } else {
                        hudImg.removeAttribute('src');
                        hudImg.style.display = 'none';
                    }
                }

                // Clear, non-overwhelming chat command prompt in the spotlight card
                const cmdEl = $('hud-cmd');
                const mode = String(cfg.howToVote ?? 'auto').toLowerCase();
                const hintDisabled = ['0', 'false', 'none', 'hide'].includes(mode)
                    || (currentState?.settings?.showVoteHint === false && !['always', 'test'].includes(mode));
                if (cmdEl) {
                    if (vote.status === 'LOCKED') {
                        cmdEl.style.display = 'flex';
                        cmdEl.innerHTML = '<span>Voting closed &middot; Ready to place</span>';
                    } else if (hintDisabled) {
                        cmdEl.style.display = 'none';
                    } else if (cfg.hintText) {
                        cmdEl.style.display = 'flex';
                        cmdEl.textContent = cfg.hintText;
                    } else {
                        cmdEl.style.display = 'flex';
                        cmdEl.innerHTML = buildCommandPromptHtml(currentState?.tiers, {
                            compact: cfg.layout === 'sidebar',
                            includeCodeId: true
                        });
                    }
                }

                updateVoteHUDMeters(vote.consensus);
                updateVotingHint(currentState, cfg);

                if (hudInterval) clearInterval(hudInterval);
                const timerPill = $('hud-timer-pill');
                const timerTrack = $('hud-timer-track');
                const timerFill = $('hud-timer-fill');
                const totalDuration = Number(vote.duration) || 0;

                const updateCountdown = () => {
                    const timeRemEl = $('hud-time-rem');
                    if (vote.status === 'LOCKED') {
                        if (timeRemEl) timeRemEl.textContent = 'Locked';
                        timerPill?.classList.remove('is-urgent');
                        timerPill?.classList.add('is-locked');
                        if (timerTrack) timerTrack.style.display = 'none';
                        return;
                    }
                    timerPill?.classList.remove('is-locked');
                    if (!vote.endsAt) {
                        if (timeRemEl) timeRemEl.textContent = 'Open';
                        timerPill?.classList.remove('is-urgent');
                        if (timerTrack) timerTrack.style.display = 'none';
                        return;
                    }
                    const remainingMs = Math.max(0, vote.endsAt - Date.now());
                    const remaining = Math.round(remainingMs / 1000);
                    if (timeRemEl) timeRemEl.textContent = formatCountdown(remaining);
                    const isUrgent = remaining > 0 && remaining <= 5;
                    timerPill?.classList.toggle('is-urgent', isUrgent);
                    if (timerTrack && timerFill && totalDuration > 0) {
                        timerTrack.style.display = 'block';
                        const pct = Math.max(0, Math.min(100, (remainingMs / (totalDuration * 1000)) * 100));
                        timerFill.style.width = `${pct.toFixed(1)}%`;
                        timerFill.classList.toggle('is-urgent', isUrgent);
                    }
                    if (remaining <= 5 && remaining > 0 && remaining !== lastTickedSecond) {
                        lastTickedSecond = remaining;
                        TierAudio.countdownTick(remaining <= 3);
                    }
                    if (remaining <= 0) {
                        clearInterval(hudInterval);
                        hudInterval = null;
                    }
                };
                updateCountdown();
                hudInterval = setInterval(updateCountdown, 1000);
            }

            function updateVoteHUDMeters(consensus) {
                if (!consensus) return;
                const total = consensus.totalVotes || 0;
                $('hud-vote-count').textContent = total > 0
                    ? `${total} vote${total === 1 ? '' : 's'}`
                    : 'Waiting for votes';

                const subBadge = $('hud-sub-badge');
                if (currentState && currentState.activeVote && currentState.activeVote.subMultiplier > 1) {
                    subBadge.textContent = `Subs ${currentState.activeVote.subMultiplier}x`;
                    subBadge.style.display = 'inline-block';
                } else if (consensus.subVotes > 0) {
                    subBadge.textContent = `${consensus.subVotes} sub vote${consensus.subVotes === 1 ? '' : 's'}`;
                    subBadge.style.display = 'inline-block';
                } else {
                    subBadge.style.display = 'none';
                }

                const agreePill = $('hud-agreement-pill');
                if (total > 0 && consensus.agreementPercent > 0) {
                    agreePill.textContent = `${consensus.agreementPercent}% agree`;
                    agreePill.style.display = 'inline-block';
                } else {
                    agreePill.style.display = 'none';
                }

                const barEl = $('hud-bar');
                barEl.innerHTML = '';
                barEl.style.display = total > 0 ? 'flex' : 'none';

                (consensus.distribution || []).forEach(d => {
                    if (d.percentage > 0) {
                        const seg = document.createElement('div');
                        seg.className = 'hud-breakdown-seg';
                        seg.style.width = `${d.percentage}%`;
                        seg.style.backgroundColor = d.color;
                        barEl.appendChild(seg);
                    }
                });

                const tickerEl = $('hud-voters-ticker');
                if (consensus.recentVoters && consensus.recentVoters.length > 0) {
                    tickerEl.innerHTML = '<span style="opacity:0.65;">Recent:</span>' + consensus.recentVoters.slice(0, 3).map(v => `
                        <span class="voter-chip">
                            ${v.isSub ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="color:#a371f7;display:inline-block;vertical-align:-1px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>' : ''}
                            ${esc(v.user)}:
                            <span class="voter-tier" style="background-color:${esc(v.tierColor)};color:${getContrastColor(v.tierColor)};">${esc(v.tierLabel)}</span>
                        </span>
                    `).join('');
                    tickerEl.style.display = 'flex';
                } else {
                    tickerEl.style.display = 'none';
                }

                const consensusEl = $('hud-consensus');
                if (consensus.consensusTier) {
                    consensusEl.textContent = `Tier ${consensus.consensusTier.label}`;
                    consensusEl.style.backgroundColor = consensus.consensusTier.color;
                    consensusEl.style.color = getContrastColor(consensus.consensusTier.color);
                    consensusEl.style.display = 'inline-flex';
                } else {
                    consensusEl.style.display = 'none';
                }
            }

            // ----------------------------------------------------------------
            // Studio Live Preview Synchronization (postMessage)
            // ----------------------------------------------------------------

            window.addEventListener('message', (e) => {
                if (!e.data || e.data.type !== 'tierlist:preview-config') return;
                const opts = e.data.options || {};
                const prevSample = activeCfg.useSampleData;
                const prevHideUnranked = activeCfg.hideUnranked;

                if (opts.layout && ['board', 'sidebar'].includes(opts.layout)) previewOverrides.layout = opts.layout;
                if (opts.hideUnranked !== undefined) previewOverrides.hideUnranked = Boolean(opts.hideUnranked);
                if (opts.size || opts.cardSize) previewOverrides.size = opts.size || opts.cardSize;
                if (opts.aspect || opts.cardAspect) previewOverrides.aspect = opts.aspect || opts.cardAspect;
                if (opts.coverFit || opts.cardFit) {
                    const cf = String(opts.coverFit || opts.cardFit).toLowerCase();
                    if (['cover', 'contain', 'fill', 'natural'].includes(cf)) previewOverrides.coverFit = cf;
                }
                const styleIn = opts.style ?? opts.theme;
                if (styleIn) {
                    const t = String(styleIn).trim().toLowerCase();
                    if (/^[a-z0-9-_#]{1,40}$/i.test(t)) previewOverrides.style = t;
                }
                if (opts.customThemeId !== undefined) previewOverrides.customThemeId = String(opts.customThemeId || '').toLowerCase();
                if (opts.headingFont !== undefined) previewOverrides.headingFont = cleanFontName(opts.headingFont);
                if (opts.fontFamily !== undefined || opts.font !== undefined) {
                    previewOverrides.fontFamily = cleanFontName(opts.fontFamily ?? opts.font ?? '');
                }
                if (opts.fontWeight !== undefined || opts.weight !== undefined) {
                    previewOverrides.fontWeight = cleanWeight(opts.fontWeight ?? opts.weight ?? '');
                }
                if (opts.fontScale !== undefined) {
                    previewOverrides.fontScale = cleanFontScale(opts.fontScale);
                }
                if (opts.textTransform !== undefined) previewOverrides.textTransform = cleanTransform(opts.textTransform);
                if (opts.textOutline !== undefined) previewOverrides.textOutline = cleanOutline(opts.textOutline);
                if (opts.backgroundColor !== undefined) previewOverrides.backgroundColor = cleanCssColor(opts.backgroundColor);
                if (opts.rowBackgroundColor !== undefined) previewOverrides.rowBackgroundColor = cleanCssColor(opts.rowBackgroundColor);
                if (opts.borderColor !== undefined) previewOverrides.borderColor = cleanCssColor(opts.borderColor);
                if (opts.textColor !== undefined) previewOverrides.textColor = cleanCssColor(opts.textColor);
                if (opts.mutedColor !== undefined) previewOverrides.mutedColor = cleanCssColor(opts.mutedColor);
                if (opts.accentColor !== undefined) previewOverrides.accentColor = cleanCssColor(opts.accentColor);
                if (opts.borderRadius !== undefined) previewOverrides.borderRadius = cleanRadius(opts.borderRadius);
                if (opts.backdropBlur !== undefined) previewOverrides.backdropBlur = cleanBlur(opts.backdropBlur);
                if (opts.chatVotingEnabled !== undefined) previewOverrides.chatVotingEnabled = Boolean(opts.chatVotingEnabled);
                if (opts.soundEnabled !== undefined) previewOverrides.soundEnabled = Boolean(opts.soundEnabled);

                if (opts.howToVote !== undefined) previewOverrides.howToVote = String(opts.howToVote).toLowerCase();
                if (opts.hintScale !== undefined) previewOverrides.hintScale = String(opts.hintScale);
                if (opts.hintText !== undefined) previewOverrides.hintText = String(opts.hintText);
                if (opts.sfx !== undefined) previewOverrides.sfx = parseBoolParam(opts.sfx) ?? Boolean(opts.sfx);

                if (opts.bannerUrl !== undefined || opts.banner !== undefined) {
                    const nextBanner = sanitizeBannerUrl(opts.bannerUrl ?? opts.banner ?? '');
                    if (nextBanner !== previewOverrides.bannerUrl) failedBannerUrl = '';
                    previewOverrides.bannerUrl = nextBanner;
                }
                if (opts.bannerMode && ['replace', 'behind'].includes(opts.bannerMode)) previewOverrides.bannerMode = opts.bannerMode;
                if (opts.bannerHeight !== undefined) previewOverrides.bannerHeight = clampBannerHeight(opts.bannerHeight);
                if (opts.bannerFit && ['cover', 'contain'].includes(opts.bannerFit)) previewOverrides.bannerFit = opts.bannerFit;

                if (opts.showCaptions !== undefined || opts.captions !== undefined) {
                    const sc = opts.showCaptions ?? opts.captions;
                    previewOverrides.showCaptions = parseBoolParam(sc) ?? Boolean(sc);
                }
                if (opts.fitCaptions !== undefined) {
                    previewOverrides.fitCaptions = parseBoolParam(opts.fitCaptions) ?? Boolean(opts.fitCaptions);
                }
                if (opts.autoFit !== undefined) {
                    previewOverrides.autoFit = parseBoolParam(opts.autoFit) ?? Boolean(opts.autoFit);
                }
                if (opts.focusEnlarge !== undefined) {
                    previewOverrides.focusEnlarge = parseBoolParam(opts.focusEnlarge) ?? Boolean(opts.focusEnlarge);
                }
                if (opts.title !== undefined) {
                    previewOverrides.title = String(opts.title);
                }
                if (opts.useSampleData !== undefined && IS_PREVIEW) {
                    previewOverrides.useSampleData = Boolean(opts.useSampleData);
                }

                if (!currentState) {
                    applyAppearance(resolveConfig(null));
                    return;
                }

                const nextCfg = resolveConfig(currentState);
                if (Boolean(nextCfg.useSampleData) !== Boolean(prevSample) ||
                    (prevHideUnranked === true && nextCfg.hideUnranked === false)) {
                    renderOverlay(currentState);
                    return;
                }

                applyAppearance(nextCfg);
                const effectiveTitle = (previewOverrides.title !== undefined && previewOverrides.title !== '')
                    ? previewOverrides.title
                    : (currentState.title || 'Community Tier List');
                $('overlay-title').textContent = effectiveTitle;
                if (nextCfg.hideUnranked) {
                    const unrankedBox = $('overlay-unranked');
                    if (unrankedBox) unrankedBox.style.display = 'none';
                }
                updateVotingHint(currentState, nextCfg);
                renderFocusStage(currentState, nextCfg);
                scheduleLayoutPass();
            });

            // ----------------------------------------------------------------
            // Observers, Idle Lifecycle & Cleanup
            // ----------------------------------------------------------------

            let containerObserver = null;
            const containerEl = $('overlay-container');
            if (containerEl && typeof ResizeObserver !== 'undefined') {
                containerObserver = new ResizeObserver(() => scheduleLayoutPass());
                containerObserver.observe(containerEl);
            }

            // Re-run layout/caption fit as individual card images or webfonts finish loading
            const onCardImgLoad = () => scheduleLayoutPass();
            $('overlay-board')?.addEventListener('load', onCardImgLoad, true);
            $('overlay-unranked-items')?.addEventListener('load', onCardImgLoad, true);

            const onFontsLoaded = () => scheduleLayoutPass();
            document.fonts?.addEventListener?.('loadingdone', onFontsLoaded);

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && currentState) scheduleLayoutPass();
            });

            function cleanupOverlay() {
                document.fonts?.removeEventListener?.('loadingdone', onFontsLoaded);
                if (layoutRaf) {
                    cancelAnimationFrame(layoutRaf);
                    layoutRaf = 0;
                }
                if (hudInterval) {
                    clearInterval(hudInterval);
                    hudInterval = null;
                }
                if (wsReconnectTimer) {
                    clearTimeout(wsReconnectTimer);
                    wsReconnectTimer = null;
                }
                if (containerObserver) {
                    containerObserver.disconnect();
                    containerObserver = null;
                }
                if (wsSocket) {
                    try {
                        wsSocket.onclose = null;
                        wsSocket.close();
                    } catch {}
                    wsSocket = null;
                }
            }
            window.addEventListener('pagehide', cleanupOverlay);
            window.addEventListener('beforeunload', cleanupOverlay);

            // ----------------------------------------------------------------
            // Data Fetch & WebSocket
            // ----------------------------------------------------------------

            async function fetchOverlayState() {
                try {
                    const res = await fetch('/api/tier-list');
                    if (res.ok) {
                        const data = await res.json();
                        if (data.settings) {
                            const rawVol = data.settings.soundVolume;
                            const volPct = (rawVol !== undefined && Number.isFinite(Number(rawVol)))
                                ? Math.min(100, Math.max(0, Number(rawVol)))
                                : 75;
                            TierAudio.volume = volPct / 100;
                        }
                        renderOverlay(data);
                    }
                } catch (err) {
                    console.error('Tier list overlay fetch error:', err);
                }
            }

            function setupOverlayWs() {
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                wsSocket = new WebSocket(`${protocol}//${location.host}/ws`);

                wsSocket.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'tier-list:vote-cancel') {
                            lastVoteCancelled = true;
                        } else if (msg.type === 'tier-list:vote-start' || msg.type === 'tier-list:vote-end' || msg.type === 'tier-list:vote-locked') {
                            lastVoteCancelled = false;
                        }
                        if (msg.type === 'tier-list:update' || msg.type === 'tier-list:move' ||
                            msg.type === 'tier-list:vote-start' || msg.type === 'tier-list:vote-end' ||
                            msg.type === 'tier-list:vote-cancel' || msg.type === 'tier-list:vote-locked') {
                            fetchOverlayState();
                        } else if (msg.type === 'tier-list:vote-update') {
                            updateVoteHUDMeters(msg.data.consensus);
                        }
                    } catch {}
                };

                wsSocket.onclose = () => {
                    wsReconnectTimer = setTimeout(setupOverlayWs, 2500);
                };
            }

            applyAppearance(resolveConfig(null));
            fetchOverlayState();
            setupOverlayWs();
        })();
    </script>
</body>
</html>

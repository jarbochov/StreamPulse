<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StreamPulse — Live Tier List Broadcast Overlay</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="/js/overlay-theme.js"></script>
    <style>
        :root {
            --tl-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --tl-heading-font: var(--tl-font);
            --tl-font-weight: 700;
            --tl-heading-weight: 800;
            --tl-font-scale: 1;
            --tl-text-transform: none;
            --tl-text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            --tl-header-shadow: none;
            --tl-bg: rgba(13, 17, 23, 0.92);
            --tl-header-bg: var(--tl-bg);
            --tl-row-bg: rgba(13, 17, 23, 0.7);
            --tl-border: rgba(255, 255, 255, 0.12);
            --tl-text: #f0f6fc;
            --tl-muted: #8b949e;
            --tl-accent: #3b82f6;
            --tl-radius: 10px;
            --tl-backdrop: none;
            --tl-card-scale: 1;
            --tl-card-size: calc(clamp(54px, 6.2cqi, 180px) * var(--tl-card-scale, 1));
            --tl-header-width: calc(clamp(88px, 9.2cqi, 210px) * var(--tl-card-scale, 1));
            --tl-card-aspect: 1/1;
            --tl-cover-fit: cover;
            --tl-gap: clamp(6px, 0.7cqi, 12px);
            --tl-hint-scale: 1;
            --tl-banner-height: 110px;
            --tl-banner-fit: cover;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: var(--tl-font);
            color: var(--tl-text);
            -webkit-font-smoothing: antialiased;
        }

        #overlay-container {
            width: 100%;
            height: 100%;
            padding: clamp(10px, 1.8cqi, 28px);
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.2cqi, 18px);
            box-sizing: border-box;
            container-type: inline-size;
        }

        /* Overlay Header & Custom Banner */
        .overlay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--tl-header-bg, var(--tl-bg));
            border: 1px solid var(--tl-border);
            border-radius: min(var(--tl-radius, 10px), 28px);
            backdrop-filter: var(--tl-backdrop, none);
            -webkit-backdrop-filter: var(--tl-backdrop, none);
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            flex-shrink: 0;
            position: relative;
        }
        body.theme-transparent .overlay-header.has-banner.banner-replace {
            background: transparent;
            box-shadow: none;
        }
        .overlay-header.has-banner {
            overflow: hidden;
            height: var(--tl-banner-height, 110px);
            max-height: 35vh;
        }
        body.layout-sidebar .overlay-header.has-banner {
            height: var(--tl-banner-height, 110px);
            max-height: 24vh;
        }
        .overlay-header.has-banner.banner-replace {
            padding: 0;
            justify-content: flex-end;
        }
        .overlay-header.has-banner.banner-replace.banner-fit-contain {
            padding: 4px;
        }
        .overlay-header.has-banner.banner-replace .overlay-title {
            display: none;
        }
        .overlay-header.has-banner.banner-replace .vote-badge {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 3;
            background: rgba(13, 17, 23, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .overlay-header.has-banner.banner-behind::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(90deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.38) 65%, rgba(0,0,0,0.52) 100%);
        }
        .overlay-header.has-banner.banner-behind .overlay-title {
            position: relative;
            z-index: 2;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.75);
        }
        .overlay-header.has-banner.banner-behind .vote-badge {
            position: relative;
            z-index: 2;
        }
        .overlay-banner-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: var(--tl-banner-fit, cover);
            object-position: center;
            display: block;
            z-index: 0;
        }
        .overlay-title {
            font-family: var(--tl-heading-font, var(--tl-font));
            font-size: calc(clamp(15px, 1.6cqi, 24px) * var(--tl-font-scale, 1));
            font-weight: var(--tl-heading-weight, 800);
            text-transform: var(--tl-text-transform, none);
            letter-spacing: -0.01em;
            color: var(--tl-text);
            text-shadow: var(--tl-header-shadow, none);
        }
        .vote-badge {
            display: none;
            align-items: center;
            gap: 7px;
            font-family: var(--tl-heading-font, var(--tl-font));
            font-size: clamp(11px, 1.05cqi, 13px);
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            background: color-mix(in srgb, var(--tl-accent, #f59e0b) 16%, transparent);
            color: var(--tl-accent, #fbbf24);
            border: 1px solid color-mix(in srgb, var(--tl-accent, #f59e0b) 42%, transparent);
            padding: 4px 11px;
            border-radius: 999px;
            flex-shrink: 0;
        }
        .vote-badge.active {
            display: inline-flex;
        }
        .vote-badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse-dot 1.6s ease-in-out infinite;
        }
        .vote-badge.is-locked .vote-badge-dot {
            animation: none;
            opacity: 0.65;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.78); }
        }

        /* Tier Board */
        .overlay-board {
            flex: 1;
            background: var(--tl-bg);
            border: 1px solid var(--tl-border);
            border-radius: min(var(--tl-radius, 10px), 24px);
            backdrop-filter: var(--tl-backdrop, none);
            -webkit-backdrop-filter: var(--tl-backdrop, none);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .overlay-row {
            display: flex;
            flex: 1;
            min-height: calc(var(--tl-card-size) + var(--tl-gap) * 2);
            border-bottom: 1px solid var(--tl-border);
            position: relative;
        }
        .overlay-row:last-child {
            border-bottom: none;
        }

        .overlay-row-header {
            width: var(--tl-header-width);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: clamp(4px, 0.5cqi, 10px);
            color: #111;
            font-family: var(--tl-heading-font, var(--tl-font));
            font-weight: var(--tl-heading-weight, 800);
            font-size: calc(clamp(15px, 1.8cqi, 32px) * var(--tl-font-scale, 1));
            line-height: 1.1;
            text-transform: var(--tl-text-transform, none);
            text-align: center;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;
            text-shadow: 0 1px 2px rgba(255,255,255,0.4);
            user-select: none;
            min-height: 0;
            overflow: hidden;
        }
        .overlay-row-label {
            max-width: 100%;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;
            line-height: 1.08;
        }
        .overlay-row-sub {
            font-family: var(--tl-font);
            font-size: calc(clamp(9px, 0.85cqi, 13px) * var(--tl-font-scale, 1));
            font-weight: 600;
            opacity: 0.88;
            margin-top: 2px;
            white-space: normal;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;
            line-height: 1.15;
            max-width: 100%;
            text-align: center;
        }

        .overlay-row-items {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: var(--tl-gap);
            padding: var(--tl-gap);
            background: var(--tl-row-bg);
            position: relative;
            overflow-y: auto;
        }

        /* Unranked Tray */
        .overlay-unranked {
            flex-shrink: 0;
            background: var(--tl-bg);
            border: 1px solid var(--tl-border);
            border-radius: min(var(--tl-radius, 10px), 22px);
            backdrop-filter: var(--tl-backdrop, none);
            -webkit-backdrop-filter: var(--tl-backdrop, none);
            padding: clamp(8px, 1cqi, 14px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: clamp(136px, 24vh, 320px);
        }
        .overlay-unranked-label {
            font-family: var(--tl-heading-font, var(--tl-font));
            font-size: clamp(10px, 0.9cqi, 12px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--tl-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .overlay-unranked-items {
            display: flex;
            flex-wrap: wrap;
            gap: var(--tl-gap);
            overflow-y: auto;
            min-height: 40px;
            padding-bottom: 4px;
        }

        /* Item Cards */
        .card {
            height: var(--tl-card-size);
            width: auto;
            aspect-ratio: var(--tl-card-aspect, 1/1);
            max-width: 100%;
            border-radius: clamp(0px, min(var(--tl-radius, 10px), 16px), 16px);
            background: #111827;
            border: 1px solid var(--tl-border);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            will-change: transform;
            transform-origin: center center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
            flex-shrink: 0;
        }

        body.fit-natural .card {
            display: block;
            width: auto;
            height: var(--tl-card-size);
            aspect-ratio: auto;
            min-width: calc(var(--tl-card-size) * 0.45);
            max-width: min(100%, calc(var(--tl-card-size) * 2.6));
        }
        body.fit-natural .card img {
            position: relative;
            inset: auto;
            width: auto;
            height: 100%;
            max-width: 100%;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
        body.fit-natural .card-caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .card.spotlight {
            border-color: var(--tl-accent, #fbbf24);
            box-shadow: 0 0 16px color-mix(in srgb, var(--tl-accent, #fbbf24) 60%, transparent);
            transform: scale(1.05);
            z-index: 50;
        }

        .card img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: var(--tl-cover-fit, cover);
            object-position: center;
            display: block;
        }

        .card-caption {
            position: relative;
            z-index: 2;
            background: linear-gradient(transparent, rgba(0,0,0,0.88) 60%);
            padding: clamp(4px, 0.5cqi, 8px) clamp(2px, 0.3cqi, 6px) clamp(2px, 0.25cqi, 4px);
            font-family: var(--tl-font);
            font-size: calc(clamp(9px, 0.82cqi, 13px) * var(--tl-font-scale, 1));
            font-weight: var(--tl-font-weight, 700);
            text-transform: var(--tl-text-transform, none);
            color: #fff;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
            text-shadow: var(--tl-text-shadow, 0 1px 2px rgba(0,0,0,0.8));
        }

        /* Caption Display Options */
        body.captions-hidden .card-caption {
            display: none;
        }
        body.captions-fit .card-caption {
            white-space: normal;
            overflow: hidden;
            text-overflow: clip;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;
            line-height: 1.14;
            max-height: 84%;
            padding: clamp(6px, 0.55cqi, 10px) clamp(3px, 0.35cqi, 6px) clamp(2px, 0.25cqi, 4px);
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.72) 22%, rgba(0, 0, 0, 0.92) 100%);
        }

        /* Auto-Fit Board Scaling */
        body.auto-fit .overlay-row {
            min-height: 0;
        }
        body.auto-fit .overlay-row-header {
            width: var(--tl-fit-header-width, var(--tl-header-width));
            font-size: var(--tl-fit-header-font, clamp(12px, 1.8cqi, 32px));
            padding: clamp(2px, 0.35cqi, 8px);
        }
        body.auto-fit .overlay-row-sub {
            font-size: var(--tl-fit-sub-font, 10px);
        }
        body.auto-fit .overlay-row-items {
            gap: var(--tl-fit-gap, var(--tl-gap));
            padding: var(--tl-fit-gap, var(--tl-gap));
            overflow: hidden;
        }
        body.auto-fit .overlay-row-items .card {
            height: var(--tl-fit-card-size, var(--tl-card-size));
            width: auto;
        }
        body.auto-fit.fit-natural .overlay-row-items .card {
            min-width: calc(var(--tl-fit-card-size, var(--tl-card-size)) * 0.45);
            max-width: min(100%, calc(var(--tl-fit-card-size, var(--tl-card-size)) * 2.6));
        }
        body.auto-fit .overlay-unranked-items .card {
            height: min(var(--tl-fit-card-size, var(--tl-card-size)), 84px);
            width: auto;
        }

        /* Focus & Enlarge Artwork Stage */
        .overlay-focus-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 8, 14, 0.56);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 900;
            pointer-events: none;
        }
        .overlay-focus-backdrop.active {
            display: block;
        }
        .overlay-focus-stage {
            display: none;
            position: fixed;
            left: 50%;
            top: 46%;
            transform: translate(-50%, -50%);
            z-index: 950;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 14px;
            background: var(--tl-header-bg, var(--tl-bg));
            border: 2px solid var(--tl-accent, #3b82f6);
            border-radius: min(var(--tl-radius, 12px), 20px);
            backdrop-filter: var(--tl-backdrop, blur(12px));
            -webkit-backdrop-filter: var(--tl-backdrop, blur(12px));
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.65);
            max-width: min(440px, calc(100% - 32px));
            pointer-events: none;
            animation: focusPopIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .overlay-focus-stage.active {
            display: flex;
        }
        body.has-active-vote .overlay-focus-stage.active {
            top: auto;
            bottom: clamp(126px, 16vh, 175px);
            transform: translateX(-50%);
        }
        body.layout-sidebar .overlay-focus-stage.active {
            left: auto;
            right: 12px;
            top: 44%;
            transform: translateY(-50%);
            width: min(416px, calc(100% - 24px));
            max-width: min(416px, calc(100% - 24px));
            padding: 10px;
        }
        body.layout-sidebar.has-active-vote .overlay-focus-stage.active {
            top: auto;
            bottom: 162px;
            transform: none;
        }
        @keyframes focusPopIn {
            from { opacity: 0; scale: 0.94; }
            to { opacity: 1; scale: 1; }
        }
        .focus-stage-frame {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.35);
            border-radius: calc(min(var(--tl-radius, 10px), 14px));
            overflow: hidden;
            border: 1px solid var(--tl-border);
            max-width: 100%;
        }
        .focus-stage-img {
            display: block;
            max-width: min(390px, 42vw);
            max-height: min(390px, 44vh);
            min-width: 160px;
            min-height: 160px;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        body.layout-sidebar .focus-stage-img {
            max-width: min(360px, 76vw);
            max-height: min(320px, 34vh);
        }
        .focus-stage-meta {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-align: center;
            max-width: 100%;
        }
        .focus-stage-badge {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--tl-accent, #3b82f6) 22%, transparent);
            color: var(--tl-accent, #93c5fd);
            border: 1px solid color-mix(in srgb, var(--tl-accent, #3b82f6) 45%, transparent);
        }
        .focus-stage-title {
            font-family: var(--tl-heading-font, var(--tl-font));
            font-size: calc(clamp(16px, 1.5cqi, 22px) * var(--tl-font-scale, 1));
            font-weight: var(--tl-heading-weight, 800);
            text-transform: var(--tl-text-transform, none);
            color: var(--tl-text);
            text-shadow: var(--tl-header-shadow, none);
            line-height: 1.2;
        }
        .focus-stage-note {
            font-size: 12px;
            color: var(--tl-muted);
            line-height: 1.3;
            max-width: 360px;
        }
        body.focus-enlarge-active #hud-img {
            display: none !important;
        }

        /* Active Vote Banner Overlay */
        .vote-hud-overlay {
            display: none;
            position: fixed;
            bottom: clamp(14px, 2.2vh, 28px);
            left: 50%;
            transform: translateX(-50%);
            width: max-content;
            max-width: min(780px, calc(100% - 28px));
            background: var(--tl-header-bg, var(--tl-bg));
            border: 2px solid var(--tl-accent, #fbbf24);
            border-radius: min(var(--tl-radius, 12px), 18px);
            backdrop-filter: var(--tl-backdrop, blur(12px));
            -webkit-backdrop-filter: var(--tl-backdrop, blur(12px));
            padding: 10px 16px 12px;
            align-items: center;
            gap: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            z-index: 1000;
            overflow: hidden;
            animation: hudSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: var(--tl-font);
            color: var(--tl-text);
        }
        .vote-hud-overlay.active {
            display: flex;
        }

        @keyframes hudSlideUp {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        @keyframes hudSlideUpSidebar {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hud-voter-img {
            width: clamp(46px, 4.2cqi, 68px);
            height: clamp(46px, 4.2cqi, 68px);
            border-radius: 7px;
            object-fit: var(--tl-cover-fit, cover);
            border: 2px solid var(--tl-accent, #fbbf24);
            background: #111827;
            flex-shrink: 0;
        }
        .hud-voter-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }
        .hud-title-row {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }
        .hud-voter-title {
            font-family: var(--tl-heading-font, var(--tl-font));
            font-size: calc(clamp(14px, 1.25cqi, 17px) * var(--tl-font-scale, 1));
            font-weight: var(--tl-heading-weight, 800);
            text-transform: var(--tl-text-transform, none);
            color: var(--tl-text);
            line-height: 1.15;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 340px;
        }
        .hud-cmd {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
            font-size: calc(12px * var(--tl-hint-scale, 1));
            color: var(--tl-muted);
            line-height: 1.25;
        }
        .hud-cmd code {
            font-family: var(--tl-heading-font, var(--tl-font));
            font-weight: 800;
            color: var(--tl-accent, #fbbf24);
            background: color-mix(in srgb, var(--tl-accent, #fbbf24) 16%, transparent);
            border: 1px solid color-mix(in srgb, var(--tl-accent, #fbbf24) 45%, transparent);
            padding: 1px 7px;
            border-radius: 5px;
            font-size: 0.98em;
            white-space: nowrap;
        }
        .cmd-example {
            opacity: 0.92;
            white-space: nowrap;
        }
        .cmd-example strong {
            color: var(--tl-text);
            font-weight: 700;
        }
        .hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }
        .hud-right-top {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .hud-timer-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 999px;
            font-family: var(--tl-heading-font, var(--tl-font));
            font-size: 13px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--tl-border);
            color: var(--tl-text);
        }
        .hud-timer-pill.is-urgent {
            background: rgba(239, 68, 68, 0.22);
            border-color: rgba(239, 68, 68, 0.6);
            color: #fca5a5;
        }
        .hud-timer-pill.is-locked {
            background: rgba(245, 158, 11, 0.2);
            border-color: rgba(245, 158, 11, 0.55);
            color: #fcd34d;
        }
        .hud-right-bottom {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hud-vote-count-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--tl-muted);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;

    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const IS_PREVIEW = urlParams.get('preview') === '1' || urlParams.get('preview') === 'true';

            const $ = id => document.getElementById(id);
            const esc = str => String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

            const DEFAULT_CFG = {
                layout: 'board',
                hideUnranked: false,
                size: 'medium',
                aspect: '1/1',
                coverFit: 'cover',
                style: 'dark',
                customThemeId: '',
                headingFont: '',
                fontFamily: '',
                fontWeight: '',
                fontScale: 1,
                textTransform: '',
                textOutline: '',
                backgroundColor: '',
                rowBackgroundColor: '',
                borderColor: '',
                textColor: '',
                mutedColor: '',
                accentColor: '',
                borderRadius: '',
                backdropBlur: '',
                bannerUrl: '',
                bannerMode: 'replace',
                bannerHeight: 110,
                bannerFit: 'cover',
                showCaptions: true,
                fitCaptions: false,
                autoFit: false,
                focusEnlarge: false,
                howToVote: 'auto',
                hintScale: '1',
                hintText: '',
                sfx: true,
                title: '',
                useSampleData: false
            };

            const FALLBACK_FONT_STACK = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";

            function parseBoolParam(raw) {
                if (raw === null || raw === undefined) return undefined;
                const s = String(raw).trim().toLowerCase();
                if (['1', 'true', 'yes', 'on'].includes(s)) return true;
                if (['0', 'false', 'no', 'off'].includes(s)) return false;
                return undefined;
            }

            function sanitizeBannerUrl(raw) {
                const val = String(raw ?? '').trim();
                if (!val) return '';
                if (val.startsWith('/') && !val.startsWith('//')) return val;
                if (/^https?:\/\//i.test(val)) return val;
                if (/^data:image\/[a-z0-9.+-]+;/i.test(val)) return val;
                return '';
            }

            function cleanCssColor(raw) {
                const val = String(raw ?? '').trim();
                if (!val || val.length > 160) return '';
                if (/[;{}<>]|url\s*\(|expression/i.test(val)) return '';
                if (/^[0-9a-f]{3}([0-9a-f]{3}([0-9a-f]{2})?)?$/i.test(val)) return `#${val}`;
                if (/^(#[0-9a-f]{3,8}|(rgb|hsl)a?\([0-9.,%\s/+-]+\)|transparent|[a-z]{3,20})$/i.test(val)) return val;
                if (/^linear-gradient\(\s*[a-z0-9#(),.%\s+-]+\)$/i.test(val)) return val;
                return '';
            }

            function cleanFontName(raw) {
                return String(raw ?? '').replace(/["'<>;{}\\]/g, '').trim().slice(0, 80);
            }

            function cleanWeight(raw) {
                const w = String(raw ?? '').trim().toLowerCase();
                if (!w) return '';
                if (w === 'normal') return '400';
                if (w === 'bold') return '700';
                return /^[1-9]00$/.test(w) ? w : '';
            }

            function cleanTransform(raw) {
                const t = String(raw ?? '').trim().toLowerCase();
                return ['none', 'uppercase', 'capitalize', 'lowercase'].includes(t) ? t : '';
            }

            function cleanOutline(raw) {
                const o = String(raw ?? '').trim().toLowerCase();
                if (!o) return '';
                if (['none', 'subtle', 'strong'].includes(o)) return o;
                return cleanCssColor(raw);
            }

            function cleanRadius(raw) {
                const v = String(raw ?? '').trim().toLowerCase();
                if (!v) return '';
                if (/^\d+$/.test(v)) return `${Math.min(999, Math.max(0, Number(v)))}px`;
                if (/^\d+(\.\d+)?(px|rem|em|%)$/.test(v)) return v;
                if (v === 'pill' || v === 'full') return '999px';
                if (v === 'sharp' || v === 'none' || v === 'square') return '0px';
                return '';
            }

            function cleanBlur(raw) {
                const v = String(raw ?? '').trim().toLowerCase();
                if (!v) return '';
                if (v === 'none') return '0px';
                if (/^\d+(\.\d+)?$/.test(v)) return `${Math.min(24, Math.max(0, Math.round(Number(v))))}px`;
                if (/^\d+(\.\d+)?px$/.test(v)) return `${Math.min(24, Math.max(0, Math.round(parseFloat(v))))}px`;
                if (/^blur\(\d+(\.\d+)?px\)(\s+saturate\(\d+%\))?$/i.test(v)) return v;
                return '';
            }

            function cleanFontScale(raw) {
                const n = Number(raw);
                if (Number.isFinite(n) && n > 0) {
                    return Math.round(Math.min(2.5, Math.max(0.5, n)) * 100) / 100;
                }
                return 1;
            }

            function resolveBaseTheme(styleId, customThemeId = '') {
                const id = String(styleId || 'dark').trim().toLowerCase();
                if (id === 'dark') {
                    return {
                        id: 'dark',
                        bg: 'rgba(13, 17, 23, 0.92)',
                        headerBg: 'rgba(13, 17, 23, 0.92)',
                        rowBg: 'rgba(13, 17, 23, 0.7)',
                        border: 'rgba(255, 255, 255, 0.12)',
                        text: '#f0f6fc',
                        muted: '#8b949e',
                        accent: '#3b82f6',
                        radius: '10px',
                        backdrop: 'none',
                        isLight: false,
                        isTransparent: false
                    };
                }
                if (id === 'light' || id === 'clean-light') {
                    return {
                        id: 'light',
                        bg: '#ffffff',
                        headerBg: '#ffffff',
                        rowBg: '#f8fafc',
                        border: 'rgba(0, 0, 0, 0.12)',
                        text: '#0f172a',
                        muted: '#64748b',
                        accent: '#0969da',
                        radius: '10px',
                        backdrop: 'none',
                        isLight: true,
                        isTransparent: false
                    };
                }
                if (id === 'transparent') {
                    return {
                        id: 'transparent',
                        bg: 'transparent',
                        headerBg: 'rgba(13, 17, 23, 0.88)',
                        rowBg: 'rgba(13, 17, 23, 0.68)',
                        border: 'transparent',
                        text: '#f0f6fc',
                        muted: '#cbd5e1',
                        accent: '#38bdf8',
                        radius: '10px',
                        backdrop: 'none',
                        isLight: false,
                        isTransparent: true
                    };
                }
                const lookupKey = (id === 'custom' && customThemeId) ? customThemeId : id;
                const matched = window.OverlayThemes && typeof window.OverlayThemes.getTheme === 'function'
                    ? window.OverlayThemes.getTheme(lookupKey)
                    : null;
                if (matched) {
                    const bg = matched.bg || matched.cardBg || 'rgba(13, 17, 23, 0.92)';
                    const rowBg = matched.cardBg || 'rgba(13, 17, 23, 0.72)';
                    return {
                        id: matched.id || id,
                        bg,
                        headerBg: bg === 'transparent' ? 'rgba(13, 17, 23, 0.88)' : bg,
                        rowBg,
                        border: matched.border || 'rgba(255, 255, 255, 0.14)',
                        text: matched.text || '#f0f6fc',
                        muted: matched.muted || '#8b949e',
                        accent: matched.accent || '#3b82f6',
                        radius: matched.radius || '10px',
                        backdrop: matched.backdrop || 'none',
                        font: matched.font || '',
                        headingFont: matched.headingFont || '',
                        weight: matched.weight || '',
                        textTransform: matched.textTransform || '',
                        outline: matched.outline || '',
                        isLight: matched.id === 'clean-light',
                        isTransparent: matched.bg === 'transparent'
                    };
                }
                return resolveBaseTheme('dark');
            }

            function parseScaleNumber(raw) {
                if (!raw) return 1.0;
                const s = String(raw).trim().toLowerCase();
                if (s === 'compact' || s === 'small') return 0.8;
                if (s === 'medium' || s === 'normal') return 1.0;
                if (s === 'large') return 1.35;
                if (s === 'xlarge' || s === 'xl') return 1.7;
                const parsed = parseFloat(s.replace('%', ''));
                if (Number.isFinite(parsed) && parsed > 0) {
                    return parsed > 10 ? parsed / 100 : parsed;
                }
                return 1.0;
            }

            function parseHintScaleNumber(raw, fallbackSize) {
                if (raw !== undefined && raw !== null && String(raw).trim() !== '') {
                    const s = String(raw).trim().toLowerCase();
                    if (s === 'compact' || s === 'small') return 0.85;
                    if (s === 'medium' || s === 'normal') return 1.0;
                    if (s === 'large') return 1.25;
                    if (s === 'xlarge' || s === 'xl') return 1.5;
                    const parsed = parseFloat(s.replace('%', ''));
                    if (Number.isFinite(parsed) && parsed > 0) {
                        return parsed > 10 ? parsed / 100 : parsed;
                    }
                }
                if (fallbackSize === 'compact') return 0.9;
                if (fallbackSize === 'large' || fallbackSize === 'xlarge') return 1.2;
                return 1.0;
            }

            function clampBannerHeight(raw) {
                const n = Math.round(Number(raw));
                return Number.isFinite(n) ? Math.min(240, Math.max(48, n)) : 110;
            }

            const urlOverrides = {};
            const layoutQ = urlParams.get('layout');
            if (layoutQ && ['board', 'sidebar'].includes(layoutQ.toLowerCase())) {
                urlOverrides.layout = layoutQ.toLowerCase();
            }
            const hideUnrankedQ = parseBoolParam(urlParams.get('hideUnranked'));
            if (hideUnrankedQ !== undefined) urlOverrides.hideUnranked = hideUnrankedQ;

            const scaleQ = urlParams.get('coverScale') ?? urlParams.get('cardScale') ?? urlParams.get('scale') ?? urlParams.get('size');
            if (scaleQ) urlOverrides.size = scaleQ;

            const aspectQ = urlParams.get('aspect') ?? urlParams.get('coverRatio');
            if (aspectQ) urlOverrides.aspect = aspectQ;

            const coverFitQ = (urlParams.get('coverFit') ?? urlParams.get('coverfit') ?? urlParams.get('fit') ?? '').toLowerCase();
            if (['cover', 'contain', 'fill', 'natural'].includes(coverFitQ)) urlOverrides.coverFit = coverFitQ;

            const themeQ = (urlParams.get('overlay') ?? urlParams.get('theme') ?? '').trim().toLowerCase();
            if (themeQ && /^[a-z0-9-_#]{1,40}$/i.test(themeQ)) urlOverrides.style = themeQ;

            const urlHeadingFontQ = cleanFontName(urlParams.get('headingfont') ?? urlParams.get('titlefont') ?? '');
            if (urlHeadingFontQ) urlOverrides.headingFont = urlHeadingFontQ;

            const urlFontQ = cleanFontName(urlParams.get('font') ?? urlParams.get('contentfont') ?? '');
            if (urlFontQ) urlOverrides.fontFamily = urlFontQ;

            const urlWeightQ = cleanWeight(urlParams.get('weight') ?? '');
            if (urlWeightQ) urlOverrides.fontWeight = urlWeightQ;

            const urlFontScaleQ = urlParams.get('fontscale') ?? urlParams.get('fontScale');
            if (urlFontScaleQ !== null && urlFontScaleQ !== '') urlOverrides.fontScale = cleanFontScale(urlFontScaleQ);

            const urlTransformQ = cleanTransform(urlParams.get('transform') ?? urlParams.get('texttransform') ?? '');
            if (urlTransformQ) urlOverrides.textTransform = urlTransformQ;

            const urlOutlineQ = cleanOutline(urlParams.get('outline') ?? urlParams.get('shadow') ?? '');
            if (urlOutlineQ) urlOverrides.textOutline = urlOutlineQ;

            const urlBgQ = cleanCssColor(urlParams.get('bg') ?? '');
            if (urlBgQ) urlOverrides.backgroundColor = urlBgQ;

            const urlRowBgQ = cleanCssColor(urlParams.get('rowbg') ?? urlParams.get('cardbg') ?? urlParams.get('card_bg') ?? '');
            if (urlRowBgQ) urlOverrides.rowBackgroundColor = urlRowBgQ;

            const urlBorderQ = cleanCssColor(urlParams.get('border') ?? urlParams.get('bordercolor') ?? '');
            if (urlBorderQ) urlOverrides.borderColor = urlBorderQ;

            const urlTextQ = cleanCssColor(urlParams.get('text') ?? urlParams.get('textcolor') ?? '');
            if (urlTextQ) urlOverrides.textColor = urlTextQ;

            const urlMutedQ = cleanCssColor(urlParams.get('muted') ?? urlParams.get('mutedcolor') ?? '');
            if (urlMutedQ) urlOverrides.mutedColor = urlMutedQ;

            const urlAccentQ = cleanCssColor(urlParams.get('accent') ?? '');
            if (urlAccentQ) urlOverrides.accentColor = urlAccentQ;

            const urlRadiusQ = cleanRadius(urlParams.get('radius') ?? urlParams.get('roundness') ?? urlParams.get('borderradius') ?? '');
            if (urlRadiusQ) urlOverrides.borderRadius = urlRadiusQ;

            const urlBlurQ = cleanBlur(urlParams.get('blur') ?? '');
            if (urlBlurQ) urlOverrides.backdropBlur = urlBlurQ;

            const howToVoteQ = urlParams.get('howtovote') ?? urlParams.get('hint') ?? urlParams.get('instructions');
            if (howToVoteQ !== null) urlOverrides.howToVote = String(howToVoteQ).toLowerCase();

            const hintScaleQ = urlParams.get('hintScale') ?? urlParams.get('hintscale') ?? urlParams.get('voteScale') ?? urlParams.get('hintSize');
            if (hintScaleQ) urlOverrides.hintScale = hintScaleQ;

            if (urlParams.has('hintText')) urlOverrides.hintText = urlParams.get('hintText') || '';

            const sfxQ = parseBoolParam(urlParams.get('sfx'));
            if (sfxQ !== undefined) urlOverrides.sfx = sfxQ;

            if (urlParams.has('banner') || urlParams.has('bannerUrl')) {
                urlOverrides.bannerUrl = sanitizeBannerUrl(urlParams.get('banner') ?? urlParams.get('bannerUrl') ?? '');
            }
            const bannerModeQ = (urlParams.get('bannerMode') ?? '').toLowerCase();
            if (['replace', 'behind'].includes(bannerModeQ)) urlOverrides.bannerMode = bannerModeQ;

            if (urlParams.has('bannerHeight')) {
                urlOverrides.bannerHeight = clampBannerHeight(urlParams.get('bannerHeight'));
            }
            const bannerFitQ = (urlParams.get('bannerFit') ?? '').toLowerCase();
            if (['cover', 'contain'].includes(bannerFitQ)) urlOverrides.bannerFit = bannerFitQ;

            const showCaptionsQ = parseBoolParam(urlParams.get('captions') ?? urlParams.get('showCaptions'));

            if (focusEnlargeQ !== undefined) urlOverrides.focusEnlarge = focusEnlargeQ;

            const previewOverrides = {};
            let currentState = null;
            let activeCfg = Object.assign({}, DEFAULT_CFG);
            let failedBannerUrl = '';
            let layoutRaf = 0;
            let hudInterval = null;
            let wsSocket = null;
            let wsReconnectTimer = null;
            let lastVoteId = null;
            let lastVoteLocked = false;
            let lastVoteCancelled = false;
            let lastTickedSecond = null;

            const TierAudio = {
                ctx: null,
                enabled: true,
                volume: 0.75,

                init() {
                    if (this.ctx) {
                        if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                        return;
                    }
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                },

                suspend() {
                    if (this.ctx && this.ctx.state === 'running') {
                        this.ctx.suspend().catch(() => {});
                    }
                },

                voteStart() {
                    if (!this.enabled || this.volume <= 0) return;
                    try {
                        this.init();
                        if (!this.ctx) return;
                        const now = this.ctx.currentTime;
                        const notes = [523.25, 659.25, 783.99];
                        notes.forEach((freq, idx) => {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.value = freq;
                            const t = now + (idx * 0.08);
                            const baseVol = 0.22 * this.volume;
                            gain.gain.setValueAtTime(baseVol, t);
                            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(t);
                            osc.stop(t + 0.45);
                        });
                    } catch {}
                },

                countdownTick(isFinal = false) {
                    if (!this.enabled || this.volume <= 0) return;
                    try {
                        this.init();
                        if (!this.ctx) return;
                        const now = this.ctx.currentTime;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = isFinal ? 'triangle' : 'sine';
                        osc.frequency.setValueAtTime(isFinal ? 880 : 587.33, now);
                        const baseVol = (isFinal ? 0.25 : 0.15) * this.volume;
                        gain.gain.setValueAtTime(baseVol, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.09);
                    } catch {}
                },

                voteLock() {
                    if (!this.enabled || this.volume <= 0) return;
                    try {
                        this.init();
                        if (!this.ctx) return;
                        const now = this.ctx.currentTime;
                        const chord = [523.25, 659.25, 783.99, 1046.50];
                        chord.forEach((freq, idx) => {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.value = freq;
                            const t = now + (idx * 0.06);
                            const baseVol = 0.28 * this.volume;
                            gain.gain.setValueAtTime(baseVol, t);
                            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(t);
                            osc.stop(t + 0.75);
                        });
                    } catch {}
                }
            };

            function resolveConfig(state) {

                if (t.headingFont !== undefined) cfg.headingFont = cleanFontName(t.headingFont);
                if (t.fontFamily !== undefined) cfg.fontFamily = cleanFontName(t.fontFamily);

                if (t.fontScale !== undefined) cfg.fontScale = cleanFontScale(t.fontScale);
                if (t.textTransform !== undefined) cfg.textTransform = cleanTransform(t.textTransform);
                if (t.textOutline !== undefined) cfg.textOutline = cleanOutline(t.textOutline);
                if (t.backgroundColor !== undefined) cfg.backgroundColor = cleanCssColor(t.backgroundColor);
                if (t.rowBackgroundColor !== undefined) cfg.rowBackgroundColor = cleanCssColor(t.rowBackgroundColor);
                if (t.borderColor !== undefined) cfg.borderColor = cleanCssColor(t.borderColor);
                if (t.textColor !== undefined) cfg.textColor = cleanCssColor(t.textColor);
                if (t.mutedColor !== undefined) cfg.mutedColor = cleanCssColor(t.mutedColor);
                if (t.accentColor !== undefined) cfg.accentColor = cleanCssColor(t.accentColor);
                if (t.borderRadius !== undefined) cfg.borderRadius = cleanRadius(t.borderRadius);
                if (t.backdropBlur !== undefined) cfg.backdropBlur = cleanBlur(t.backdropBlur);
                if (t.bannerUrl !== undefined) cfg.bannerUrl = sanitizeBannerUrl(t.bannerUrl);
                if (t.bannerMode && ['replace', 'behind'].includes(t.bannerMode)) cfg.bannerMode = t.bannerMode;
                if (t.bannerHeight !== undefined) cfg.bannerHeight = clampBannerHeight(t.bannerHeight);
                if (t.bannerFit && ['cover', 'contain'].includes(t.bannerFit)) cfg.bannerFit = t.bannerFit;
                if (t.showCaptions !== undefined) cfg.showCaptions = t.showCaptions !== false;
                if (t.fitCaptions !== undefined) cfg.fitCaptions = Boolean(t.fitCaptions);
                if (t.autoFit !== undefined) cfg.autoFit = Boolean(t.autoFit);
                if (t.focusEnlarge !== undefined) cfg.focusEnlarge = Boolean(t.focusEnlarge);
                if (t.howToVote !== undefined) cfg.howToVote = String(t.howToVote).toLowerCase();
                if (t.hintScale !== undefined) cfg.hintScale = String(t.hintScale);
                cfg.sfx = !(state && state.settings && state.settings.soundEnabled === false) && (t.sfx !== false);

                Object.assign(cfg, urlOverrides);
                Object.assign(cfg, previewOverrides);

                if (previewOverrides.soundEnabled === false) {
                    cfg.sfx = false;

                if (!IS_PREVIEW) cfg.useSampleData = false;

            }

            function applyAppearance(cfg) {
                activeCfg = cfg;
                const docStyle = document.documentElement.style;

                document.body.classList.toggle('auto-fit', Boolean(cfg.autoFit));
                document.body.classList.toggle('focus-enlarge-enabled', Boolean(cfg.focusEnlarge));

                const cardScale = parseScaleNumber(cfg.size);

                docStyle.setProperty('--tl-cover-fit', cfg.coverFit === 'natural' ? 'contain' : (cfg.coverFit || 'cover'));
                docStyle.setProperty('--tl-hint-scale', parseHintScaleNumber(cfg.hintScale, cfg.size));
                docStyle.setProperty('--tl-banner-height', `${clampBannerHeight(cfg.bannerHeight)}px`);

                const base = resolveBaseTheme(cfg.style, cfg.customThemeId);

                if (base.isTransparent) document.body.classList.add('theme-transparent');

                const effBg = cfg.backgroundColor || base.bg;
                const effHeaderBg = cfg.backgroundColor || base.headerBg || effBg;
                const effRowBg = cfg.rowBackgroundColor || base.rowBg;
                const effBorder = cfg.borderColor || base.border;
                const effText = cfg.textColor || base.text;
                const effMuted = cfg.mutedColor || base.muted;
                const effAccent = cfg.accentColor || base.accent;
                const effRadius = cfg.borderRadius || base.radius || '10px';

                let effBackdrop = base.backdrop || 'none';
                if (cfg.backdropBlur) {
                    if (cfg.backdropBlur === '0px' || cfg.backdropBlur === 'none') {
                        effBackdrop = 'none';
                    } else if (/^\d+(\.\d+)?px$/.test(cfg.backdropBlur)) {

                docStyle.setProperty('--tl-bg', effBg);
                docStyle.setProperty('--tl-header-bg', effHeaderBg);

                docStyle.setProperty('--tl-border', effBorder);
                docStyle.setProperty('--tl-text', effText);

                docStyle.setProperty('--tl-accent', effAccent);
                docStyle.setProperty('--tl-radius', effRadius);

                const effFont = cfg.fontFamily || base.font || '';
                const effHeadingFont = cfg.headingFont || base.headingFont || effFont;

                if (effHeadingFont) {

                docStyle.setProperty('--tl-font-weight', effWeight || '700');
                docStyle.setProperty('--tl-heading-weight', effWeight || '800');

                    docStyle.setProperty('--tl-header-shadow', 'none');

                const headerEl = $('overlay-header');
                const bannerImg = $('overlay-banner-img');
                if (headerEl && bannerImg) {
                    const cleanBanner = sanitizeBannerUrl(cfg.bannerUrl);
                    const hasValidBanner = Boolean(cleanBanner && cleanBanner !== failedBannerUrl);
                    if (hasValidBanner) {
                        if (bannerImg.dataset.loadedSrc !== cleanBanner) {
                            bannerImg.dataset.loadedSrc = cleanBanner;
                            bannerImg.src = cleanBanner;

                        bannerImg.style.display = 'block';
                        headerEl.classList.add('has-banner');
                        headerEl.classList.toggle('banner-replace', cfg.bannerMode !== 'behind');
                        headerEl.classList.toggle('banner-behind', cfg.bannerMode === 'behind');
                        headerEl.classList.toggle('banner-fit-contain', cfg.bannerFit === 'contain');
                    } else {

                            bannerImg.removeAttribute('src');

                        headerEl.classList.remove('has-banner', 'banner-replace', 'banner-behind', 'banner-fit-contain');
                    }
                }

                const votingEnabled = previewOverrides.chatVotingEnabled !== undefined
                    ? Boolean(previewOverrides.chatVotingEnabled)
                    : (currentState?.settings?.chatVotingEnabled !== false);
                TierAudio.enabled = !IS_PREVIEW && votingEnabled && Boolean(cfg.sfx) && TierAudio.volume > 0;
                if (!TierAudio.enabled) {
                    TierAudio.suspend();
                }
            }

            // Initialize banner error / load fallback once
            (function bindBannerImg() {
                const img = $('overlay-banner-img');
                if (!img) return;
                img.addEventListener('load', () => {
                    if (img.dataset.loadedSrc === failedBannerUrl) failedBannerUrl = '';
                    scheduleLayoutPass();
                });
                img.addEventListener('error', () => {
                    const brokenSrc = img.dataset.loadedSrc || '';
                    if (brokenSrc) failedBannerUrl = brokenSrc;
                    img.style.display = 'none';
                    const headerEl = $('overlay-header');
                    headerEl?.classList.remove('has-banner', 'banner-replace', 'banner-behind', 'banner-fit-contain');
                    scheduleLayoutPass();
                });
            })();

            // ----------------------------------------------------------------
            // Auto-Fit Board Scaling & Always-Fit Card Captions
            // ----------------------------------------------------------------

            function parseAspectRatio(str) {
                const parts = String(str || '1/1').split('/');
                if (parts.length === 2) {
                    const w = parseFloat(parts[0]);
                    const h = parseFloat(parts[1]);
                    if (w > 0 && h > 0) return w / h;
                }
                return 1;
            }

            function clearAutoFitStyles() {
                const containerEl = $('overlay-container');
                if (containerEl) {
                    containerEl.style.removeProperty('--tl-fit-card-size');
                    containerEl.style.removeProperty('--tl-fit-gap');
                    containerEl.style.removeProperty('--tl-fit-header-width');
                    containerEl.style.removeProperty('--tl-fit-header-font');
                    containerEl.style.removeProperty('--tl-fit-sub-font');
                }
                document.querySelectorAll('#overlay-board .overlay-row').forEach(row => {
                    row.style.removeProperty('flex');
                });
            }

            function applyAutoFit(cfg) {
                if (!cfg.autoFit) {
                    clearAutoFitStyles();
                    return;
                }
                const containerEl = $('overlay-container');
                const boardEl = $('overlay-board');
                if (!containerEl || !boardEl) return;

                const rows = Array.from(boardEl.querySelectorAll('.overlay-row'));
                if (!rows.length) return;

                const containerW = containerEl.clientWidth;
                const containerH = containerEl.clientHeight;
                const availBoardW = boardEl.clientWidth;
                if (containerW <= 0 || containerH <= 0 || availBoardW <= 0) return;

                const cs = getComputedStyle(containerEl);
                const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
                const rowGap = parseFloat(cs.rowGap || cs.gap) || 0;

                let siblingsH = 0;
                let visibleSiblings = 0;
                for (const id of ['overlay-header', 'overlay-how-to-vote', 'overlay-unranked']) {
                    const sib = $(id);
                    if (sib && getComputedStyle(sib).display !== 'none') {
                        siblingsH += sib.offsetHeight;
                        visibleSiblings++;
                    }
                }
                const gapsH = visibleSiblings * rowGap;
                const availBoardH = Math.max(80, containerH - padY - siblingsH - gapsH - 2);

                const scaleNum = parseScaleNumber(cfg.size);
                const baseHeaderW = Math.min(200, Math.max(76, 0.085 * containerW)) * scaleNum;
                const isSidebar = cfg.layout === 'sidebar';
                const fixedAspectRatio = parseAspectRatio(cfg.aspect);
                const isNatural = cfg.coverFit === 'natural';
                const rowBorders = Math.max(0, rows.length - 1);
                const maxH = Math.min(260, Math.max(32, Math.floor((availBoardH - rowBorders) / rows.length)));

                const rowRatios = rows.map(r => {
                    const imgs = r.querySelectorAll('.card img');
                    const arr = [];
                    for (let i = 0; i < imgs.length; i++) {
                        if (isNatural) {
                            const nw = imgs[i].naturalWidth;
                            const nh = imgs[i].naturalHeight;
                            const ratio = (nw > 0 && nh > 0) ? (nw / nh) : 1;
                            arr.push(Math.min(2.6, Math.max(0.45, ratio)));
                        } else {
                            arr.push(fixedAspectRatio);
                        }
                    }
                    return arr;
                });

                function evaluate(H) {
                    const gap = Math.max(2, Math.min(10, Math.round(H * 0.08)));
                    const headerW = isSidebar
                        ? Math.max(44, Math.min(92, Math.round(H * 1.15)))
                        : Math.max(54, Math.min(Math.round(baseHeaderW), Math.round(H * 1.3)));
                    const itemsW = Math.max(20, availBoardW - headerW - 4 - gap * 2);

                    const linesPerRow = [];
                    const rowHeights = [];
                    let totalH = rowBorders;
                    for (let i = 0; i < rowRatios.length; i++) {
                        const ratios = rowRatios[i];
                        let lines = 1;
                        let lineW = 0;
                        for (let j = 0; j < ratios.length; j++) {
                            const cardW = Math.min(itemsW, H * ratios[j]);
                            const needed = lineW === 0 ? cardW : (lineW + gap + cardW);
                            if (needed > itemsW && lineW > 0) {
                                lines++;
                                lineW = cardW;
                            } else {
                                lineW = needed;
                            }
                        }
                        const rowH = (lines * H) + (Math.max(0, lines - 1) * gap) + (gap * 2);
                        linesPerRow.push(lines);
                        rowHeights.push(rowH);
                        totalH += rowH;
                    }
                    const headerFont = Math.max(11, Math.min(28, Math.round(Math.min(headerW * 0.28, H * 0.28))));
                    const subFont = Math.max(8, Math.min(13, Math.round(headerFont * 0.55)));
                    return {
                        feasible: totalH <= availBoardH - 2,
                        linesPerRow,
                        rowHeights,
                        cardH: H,
                        gap,
                        headerW,
                        headerFont,
                        subFont
                    };
                }

                let lo = 16;
                let hi = Math.max(16, maxH);
                let bestResult = evaluate(lo);
                for (let iter = 0; iter < 14 && lo <= hi; iter++) {
                    const mid = (lo + hi) >> 1;
                    const res = evaluate(mid);
                    if (res.feasible) {
                        bestResult = res;
                        lo = mid + 1;
                    } else {
                        hi = mid - 1;
                    }
                }

                function applyFitVars(res) {
                    containerEl.style.setProperty('--tl-fit-card-size', `${res.cardH}px`);
                    containerEl.style.setProperty('--tl-fit-gap', `${res.gap}px`);
                    containerEl.style.setProperty('--tl-fit-header-width', `${res.headerW}px`);
                    containerEl.style.setProperty('--tl-fit-header-font', `${res.headerFont}px`);
                    containerEl.style.setProperty('--tl-fit-sub-font', `${res.subFont}px`);
                    for (let i = 0; i < rows.length; i++) {
                        rows[i].style.flex = `${res.linesPerRow[i]} 1 ${Math.floor(res.rowHeights[i])}px`;
                    }
                }

                applyFitVars(bestResult);

                // Verify subpixel rounding against real DOM heights (at most 2 nudges)
                let currentH = bestResult.cardH;
                for (let attempt = 0; attempt < 2 && currentH > 16; attempt++) {
                    const boardOverflow = boardEl.scrollHeight > boardEl.clientHeight + 2;
                    let rowOverflow = false;
                    if (!boardOverflow) {
                        for (let i = 0; i < rows.length; i++) {
                            const itemsEl = rows[i].querySelector('.overlay-row-items');
                            if (itemsEl && itemsEl.scrollHeight > itemsEl.clientHeight + 2) {
                                rowOverflow = true;
                                break;
                            }
                        }
                    }
                    if (!boardOverflow && !rowOverflow) break;
                    currentH = Math.max(16, currentH - 2);
                    applyFitVars(evaluate(currentH));
                }
            }

            function fitCaptionsInContainer(selector, cfg = activeCfg) {
                const container = $(selector);
                if (!container) return;
                const cards = Array.from(container.querySelectorAll('.card'));
                if (!cards.length) return;
                const fontScale = cleanFontScale(cfg?.fontScale);

                // Read batch 1: measure each card individually (supports mixed-width natural images)
                const items = [];
                for (let i = 0; i < cards.length; i++) {
                    const card = cards[i];
                    const cardW = card.clientWidth;
                    const cardH = card.clientHeight;
                    const cap = card.querySelector('.card-caption');
                    if (cardW > 0 && cardH > 0 && cap) {
                        const baseFont = Math.min(18, Math.max(8, Math.round(cardW * 0.135 * fontScale)));
                        const maxH = Math.max(22, Math.floor(cardH * 0.74));
                        items.push({ cap, cardH, baseFont, maxH });
                    }
                }
                if (!items.length) return;

                // Write batch 1: reset captions to per-card baseFont
                for (let i = 0; i < items.length; i++) {
                    const { cap, baseFont } = items[i];
                    cap.style.fontSize = `${baseFont}px`;
                    cap.style.lineHeight = '';
                    cap.style.maxHeight = '';
                }

                // Read batch 2: collect only captions that overflow baseFont bounds
                const overflowing = [];
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    if (item.cap.scrollHeight > item.maxH || item.cap.scrollHeight > item.cap.clientHeight + 1 || item.cap.scrollWidth > item.cap.clientWidth + 1) {
                        overflowing.push(item);
                    }
                }

                // Shrink overflowing captions with fast binary search
                for (let i = 0; i < overflowing.length; i++) {
                    const { cap, cardH, baseFont, maxH } = overflowing[i];
                    const hardMaxH = Math.max(maxH, Math.floor(cardH * 0.92));
                    let lo = 6;
                    let hi = baseFont - 1;
                    let best = 6;
                    for (let iter = 0; iter < 4 && lo <= hi; iter++) {
                        const mid = (lo + hi) >> 1;
                        cap.style.fontSize = `${mid}px`;
                        if (cap.scrollHeight <= maxH && cap.scrollHeight <= cap.clientHeight + 1 && cap.scrollWidth <= cap.clientWidth + 1) {
                            best = mid;
                            lo = mid + 1;
                        } else {
                            hi = mid - 1;
                        }
                    }
                    cap.style.fontSize = `${best}px`;
                    if (cap.scrollHeight > maxH || cap.scrollHeight > cap.clientHeight + 1 || cap.scrollWidth > cap.clientWidth + 1) {
                        cap.style.lineHeight = '1.05';
                        cap.style.maxHeight = '92%';
                        cap.style.fontSize = '6px';
                        if (cap.scrollHeight > hardMaxH || cap.scrollHeight > cap.clientHeight + 1 || cap.scrollWidth > cap.clientWidth + 1) {
                            cap.style.fontSize = '5px';
                        }
                    }
                }
            }

            function fitAllCardCaptions(cfg = activeCfg) {
                if (!cfg.showCaptions || !cfg.fitCaptions) {
                    document.querySelectorAll('.card-caption').forEach(el => {
                        el.style.removeProperty('font-size');
                        el.style.removeProperty('line-height');
                        el.style.removeProperty('max-height');
                    });
                    return;
                }
                fitCaptionsInContainer('overlay-board', cfg);
                fitCaptionsInContainer('overlay-unranked-items', cfg);
            }

            function fitRowHeaders() {
                const headers = Array.from(document.querySelectorAll('#overlay-board .overlay-row-header'));
                if (!headers.length) return;

                // Batch 1: clear previous inline shrink overrides
                const entries = headers.map(header => {
                    const labelEl = header.querySelector('.overlay-row-label');
                    const subEl = header.querySelector('.overlay-row-sub');
                    if (labelEl) labelEl.style.removeProperty('font-size');
                    if (subEl) {
                        subEl.style.removeProperty('font-size');
                        subEl.style.removeProperty('display');
                    }
                    return { header, labelEl, subEl };
                });

                // Batch 2: measure overflowing headers
                const overflowing = entries.filter(({ header }) => (
                    header.clientWidth > 0 && header.clientHeight > 0 &&
                    (header.scrollHeight > header.clientHeight + 1 || header.scrollWidth > header.clientWidth + 1)
                ));
                if (!overflowing.length) return;

                // Batch 3: shrink sub-label then main label proportionally until it fits
                for (const { header, labelEl, subEl } of overflowing) {
                    const headerCs = getComputedStyle(header);
                    const baseLabelPx = parseFloat(headerCs.fontSize) || 18;
                    const baseSubPx = subEl ? (parseFloat(getComputedStyle(subEl).fontSize) || 11) : 11;

                    let fitted = false;
                    for (let step = 1; step <= 6; step++) {
                        const factor = Math.max(0.55, 1 - step * 0.09);
                        if (subEl) subEl.style.fontSize = `${Math.max(8, Math.round(baseSubPx * factor))}px`;
                        if (labelEl) labelEl.style.fontSize = `${Math.max(10, Math.round(baseLabelPx * factor))}px`;
                        if (header.scrollHeight <= header.clientHeight + 1 && header.scrollWidth <= header.clientWidth + 1) {
                            fitted = true;
                            break;
                        }
                    }
                    // Only hide sub-description if extreme vertical compression prevents any fit
                    if (!fitted && subEl && header.scrollHeight > header.clientHeight + 2) {
                        subEl.style.display = 'none';
                        if (labelEl && header.scrollHeight > header.clientHeight + 1) {
                            labelEl.style.fontSize = `${Math.max(9, Math.round(baseLabelPx * 0.65))}px`;
                        }
                    }
                }
            }

            function runLayoutPass() {
                layoutRaf = 0;
                if (document.hidden || !currentState) return;
                applyAutoFit(activeCfg);
                fitRowHeaders();
                fitAllCardCaptions(activeCfg);
            }

            function scheduleLayoutPass() {
                if (document.hidden || layoutRaf) return;
                layoutRaf = requestAnimationFrame(runLayoutPass);
            }

            // ----------------------------------------------------------------
            // Preview-Only Fictional Sample Data
            // ----------------------------------------------------------------

            function makeSampleThumb(label, bg1, bg2) {
                const initials = String(label || '?').split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
                const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'>` +
                    `<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='${bg1}'/><stop offset='100%' stop-color='${bg2}'/></linearGradient></defs>` +
                    `<rect width='240' height='240' fill='url(#g)'/>` +
                    `<circle cx='190' cy='50' r='55' fill='rgba(255,255,255,0.08)'/>` +
                    `<text x='50%' y='46%' dominant-baseline='middle' text-anchor='middle' fill='#ffffff' font-family='system-ui,sans-serif' font-size='64' font-weight='800' opacity='0.9'>${esc(initials)}</text>` +
                    `</svg>`;
                return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
            }

            function buildPreviewSampleState(realState) {
                const tiers = (realState?.tiers && realState.tiers.length)
                    ? realState.tiers
                    : [
                        { id: 'tier-s', label: 'S', color: '#ff7f7f', description: 'Top Tier' },
                        { id: 'tier-a', label: 'A', color: '#ffbf7f', description: 'Great' },
                        { id: 'tier-b', label: 'B', color: '#ffdf7f', description: 'Good' },
                        { id: 'tier-c', label: 'C', color: '#ffff7f', description: 'Average' },
                        { id: 'tier-d', label: 'D', color: '#bfff7f', description: 'Below Average' },
                        { id: 'tier-f', label: 'F', color: '#7fff7f', description: 'Bottom Tier' }
                    ];
                const sampleCatalog = [
                    { name: 'Chrono Trigger: Definitive Edition', colors: ['#1d4ed8', '#7c3aed'] },
                    { name: 'Hades', colors: ['#dc2626', '#9a3412'] },
                    { name: 'Hollow Knight: Silksong', colors: ['#334155', '#0f172a'] },
                    { name: 'Portal 2', colors: ['#0284c7', '#1e293b'] },
                    { name: 'The Legend of Zelda: Tears of the Kingdom', colors: ['#047857', '#065f46'] },
                    { name: 'Celeste', colors: ['#be185d', '#4c1d95'] },
                    { name: 'Stardew Valley', colors: ['#15803d', '#854d0e'] },
                    { name: 'Balatro', colors: ['#b91c1c', '#1e1b4b'] },
                    { name: 'Super Metroid', colors: ['#9333ea', '#1e3a8a'] },
                    { name: 'Elden Ring: Shadow of the Erdtree', colors: ['#92400e', '#1c1917'] },
                    { name: 'Outer Wilds', colors: ['#c2410c', '#0f172a'] },
                    { name: 'Cyberpunk 2077: Phantom Liberty', colors: ['#ca8a04', '#701a75'] },
                    { name: 'Subnautica', colors: ['#0369a1', '#042f2e'] },
                    { name: 'Minecraft', colors: ['#16a34a', '#78350f'] },
                    { name: 'Inscryption', colors: ['#3f6212', '#18181b'] },
                    { name: 'Cuphead: The Delicious Last Course', colors: ['#b45309', '#991b1b'] },
                    { name: 'Return of the Obra Dinn', colors: ['#334155', '#111827'] },
                    { name: 'Untitled Indie Adventure Sequel Deluxe', colors: ['#0f766e', '#1e293b'] }
                ];
                const items = sampleCatalog.map((entry, idx) => {
                    const placedCount = sampleCatalog.length - 3;
                    const tierId = idx < placedCount ? tiers[idx % Math.min(tiers.length, 4)]?.id || tiers[0].id : null;
                    return {
                        id: `sample-item-${idx}`,
                        name: entry.name,
                        imageUrl: makeSampleThumb(entry.name, entry.colors[0], entry.colors[1]),
                        tierId,

                    };

                return Object.assign({}, realState || {}, { tiers, items });

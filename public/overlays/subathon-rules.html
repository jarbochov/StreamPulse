<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse Subathon Rules</title>
    <style>
        :root {
            --bg-card: rgba(18, 24, 38, 0.88);
            --border-card: rgba(255, 255, 255, 0.12);
            --radius-card: 10px;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.7);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --boost-banner: linear-gradient(135deg, rgba(245, 158, 11, 0.9), rgba(217, 119, 6, 0.95));
            --boost-banner-glow: rgba(245, 158, 11, 0.4);
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            --header-font: inherit;
            --header-size: 1.15rem;
            --value-size: 1.35rem;
            --value-weight: 800;
            --scale: 1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: transparent;
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow: hidden;
            transform-origin: center center;
        }

        .rules-container {
            transform: scale(var(--scale));
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            max-width: 900px;
            width: 100%;
            transition: max-width 0.2s ease;
        }

        /* Banner */
        .happy-hour-banner {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: var(--boost-banner);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            box-shadow: 0 4px 18px var(--boost-banner-glow);
            animation: pulseBanner 2s infinite ease-in-out;
            color: #ffffff;
        }

        @keyframes pulseBanner {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.15); }
        }

        .header-title {
            font-family: var(--header-font);
            font-size: var(--header-size);
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid var(--border-card);
        }

        .header-title span.badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #93c5fd;
        }

        /* Grid Layout */
        .rules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.75rem;
        }

        .rule-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-card);
            padding: 0.85rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .rule-card:hover {
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .rule-head {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-sub);
        }

        .rule-head svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            flex-shrink: 0;
        }

        .rule-value {
            font-size: var(--value-size);
            font-weight: var(--value-weight);
            color: var(--text-main);
            letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums;
        }

        .rule-note {
            font-size: 0.74rem;
            color: var(--text-sub);
        }

        /* Compact Layout */
        .rules-container.layout-compact .rules-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .rules-container.layout-compact .rule-card {
            flex-direction: row;
            align-items: center;
            padding: 0.45rem 0.85rem;
            gap: 0.75rem;
        }

        .rules-container.layout-compact .rule-value {
            font-size: 0.95rem;
        }

        /* Ticker Layout */
        .rules-container.layout-ticker {
            max-width: 100vw;
            width: 100vw;
            padding: 0;
        }

        .rules-container.layout-ticker .rules-grid {
            display: flex;
            gap: 1.5rem;
            animation: tickerScroll 25s linear infinite;
            white-space: nowrap;
            width: max-content;
        }

        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Preset Overrides */
        body.theme-light {
            --bg-card: rgba(255, 255, 255, 0.94);
            --border-card: rgba(0, 0, 0, 0.12);
            --text-main: #0f172a;
            --text-sub: #475569;
            --accent: #2563eb;
        }

        body.theme-arcade {
            --bg-card: rgba(15, 12, 41, 0.94);
            --border-card: rgba(236, 72, 153, 0.45);
            --radius-card: 4px;
            --accent: #ec4899;
            --text-main: #fdf2f8;
            --text-sub: #fbcfe8;
            --font-family: 'Courier New', Courier, monospace;
        }

        body.theme-glass {
            --bg-card: rgba(255, 255, 255, 0.08);
            --border-card: rgba(255, 255, 255, 0.22);
            --radius-card: 14px;
            --accent: #38bdf8;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        body.theme-minimal {
            --bg-card: rgba(0, 0, 0, 0.45);
            --border-card: rgba(255, 255, 255, 0.08);
            --radius-card: 8px;
            --accent: #60a5fa;
        }

        .empty-placeholder {
            color: var(--text-sub);
            font-size: 0.85rem;
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div id="rules-root" class="rules-container">
        <div id="happy-hour" class="happy-hour-banner">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            <span id="happy-hour-text">2X BOOST PERIOD ACTIVE!</span>
        </div>

        <div id="rules-header" class="header-title">
            <span id="title-text">Subathon Rates</span>
            <span id="total-badge" class="badge">0m Added</span>
        </div>

        <div id="rules-grid" class="rules-grid"></div>
    </div>

    <script src="/overlay-shared.js"></script>
    <script src="/overlay-visibility.js" data-key="subathon-rules"></script>
    <script src="/url-params.js"></script>
    <script>
    (function() {
        const urlParams = window.overlayParams ? window.overlayParams() : new URLSearchParams(window.location.search);
        let subathonData = null;
        let previewThemeOverride = null;
        let previewSampleOverride = null;

        function fmtSeconds(sec) {
            const s = Math.max(0, Math.round(Number(sec) || 0));
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const remS = s % 60;
            if (h > 0) return remS > 0 ? `${h}h ${m}m ${remS}s` : `${h}h ${m}m`;
            if (m > 0) return remS > 0 ? `${m}m ${remS}s` : `${m}m`;
            return `${remS}s`;
        }

        function getEffectiveTheme() {
            const serverTheme = subathonData?.config?.theme || {};
            const override = previewThemeOverride || {};
            return {
                preset: urlParams.get('theme') || urlParams.get('preset') || override.preset || serverTheme.preset || 'dark',
                layout: urlParams.get('layout') || override.layout || serverTheme.layout || 'grid',
                columns: urlParams.get('columns') ? parseInt(urlParams.get('columns'), 10) : (override.columns !== undefined ? override.columns : (serverTheme.columns || 0)),
                scale: urlParams.get('scale') ? parseFloat(urlParams.get('scale')) : (override.scale !== undefined ? override.scale : (serverTheme.scale || 1.0)),
                showHeader: urlParams.get('header') !== null ? (urlParams.get('header') !== '0' && urlParams.get('header') !== 'false') : (override.showHeader !== undefined ? override.showHeader : (serverTheme.showHeader !== false)),
                titleText: urlParams.get('title') || override.titleText || serverTheme.titleText || 'Subathon Rates',
                showTotalBadge: urlParams.get('total') !== null ? (urlParams.get('total') !== '0') : (override.showTotalBadge !== undefined ? override.showTotalBadge : (serverTheme.showTotalBadge !== false)),
                showBoostBanner: urlParams.get('boost') !== null ? (urlParams.get('boost') !== '0') : (override.showBoostBanner !== undefined ? override.showBoostBanner : (serverTheme.showBoostBanner !== false)),
                showCardIcons: urlParams.get('icons') !== null ? (urlParams.get('icons') !== '0') : (override.showCardIcons !== undefined ? override.showCardIcons : (serverTheme.showCardIcons !== false)),
                showNotes: urlParams.get('notes') !== null ? (urlParams.get('notes') !== '0') : (override.showNotes !== undefined ? override.showNotes : (serverTheme.showNotes !== false)),
                showSubs: urlParams.get('subs') !== null ? (urlParams.get('subs') !== '0') : (override.showSubs !== undefined ? override.showSubs : (serverTheme.showSubs !== false)),
                showDonations: (urlParams.get('tips') !== null ? urlParams.get('tips') !== '0' : (urlParams.get('donations') !== null ? urlParams.get('donations') !== '0' : (override.showDonations !== undefined ? override.showDonations : (serverTheme.showDonations !== false)))),
                showBits: urlParams.get('bits') !== null ? (urlParams.get('bits') !== '0') : (override.showBits !== undefined ? override.showBits : (serverTheme.showBits !== false)),
                showFollows: urlParams.get('follows') !== null ? (urlParams.get('follows') !== '0') : (override.showFollows !== undefined ? override.showFollows : (serverTheme.showFollows !== false)),
                showRaids: urlParams.get('raids') !== null ? (urlParams.get('raids') !== '0') : (override.showRaids !== undefined ? override.showRaids : (serverTheme.showRaids !== false)),
                cardBackground: override.cardBackground || serverTheme.cardBackground || '',
                cardBorder: override.cardBorder || serverTheme.cardBorder || '',
                cardRadius: override.cardRadius !== undefined ? override.cardRadius : serverTheme.cardRadius,
                textColor: override.textColor || serverTheme.textColor || '',
                textMuted: override.textMuted || serverTheme.textMuted || '',
                accentColor: override.accentColor || serverTheme.accentColor || '',
                boostBannerColor: override.boostBannerColor || serverTheme.boostBannerColor || '',
                fontFamily: override.fontFamily || serverTheme.fontFamily || '',
                headerFontFamily: override.headerFontFamily || serverTheme.headerFontFamily || '',
                headerSize: override.headerSize || serverTheme.headerSize || '1.15rem',
                valueSize: override.valueSize || serverTheme.valueSize || '1.35rem',
                valueWeight: override.valueWeight || serverTheme.valueWeight || '800'
            };
        }

        function applyTheme(theme) {
            const root = document.documentElement;
            const rootDiv = document.getElementById('rules-root');
            const gridDiv = document.getElementById('rules-grid');

            // Reset theme classes
            document.body.className = '';
            if (theme.preset && theme.preset !== 'custom') {
                document.body.classList.add(`theme-${theme.preset}`);
            }

            // Layout class
            rootDiv.className = 'rules-container';
            if (theme.layout && theme.layout !== 'grid') {
                rootDiv.classList.add(`layout-${theme.layout}`);
            }

            // Columns
            if (theme.layout === 'grid' && theme.columns > 0) {
                gridDiv.style.gridTemplateColumns = `repeat(${theme.columns}, 1fr)`;
            } else if (theme.layout === 'grid') {
                gridDiv.style.gridTemplateColumns = `repeat(auto-fit, minmax(180px, 1fr))`;
            } else {
                gridDiv.style.gridTemplateColumns = '';
            }

            // CSS Custom Properties
            root.style.setProperty('--scale', theme.scale || 1);
            if (theme.cardBackground) root.style.setProperty('--bg-card', theme.cardBackground);
            if (theme.cardBorder) root.style.setProperty('--border-card', theme.cardBorder);
            if (theme.cardRadius !== undefined) root.style.setProperty('--radius-card', `${theme.cardRadius}px`);
            if (theme.textColor) root.style.setProperty('--text-main', theme.textColor);
            if (theme.textMuted) root.style.setProperty('--text-sub', theme.textMuted);
            if (theme.accentColor) {
                root.style.setProperty('--accent', theme.accentColor);
                root.style.setProperty('--accent-glow', `${theme.accentColor}55`);
            }
            if (theme.boostBannerColor) {
                root.style.setProperty('--boost-banner', theme.boostBannerColor);
            }
            if (theme.fontFamily) root.style.setProperty('--font-family', theme.fontFamily);
            if (theme.headerFontFamily) root.style.setProperty('--header-font', theme.headerFontFamily);
            if (theme.headerSize) root.style.setProperty('--header-size', theme.headerSize);
            if (theme.valueSize) root.style.setProperty('--value-size', theme.valueSize);
            if (theme.valueWeight) root.style.setProperty('--value-weight', theme.valueWeight);

            // Header & Title
            const headerEl = document.getElementById('rules-header');
            if (headerEl) {
                headerEl.style.display = theme.showHeader ? 'flex' : 'none';
            }
            const titleEl = document.getElementById('title-text');
            if (titleEl) {
                titleEl.textContent = theme.titleText || 'Subathon Rates';
            }
            const totalBadgeEl = document.getElementById('total-badge');
            if (totalBadgeEl) {
                totalBadgeEl.style.display = theme.showTotalBadge ? 'inline-block' : 'none';
            }
        }

        function render() {
            const theme = getEffectiveTheme();
            applyTheme(theme);

            const isSample = previewSampleOverride !== null
                ? previewSampleOverride
                : (urlParams.get('sample') === '1' || urlParams.get('preview') === '1');

            const isInactive = !subathonData || !subathonData.config || subathonData.config.enabled === false;

            if (isInactive && !isSample) {
                document.getElementById('rules-grid').innerHTML = '<div class="empty-placeholder">Subathon is currently inactive</div>';
                document.getElementById('happy-hour').style.display = 'none';
                return;
            }

            // Build rules data from live config or sample mock
            let cfg = subathonData?.config || {};
            let r = cfg.rules || {};
            let state = subathonData?.state || {};
            let factor = (subathonData?.rulesSummary?.boostActive || subathonData?.rulesSummary?.happyHourActive)
                ? (cfg.multiplier?.factor || 2)
                : 1;

            if (isInactive && isSample) {
                factor = 2;
                r = {
                    subs: { enabled: true, tier1Seconds: 120, tier2Seconds: 240, tier3Seconds: 600 },
                    donations: { enabled: true, secondsPerDollar: 60, exactAmounts: [{ amount: 4.20, seconds: 420, label: 'Blaze It' }] },
                    bits: { enabled: true, secondsPer100Bits: 30 },
                    follows: { enabled: true, seconds: 15 },
                    raids: { enabled: true, baseSeconds: 30, secondsPerViewer: 2 }
                };
                state = { totalTimeAddedSeconds: 2700 };
            }

            // Boost banner
            const hhEl = document.getElementById('happy-hour');
            const isBoost = Boolean(factor > 1);
            if (isBoost && theme.showBoostBanner) {
                hhEl.style.display = 'flex';
                document.getElementById('happy-hour-text').textContent = `${factor}X BOOST PERIOD ACTIVE!`;
            } else {
                hhEl.style.display = 'none';
            }

            // Total badge
            const totalSec = state.totalTimeAddedSeconds || 0;
            document.getElementById('total-badge').textContent = `${fmtSeconds(totalSec)} Added`;

            const cards = [];

            // 1. Subs
            if (r.subs && r.subs.enabled !== false && theme.showSubs) {
                const t1 = Math.round((r.subs.tier1Seconds || 120) * factor);
                cards.push({
                    title: 'Tier 1 Sub',
                    value: `+${fmtSeconds(t1)}`,
                    note: 'Or Twitch Prime',
                    icon: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
                });
                if (r.subs.tier2Seconds > 0) {
                    cards.push({
                        title: 'Tier 2 Sub',
                        value: `+${fmtSeconds(Math.round(r.subs.tier2Seconds * factor))}`,
                        note: '2x multiplier tier',
                        icon: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
                    });
                }
                if (r.subs.tier3Seconds > 0) {
                    cards.push({
                        title: 'Tier 3 Sub',
                        value: `+${fmtSeconds(Math.round(r.subs.tier3Seconds * factor))}`,
                        note: 'Maximum tier boost',
                        icon: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
                    });
                }
            }

            // 2. Donations / Tips
            if (r.donations && r.donations.enabled !== false && theme.showDonations) {
                const perDollar = Math.round((r.donations.secondsPerDollar || 60) * factor);
                cards.push({
                    title: 'Donation / Tip',
                    value: `+${fmtSeconds(perDollar)}`,
                    note: 'Per $1.00 contributed',
                    icon: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'
                });

                if (Array.isArray(r.donations.exactAmounts)) {
                    for (const ea of r.donations.exactAmounts) {
                        const eaSec = Math.round(ea.seconds * factor);
                        cards.push({
                            title: `$${ea.amount.toFixed(2)} Exact`,
                            value: `+${fmtSeconds(eaSec)}`,
                            note: ea.label || 'Custom exact bonus',
                            icon: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>'
                        });
                    }
                }
            }

            // 3. Bits
            if (r.bits && r.bits.enabled !== false && theme.showBits) {
                const per100 = Math.round((r.bits.secondsPer100Bits || 30) * factor);
                cards.push({
                    title: 'Cheer Bits',
                    value: `+${fmtSeconds(per100)}`,
                    note: 'Per 100 bits',
                    icon: '<polygon points="6 2 18 2 22 8 12 22 2 8 6 2"/>'
                });
            }

            // 4. Follows
            if (r.follows && r.follows.enabled && theme.showFollows) {
                const followSec = Math.round((r.follows.seconds || 15) * factor);
                cards.push({
                    title: 'New Follow',
                    value: `+${fmtSeconds(followSec)}`,
                    note: 'Per follow',
                    icon: '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>'
                });
            }

            // 5. Raids
            if (r.raids && r.raids.enabled && theme.showRaids) {
                const baseSec = Math.round((r.raids.baseSeconds || 30) * factor);
                const perViewer = Math.round((r.raids.secondsPerViewer || 2) * factor);
                cards.push({
                    title: 'Incoming Raid',
                    value: `+${fmtSeconds(baseSec)}`,
                    note: `+${fmtSeconds(perViewer)} per raider`,
                    icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'
                });
            }

            const html = cards.map(c => `
                <div class="rule-card">
                    <div class="rule-head">
                        ${theme.showCardIcons ? `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg>` : ''}
                        <span>${c.title}</span>
                    </div>
                    <div class="rule-value">${c.value}</div>
                    ${theme.showNotes ? `<div class="rule-note">${c.note}</div>` : ''}
                </div>
            `).join('');

            document.getElementById('rules-grid').innerHTML = html || '<div class="empty-placeholder">No active rates configured</div>';
        }

        async function fetchSubathon() {
            try {
                const res = await fetch('/api/subathon');
                if (!res.ok) return;
                subathonData = await res.json();
                render();
            } catch (err) {
                console.warn('[Subathon Rules] Fetch error:', err);
            }
        }

        fetchSubathon();

        // 60FPS zero-lag postMessage preview synchronization
        window.addEventListener('message', (event) => {
            if (!event.data) return;
            if (event.data.type === 'subathon:preview-config' || event.data.type === 'subathon:preview-theme') {
                if (event.data.theme) {
                    previewThemeOverride = { ...(previewThemeOverride || {}), ...event.data.theme };
                }
                if (event.data.sample !== undefined) {
                    previewSampleOverride = Boolean(event.data.sample);
                }
                render();
            }
        });

        // WebSocket live sync
        if (typeof window.StreamPulseOverlay === 'function') {
            window.StreamPulseOverlay({
                onEvent(type) {
                    if (type === 'subathon-update' || type === 'subathon-event') {
                        fetchSubathon();
                    }
                }
            });
        } else {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${proto}//${location.host}/ws`);
            ws.onmessage = (msg) => {
                try {
                    const data = JSON.parse(msg.data);
                    if (data.type === 'subathon-update' || data.type === 'subathon-event') {
                        fetchSubathon();
                    }
                } catch (_) {}
            };
        }
    })();
    </script>
</body>
</html>

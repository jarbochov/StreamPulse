<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse Viewer Count</title>
    <style>
        :root {
            --viewer-font-family: 'Segoe UI', system-ui, sans-serif;
            --viewer-text-color: #ffffff;
            --viewer-accent-color: #58a6ff;
            --viewer-muted-color: rgba(255,255,255,.72);
            --viewer-background: rgba(0,0,0,.45);
            --viewer-outline-color: #000000aa;
            --viewer-font-scale: 1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
        body { display: flex; align-items: center; justify-content: center; font-family: var(--viewer-font-family); color: var(--viewer-text-color); }
        .viewer-card { width: 100%; height: 100%; display: inline-flex; align-items: center; justify-content: center; gap: .55em; padding: clamp(.45em, max(5vmin, 8cqh, 8vh), 3rem); background: var(--viewer-background); border-radius: .45em; text-shadow: 0 2px .3em var(--viewer-outline-color); container-type: size; }
        .count { color: var(--viewer-text-color); font-size: calc(clamp(1.2rem, max(8vmin, 52cqh, 52vh), 8rem) * var(--viewer-font-scale)); font-weight: 700; line-height: 1; }
        .label { color: var(--viewer-muted-color); font-size: calc(clamp(.7rem, max(3.2vmin, 24cqh, 24vh), 3.5rem) * var(--viewer-font-scale)); }
        .offline { opacity: .65; }

        /* Layout variants */
        .viewer-card.layout-pill {
            border-radius: 999px;
            padding: clamp(.35em, max(2.5vmin, 6cqh, 6vh), 1.2rem) clamp(.85em, max(4vmin, 8cqw, 8vw), 2.2rem);
        }
        .viewer-card .live-dot {
            width: clamp(8px, max(2vmin, 16cqh, 16vh), 28px);
            height: clamp(8px, max(2vmin, 16cqh, 16vh), 28px);
            background: #f43f5e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.8s infinite ease-in-out;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(244, 63, 94, 0.7);
        }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.6; }
        }
        .viewer-card.layout-badge {
            border-radius: clamp(6px, 1.5vmin, 12px);
            padding: clamp(.3em, max(2vmin, 6cqh, 6vh), 1.5rem) clamp(.6em, max(2.8vmin, 6cqw, 6vw), 2.2rem);
            gap: .35em;
        }
        .viewer-card.layout-minimal .label {
            display: none;
        }
        .viewer-card.layout-stacked {
            flex-direction: column;
            gap: .15em;
        }
    </style>
</head>
<body>
    <div class="viewer-card" id="viewer-card">
        <span class="live-dot" id="live-dot" style="display:none;"></span>
        <span class="badge-icon" id="badge-icon" style="display:none;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
        <span class="count" id="viewer-count">0</span>
        <span class="label" id="viewer-label">viewers</span>
    </div>
    <script src="/overlay-visibility.js" data-key="viewers"></script>
    <script src="/url-params.js"></script>
    <script src="/overlay-theme.js"></script>
    <script>
    const params = overlayParams();
    const count = document.getElementById('viewer-count');
    const label = document.getElementById('viewer-label');
    const card = document.getElementById('viewer-card');
    const layout = (params.get('layout') || params.get('mode') || 'card').toLowerCase();
    const align = (params.get('align') || 'center').toLowerCase();
    const root = document.documentElement;
    let configuredLabel = 'viewers';

    if (layout && layout !== 'card') {
        card.classList.add(`layout-${layout}`);
    }
    if (layout === 'pill') {
        document.getElementById('live-dot').style.display = 'inline-block';
    } else if (layout === 'badge') {
        document.getElementById('badge-icon').style.display = 'inline-block';
    }

    if (align === 'left' || align === 'start') {
        document.body.style.justifyContent = 'flex-start';
    } else if (align === 'right' || align === 'end') {
        document.body.style.justifyContent = 'flex-end';
    }

    function setTheme(config) {
        const theme = config?.theme || {};
        configuredLabel = config?.viewer_tracking?.viewer_label || 'viewers';
        applyOverlayTheme(theme, {
            font: '--viewer-font-family', text: '--viewer-text-color', accent: '--viewer-accent-color',
            background: '--viewer-background', outline: '--viewer-outline-color', scale: '--viewer-font-scale'
        }, { defaultFont: 'Segoe UI', fontFallback: 'system-ui, sans-serif', backgroundKey: 'viewer_background_color' });
    }

    function render(data) {
        const viewers = data || {};
        count.textContent = Number(viewers.current || 0).toLocaleString();
        label.textContent = params.get('label') || viewers.label || configuredLabel;
        card.classList.toggle('offline', viewers.live === false);
    }

    async function init() {
        try {
            const [configRes, viewerRes] = await Promise.all([fetch('/api/config'), fetch('/api/viewers')]);
            if (configRes.ok) setTheme(await configRes.json());
            if (viewerRes.ok) render(await viewerRes.json());
        } catch (error) { console.warn('[Viewer overlay] Initial load failed:', error.message); }
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${location.host}`);
        ws.onmessage = event => {
            try {
                const message = JSON.parse(event.data);
                if (message.type === 'viewer-update') render(message.data);
            } catch {}
        };
        ws.onclose = () => setTimeout(init, 5000);
    }
    init();
    </script>
</body>
</html>

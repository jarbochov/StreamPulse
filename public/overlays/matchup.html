    <style>
        :root {
            --matchup-scale: 1;

            --matchup-muted: #8b949e;
            --matchup-accent: #58a6ff;
            --matchup-winner: #3fb950;
            --matchup-badge-color: var(--matchup-accent);
            --matchup-badge-bg: rgba(0, 0, 0, 0.28);
            --matchup-badge-border: var(--matchup-border);
            --matchup-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --p1-color: #ef4444;
            --p2-color: #3b82f6;
            --p3-color: #10b981;
            --p4-color: #f59e0b;
        }

        html {
            font-size: calc(16px * var(--matchup-scale, 1));
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: var(--matchup-font);
            color: var(--matchup-text);
            display: flex;
            align-items: var(--matchup-valign, flex-start);
            justify-content: var(--matchup-align, center);
            font-size: 0.875rem;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Layout Positions & Alignments */
        body.layout-top {
            --matchup-valign: flex-start;
        }

        body.layout-bottom {
            --matchup-valign: flex-end;
        }

        body.layout-compact {
            --matchup-valign: flex-start;
            --matchup-align: flex-start;
        }

        body.layout-versus {
            --matchup-valign: center;
            --matchup-align: center;
        }

        body.layout-pillar,
        body.layout-vertical {
            --matchup-valign: flex-start;
            --matchup-align: flex-start;
        }

        #stage {
            width: 100%;
            display: flex;
            justify-content: var(--matchup-align, center);
            align-items: var(--matchup-valign, flex-start);
            padding: var(--matchup-padding, clamp(0.2rem, 1.5cqw, 0.6rem));
            transition: opacity 0.3s ease;
            container-type: inline-size;
            container-name: stage;
        }

        #stage.hidden {
            display: none !important;
        }

        #matchup-container {
            container-type: inline-size;
            container-name: matchup;
            display: flex;
            flex-direction: column;
            width: var(--matchup-width, 100%);
            max-width: var(--matchup-max-width, 1200px);
            align-items: center;
        }

        body.mode-single-pod #matchup-container,
        body.mode-clock-only #matchup-container {
            align-items: var(--matchup-align, center);
        }

        /* Auto-Fit / Tight Content Box Mode (?fit=content or ?fit=1) */
        body.fit-content #stage {
            padding: 0;
            width: max-content;
            height: max-content;
        }
        body.fit-content #matchup-container {
            container-type: normal;
            width: max-content !important;
            max-width: 100% !important;
        }

        /* Wide Stage Mode (?wide=1) */
        body.layout-wide #matchup-container {
            max-width: clamp(1400px, 94vw, 2400px) !important;
        }
        body.layout-wide .topbar-competitor {
            min-width: clamp(240px, 28vw, 480px);
        }
        body.layout-wide .split-corner-card {
            min-width: clamp(280px, 24vw, 460px);
        }
        body.layout-wide .versus-card-stage {
            max-width: clamp(1200px, 90vw, 2000px);
        }
        body.layout-wide .match-title-badge {
            max-width: clamp(240px, 45cqw, 720px);
        }
        body.layout-wide .competitor-name {
            font-size: clamp(1.15rem, 2.5cqw, 1.55rem);
        }

        .ang-row { display:flex; align-items:stretch; width:100%; filter: drop-shadow(0 6px 14px rgba(0,0,0,.55)); min-height: clamp(2.6rem, 6cqw, 3.8rem); }

        .fgc-panel {

            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.2rem 0.5rem;
            border-radius: 9999px;
            background: var(--matchup-winner);
            color: #0b0f16;
            flex-shrink: 0;
        }

        /* ----------------------------------------------------
           Pod Layout Variations (?layout=angular|fgc|compact|minimal|pillar|pill)
           ---------------------------------------------------- */
        .single-player-pod.pod-angular {
            transform: skewX(-10deg);
            border-radius: 4px;
            padding-left: clamp(0.9rem, 2.5cqw, 1.4rem);
            padding-right: clamp(0.9rem, 2.5cqw, 1.4rem);
        }
        .single-player-pod.pod-angular > * {
            transform: skewX(10deg);
        }

        .single-player-pod.pod-fgc {
            clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 100%, 0 100%);
            border-radius: 0;
            padding-right: clamp(1.2rem, 3cqw, 1.8rem);
        }
        .single-player-pod.pod-fgc .score-box {
            border-radius: 0;
        }

        .single-player-pod.pod-compact {
            padding: clamp(0.25rem, 0.8cqw, 0.4rem) clamp(0.45rem, 1.4cqw, 0.75rem);
            gap: clamp(0.35rem, 1cqw, 0.55rem);
            min-width: clamp(120px, 20cqw, 240px);
            border-radius: 6px;
        }
        .single-player-pod.pod-compact .competitor-name {
            font-size: clamp(0.82rem, 1.6cqw, 1rem);
        }
        .single-player-pod.pod-compact .score-box {
            min-width: clamp(22px, 3cqw, 30px);
            height: clamp(22px, 3cqw, 30px);
            font-size: clamp(0.85rem, 1.6cqw, 1.1rem);
        }

        .single-player-pod.pod-minimal {
            background: rgba(13, 17, 23, 0.45);
            border: none;
            border-bottom: 3px solid var(--matchup-accent);
            border-radius: 0;
            box-shadow: none;
            padding: clamp(0.3rem, 1cqw, 0.5rem) clamp(0.6rem, 2cqw, 1rem);
        }

        .single-player-pod.pod-pillar,
        .single-player-pod.pod-vertical {
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-width: clamp(80px, 15cqw, 140px);
            max-width: clamp(110px, 18cqw, 180px);
            padding: clamp(0.6rem, 1.8cqw, 1rem) clamp(0.5rem, 1.5cqw, 0.85rem);
            gap: clamp(0.3rem, 1cqw, 0.5rem);
        }
        .single-player-pod.pod-pillar .competitor-meta,
        .single-player-pod.pod-vertical .competitor-meta {
            align-items: center;
            width: 100%;
        }
        .single-player-pod.pod-pillar .competitor-accent-strip,
        .single-player-pod.pod-vertical .competitor-accent-strip {
            left: 0;
            top: 0;
            right: 0;
            bottom: auto;
            width: 100%;
            height: 4px;
        }
        .single-player-pod.pod-pillar .score-box,
        .single-player-pod.pod-vertical .score-box {
            font-size: clamp(1.2rem, 2.8cqw, 1.6rem);
            min-width: clamp(34px, 4cqw, 46px);
            height: clamp(34px, 4cqw, 46px);
        }

        .single-player-pod.pod-bottom {
            border-radius: 4px;
            border-top: 3px solid var(--matchup-accent);
        }

        .single-player-pod.pod-race {
            border-left: 4px solid var(--matchup-accent);
            background: linear-gradient(90deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.85));
        }

        .single-player-pod.pod-pill {
            border-radius: 9999px;
            padding-left: clamp(1rem, 2.5cqw, 1.5rem);
            padding-right: clamp(1rem, 2.5cqw, 1.5rem);
        }

        /* ----------------------------------------------------
           Mirrored / Reflected Pod Elements (?mirror=1 / ?side=right)
           ---------------------------------------------------- */
        .single-player-pod.mirrored {
            flex-direction: row-reverse;
        }
        .single-player-pod.mirrored .competitor-accent-strip {
            left: auto;
            right: 0;
        }
        .single-player-pod.mirrored .competitor-meta {
            text-align: right;
            align-items: flex-end;
        }
        .single-player-pod.mirrored .pips-container {
            flex-direction: row-reverse;
        }
        .single-player-pod.mirrored.pod-angular {
            transform: skewX(10deg);
        }
        .single-player-pod.mirrored.pod-angular > * {
            transform: skewX(-10deg);
        }
        .single-player-pod.mirrored.pod-fgc {
            clip-path: polygon(16px 0, 100% 0, 100% 100%, 0 100%);
            padding-right: clamp(0.6rem, 2cqw, 1.1rem);
            padding-left: clamp(1.2rem, 3cqw, 1.8rem);
        }
        .single-player-pod.mirrored.pod-race {
            border-left: none;
            border-right: 4px solid var(--matchup-accent);
            background: linear-gradient(-90deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.85));
        }
        .single-player-pod.mirrored.pod-pillar,
        .single-player-pod.mirrored.pod-vertical {
            align-items: flex-end;
            text-align: right;
        }
        .single-player-pod.mirrored.pod-pillar .competitor-meta,
        .single-player-pod.mirrored.pod-vertical .competitor-meta {
            align-items: flex-end;
            text-align: right;
        }
        .single-player-pod.mirrored.pod-pillar .competitor-accent-strip,
        .single-player-pod.mirrored.pod-vertical .competitor-accent-strip {
            left: auto;
            right: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            height: 100%;
        }

        /* ----------------------------------------------------
           Master Clock / Match Phase Only Panel (?player=none / ?layout=clock)
           ---------------------------------------------------- */
        .master-clock-panel {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            background: var(--matchup-bg);
            border: 1px solid var(--matchup-border);
            border-radius: 12px;
            padding: clamp(0.5rem, 1.5cqw, 0.85rem) clamp(0.8rem, 2.5cqw, 1.5rem);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .master-clock-panel .clock-digits-hero {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: clamp(1.4rem, 3.5cqw, 2.2rem);
            font-weight: 900;
            letter-spacing: 0.02em;
            color: var(--matchup-text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ----------------------------------------------------
           2. 3 & 4 COMPETITOR GRID BAR
           ---------------------------------------------------- */
        .multi-competitor-grid {
            display: grid;
            grid-template-columns: repeat(var(--col-count, 3), 1fr);
            width: 100%;
        }

        .multi-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0.85rem;
            gap: 0.5rem;
            border-right: 1px solid var(--matchup-border);
            position: relative;
        }

        .multi-card:last-child {
            border-right: none;
        }

        /* ----------------------------------------------------
           3. ESPORTS LOWER-THIRD HUD LAYOUT (?layout=bottom)
           ---------------------------------------------------- */
        .bottom-hud-card {
            background: var(--matchup-bg);
            border: 1px solid var(--matchup-border);
            border-radius: 12px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
            padding: 0.75rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
        }

        .hud-top-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 0.35rem;
        }

        .hud-grid {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--center-gap, 0.75rem);
        }

        /* Center / Opponent Gap Overrides (?gap=intact|160px|240px) */
        body.has-center-gap .topbar-center-badge {
            min-width: var(--center-gap, clamp(80px, 16cqw, 150px));
        }

        body.has-center-gap.no-center-badge .topbar-panel {
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            gap: var(--center-gap, 160px);
            overflow: visible;
        }

        body.has-center-gap.no-center-badge .topbar-competitor {
            background: var(--matchup-bg);
            border: 1px solid var(--matchup-border);
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }

        body.has-center-gap.no-center-badge .topbar-panel .center-divider {
            display: none !important;
        }

        body.has-center-gap.no-center-badge.theme-retro .topbar-competitor,
        body.has-center-gap.no-center-badge.theme-retro .minimal-side {
            border-radius: 0 !important;
            border: 3px solid #ffcc00 !important;
            box-shadow: 4px 4px 0 #000, 0 0 0 2px #000 !important;
        }

        body.has-center-gap.no-center-badge.theme-border .topbar-competitor,
        body.has-center-gap.no-center-badge.theme-border .minimal-side {
            border: 3px solid var(--matchup-accent) !important;
            border-radius: 8px !important;
        }

        body.has-center-gap.no-center-badge.theme-pill .topbar-competitor,
        body.has-center-gap.no-center-badge.theme-pill .minimal-side {
            border-radius: 9999px !important;
            padding-left: 1.25rem !important;
            padding-right: 1.25rem !important;
        }

        body.has-center-gap.no-center-badge .minimal-bar {
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
            gap: var(--center-gap, 160px);
            overflow: visible;
        }

        body.has-center-gap.no-center-badge .minimal-side {
            background: var(--matchup-bg);
            border: 1px solid var(--matchup-border);
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        }

        body.has-center-gap.no-center-badge .minimal-bar .center-divider {
            display: none !important;
        }

        body.has-center-gap .ang-row {
            gap: var(--center-gap, 0px);
        }

        body.has-center-gap.no-center-badge .ang-side.l,
        body.has-center-gap.no-center-badge .ang-side.r {
            margin-left: 0;
            margin-right: 0;
        }

        body.has-center-gap .versus-card-grid {
            gap: var(--center-gap, 2rem);
        }

        .vs-divider {
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--matchup-muted);
            letter-spacing: 0.05em;
            padding: 0.2rem 0.6rem;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 9999px;
            flex-shrink: 0;
        }

        /* ----------------------------------------------------
           4. COMPACT / CORNER SCORE BUG LAYOUT (?layout=compact)
           ---------------------------------------------------- */
        .compact-bug {
            background: var(--matchup-bg);
            border: 1px solid var(--matchup-border);
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: fit-content;
            min-width: 200px;
        }

        .compact-header {
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--matchup-accent);
            padding: 0.25rem 0.6rem;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
        }

        .compact-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.35rem 0.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            gap: 0.6rem;
        }

        .compact-row:last-child {
            border-bottom: none;
        }

        .compact-name-block {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            min-width: 0;
        }

        .compact-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .compact-score {
            font-weight: 800;
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.95rem;
        }

        /* ----------------------------------------------------
           5. VERSUS SCREEN CARD LAYOUT (?layout=versus)
           ---------------------------------------------------- */
        .versus-card-stage {
            background: var(--matchup-bg);
            border: 1px solid var(--matchup-border);
            border-radius: 16px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
            padding: 2rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            max-width: 720px;
            width: 100%;
        }

        .versus-card-grid {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            width: 100%;
        }

        .versus-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0.4rem;
        }

        .versus-big-name {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--matchup-text);
            line-height: 1.1;
        }

        .versus-big-score {
            font-size: 3rem;
            font-weight: 900;
            font-family: ui-monospace, SFMono-Regular, monospace;
            line-height: 1;
            margin-top: 0.3rem;
        }

        .versus-badge-big {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: var(--matchup-accent);
            text-shadow: 0 0 16px rgba(88, 166, 255, 0.5);
        }

        /* Winner Announcement Glow */
        .winner-banner {
            background: linear-gradient(90deg, transparent, rgba(63, 185, 80, 0.25), transparent);
            border-top: 1px solid var(--matchup-winner);
            border-bottom: 1px solid var(--matchup-winner);
            color: #fff;
            padding: 0.35rem 1rem;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            width: 100%;
        }

        /* ----------------------------------------------------
           MATCH CLOCK & STOPWATCH STYLES (EVO & GDQ)
           ---------------------------------------------------- */
        .fgc-clock-box {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000000;
            border: 2px solid #ffd700;
            border-radius: 6px;
            padding: 0.1rem 0.55rem;
            box-shadow: 0 0 14px rgba(255, 215, 0, 0.4);
            min-width: 50px;
            line-height: 1;
        }

        .fgc-clock-digits {
            font-size: 1.45rem;
            font-weight: 900;
            font-family: 'Impact', 'Arial Black', -apple-system, sans-serif;
            color: #ffd700;
            letter-spacing: -0.02em;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.7);
        }

        .fgc-clock-box.clock-low .fgc-clock-digits {
            color: #ff3333;
            text-shadow: 0 0 12px rgba(255, 51, 51, 0.9);
            animation: pulse-clock 0.6s infinite alternate;
        }

        .fgc-clock-box.clock-over .fgc-clock-digits {
            color: #6e7681;
        }

        .fgc-clock-est {
            font-size: 0.55rem;
            font-weight: 800;
            color: #8b949e;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-top: 2px;
        }

        @keyframes pulse-clock {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        .clock-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(0, 0, 0, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            padding: 0.18rem 0.55rem;
            font-size: 0.8rem;
            font-weight: 800;
            color: #ffd700;
            white-space: nowrap;
        }

        .clock-pill.clock-low {
            color: #ff4d4f;
            border-color: #ff4d4f;
            animation: pulse-clock 0.6s infinite alternate;
        }

        .clock-pill .clock-est {
            font-size: 0.72rem;
            color: var(--matchup-muted);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            margin-left: 0.35rem;
        }

        .clock-pill .clock-est .clock-est-label {
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--matchup-muted);
            opacity: 0.85;
        }

        .clock-pill.clock-over {
            color: #6e7681;
        }

        .bottom-clock-dock {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 0.6rem;
        }

        .clock-dock-pill {
            background: var(--matchup-bg);
            border: 1px solid var(--matchup-border);
            border-radius: 999px;
            padding: 0.4rem 1.1rem;
            font-size: 0.95rem;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .clock-dock-pill .clock-label {
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--matchup-muted);
        }

        .clock-dock-pill .clock-val {
            font-family: monospace;
            font-weight: 900;
            font-size: 1.15rem;
            color: var(--matchup-accent);
        }

        .clock-dock-pill .clock-est {
            font-size: 0.8rem;
            color: var(--matchup-muted);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            margin-left: 0.45rem;
        }

        .clock-dock-pill .clock-est .clock-est-label {
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--matchup-muted);
            opacity: 0.85;
        }

        .split-center-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            pointer-events: none;
            margin: 0 1rem;
        }

        .minimal-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            width: 100%;
        }

        .minimal-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.82rem;
            padding: 0.2rem 0.6rem;
        }

        /* ----------------------------------------------------
           SPEEDRUN BATTLE / RACE LAYOUT (?layout=race)
           ---------------------------------------------------- */
        .layout-race #stage {
            width: 100%;
            max-width: 1300px;
        }

        .race-panel {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            width: 100%;
        }

        .race-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--matchup-bg);
            border: 1px solid var(--matchup-border);
            border-radius: 8px;
            padding: 0.4rem 1rem;
            backdrop-filter: var(--matchup-backdrop);
            -webkit-backdrop-filter: var(--matchup-backdrop);
        }

        .race-est-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            font-weight: 800;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.25);
            padding: 0.15rem 0.55rem;
            border-radius: 999px;
            letter-spacing: 0.04em;
        }

        .race-runners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 0.75rem;
            width: 100%;
        }

        .race-runner-card {
            background: var(--matchup-bg);
            border: 1px solid var(--matchup-border);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            backdrop-filter: var(--matchup-backdrop);
            -webkit-backdrop-filter: var(--matchup-backdrop);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
            transition: all 0.25s ease;
        }

        .race-runner-card.finished {
            border-color: #3fb950;
            box-shadow: 0 0 20px rgba(63, 185, 80, 0.35);
        }

        .race-strip {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 5px;
        }

        .race-runner-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 0.4rem;
        }

        .race-runner-name {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--matchup-text);
            letter-spacing: -0.01em;
        }

        .race-runner-tag {
            font-size: 0.75rem;
            color: var(--matchup-muted);
            font-weight: 600;
        }

        .race-timer-hero {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 0.45rem 0.75rem;
            margin-left: 0.4rem;
        }

        .race-timer-digits {
            font-size: 1.65rem;
            font-weight: 900;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #ffd700;
            letter-spacing: -0.02em;
        }

        .race-runner-card.finished .race-timer-digits {
            color: #3fb950;
            text-shadow: 0 0 10px rgba(63, 185, 80, 0.6);
        }

        .race-finish-badge {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            letter-spacing: 0.04em;
        }

        .race-finish-badge.finish-win {
            background: rgba(63, 185, 80, 0.2);
            color: #3fb950;
            border: 1px solid rgba(63, 185, 80, 0.4);
        }

        .race-finish-badge.finish-delta {
            background: rgba(255, 255, 255, 0.1);
            color: #8b949e;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .race-finish-badge.finish-running {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.3);

            height: 100vh;
            pointer-events: none;
            z-index: 9999;

<body class="layout-top">
    <canvas id="confetti-canvas"></canvas>

    <div id="stage">

    <script src="/overlay-visibility.js" data-key="matchup"></script>
    <script src="/js/url-params.js"></script>
    <script src="/js/overlay-theme.js"></script>

    <script>
        const params = (typeof overlayParams === 'function') ? overlayParams() : new URLSearchParams(window.location.search);
        const stage = document.getElementById('stage');
        const container = document.getElementById('matchup-container');
        const confettiCanvas = document.getElementById('confetti-canvas');

        // Parameter configuration
        const forceSample = params.get('sample') === '1';
        const isPreview = params.get('preview') === '1' || params.get('sample') === '1';
        const sourceMode = (params.get('source') || 'auto').toLowerCase(); // 'auto' | 'tournament' | 'matchup'
        const layout = (params.get('layout') || params.get('mode') || 'top').toLowerCase(); // 'top' | 'fgc' | 'split' | 'minimal' | 'bottom' | 'compact' | 'versus' | 'pillar' | 'vertical'
        const showCenter = params.get('center') !== '0' && params.get('showcenter') !== '0';
        const customGap = (params.get('gap') || params.get('centerspace') || params.get('spacing') || '').trim().toLowerCase();
        const showPips = params.get('pips') !== '0';
        const showRoundPips = params.get('roundpips') === '1' || (showPips && params.get('roundpips') !== '0' && params.get('rounds') !== '0' && params.get('showrounds') !== '0');
        const pipStyle = (params.get('pipstyle') || params.get('pips_style') || 'circle').toLowerCase(); // 'circle' | 'diamond' | 'bar' | 'digit'
        const roundPipStyle = (params.get('roundpipstyle') || params.get('round_pipstyle') || 'diamond').toLowerCase(); // 'diamond' | 'circle' | 'bar' | 'digit'
        const showTags = params.get('tags') !== '0';
        const showDetails = params.get('details') !== '0';
        const showClock = params.get('clock') !== '0';
        const clockStyle = (params.get('clockstyle') || 'badge').toLowerCase(); // 'badge' | 'bottom' | 'pill' | 'fgc'
        const runnerTimersParam = (params.get('runnertimers') || params.get('runner_timers') || '').toLowerCase(); // 'finish' | 'always' | 'off'
        const playerClocksParam = (params.get('playerclocks') || params.get('player_clocks') || params.get('runnerclocks') || '').toLowerCase(); // '1' | 'always' | 'auto' | '0' | 'off'
        const splitsParam = (params.get('splits') ?? params.get('showsplits') ?? params.get('deltas') ?? '').toLowerCase();
        function isSplitsEnabled(m) {
            if (splitsParam === '0' || splitsParam === 'false' || splitsParam === 'off') return false;
            if (splitsParam === '1' || splitsParam === 'true' || splitsParam === 'on') return true;
            return m?.clock?.showSplits !== false;
        }
        const showEst = params.get('showest') !== '0';
        const showTitle = params.get('title') !== '0';
        const showPhase = params.get('phase') !== '0';
        const hideCss = [
            !showPhase && '.match-phase-badge',
            !showTitle && '.match-title-badge, .match-title-inline',
            !showClock && '.clock-pill, .fgc-clock-box, .bottom-clock-dock, .race-timer-hero, .clock-dock-pill, .race-est-badge, .race-master-bar, .runner-finish-pill',
            params.get('banner') === '0' && '.winner-banner'
        ].filter(Boolean);
        if (hideCss.length) { const st = document.createElement('style'); st.textContent = hideCss.map(x => x + '{display:none !important}').join(''); document.head.appendChild(st); }
        const enableConfetti = params.get('confetti') !== '0' && params.get('confetti') !== 'false';
        const scaleVal = parseFloat(params.get('scale') || params.get('fontscale') || '1');
        const customWidth = params.get('width');
        const customMaxWidth = params.get('maxwidth') || params.get('max_width');
        const customPadding = params.get('padding');
        const customAccent = params.get('accent');
        const customWinner = params.get('winner');
        const customP1Color = params.get('p1color');
        const customP2Color = params.get('p2color');
        const customBadgeColor = params.get('badgecolor') || params.get('centerbadge') || params.get('badge_color');
        const playerFilterParam = (params.get('player') || params.get('competitor') || params.get('slot') || '').trim().toLowerCase();
        const alignParam = (params.get('align') || params.get('justify') || '').trim().toLowerCase();
        const valignParam = (params.get('valign') || params.get('v_align') || '').trim().toLowerCase();
        const sideParam = (params.get('side') || '').trim().toLowerCase(); // 'left' | 'right'
        const mirrorRaw = (params.get('mirror') || params.get('flip') || params.get('reflect') || params.get('reverse') || '').trim().toLowerCase();
        const isMirrored = (mirrorRaw === '1' || mirrorRaw === 'true' || mirrorRaw === 'yes' || mirrorRaw === 'on' || sideParam === 'right');
        const fitParam = params.get('fit');
        const isWide = params.get('wide') === '1' || params.get('wide') === 'true';

        document.body.className = `layout-${layout}`;

            document.body.classList.add('layout-wide');

        if (fitParam === 'content' || fitParam === '1' || fitParam === 'tight') {

        }
        if (playerFilterParam === 'none' || playerFilterParam === 'clock' || playerFilterParam === 'timer' || layout === 'clock') {
            document.body.classList.add('mode-clock-only');
        } else if (['1', '2', '3', '4'].includes(playerFilterParam) || layout === 'pod' || layout === 'single') {
            document.body.classList.add('mode-single-pod');
        }

        if (sideParam === 'right' && !alignParam) {
            document.documentElement.style.setProperty('--matchup-align', 'flex-end');

        // Styling via ?overlay=theme or ?bg=hex

            let overlayVal = (params.get('overlay') || params.get('theme') || '').trim();

            if (!overlayVal && hashVal && !hashVal.includes('=')) {

            else if (overlayVal === 'pill') document.body.classList.add('theme-pill');
            else if (overlayVal === 'neon') document.body.classList.add('theme-neon');

            else if (overlayVal === 'fgc-evo' || overlayVal === 'evo') document.body.classList.add('theme-fgc-evo');

        const needs4Comps = Boolean(playerFilterParam && (playerFilterParam.includes('3') || playerFilterParam.includes('4') || playerFilterParam === '3' || playerFilterParam === '4'));
        const SAMPLE_MATCHUP = {
            id: 'sample-matchup',
            title: layout === 'race' ? 'Super Metroid Any%' : 'Street Fighter 6',
            phase: layout === 'race' ? 'Speedrun Race Finals' : 'Grand Finals',
            details: layout === 'race' ? (needs4Comps ? '4-Way Live Race · Target EST 45:00' : '1v1 Live Race · Target EST 45:00') : (needs4Comps ? '4-Player Championship · Decider' : 'First to 5 (FT5) · Metro City Decider'),
            competitorCount: needs4Comps ? 4 : 2,
            roundsBestOf: layout === 'race' ? 0 : 3,
            competitors: needs4Comps ? SAMPLE_ALL_COMPETITORS.slice(0, 4) : SAMPLE_ALL_COMPETITORS.slice(0, 2),
            format: 'bestOf',
            bestOf: layout === 'race' ? 1 : 9,
            targetScore: layout === 'race' ? 1 : 5,
            status: 'ACTIVE',
            winner: null,
            clock: {
                enabled: showClock,
                mode: sampleClockMode,
                runnerTimersMode: runnerTimersParam || 'finish',
                showSplits: splitsParam === '0' || splitsParam === 'false' || splitsParam === 'off' ? false : true,
                duration: 99,
                remaining: 99,
                elapsed: 2538.45,
                isRunning: true,
                estimate: layout === 'race' ? '45:00' : '18:30'
            }
        };

        let currentMatchup = null;
        let lastCelebratedWinner = null;

        function esc(str) {
            return String(str || '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        let liveM = null, liveAt = 0;
        function fmtMs(sec) {
            const t = Math.max(0, sec || 0);
            const cs = Math.floor(t * 100) % 100;
            const w = Math.floor(t);
            const h = Math.floor(w / 3600), mi = Math.floor((w % 3600) / 60), se = w % 60;
            const p2 = n => String(n).padStart(2, '0');
            return `${h > 0 ? h + ':' + p2(mi) : p2(mi)}:${p2(se)}.${p2(cs)}`;
        }
        setInterval(() => {
            if (!liveM) return;
            const clockRunning = liveM.clock && liveM.clock.enabled !== false && liveM.clock.isRunning;
            const anyRunnerRunning = Array.isArray(liveM.competitors) && liveM.competitors.some(c => c.timer && c.timer.isRunning && !c.timer.finished);
            if (!clockRunning && !anyRunnerRunning) return;
            const dt = (Date.now() - liveAt) / 1000;
            document.querySelectorAll('[data-live]').forEach(el => {
                const k = el.dataset.live;
                if (k === 'clock') {
                    const c = liveM.clock; if (!c || c.enabled === false) return;
                    el.textContent = fmtMs((c.elapsed || 0) + (c.isRunning ? dt : 0));
                } else {
                    const t = (liveM.competitors || [])[parseInt(k, 10)]?.timer;
                    if (!t || t.finished) return;
                    el.textContent = fmtMs((t.elapsed || 0) + (t.isRunning ? dt : 0));
                }
            });
        }, 50);

        function formatClockTime(seconds, isStopwatch = false) {
            const s = Math.max(0, parseInt(seconds, 10) || 0);
            const m = Math.floor(s / 60);
            const remS = s % 60;
            if (m >= 60) {
                const h = Math.floor(m / 60);
                const remM = m % 60;
                return `${h}:${String(remM).padStart(2, '0')}:${String(remS).padStart(2, '0')}`;
            }
            if (isStopwatch || m > 0) {
                return `${String(m).padStart(2, '0')}:${String(remS).padStart(2, '0')}`;
            }
            return String(s);
        }

        function renderClockHtml(m, styleType = 'badge') {
            liveM = m; liveAt = Date.now();
            const clock = m?.clock;
            if (!clock || clock.enabled === false || !showClock) return '';
            if (clockStyle === 'bottom' && styleType !== 'bottom') return '';

            const isStopwatch = clock.mode === 'stopwatch' || clock.mode === 'race';
            const displayVal = isStopwatch ? fmtMs(clock.elapsed) : (clock.remaining !== undefined ? formatClockTime(clock.remaining, clock.duration >= 60) : '99');
            const isLow = !isStopwatch && clock.remaining !== undefined && clock.remaining <= 10 && clock.remaining > 0;
            const isOver = !isStopwatch && clock.remaining === 0;

            if (styleType === 'bottom') {
                return `
                    <div class="bottom-clock-dock">
                        <div class="clock-pill clock-dock-pill${isLow ? ' clock-low' : ''}${isOver ? ' clock-over' : ''}${clock.isRunning ? ' clock-running' : ''}" title="${isStopwatch ? 'Speedrun Timer' : 'Round Timer'}">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            <span class="clock-label" style="font-size:0.62rem; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--matchup-muted);">TIME</span>
                            <span class="clock-val"${isStopwatch ? ' data-live="clock"' : ''} style="font-family:monospace; font-weight:900; font-size:1.15rem;">${displayVal}</span>
                            ${(showEst && clock.estimate) ? `
                                <span class="clock-est" title="Estimated Time">
                                    <span class="clock-est-label">EST</span>
                                    <span>${esc(clock.estimate)}</span>
                                </span>
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            if (styleType === 'fgc-center') {
                return `
                    <div class="fgc-clock-box${isLow ? ' clock-low' : ''}${isOver ? ' clock-over' : ''}${clock.isRunning ? ' clock-running' : ''}" title="${isStopwatch ? 'Speedrun Timer' : 'Round Timer'}">
                        <span class="fgc-clock-digits"${isStopwatch ? ' data-live="clock"' : ''}>${displayVal}</span>
                        ${(showEst && clock.estimate) ? `<span class="fgc-clock-est">EST ${esc(clock.estimate)}</span>` : ''}
                    </div>
                `;
            }

            return `
                <div class="clock-pill${isLow ? ' clock-low' : ''}${isOver ? ' clock-over' : ''}${clock.isRunning ? ' clock-running' : ''}" title="${isStopwatch ? 'Speedrun Stopwatch' : 'Round Countdown'}">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span class="clock-val"${isStopwatch ? ' data-live="clock"' : ''}>${displayVal}</span>
                    ${(showEst && clock.estimate) ? `
                        <span class="clock-est" title="Estimated Time">
                            <span class="clock-est-label">EST</span>
                            <span>${esc(clock.estimate)}</span>
                        </span>
                    ` : ''}
                </div>
            `;
        }

        function renderPipsHtml(comp, target, color) {
            const score = typeof comp === 'object' ? (comp.score || 0) : comp;
            const rb = Number(currentMatchup && currentMatchup.roundsBestOf) || (typeof comp === 'object' && comp.rounds > 0 ? 3 : 0);
            const roundTarget = rb > 0 ? Math.ceil(rb / 2) : 2;
            const roundsWon = typeof comp === 'object' ? (comp.rounds || 0) : 0;
            const hasRounds = showRoundPips && (rb > 0 || (typeof comp === 'object' && comp.rounds !== undefined && comp.rounds > 0));
            const hasGamePips = showPips && target && target > 0;

            if (!hasGamePips && !hasRounds) return '';

            const isGameDigit = pipStyle === 'digit' || pipStyle === 'number';
            const isRoundDigit = roundPipStyle === 'digit' || roundPipStyle === 'number';

            if (isGameDigit && isRoundDigit) {
                const roundsSub = hasRounds
                    ? `<span class="pip-digit-rounds" style="font-size:0.7em;opacity:0.85;margin-left:0.35rem;font-weight:700;">◆ ${roundsWon}/${roundTarget}</span>`
                    : '';
                if (!hasGamePips && hasRounds) {
                    return `<div class="pip-digit-badge" style="${color ? `color:${color};` : ''}">${roundsSub}</div>`;
                }
                return `<div class="pip-digit-badge" style="${color ? `color:${color};` : ''}">${score} / ${target}${roundsSub}</div>`;
            }

            const gamePipClass = (pipStyle === 'bar' || pipStyle === 'block') ? ' pip-bar' : (pipStyle === 'diamond' || pipStyle === 'diamonds' ? ' pip-diamond' : ' pip-circle');
            const roundPipClass = (roundPipStyle === 'circle' || roundPipStyle === 'circles') ? ' pip-circle' : ((roundPipStyle === 'bar' || roundPipStyle === 'block') ? ' pip-bar' : ' pip-diamond');

            const mkGames = () => {
                if (!hasGamePips) return '';
                if (isGameDigit) {
                    return `<div class="pip-digit-badge" style="${color ? `color:${color};` : ''}">${score} / ${target}</div>`;
                }
                let h = `<div class="pips-container">`;
                for (let i = 0; i < target; i++) {
                    h += `<span class="pip${gamePipClass}${i < score ? ' won' : ''}" style="${i < score && color ? `background:${color};border-color:${color};box-shadow:0 0 6px ${color};` : ''}"></span>`;
                }
                return h + '</div>';
            };

            const mkRounds = () => {
                if (!hasRounds) return '';
                if (isRoundDigit) {
                    return `<div class="pip-digit-badge pip-digit-rounds" style="font-size:0.75rem;${color ? `color:${color};` : ''}">◆ ${roundsWon} / ${roundTarget}</div>`;
                }
                let h = `<div class="pips-container pips-rounds-container" title="Rounds won (${roundsWon}/${roundTarget})">`;
                for (let i = 0; i < roundTarget; i++) {
                    h += `<span class="pip pip-round${roundPipClass}${i < roundsWon ? ' won' : ''}" style="${i < roundsWon && color ? `background:${color};border-color:${color};box-shadow:0 0 6px ${color};` : ''}"></span>`;
                }
                return h + '</div>';
            };

            if (hasGamePips && hasRounds) {
                return `<div class="pips-stack">${mkGames()}${mkRounds()}</div>`;
            }
            if (hasRounds) return mkRounds();
            return mkGames();
        }

        function getRunnerTimersMode(m) {
            if (runnerTimersParam === 'off' || runnerTimersParam === 'none' || runnerTimersParam === '0') return 'off';
            if (runnerTimersParam === 'always' || runnerTimersParam === 'live' || runnerTimersParam === 'all') return 'always';
            if (runnerTimersParam === 'finish' || runnerTimersParam === 'reveal' || runnerTimersParam === 'main') return 'finish';
            if (m?.clock?.runnerTimersMode === 'off' || m?.clock?.runnerTimersMode === 'none') return 'off';
            return (m?.clock?.runnerTimersMode === 'always') ? 'always' : 'finish';
        }

        function formatOrdinal(n) {
            if (n === 1) return '1st';
            if (n === 2) return '2nd';
            if (n === 3) return '3rd';
            return `${n}th`;
        }

        function computeRunnerDeltaInfo(m, comp, idx) {
            const t = comp?.timer;
            if (!t || !t.finished) return { place: null, deltaStr: null };
            const comps = m?.competitors || [];
            const finishers = comps
                .filter(c => c.timer && c.timer.finished)
                .sort((a, b) => (a.timer.finishSeconds ?? a.timer.elapsed ?? 0) - (b.timer.finishSeconds ?? b.timer.elapsed ?? 0));
            const placeIdx = finishers.indexOf(comp);
            const place = t.place || (placeIdx >= 0 ? placeIdx + 1 : 1);
            if (place === 1) return { place: 1, deltaStr: null };
            if (t.delta && t.delta !== 'WINNER') return { place, deltaStr: t.delta };
            const first = finishers[0];
            if (first && first !== comp) {
                const diff = Math.max(0, (t.finishSeconds ?? t.elapsed ?? 0) - (first.timer.finishSeconds ?? first.timer.elapsed ?? 0));
                if (diff > 0) return { place, deltaStr: `+${fmtMs(diff)}` };
            }
            return { place, deltaStr: null };
        }

        // Renders inline finish/running timer badge for any scoreboard layout (top, fgc, split, pillar, minimal, bottom, compact, angular, versus)
        function renderRunnerInlineTimerHtml(m, comp, idx) {
            if (!showClock || !m?.clock || m.clock.enabled === false) return '';
            const t = comp?.timer;
            const mode = getRunnerTimersMode(m);
            const playerClocksExplicit = playerClocksParam === '1' || playerClocksParam === 'always' || playerClocksParam === 'true';
            const playerClocksOff = playerClocksParam === '0' || playerClocksParam === 'off' || playerClocksParam === 'false';
            if (playerClocksOff) return '';

            const isRace = m.clock.mode === 'race';
            const hasActiveTimer = Boolean(t && (t.finished || t.isRunning || (t.elapsed || 0) > 0));
            if (!isRace && !playerClocksExplicit && !hasActiveTimer) return '';
            if (mode === 'off' && !playerClocksExplicit) return '';

            const origIdx = comp?._origIdx !== undefined ? comp._origIdx : idx;
            const splitsOn = isSplitsEnabled(m);
            if (t && t.finished) {
                const timeStr = t.finishTime || fmtMs(t.elapsed || 0);
                if (!splitsOn) {
                    return `<span class="runner-finish-pill place-1" title="Finish Time"><span>${esc(timeStr)}</span></span>`;
                }
                const { place, deltaStr } = computeRunnerDeltaInfo(m, comp, origIdx);
                const ord = formatOrdinal(place || 1);
                if (place === 1 || !deltaStr) {
                    return `<span class="runner-finish-pill place-1" title="Finished ${ord}"><span>${ord}</span><span>·</span><span>${esc(timeStr)}</span></span>`;
                }
                return `<span class="runner-finish-pill place-other" title="Finished ${ord} (${deltaStr})"><span>${ord}</span><span>·</span><span>${esc(timeStr)}</span><span class="runner-delta-tag">${esc(deltaStr)}</span></span>`;
            }
            if (t && t.isRunning) {
                return `<span class="runner-finish-pill running-live"><span data-live="${origIdx}">${fmtMs(t.elapsed || 0)}</span></span>`;
            }
            if (hasActiveTimer && t && (t.elapsed || 0) > 0) {
                return `<span class="runner-finish-pill place-other"><span data-live="${origIdx}">${fmtMs(t.elapsed || 0)}</span></span>`;
            }
            if (playerClocksExplicit) {
                return `<span class="runner-finish-pill ready"><span data-live="${origIdx}">0:00.0</span></span>`;
            }
            return '';
        }

        // Single Competitor Floating Score Pod (?player=1..4 or ?layout=pod)
        function renderSinglePlayerPod(m, comp, idx, target) {
            liveM = m; liveAt = Date.now();
            const compColor = comp.color || (idx === 0 ? 'var(--p1-color)' : (idx === 1 ? 'var(--p2-color)' : (idx === 2 ? 'var(--p3-color)' : 'var(--p4-color)')));
            const isWinner = (m.status === 'COMPLETED' && m.winner === comp.name);
            const slotLabel = `P${idx + 1}`;
            const runnerTimerHtml = renderRunnerInlineTimerHtml(m, comp, idx);
            const pipsHtml = renderPipsHtml(comp, target, compColor);
            const podLayoutClass = (layout && !['pod', 'single', 'top'].includes(layout)) ? ` pod-${layout}` : '';
            const mirrorClass = isMirrored ? ' mirrored' : '';

            container.innerHTML = `
                <div class="single-player-pod${podLayoutClass}${mirrorClass}${isWinner ? ' winner' : ''}">
                    <div class="competitor-accent-strip" style="background: ${compColor};"></div>
                    <div class="player-slot-pill" style="background: color-mix(in srgb, ${compColor} 20%, transparent); color: ${compColor}; border: 1px solid color-mix(in srgb, ${compColor} 45%, transparent);">
                        ${comp.seed ? `#${comp.seed}` : slotLabel}
                    </div>
                    ${comp.avatar ? `<img src="${esc(comp.avatar)}" class="competitor-avatar" style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,0.2);" alt="">` : ''}
                    <div class="competitor-meta">
                        <div class="competitor-name">${esc(comp.name)}</div>
                        ${showTags && comp.tag ? `<div class="competitor-tag">${esc(comp.tag)}</div>` : ''}
                    </div>
                    ${runnerTimerHtml ? `<div style="display:flex;align-items:center;">${runnerTimerHtml}</div>` : ''}
                    ${pipsHtml ? `<div style="display:flex;align-items:center;">${pipsHtml}</div>` : ''}
                    <div class="score-box" style="border-color: color-mix(in srgb, ${compColor} 50%, rgba(255,255,255,0.15));">${comp.score ?? 0}</div>
                    ${isWinner ? `<div class="single-pod-winner-badge">WINNER</div>` : ''}
                </div>
            `;
        }

        // Master Clock & Match Phase Only Panel (?player=none or ?layout=clock)
        function renderMasterClockOnly(m) {
            liveM = m; liveAt = Date.now();
            const clock = m?.clock || {};
            const isStopwatch = clock.mode === 'stopwatch' || clock.mode === 'race';
            const displayVal = isStopwatch ? fmtMs(clock.elapsed) : (clock.remaining !== undefined ? formatClockTime(clock.remaining, clock.duration >= 60) : '99');
            const isRunning = Boolean(clock.isRunning);
            const est = clock.estimate;

            container.innerHTML = `
                <div class="master-clock-panel">
                    <div style="display: flex; align-items: center; justify-content: center; gap: 0.6rem; flex-wrap: wrap;">
                        ${showTitle && m.title ? `<span class="match-title-badge" style="margin-bottom:0;">${esc(m.title)}</span>` : ''}
                        ${(showTitle && m.title && showPhase && m.phase) ? `<span style="opacity: 0.4;">·</span>` : ''}
                        ${showPhase && m.phase ? `<span class="match-phase-badge">${esc(m.phase)}</span>` : ''}
                    </div>
                    <div class="clock-digits-hero">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${isRunning ? '#3fb950' : 'var(--matchup-accent)'}" stroke-width="2.5" style="${isRunning ? 'animation: pulse 1.5s infinite;' : ''}"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span ${isStopwatch ? 'data-live="clock"' : ''}>${displayVal}</span>
                        ${(showEst && est) ? `
                            <span class="clock-est" title="Estimated Time" style="font-size: 0.75rem; font-family: var(--matchup-font); font-weight: 700; padding: 0.2rem 0.55rem; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 9999px; display: inline-flex; align-items: center; gap: 0.35rem;">
                                <span class="clock-est-label" style="opacity: 0.7; font-size: 0.65rem; text-transform: uppercase;">EST</span>
                                <span>${esc(est)}</span>
                            </span>
                        ` : ''}
                    </div>
                    ${showDetails && m.details ? `<div class="match-details-badge" style="font-size:0.75rem; color:var(--matchup-muted); font-weight:600; margin-top:0;">${esc(m.details)}</div>` : ''}
                    ${m.status === 'COMPLETED' && m.winner ? `
                        <div class="winner-banner" style="margin-top:0.35rem; padding:0.25rem 0.8rem; font-size:0.8rem;">Winner: ${esc(m.winner)}</div>
                    ` : ''}
                </div>
            `;
        }

        function renderMatchup(m) {
            const isClockOnly = playerFilterParam === 'none' || playerFilterParam === 'clock' || playerFilterParam === 'timer' || layout === 'clock';
            const isSinglePlayerReq = ['1', '2', '3', '4'].includes(playerFilterParam) || layout === 'pod' || layout === 'single';

            const minReq = isClockOnly ? 0 : (isSinglePlayerReq ? 1 : 2);
            if (!m || !Array.isArray(m.competitors) || m.competitors.length < minReq) {
                if (isPreview) {
                    m = SAMPLE_MATCHUP;
                } else {
                    stage.classList.add('hidden');
                    return;
                }
            }

            stage.classList.remove('hidden');
            currentMatchup = m;

            // Winner celebration
            if (m.status === 'COMPLETED' && m.winner && m.winner !== lastCelebratedWinner) {
                lastCelebratedWinner = m.winner;
                if (enableConfetti) burstConfetti();
            } else if (m.status === 'ACTIVE') {
                lastCelebratedWinner = null;
            }

            const target = m.targetScore || (m.bestOf > 0 ? Math.ceil(m.bestOf / 2) : 0);

            // Clock-only mode
            if (isClockOnly) {
                renderMasterClockOnly(m);
                return;
            }

            // Competitor filtering (?player=1, ?player=2, ?player=1,2, ?player=name)
            let selectedIndices = null;
            if (playerFilterParam && playerFilterParam !== 'all' && playerFilterParam !== '*') {
                const tokens = playerFilterParam.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
                selectedIndices = [];
                tokens.forEach(tok => {
                    if (/^[1-9]\d*$/.test(tok)) {
                        const idx = parseInt(tok, 10) - 1;
                        if (idx < m.competitors.length) selectedIndices.push(idx);
                    } else if (tok === '0') {
                        if (m.competitors.length > 0) selectedIndices.push(0);
                    } else {
                        const idx = m.competitors.findIndex(c => (c.id && c.id.toLowerCase() === tok) || (c.name && c.name.toLowerCase() === tok));
                        if (idx >= 0) selectedIndices.push(idx);
                    }
                });
                selectedIndices = [...new Set(selectedIndices)];
            }

            // Single player pod layout
            if (selectedIndices && selectedIndices.length === 1) {
                const origIdx = selectedIndices[0];
                const comp = m.competitors[origIdx];
                renderSinglePlayerPod(m, comp, origIdx, target);
                return;
            }

            if (layout === 'pod' || layout === 'single') {
                const origIdx = (selectedIndices && selectedIndices.length > 0) ? selectedIndices[0] : 0;
                const comp = m.competitors[origIdx] || m.competitors[0];
                renderSinglePlayerPod(m, comp, origIdx, target);
                return;
            }

            // Subset of 2+ competitors
            let matchToRender = m;
            let count = m.competitorCount || m.competitors.length;
            if (selectedIndices && selectedIndices.length > 1) {
                matchToRender = {
                    ...m,
                    competitors: selectedIndices.map(i => ({ ...m.competitors[i], _origIdx: i })),
                    competitorCount: selectedIndices.length
                };
                count = selectedIndices.length;
            }

            // Select Layout (explicit ?layout= always respected; race clock works across all layouts!)
            if (layout === 'race') {
                renderSpeedrunRace(matchToRender, target, count);
            } else if (layout === 'fgc' || layout === 'evo') {
                renderFgcBar(matchToRender, target, count);
            } else if (layout === 'split') {
                renderSplitCorners(matchToRender, target);
            } else if (layout === 'minimal') {
                renderMinimalBar(matchToRender, target);
            } else if (layout === 'pillar' || layout === 'vertical') {
                renderPillar(matchToRender, target);
            } else if (layout === 'bottom') {
                renderBottomHud(matchToRender, target);
            } else if (layout === 'compact' || layout === 'corner') {
                renderCompactBug(matchToRender, target);
            } else if (layout === 'angular' || layout === 'angle') {
                renderAngular(matchToRender, target);
            } else if (layout === 'versus' || layout === 'card') {
                renderVersusCard(matchToRender, target);
            } else {
                renderTopBar(matchToRender, target, count);
            }
            if (showClock && m.clock && m.clock.enabled !== false && clockStyle === 'bottom') {
                const wrap = document.createElement('div');
                wrap.style.cssText = 'display:flex;justify-content:center;margin-top:0.6rem;width:100%;';
                wrap.innerHTML = renderClockHtml(m, 'bottom');
                container.appendChild(wrap);
            } else if (showClock && m.clock && m.clock.enabled !== false && !container.querySelector('.clock-pill, .fgc-clock-box, .race-master-bar')) {
                const wrap = document.createElement('div');
                wrap.style.cssText = 'display:flex;justify-content:center;margin-top:0.5rem;';
                wrap.innerHTML = renderClockHtml(m, 'pill');
                container.appendChild(wrap);
            }
        }

        // SPEEDRUN RACE LAYOUT
        function renderSpeedrunRace(m, target, count) {
            liveM = m; liveAt = Date.now();
            const comps = m.competitors || [];
            const clock = m.clock || {};
            const est = clock.estimate || '';
            const clockOff = !showClock || (m.clock && m.clock.enabled === false);
            const timersMode = getRunnerTimersMode(m);
            const masterTimeStr = fmtMs(clock.elapsed || 0);
            const anyRunning = Boolean(clock.isRunning || comps.some(c => c.timer && c.timer.isRunning && !c.timer.finished));
            const allFinished = comps.length > 0 && comps.every(c => c.timer && c.timer.finished);

            container.innerHTML = `
                <div class="race-panel">
                    <div class="race-header">

                            const finTimeStr = t.finishTime || fmtMs(t.elapsed || 0);
                            const liveTimeStr = fmtMs(t.elapsed || 0);

                            let heroHtml = '';
                            if (!clockOff && timersMode !== 'off') {
                                const splitsOn = isSplitsEnabled(m);
                                if (isFin) {
                                    let badgeHtml = '';

                                        badgeHtml = (place === 1 || !deltaStr)
                                            ? `<span class="race-finish-badge finish-win">${ord} · Winner</span>`
                                            : `<span class="race-finish-badge finish-delta" style="background: rgba(239, 68, 68, 0.18); color: #fca5a5; border-color: rgba(239, 68, 68, 0.45);">${ord} · ${esc(deltaStr)}</span>`;

                                        <div class="race-timer-hero">

        // 1b. VERTICAL PILLAR LAYOUT

                    <div class="compact-header" style="background:none; font-size:0.85rem;">
                        <span class="match-title-badge">${esc(m.title || 'Versus Showdown')}</span>
                        <span class="match-phase-badge">${esc(m.phase || '')}</span>
                    </div>
                    <div class="versus-card-grid">
                        <div class="versus-side">
                            <div class="versus-big-name" style="color: ${p1.color || 'var(--p1-color)'};">${esc(p1.name)}</div>
                            ${showTags && p1.tag ? `<div class="competitor-tag">${esc(p1.tag)}</div>` : ''}
                            <div class="versus-big-score">${p1.score}</div>
                            ${renderPipsHtml(p1, target, p1.color)}
                            ${renderRunnerInlineTimerHtml(m, p1, 0)}
                        </div>

                        <div class="versus-badge-big">VS</div>

                        <div class="versus-side">
                            <div class="versus-big-name" style="color: ${p2.color || 'var(--p2-color)'};">${esc(p2.name)}</div>
                            ${showTags && p2.tag ? `<div class="competitor-tag">${esc(p2.tag)}</div>` : ''}
                            <div class="versus-big-score">${p2.score}</div>
                            ${renderPipsHtml(p2, target, p2.color)}
                            ${renderRunnerInlineTimerHtml(m, p2, 1)}
                        </div>
                    </div>
                    ${showDetails && m.details ? `
                        <div style="font-size:0.75rem; color:var(--matchup-muted);">${esc(m.details)}</div>
                    ` : ''}
                </div>
            `;
        }

        // Particle Confetti
        function burstConfetti() {
            if (!enableConfetti || !confettiCanvas) return;
            const ctx = confettiCanvas.getContext('2d');
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#ffffff'];

            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: confettiCanvas.width / 2 + (Math.random() - 0.5) * 300,
                    y: layout === 'bottom' ? confettiCanvas.height - 80 : 80,
                    vx: (Math.random() - 0.5) * 12,
                    vy: layout === 'bottom' ? -Math.random() * 12 - 4 : Math.random() * 10 + 2,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    vrot: (Math.random() - 0.5) * 10,
                    alpha: 1
                });
            }

            let start = performance.now();
            function frame(time) {
                const elapsed = time - start;
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

                let alive = false;
                for (const p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.25; // gravity
                    p.rot += p.vrot;
                    p.alpha = Math.max(0, 1 - elapsed / 2400);

                    if (p.alpha > 0) {
                        alive = true;
                        ctx.save();
                        ctx.globalAlpha = p.alpha;
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rot * Math.PI) / 180);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        ctx.restore();
                    }
                }

                if (alive && elapsed < 2600) {
                    requestAnimationFrame(frame);
                } else {
                    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                }
            }
            requestAnimationFrame(frame);
        }

        // Auto State Resolver (Tournament vs Standalone Matchup)
        let activeTournamentData = null;
        let standaloneMatchupData = null;

        function convertTournamentMatchToMatchup(tournament, match) {
            if (!tournament || !match) return null;
            const e1Name = match.entrant1?.name || (match.entrants && match.entrants[0]) || 'Player 1';
            const e2Name = match.entrant2?.name || (match.entrants && match.entrants[1]) || 'Player 2';
            const s1 = match.entrant1?.score ?? (Array.isArray(match.scores) ? (match.scores[0] ?? 0) : ((match.scores && match.scores[e1Name]) ?? 0));
            const s2 = match.entrant2?.score ?? (Array.isArray(match.scores) ? (match.scores[1] ?? 0) : ((match.scores && match.scores[e2Name]) ?? 0));
            const bestOf = match.bestOf || tournament.bestOf || 3;
            const targetScore = match.targetScore || tournament.targetScore || (bestOf > 0 ? Math.ceil(bestOf / 2) : 0);

            return {
                id: match.id,
                title: tournament.title || tournament.name || 'Tournament Showdown',
                phase: match.roundName || `Round ${match.round || 1}`,
                details: match.matchDetails || match.details || `${tournament.format === 'roundRobin' ? 'Round Robin' : 'Bracket'} · Best of ${bestOf}`,
                competitorCount: 2,
                roundsBestOf: match.roundsBestOf || tournament.roundsBestOf || 0,
                competitors: [
                    { id: 'c1', name: e1Name, tag: match.entrant1?.tag || '', color: customP1Color || match.entrant1?.color || '#ef4444', score: s1, rounds: match.entrant1?.rounds || 0 },
                    { id: 'c2', name: e2Name, tag: match.entrant2?.tag || '', color: customP2Color || match.entrant2?.color || '#3b82f6', score: s2, rounds: match.entrant2?.rounds || 0 }
                ],
                format: tournament.scoringType === 'points' ? 'points' : 'bestOf',
                bestOf,
                targetScore,
                status: match.status === 'COMPLETED' ? 'COMPLETED' : (match.winner ? 'COMPLETED' : 'ACTIVE'),
                winner: match.winner || null,
                clock: standaloneMatchupData?.clock || null,
                isTournament: true
            };
        }

        function isTourneyValid(t) {
            return t && (t.status === 'IN_PROGRESS' || t.status === 'READY' || t.status === 'ACTIVE' || t.status === 'COMPLETED') && Array.isArray(t.matches) && t.matches.length > 0;
        }

        function resolveActiveState() {
            if (forceSample) {
                fetch('/api/matchup').then(r => r.json()).then(d => {
                    const c = (d.matchup || d).clock;
                    if (c) {
                        SAMPLE_MATCHUP.clock.enabled = showClock && c.enabled !== false;
                        if (!runnerTimersParam && c.runnerTimersMode) SAMPLE_MATCHUP.clock.runnerTimersMode = c.runnerTimersMode;
                        if (splitsParam === '' && c.showSplits !== undefined) SAMPLE_MATCHUP.clock.showSplits = c.showSplits;
                        renderMatchup(SAMPLE_MATCHUP);
                    }
                }).catch(() => {});
                SAMPLE_MATCHUP.clock.enabled = showClock;
                renderMatchup(SAMPLE_MATCHUP);
                return;
            }

            if (sourceMode === 'tournament') {
                if (isTourneyValid(activeTournamentData)) {
                    const match = activeTournamentData.matches.find(m => m.id === activeTournamentData.activeMatchId) ||
                                  activeTournamentData.matches.find(m => !m.isBye && !m.winner && m.status === 'ACTIVE') ||
                                  activeTournamentData.matches.find(m => !m.isBye && !m.winner && m.entrant1?.name !== 'TBD' && m.entrant2?.name !== 'TBD') ||
                                  activeTournamentData.matches[0];
                    if (match) {
                        renderMatchup(convertTournamentMatchToMatchup(activeTournamentData, match));
                        return;
                    }
                }
                if (isPreview) {
                    renderMatchup(SAMPLE_MATCHUP);
                } else {
                    stage.classList.add('hidden');
                }
                return;
            }

            if (sourceMode === 'auto') {
                // If tournament is active, show tournament's active match!
                if (isTourneyValid(activeTournamentData)) {
                    const match = activeTournamentData.matches.find(m => m.id === activeTournamentData.activeMatchId) ||
                                  activeTournamentData.matches.find(m => !m.isBye && !m.winner && m.status === 'ACTIVE') ||
                                  activeTournamentData.matches.find(m => !m.isBye && !m.winner && m.entrant1?.name !== 'TBD' && m.entrant2?.name !== 'TBD');
                    if (match) {
                        renderMatchup(convertTournamentMatchToMatchup(activeTournamentData, match));
                        return;
                    }
                }
            }

            // Standalone matchup fallback
            if (standaloneMatchupData) {
                renderMatchup(standaloneMatchupData);
            } else if (isPreview) {
                renderMatchup(SAMPLE_MATCHUP);
            } else {
                stage.classList.add('hidden');
            }
        }

        // Initial Data Fetch
        async function loadInitial() {
            try {
                const [matchupRes, tourneyRes] = await Promise.all([
                    fetch('/api/matchup').catch(() => null),
                    fetch('/api/tournament').catch(() => null)
                ]);

                if (matchupRes && matchupRes.ok) {
                    const mData = await matchupRes.json();
                    if (mData && mData.matchup) standaloneMatchupData = mData.matchup;
                }
                if (tourneyRes && tourneyRes.ok) {
                    const tData = await tourneyRes.json();
                    if (tData && tData.tournament) activeTournamentData = tData.tournament;
                }
            } catch (err) {
                console.warn('Could not fetch initial matchup or tournament data:', err);
            }
            resolveActiveState();
        }
        loadInitial();

        // WebSocket Connection
        function connectWs() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${proto}//${location.host}/ws`);

            ws.onopen = () => {
                if (window.self === window.top && !isPreview) {
                    ws.send(JSON.stringify({ type: 'overlay-source', key: 'matchup' }));
                }
            };

            ws.onmessage = (event) => {
                if (forceSample) {
                    try {
                        const sm = JSON.parse(event.data);
                        if (sm.type === 'matchup-update' && sm.data && sm.data.clock) {
                            const c = sm.data.clock;
                            SAMPLE_MATCHUP.clock.enabled = showClock && c.enabled !== false;
                            if (!runnerTimersParam && c.runnerTimersMode) SAMPLE_MATCHUP.clock.runnerTimersMode = c.runnerTimersMode;
                            if (splitsParam === '' && c.showSplits !== undefined) SAMPLE_MATCHUP.clock.showSplits = c.showSplits;
                            renderMatchup(SAMPLE_MATCHUP);
                        }
                    } catch { /* ignore */ }
                    return;
                }
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'matchup-update') {
                        standaloneMatchupData = msg.data;
                        resolveActiveState();
                    } else if (msg.type === 'tournament-update') {
                        activeTournamentData = msg.data;
                        resolveActiveState();
                    }
                } catch { /* ignore parse error */ }
            };

            ws.onclose = () => setTimeout(connectWs, 2000);
        }
        connectWs();
    </script>
</body>

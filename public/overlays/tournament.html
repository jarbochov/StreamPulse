<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Tournament Bracket Overlay</title>
    <style>
        :root {
            --tourney-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif;
            --tourney-text: #f0f6fc;
            --tourney-muted: #8b949e;
            --tourney-accent: #58a6ff;
            --tourney-badge-bg: var(--tourney-accent);
            --tourney-badge-color: #0d1117;
            --tourney-winner: #3fb950;
            --tourney-bg: rgba(13, 17, 23, 0.92);
            --tourney-card-bg: rgba(22, 27, 34, 0.88);
            --tourney-border: #30363d;
            --tourney-radius: 10px;
            --tourney-backdrop: blur(12px);
            --tourney-text-shadow: none;
            --tourney-scale: 1;
            --round-gap: clamp(1rem, 2.5vw, 2.5rem);
            --match-gap: clamp(0.75rem, 1.8vh, 1.75rem);
            --round-min-width: 210px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: var(--tourney-font);
            color: var(--tourney-text);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(0.5rem, 2vmin, 1.5rem);
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        .tournament-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1600px;
            transition: transform 0.2s ease;
        }

        /* Themes */
        .theme-ember { --tourney-bg: linear-gradient(135deg,#2a0f0a,#12060a); --tourney-card-bg: rgba(10,14,24,.88); --tourney-border: #ff6a3d; --tourney-accent: #ff6a3d; }
        .theme-aurora { --tourney-bg: linear-gradient(135deg,#06232b,#0b1a3a); --tourney-card-bg: rgba(10,14,24,.88); --tourney-border: #2dd4bf; --tourney-accent: #2dd4bf; }
        .theme-ocean { --tourney-bg: linear-gradient(135deg,#071c3a,#04101f); --tourney-card-bg: rgba(10,14,24,.88); --tourney-border: #38bdf8; --tourney-accent: #38bdf8; }
        .theme-sunset { --tourney-bg: linear-gradient(135deg,#3b0f3a,#2a0d1a); --tourney-card-bg: rgba(10,14,24,.88); --tourney-border: #fb7185; --tourney-accent: #fbbf24; }
        .theme-violet { --tourney-bg: linear-gradient(135deg,#1e1038,#0d0820); --tourney-card-bg: rgba(10,14,24,.88); --tourney-border: #a78bfa; --tourney-accent: #c084fc; }
        .theme-forest { --tourney-bg: linear-gradient(135deg,#0a2316,#06120b); --tourney-card-bg: rgba(10,14,24,.88); --tourney-border: #4ade80; --tourney-accent: #4ade80; }
        .theme-glass {
            --tourney-bg: rgba(13, 17, 23, 0.65);
            --tourney-card-bg: rgba(22, 27, 34, 0.65);
            --tourney-backdrop: blur(18px);
            --tourney-border: rgba(255, 255, 255, 0.15);
        }

        .theme-solid {
            --tourney-bg: #0d1117;
            --tourney-card-bg: #161b22;
            --tourney-backdrop: none;
            --tourney-border: #30363d;
        }

        .theme-transparent {
            --tourney-bg: transparent;
            --tourney-card-bg: rgba(0, 0, 0, 0.55);
            --tourney-backdrop: none;
            --tourney-border: rgba(255, 255, 255, 0.12);
            --tourney-text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }

        .theme-pill {
            --tourney-radius: 24px;
        }

        .theme-neon {
            --tourney-bg: rgba(9, 13, 22, 0.94);
            --tourney-card-bg: rgba(15, 23, 42, 0.9);
            --tourney-border: #38bdf8;
            --tourney-accent: #38bdf8;
        }

        .theme-retro {
            --tourney-bg: rgba(15, 10, 30, 0.94);
            --tourney-card-bg: rgba(30, 18, 55, 0.9);
            --tourney-border: #ec4899;
            --tourney-accent: #06b6d4;
        }

        .theme-championship, .theme-gold {
            --tourney-bg: rgba(22, 17, 8, 0.94);
            --tourney-card-bg: rgba(35, 28, 12, 0.9);
            --tourney-border: #ffd700;
            --tourney-accent: #ffd700;
        }

        .theme-cyber {
            --tourney-bg: rgba(6, 10, 20, 0.94);
            --tourney-card-bg: rgba(12, 20, 36, 0.9);
            --tourney-border: #00f0ff;
            --tourney-accent: #ff0055;
        }

        .theme-fgc-evo {
            --tourney-bg: linear-gradient(180deg, #161b22 0%, #0a0d14 100%);
            --tourney-card-bg: #121824;
            --tourney-border: #f59e0b;
            --tourney-accent: #ffd700;
            --tourney-winner: #10b981;
        }

        .theme-clean-light {
            --tourney-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --tourney-text: #1f2328;
            --tourney-muted: #656d76;
            --tourney-accent: #0969da;
            --tourney-winner: #1a7f37;
            --tourney-bg: #ffffff;
            --tourney-card-bg: #f6f8fa;
            --tourney-border: #d0d7de;
        }

        .theme-clean-light .entrant-row {
            background: #ffffff;
        }
        .theme-clean-light .entrant-row:first-child {
            border-bottom: 1px solid var(--tourney-border);
        }
        .theme-clean-light .entrant-row.winner {
            background: rgba(26, 127, 55, 0.12);
        }
        .theme-clean-light .seed-pill {
            background: rgba(0, 0, 0, 0.06);
            color: var(--tourney-muted);
        }
        .theme-clean-light .score-badge {
            background: rgba(0, 0, 0, 0.06);
            color: var(--tourney-text);
        }
        .theme-clean-light .win-pip:not(.won),
        .theme-clean-light .match-round-pip:not(.won) {
            background: rgba(0, 0, 0, 0.12);
            border-color: rgba(0, 0, 0, 0.25);
        }
        .theme-clean-light .win-pip.won {
            background: var(--tourney-winner);
            border-color: var(--tourney-winner);
            box-shadow: 0 0 6px rgba(26, 127, 55, 0.4);
        }
        .theme-clean-light .rr-standings-card {
            background: #ffffff;
            border-color: var(--tourney-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        .theme-clean-light .rr-matches-card {
            background: #ffffff;
            border-color: var(--tourney-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        .theme-clean-light .rr-matches-header {
            border-bottom-color: var(--tourney-border);
        }
        .theme-clean-light .rr-match-item {
            background: #f6f8fa;
            border-color: var(--tourney-border);
        }
        .theme-clean-light .rr-score-pill {
            background: rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.08);
            color: var(--tourney-text);
        }
        .theme-clean-light .rr-table th {
            background: #f6f8fa;
            border-bottom: 1px solid var(--tourney-border);
            color: var(--tourney-muted);
        }
        .theme-clean-light .rr-table td {
            border-bottom: 1px solid var(--tourney-border);
            color: var(--tourney-text);
        }
        .theme-clean-light .rr-rank-badge {
            background: rgba(0, 0, 0, 0.06);
            color: var(--tourney-text);
        }
        .theme-clean-light .hud-header {
            border-bottom: 1px solid var(--tourney-border);
        }
        .theme-clean-light .hud-vs-pill {
            background: rgba(0, 0, 0, 0.06);
        }
        .theme-clean-light .hud-vote-bar-wrap {
            background: rgba(0, 0, 0, 0.08);
        }
        .theme-clean-light .bracket-line {
            stroke: rgba(0, 0, 0, 0.2);
        }
        .theme-clean-light .lines-solid .bracket-line {
            stroke: rgba(0, 0, 0, 0.35);
        }
        .theme-clean-light .lines-minimal .bracket-line {
            stroke: rgba(0, 0, 0, 0.15);
        }
        .theme-clean-light .champion-name {
            color: #1f2328;
            text-shadow: none;
        }

        .theme-minimal-dark {
            --tourney-bg: #000000;
            --tourney-card-bg: #0d1117;
            --tourney-border: #21262d;
            --tourney-accent: #58a6ff;
        }

        .theme-border {
            --tourney-border: #58a6ff;
            --tourney-card-bg: #0d1117;
            --tourney-radius: 8px;
        }

        /* Spacing Variations */
        body.spacing-compact {
            --round-min-width: 165px;
            --round-gap: clamp(0.35rem, 1vw, 0.9rem);
            --match-gap: clamp(0.3rem, 0.8vh, 0.7rem);
        }
        body.spacing-compact .entrant-row {
            padding: 0.35rem 0.55rem;
        }
        body.spacing-compact .round-header {
            margin-bottom: 0.2rem;
            font-size: 0.68rem;
        }

        body.spacing-spacious {
            --round-min-width: 255px;
            --round-gap: clamp(1.75rem, 4vw, 4.2rem);
            --match-gap: clamp(1.4rem, 3vh, 3.2rem);
        }
        body.spacing-spacious .entrant-row {
            padding: 0.75rem 0.95rem;
        }

        /* Bracket Connector Lines */
        #bracket-connectors {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
            z-index: 1;
        }

        .bracket-line {
            fill: none;
            stroke: rgba(255, 255, 255, 0.25);
            stroke-width: 2px;
            stroke-linejoin: round;
            stroke-linecap: round;
            transition: stroke 0.3s ease, filter 0.3s ease;
        }

        .bracket-line.active-line {
            stroke: var(--tourney-accent);
            stroke-width: 2.5px;
        }

        .bracket-line.winner-line {
            stroke: var(--tourney-winner, #3fb950);
            stroke-width: 2px;
        }

        /* Line Styles */
        .lines-glow .bracket-line {
            stroke: var(--tourney-accent);
            stroke-width: 2px;
            filter: drop-shadow(0 0 6px rgba(88, 166, 255, 0.75));
        }
        .lines-glow .bracket-line.winner-line {
            stroke: var(--tourney-winner, #3fb950);
            filter: drop-shadow(0 0 6px rgba(63, 185, 80, 0.75));
        }
        .lines-glow .match-card.active {
            box-shadow: 0 0 28px rgba(88, 166, 255, 0.6), inset 0 0 12px rgba(88, 166, 255, 0.2);
        }

        .lines-solid .bracket-line {
            stroke: rgba(255, 255, 255, 0.45);
            stroke-width: 2px;
            filter: none;
        }
        .lines-solid .bracket-line.active-line {
            stroke: var(--tourney-accent);
            stroke-width: 2.5px;
        }
        .lines-solid .match-card {
            border-width: 2px;
        }

        .lines-minimal .bracket-line {
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 1px;
            filter: none;
        }
        .lines-minimal .match-card {
            border-style: solid;
            border-width: 1px;
            box-shadow: none;
        }

        /* Round Header Variations */
        .roundheaders-pill .round-header {
            display: inline-block;
            background: rgba(88, 166, 255, 0.14);
            color: var(--tourney-accent);
            border: 1px solid rgba(88, 166, 255, 0.25);
            padding: 0.18rem 0.65rem;
            border-radius: 999px;
            margin: 0 auto 0.4rem;
        }

        .roundheaders-hidden .round-header {
            display: none;
        }

        /* Header */
        #stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        #tournament-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-align: center;
        }

        .tournament-header {
            text-align: center;
            margin: 0 auto clamp(1rem, 3cqi, 1.75rem) auto;
            background: var(--tourney-bg);
            backdrop-filter: var(--tourney-backdrop);
            -webkit-backdrop-filter: var(--tourney-backdrop);
            border: 1px solid var(--tourney-border);
            border-radius: var(--tourney-radius);
            padding: 0.75rem 2rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            text-shadow: var(--tourney-text-shadow);
        }

        .tournament-logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 0.2rem;
        }

        .tournament-logo {
            display: block;
            width: auto;
            max-width: min(380px, 75vw);
            max-height: calc(56px * var(--tourney-scale));
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.45));
        }

        .tournament-title {
            font-size: calc(clamp(1.1rem, 3.2cqi, 1.45rem) * var(--tourney-scale));
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--tourney-text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            text-align: center;
            width: 100%;
        }

        .tournament-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-size: calc(0.72rem * var(--tourney-scale));
            color: var(--tourney-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            flex-wrap: wrap;
        }

        .meta-pill {
            background: color-mix(in srgb, var(--tourney-badge-bg) 14%, transparent);
            color: var(--tourney-badge-bg);
            border: 1px solid color-mix(in srgb, var(--tourney-badge-bg) 28%, transparent);
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }

        /* Bracket Tree View (Default Layout) */
        .bracket-tree {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--round-gap);
            width: 100%;
            position: relative;
        }

        .bracket-round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: var(--match-gap);
            min-width: var(--round-min-width);
            flex: 1;
            max-width: 340px;
            position: relative;
            z-index: 2;
        }

        .round-header {
            font-size: calc(0.75rem * var(--tourney-scale));
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--tourney-muted);
            text-align: center;
            margin-bottom: 0.4rem;
        }

        /* Match Card */
        .match-card {
            background: var(--tourney-card-bg);
            backdrop-filter: var(--tourney-backdrop);
            -webkit-backdrop-filter: var(--tourney-backdrop);
            border: 1px solid var(--tourney-border);
            border-radius: var(--tourney-radius);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transition: all 0.25s ease;
            position: relative;
        }

        .match-card.active {
            border-color: var(--tourney-accent);
            box-shadow: 0 0 24px rgba(88, 166, 255, 0.35);
            animation: match-pulse 2s infinite alternate;
        }

        @keyframes match-pulse {
            from { border-color: rgba(88, 166, 255, 0.6); }
            to { border-color: rgba(88, 166, 255, 1); }
        }

        .match-card.completed {
            border-color: rgba(56, 139, 253, 0.2);
        }

        .match-card.bye-card {
            opacity: 0.72;
            border-style: dashed;
            background: rgba(255, 255, 255, 0.02);
        }

        .match-card.bye-card .entrant-row {
            background: transparent;
            padding: 0.65rem 0.75rem;
        }

        .bye-badge {
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.15rem 0.45rem;
            border-radius: 9999px;
            background: color-mix(in srgb, var(--tourney-badge-bg) 15%, transparent);
            color: var(--tourney-badge-bg);
            border: 1px solid color-mix(in srgb, var(--tourney-badge-bg) 30%, transparent);
            white-space: nowrap;
        }

        /* Round Robin Standings Table */
        .rr-stage {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
        }

        .rr-standings-card {
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .rr-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        .rr-table th {
            text-align: left;
            padding: 0.6rem 0.85rem;
            background: rgba(13, 17, 23, 0.7);
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--tourney-muted);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .rr-table td {
            padding: 0.65rem 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .rr-table tr:last-child td {
            border-bottom: none;
        }

        .rr-table tr.leader {
            background: rgba(63, 185, 80, 0.08);
        }

        .rr-table tr.leader td:first-child {
            color: var(--tourney-winner);
            font-weight: 800;
        }

        .rr-rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            font-weight: 800;
            font-size: 0.75rem;
        }

        .leader .rr-rank-badge {
            background: #f59e0b;
            color: #0d1117;
        }

        /* Round Robin Matches Grid & Schedule */
        .rr-matches-card {
            background: var(--tourney-card-bg, rgba(22, 27, 34, 0.85));
            border: 1px solid var(--tourney-border, rgba(255, 255, 255, 0.12));
            border-radius: var(--tourney-radius, 10px);
            padding: 0.9rem 1.1rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .rr-matches-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            padding-bottom: 0.45rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .rr-matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 0.65rem;
        }

        .rr-match-item {
            background: rgba(13, 17, 23, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 0.55rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            transition: all 0.2s ease;
        }

        .rr-match-item.active {
            border-color: var(--tourney-accent);
            box-shadow: 0 0 10px color-mix(in srgb, var(--tourney-accent) 25%, transparent);
        }

        .rr-match-item.completed {
            border-color: rgba(255, 255, 255, 0.05);
        }

        .rr-match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            color: var(--tourney-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .rr-badge-live {
            color: var(--tourney-badge-bg);
            font-weight: 800;
        }

        .rr-badge-draw {
            color: var(--tourney-muted);
            font-weight: 700;
        }

        .rr-badge-win {
            color: var(--tourney-winner);
            font-weight: 800;
        }

        .rr-match-row {
            display: grid;
            grid-template-columns: 1fr 64px 1fr;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.84rem;
            width: 100%;
        }

        .rr-entrant {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            min-width: 0;
            overflow: hidden;
        }

        .rr-entrant-1 {
            justify-content: flex-end;
            text-align: right;
        }

        .rr-entrant-2 {
            justify-content: flex-start;
            text-align: left;
        }

        .rr-entrant .entrant-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }

        .rr-entrant.winner .entrant-name {
            font-weight: 800;
            color: var(--tourney-winner);
        }

        .rr-score-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            flex-shrink: 0;
        }

        .rr-score-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            padding: 0.18rem 0;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--tourney-text);
            font-weight: 800;
            font-size: 0.82rem;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.04em;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .rr-vs-pill {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--tourney-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
        }

        .match-card-badge {
            position: absolute;
            top: -1px;
            right: 8px;
            background: var(--tourney-badge-bg);
            color: var(--tourney-badge-color);
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 0.15rem 0.45rem;
            border-radius: 0 0 4px 4px;
            z-index: 2;
        }

            transform: rotate(45deg);

        .win-pip.pip-bar {
            width: 5px;
            height: 12px;
            border-radius: 2px;

        }

        .match-round-pip {
            width: 8px;
            height: 8px;
            border-radius: 1px;
            transform: rotate(45deg);
            margin: 1px 2px;
            background: rgba(255, 255, 255, 0.2);

            box-sizing: border-box;

            transform: none;
            margin: 0;

            ]

        const SAMPLE_RR_TOURNAMENT = {
            id: 'sample-rr-tourney',
            title: 'Retro Community League',
            format: 'roundRobin',
            bracketSize: 4,
            roundCount: 3,
            progressionMode: 'manual',
            bestOf: 3,
            targetScore: 2,

            standings: [
                { name: 'Chrono Trigger', tag: 'Square', seed: 1, played: 2, won: 2, lost: 0, draws: 0, scoreFor: 4, scoreAgainst: 1, diff: 3, points: 6 },
                { name: 'EarthBound', tag: 'Ape', seed: 2, played: 2, won: 1, lost: 1, draws: 0, scoreFor: 3, scoreAgainst: 2, diff: 1, points: 3 },
                { name: 'Final Fantasy VI', tag: 'Square', seed: 3, played: 2, won: 1, lost: 1, draws: 0, scoreFor: 2, scoreAgainst: 3, diff: -1, points: 3 },
                { name: 'Lufia II', tag: 'Neverland', seed: 4, played: 2, won: 0, lost: 2, draws: 0, scoreFor: 1, scoreAgainst: 4, diff: -3, points: 0 }
            ],
            matches: [
                { id: 'rr_1_1', round: 1, roundName: 'Round 1', entrant1: { name: 'Chrono Trigger', tag: 'Square', seed: 1, score: 2 }, entrant2: { name: 'EarthBound', tag: 'Ape', seed: 2, score: 1 }, scores: [2, 1], status: 'COMPLETED', winner: 'Chrono Trigger' },
                { id: 'rr_1_2', round: 1, roundName: 'Round 1', entrant1: { name: 'Final Fantasy VI', tag: 'Square', seed: 3, score: 2 }, entrant2: { name: 'Lufia II', tag: 'Neverland', seed: 4, score: 0 }, scores: [2, 0], status: 'COMPLETED', winner: 'Final Fantasy VI' },
                { id: 'rr_2_1', round: 2, roundName: 'Round 2', entrant1: { name: 'Chrono Trigger', tag: 'Square', seed: 1, score: 1 }, entrant2: { name: 'Final Fantasy VI', tag: 'Square', seed: 3, score: 0 }, scores: [1, 0], status: 'ACTIVE' },
                { id: 'rr_2_2', round: 2, roundName: 'Round 2', entrant1: { name: 'EarthBound', tag: 'Ape', seed: 2, score: 2 }, entrant2: { name: 'Lufia II', tag: 'Neverland', seed: 4, score: 1 }, scores: [2, 1], status: 'COMPLETED', winner: 'EarthBound' }
            ]
        };

        function esc(str) {
            return String(str || '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function getFallbackSample() {
            if (isPollSource) return SAMPLE_POLL_TOURNAMENT;
            if (layoutMode === 'roundrobin' || layoutMode === 'rr' || params.get('format') === 'roundRobin') {
                return SAMPLE_RR_TOURNAMENT;
            }
            return SAMPLE_TOURNAMENT;
        }

        function renderTournament(tournament) {
            if (!tournament || !Array.isArray(tournament.matches)) {
                if (isPreview) {
                    tournament = getFallbackSample();
                } else {
                    container.innerHTML = `
                        <div class="empty-placeholder">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="margin-bottom: 0.6rem; opacity: 0.6;"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
                            <p>No active tournament bracket</p>
                            <span style="font-size: 0.8rem; opacity: 0.7;">Open Poll Manager to launch a tournament</span>
                        </div>
                    `;
                    return;
                }
            }

            currentTournament = tournament;
            const matches = tournament.matches;

            // Trigger Champion celebration once
            if (tournament.status === 'COMPLETED' && tournament.champion && lastCelebratedChampion !== tournament.champion) {
                lastCelebratedChampion = tournament.champion;
                if (enableConfetti) burstConfetti();
            }

            // Check layout mode: HUD / Active match vs Bracket Tree
            if (layoutMode === 'active' || layoutMode === 'hud' || layoutMode === 'match') {
                renderActiveMatchHud(tournament);
            } else if (tournament.format === 'roundRobin' || layoutMode === 'roundrobin' || layoutMode === 'rr') {
                renderRoundRobinView(tournament);
            } else {
                renderBracketTree(tournament);
            }
            adjustScaleAndFit();
        }

        function adjustScaleAndFit() {
            if (layoutMode === 'active' || layoutMode === 'hud' || layoutMode === 'match') {
                stage.style.transform = '';
                return;
            }
            const autoFit = params.get('fit') === '1' || params.get('autoscale') === '1' || params.get('fit') === 'all';
            if (autoFit) {
                stage.style.transform = '';
                stage.style.width = 'max-content';
                stage.style.maxWidth = 'none';
                const winW = window.innerWidth;
                const winH = window.innerHeight;
                const stageW = stage.scrollWidth || stage.offsetWidth;
                const stageH = stage.scrollHeight || stage.offsetHeight;
                if (stageW > 0 && stageH > 0) {
                    const pad = 24;
                    const scale = Math.min(1, (winW - pad) / stageW, (winH - pad) / stageH);
                    stage.style.transform = `scale(${scale})`;
                    stage.style.transformOrigin = 'center center';
                }
            } else if (scaleVal && Number.isFinite(scaleVal) && scaleVal > 0 && scaleVal !== 1) {
                stage.style.transform = `scale(${scaleVal})`;
                stage.style.transformOrigin = 'center center';
            }
            requestAnimationFrame(drawBracketConnectors);
        }
        window.addEventListener('resize', () => {
            adjustScaleAndFit();
            drawBracketConnectors();
        });

        // Render Esports Lower-Third / Active Match HUD
        function renderActiveMatchHud(tournament) {
            const matches = tournament.matches || [];
            let activeMatch = matches.find(m => m.id === tournament.activeMatchId) ||
                              matches.find(m => m.status === 'ACTIVE') ||
                              matches.find(m => m.status === 'PENDING' && m.entrant1?.name !== 'TBD' && m.entrant2?.name !== 'TBD') ||
                              matches[matches.length - 1];

            if (!activeMatch) {
                container.innerHTML = '<div class="empty-placeholder">No active matchup to display.</div>';
                return;
            }

            const e1 = activeMatch.entrant1 || { name: 'TBD', seed: 0, score: 0, rounds: 0, votes: 0 };
            const e2 = activeMatch.entrant2 || { name: 'TBD', seed: 0, score: 0, rounds: 0, votes: 0 };
            const bestOf = activeMatch.bestOf || tournament.bestOf || 0;
            const targetScore = activeMatch.targetScore || (bestOf > 0 ? Math.ceil(bestOf / 2) : 0);
            const rb = activeMatch.roundsBestOf || tournament.roundsBestOf || 0;
            const targetRounds = rb > 0 ? Math.ceil(rb / 2) : 0;
            const isVote = tournament.progressionMode === 'vote';
            const totalVotes = (Number(e1.votes) || 0) + (Number(e2.votes) || 0);
            const e1Pct = totalVotes > 0 ? Math.round(((Number(e1.votes) || 0) / totalVotes) * 100) : 50;

            function renderPips(score, color) {
                if (!targetScore) return '';
                if (pipStyle === 'digit' || pipStyle === 'number') {
                    return `<span class="score-badge" style="margin-left:0.35rem;${color ? `color:${color};` : ''}">${score}/${targetScore}</span>`;
                }
                const pipClass = (pipStyle === 'diamond' || pipStyle === 'diamonds') ? ' pip-diamond' : ((pipStyle === 'bar' || pipStyle === 'block') ? ' pip-bar' : ' pip-circle');
                let pips = '<div class="win-pips" title="Game wins">';
                for (let i = 0; i < targetScore; i++) {
                    const isWon = i < score;
                    pips += `<span class="win-pip${pipClass}${isWon ? ' won' : ''}" style="${isWon && color ? `background:${color};border-color:${color};box-shadow:0 0 6px ${color};` : ''}"></span>`;
                }
                pips += '</div>';
                return pips;
            }

            function renderHudRoundPips(rounds, color) {
                if (!showRoundPips || !targetRounds) return '';
                if (roundPipStyle === 'digit' || roundPipStyle === 'number') {
                    return `<span class="score-badge" style="font-size:0.7em;margin-top:0.25rem;display:inline-block;${color ? `color:${color};` : ''}">◆ ${rounds}/${targetRounds}</span>`;
                }
                const pipClass = (roundPipStyle === 'circle' || roundPipStyle === 'circles') ? ' pip-circle' : ((roundPipStyle === 'bar' || roundPipStyle === 'block') ? ' pip-bar' : ' pip-diamond');
                let p = '<div class="match-round-pips" style="margin-top:0.25rem;" title="Rounds won">';
                for (let i = 0; i < targetRounds; i++) {
                    const isWon = i < rounds;
                    p += `<span class="match-round-pip${pipClass}${isWon ? ' won' : ''}" style="${isWon && color ? `background:${color};border-color:${color};box-shadow:0 0 6px ${color};` : ''}"></span>`;
                }
                p += '</div>';
                return p;
            }

            container.innerHTML = `
                <div class="hud-stage">
                    <div class="match-hud-card">
                        <div class="hud-header">
                            <span>${esc(activeMatch.roundName)} ${bestOf > 0 ? `· Best of ${bestOf}` : ''}</span>
                            <span>${activeMatch.matchDetails ? esc(activeMatch.matchDetails) : esc(tournament.title)}</span>
                        </div>
                        <div class="hud-match-grid" style="gap: var(--tourney-center-gap, 1rem);${!showCenter ? ' grid-template-columns: 1fr 1fr;' : ''}">
                            <div class="hud-entrant e1" style="${e1.color ? `border-left: 4px solid ${e1.color};` : ''}">
                                <div class="hud-score-display">${isVote ? (e1.votes || 0) : (showScoresParam ? (e1.score || 0) : '')}</div>
                                <div>
                                    <div class="hud-entrant-name" style="${e1.color ? `color:${e1.color};` : ''}">${esc(e1.name)}</div>
                                    ${showTags && e1.tag ? `<div class="hud-entrant-tag">${esc(e1.tag)}</div>` : ''}
                                    ${!isVote && !isPollSource && targetScore > 0 ? renderPips(e1.score || 0, e1.color) : ''}
                                    ${!isVote && !isPollSource && targetRounds > 0 ? renderHudRoundPips(e1.rounds || 0, e1.color) : ''}
                                </div>
                            </div>
                            ${showCenter ? '<div class="hud-vs-pill">VS</div>' : ''}
                            <div class="hud-entrant e2" style="${e2.color ? `border-right: 4px solid ${e2.color};` : ''}">
                                <div class="hud-score-display">${isVote ? (e2.votes || 0) : (showScoresParam ? (e2.score || 0) : '')}</div>
                                <div>
                                    <div class="hud-entrant-name" style="${e2.color ? `color:${e2.color};` : ''}">${esc(e2.name)}</div>
                                    ${showTags && e2.tag ? `<div class="hud-entrant-tag">${esc(e2.tag)}</div>` : ''}
                                    ${!isVote && !isPollSource && targetScore > 0 ? renderPips(e2.score || 0, e2.color) : ''}
                                    ${!isVote && !isPollSource && targetRounds > 0 ? renderHudRoundPips(e2.rounds || 0, e2.color) : ''}
                                </div>
                            </div>
                        </div>
                        ${isVote ? `
                            <div class="hud-vote-bar-wrap">
                                <div class="hud-vote-fill" style="width: ${e1Pct}%;"></div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Render Visual Bracket Tree
        function renderBracketTree(tournament) {
            const matches = tournament.matches || [];
            const maxRound = Math.max(...matches.map(m => m.round || 1));
            const formatLabel = tournament.format === 'double' ? 'Double Elimination' : 'Single Elimination';
            const modeLabel = tournament.progressionMode === 'manual' ? (tournament.bestOf > 0 ? `Best of ${tournament.bestOf}` : 'Scored Bracket') : 'Chat Vote';

            const roundsMap = new Map();
            for (let r = 1; r <= maxRound; r++) {
                roundsMap.set(r, matches.filter(m => m.round === r));
            }

            function renderMatchRoundPips(roundsWon, rTarget, color) {
                if (!showRoundPips || !rTarget || rTarget <= 0) return '';
                if (roundPipStyle === 'digit' || roundPipStyle === 'number') {
                    return `<span class="score-badge" style="font-size:0.68em;margin-right:0.35rem;${color ? `color:${color};` : ''}">R ${roundsWon}/${rTarget}</span>`;
                }
                const pipClass = (roundPipStyle === 'circle' || roundPipStyle === 'circles') ? ' pip-circle' : ((roundPipStyle === 'bar' || roundPipStyle === 'block') ? ' pip-bar' : ' pip-diamond');
                let p = '<div class="match-round-pips" title="Rounds won">';
                for (let i = 0; i < rTarget; i++) {
                    const isWon = i < roundsWon;
                    p += `<span class="match-round-pip${pipClass}${isWon ? ' won' : ''}" style="${isWon && color ? `background:${color};border-color:${color};box-shadow:0 0 6px ${color};` : ''}"></span>`;
                }
                p += '</div>';
                return p;
            }

            const logoUrl = showLogo ? (paramLogo || tournament.logo || '') : '';
            const rawLogoSize = paramLogoSize || tournament.logoSize || '56px';
            const logoHeightCss = /^\d+$/.test(rawLogoSize) ? `${rawLogoSize}px` : rawLogoSize;
            const hasHeaderContent = showTitle || Boolean(logoUrl);

            let html = hasHeaderContent ? `
                <div class="tournament-header">
                    ${logoUrl ? `
                    <div class="tournament-logo-wrap">
                        <img src="${esc(logoUrl)}" alt="" class="tournament-logo" style="max-height: calc(${esc(logoHeightCss)} * var(--tourney-scale));" onload="if (typeof adjustScaleAndFit === 'function') adjustScaleAndFit();" onerror="this.parentElement.style.display='none'">
                    </div>
                    ` : ''}
                    ${showTitle ? `
                    <div class="tournament-title">
                        ${!logoUrl ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>` : ''}
                        ${esc(tournament.title)}
                    </div>
                    ` : ''}
                    ${showTitle && showMeta ? `
                    <div class="tournament-meta">
                        ${showFormat ? `<span class="meta-pill">${formatLabel}</span>` : ''}
                        ${showMode ? `<span class="meta-pill">${modeLabel}</span>` : ''}
                        ${showEntrants ? `<span>${tournament.entrantCount || tournament.bracketSize} Participants</span>` : ''}
                        ${showStatus ? (tournament.status === 'COMPLETED' ? '<span style="color: var(--tourney-winner);">Finished</span>' : '<span>In Progress</span>') : ''}
                    </div>
                    ` : ''}
                </div>
            ` : '';

            // If Champion declared
            if (showChampion && tournament.status === 'COMPLETED' && tournament.champion) {
                html += `
                    <div class="champion-card">
                        <div class="champion-title">Tournament Champion</div>
                        <div class="champion-name">${esc(tournament.champion)}</div>
                    </div>
                `;
            }

            // Bracket Tree Columns
            html += `<div class="bracket-tree"><svg id="bracket-connectors"></svg>`;
            for (let r = 1; r <= maxRound; r++) {
                const roundMatches = roundsMap.get(r) || [];
                const roundTitle = roundMatches[0]?.roundName || `Round ${r}`;

                html += `
                    <div class="bracket-round">
                        ${showRounds ? `<div class="round-header">${esc(roundTitle)}</div>` : ''}
                `;

                for (const match of roundMatches) {
                    if (match.isBye) {
                        const real = match.entrant1?.name !== 'BYE' ? match.entrant1 : match.entrant2;
                        html += `
                            <div class="match-card bye-card" data-match-id="${match.id}">
                                <div class="entrant-row winner">
                                    <div class="entrant-info">
                                        ${showSeeds && real?.seed > 0 ? `<span class="seed-pill">#${real.seed}</span>` : ''}
                                        <span class="entrant-name">${esc(real?.name || 'BYE')}</span>
                                        ${showTags && real?.tag ? `<span class="entrant-tag">${esc(real.tag)}</span>` : ''}
                                    </div>
                                    <span class="bye-badge">1st Round BYE</span>
                                </div>
                            </div>
                        `;
                        continue;
                    }

                    const isActive = showHighlight && tournament.highlightLive !== false && (
                        Object.prototype.hasOwnProperty.call(tournament, 'activeMatchId')
                            ? Boolean(tournament.activeMatchId) && match.id === tournament.activeMatchId
                            : match.status === 'ACTIVE'
                    );
                    const isCompleted = match.status === 'COMPLETED';
                    const hasWinner = match.winner;

                    const e1 = match.entrant1 || { name: 'TBD', seed: 0, score: 0, rounds: 0, votes: 0, percent: 0 };
                    const e2 = match.entrant2 || { name: 'TBD', seed: 0, score: 0, rounds: 0, votes: 0, percent: 0 };
                    const isVote = tournament.progressionMode === 'vote' || isPollSource;
                    const rb = (!isVote && !isPollSource) ? (match.roundsBestOf || tournament.roundsBestOf || 0) : 0;
                    const rTarget = rb > 0 ? Math.ceil(rb / 2) : 0;

                    const e1Winner = isCompleted && hasWinner === e1.name;
                    const e2Winner = isCompleted && hasWinner === e2.name;
                    const e1Loser = isCompleted && hasWinner && hasWinner !== e1.name;
                    const e2Loser = isCompleted && hasWinner && hasWinner !== e2.name;

                    html += `
                        <div class="match-card${isActive ? ' active' : ''}${isCompleted ? ' completed' : ''}" data-match-id="${match.id}">
                            ${showBadges && isActive ? `<span class="match-card-badge">${isVote ? 'Voting' : 'Live'}</span>` : ''}
                            
                            <div class="entrant-row${e1Winner ? ' winner' : ''}${e1Loser ? ' loser' : ''}" style="${e1.color ? `border-left: 3px solid ${e1.color};` : ''}">
                                ${isActive && isVote ? `<div class="vote-fill-bar" style="width: ${e1.percent || 0}%;"></div>` : ''}
                                <div class="entrant-info">
                                    ${e1.color ? `<span class="entrant-color-dot" style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${e1.color}; flex-shrink:0;"></span>` : ''}
                                    ${showSeeds && e1.seed > 0 ? `<span class="seed-pill">#${e1.seed}</span>` : ''}
                                    <span class="entrant-name">${esc(e1.name)}</span>
                                    ${showTags && e1.tag ? `<span class="entrant-tag">${esc(e1.tag)}</span>` : ''}
                                </div>
                                <div class="entrant-score-box">
                                    ${!isVote && !isPollSource && rTarget > 0 ? renderMatchRoundPips(e1.rounds || 0, rTarget, e1.color) : ''}
                                    ${showScoresParam ? `
                                        ${isVote ? (isActive || isCompleted ? `<span class="score-badge">${e1.votes || 0}</span><span class="entrant-pct">${e1.percent || 0}%</span>` : '') : `
                                            <span class="score-badge">${e1.score || 0}</span>
                                        `}
                                    ` : ''}
                                </div>
                            </div>

                            <div class="entrant-row${e2Winner ? ' winner' : ''}${e2Loser ? ' loser' : ''}" style="${e2.color ? `border-left: 3px solid ${e2.color};` : ''}">
                                ${isActive && isVote ? `<div class="vote-fill-bar" style="width: ${e2.percent || 0}%;"></div>` : ''}
                                <div class="entrant-info">
                                    ${e2.color ? `<span class="entrant-color-dot" style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${e2.color}; flex-shrink:0;"></span>` : ''}
                                    ${showSeeds && e2.seed > 0 ? `<span class="seed-pill">#${e2.seed}</span>` : ''}
                                    <span class="entrant-name">${esc(e2.name)}</span>
                                    ${showTags && e2.tag ? `<span class="entrant-tag">${esc(e2.tag)}</span>` : ''}
                                </div>
                                <div class="entrant-score-box">
                                    ${!isVote && !isPollSource && rTarget > 0 ? renderMatchRoundPips(e2.rounds || 0, rTarget, e2.color) : ''}
                                    ${showScoresParam ? `
                                        ${isVote ? (isActive || isCompleted ? `<span class="score-badge">${e2.votes || 0}</span><span class="entrant-pct">${e2.percent || 0}%</span>` : '') : `
                                            <span class="score-badge">${e2.score || 0}</span>
                                        `}
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }

                html += `</div>`;
            }
            html += `</div>`;

            container.innerHTML = html;
            requestAnimationFrame(drawBracketConnectors);
            setTimeout(drawBracketConnectors, 60);
        }

        function drawBracketConnectors() {
            const tree = document.querySelector('.bracket-tree');
            if (!tree) return;
            let svg = document.getElementById('bracket-connectors');
            if (!svg) {
                svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.id = 'bracket-connectors';
                tree.insertBefore(svg, tree.firstChild);
            }
            svg.innerHTML = '';
            if (!showLines || params.get('lines') === 'none') return;

            const treeRect = tree.getBoundingClientRect();
            if (!treeRect.width || !treeRect.height) return;

            svg.setAttribute('viewBox', `0 0 ${treeRect.width} ${treeRect.height}`);

            const rounds = Array.from(tree.querySelectorAll('.bracket-round'));
            if (rounds.length < 2) return;

            for (let r = 0; r < rounds.length - 1; r++) {
                const curRoundEl = rounds[r];
                const nextRoundEl = rounds[r + 1];

                const curCards = Array.from(curRoundEl.querySelectorAll('.match-card'));
                const nextCards = Array.from(nextRoundEl.querySelectorAll('.match-card'));

                curCards.forEach((fromCard, idx) => {
                    const nextIdx = Math.floor(idx / 2);
                    const toCard = nextCards[nextIdx];
                    if (!toCard) return;

                    const fromRect = fromCard.getBoundingClientRect();
                    const toRect = toCard.getBoundingClientRect();

                    const x1 = fromRect.right - treeRect.left;
                    const y1 = fromRect.top + fromRect.height / 2 - treeRect.top;

                    const x2 = toRect.left - treeRect.left;
                    const isUpper = (idx % 2 === 0);
                    const y2 = toRect.top + (isUpper ? toRect.height * 0.32 : toRect.height * 0.68) - treeRect.top;

                    const xm = x1 + (x2 - x1) * 0.5;

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', `M ${x1} ${y1} H ${xm} V ${y2} H ${x2}`);

                    const fromId = fromCard.dataset.matchId;
                    const matchObj = currentTournament?.matches?.find(m => m.id === fromId);
                    const isActive = matchObj?.status === 'ACTIVE' || fromCard.classList.contains('active');

                    let cls = 'bracket-line';
                    if (matchObj?.winner) cls += ' winner-line';
                    else if (isActive) cls += ' active-line';
                    path.setAttribute('class', cls);

                    svg.appendChild(path);
                });
            }
        }

        // Render Round Robin View (Standings Table + Match Schedule)
        function renderRoundRobinView(tournament) {
            const standings = tournament.standings || [];
            const matches = tournament.matches || [];

            const logoUrl = showLogo ? (paramLogo || tournament.logo || '') : '';
            const rawLogoSize = paramLogoSize || tournament.logoSize || '56px';
            const logoHeightCss = /^\d+$/.test(rawLogoSize) ? `${rawLogoSize}px` : rawLogoSize;
            const hasHeaderContent = showTitle || Boolean(logoUrl);

            let html = hasHeaderContent ? `
                <div class="tournament-header">
                    ${logoUrl ? `
                    <div class="tournament-logo-wrap">
                        <img src="${esc(logoUrl)}" alt="" class="tournament-logo" style="max-height: calc(${esc(logoHeightCss)} * var(--tourney-scale));" onload="if (typeof adjustScaleAndFit === 'function') adjustScaleAndFit();" onerror="this.parentElement.style.display='none'">
                    </div>
                    ` : ''}
                    ${showTitle ? `
                    <div class="tournament-title">
                        ${!logoUrl ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>` : ''}
                        ${esc(tournament.title)}
                    </div>
                    ` : ''}
                    ${showTitle && showMeta ? `
                    <div class="tournament-meta">
                        ${showFormat ? `<span class="meta-pill">Round Robin (All vs All)</span>` : ''}
                        ${showMode ? `<span class="meta-pill">${tournament.bestOf > 0 ? `Best of ${tournament.bestOf}` : 'Scored'}</span>` : ''}
                        ${showEntrants ? `<span>${tournament.entrantCount || standings.length} Participants</span>` : ''}
                        ${showStatus ? (tournament.status === 'COMPLETED' ? '<span style="color: var(--tourney-winner);">Finished</span>' : '<span>In Progress</span>') : ''}
                    </div>
                    ` : ''}
                </div>
            ` : '';

            if (showChampion && tournament.status === 'COMPLETED' && tournament.champion) {
                html += `
                    <div class="champion-card">
                        <div class="champion-title">Tournament Champion</div>
                        <div class="champion-name">${esc(tournament.champion)}</div>
                    </div>
                `;
            }

            html += `
                <div class="rr-stage">
                    ${showStandings ? `
                    <div class="rr-standings-card">
                        <table class="rr-table">
                            <thead>
                                <tr>
                                    <th style="width: 40px; text-align: center;">#</th>
                                    <th>Participant</th>
                                    <th style="text-align: center;">P</th>
                                    <th style="text-align: center;">W</th>
                                    <th style="text-align: center;">D</th>
                                    <th style="text-align: center;">L</th>
                                    <th style="text-align: center;">Diff</th>
                                    <th style="text-align: right; padding-right: 1.25rem;">PTS</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${standings.map((s, idx) => `
                                    <tr class="${idx === 0 && s.played > 0 ? 'leader' : ''}">
                                        <td style="text-align: center;">
                                            <span class="rr-rank-badge">${idx + 1}</span>
                                        </td>
                                        <td>
                                            <div style="display: flex; align-items: center; gap: 0.4rem;">
                                                ${showSeeds && s.seed > 0 ? `<span class="seed-pill">#${s.seed}</span>` : ''}
                                                <span style="font-weight: 700;">${esc(s.name)}</span>
                                                ${showTags && s.tag ? `<span class="entrant-tag">${esc(s.tag)}</span>` : ''}
                                            </div>
                                        </td>
                                        <td style="text-align: center;">${s.played}</td>
                                        <td style="text-align: center; color: var(--tourney-winner); font-weight: 700;">${s.won}</td>
                                        <td style="text-align: center; color: var(--tourney-muted);">${s.draws || 0}</td>
                                        <td style="text-align: center; opacity: 0.7;">${s.lost}</td>
                                        <td style="text-align: center; font-variant-numeric: tabular-nums;">${s.diff > 0 ? `+${s.diff}` : s.diff}</td>
                                        <td style="text-align: right; padding-right: 1.25rem; font-weight: 800; color: var(--tourney-accent); font-size: 1.05rem;">
                                            ${s.points}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    ` : ''}

                    ${showMatches ? `
                    <div class="rr-matches-card">
                        <div class="rr-matches-header">
                            <span style="font-weight: 800; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--tourney-muted);">
                                Match Schedule &amp; Results (${matches.filter(m => m.status === 'COMPLETED').length}/${matches.length})
                            </span>
                        </div>
                        <div class="rr-matches-grid">
                            ${matches.map(m => {
                                const isAct = showHighlight && tournament.highlightLive !== false && (
                                    Object.prototype.hasOwnProperty.call(tournament, 'activeMatchId')
                                        ? Boolean(tournament.activeMatchId) && m.id === tournament.activeMatchId
                                        : m.status === 'ACTIVE'
                                );
                                const isComp = m.status === 'COMPLETED';
                                const e1 = m.entrant1 || { name: 'TBD', score: 0 };
                                const e2 = m.entrant2 || { name: 'TBD', score: 0 };
                                const s1 = e1.score ?? (Array.isArray(m.scores) ? m.scores[0] : 0) ?? 0;
                                const s2 = e2.score ?? (Array.isArray(m.scores) ? m.scores[1] : 0) ?? 0;
                                const seed1 = e1.seed || (standings.find(s => s.name === e1.name)?.seed) || (Array.isArray(tournament.entrants) ? tournament.entrants.findIndex(x => (x.name || x) === e1.name) + 1 : 0);
                                const seed2 = e2.seed || (standings.find(s => s.name === e2.name)?.seed) || (Array.isArray(tournament.entrants) ? tournament.entrants.findIndex(x => (x.name || x) === e2.name) + 1 : 0);

                                return `
                                    <div class="rr-match-item${isAct ? ' active' : ''}${isComp ? ' completed' : ''}">
                                        <div class="rr-match-header">
                                            <span>${esc(m.roundName || ('Round ' + m.round))}</span>
                                            ${showBadges && isAct ? '<span class="rr-badge-live">LIVE</span>' : ''}
                                            ${isComp ? (m.winner === 'DRAW' ? '<span class="rr-badge-draw">DRAW</span>' : `<span class="rr-badge-win">WIN: ${esc(m.winner)}</span>`) : ''}
                                        </div>
                                        <div class="rr-match-row">
                                            <div class="rr-entrant rr-entrant-1${m.winner === e1.name ? ' winner' : ''}">
                                                ${showSeeds && seed1 > 0 ? `<span class="seed-pill">#${seed1}</span>` : ''}
                                                <span class="entrant-name">${esc(e1.name)}</span>
                                                ${showTags && e1.tag ? `<span class="entrant-tag">${esc(e1.tag)}</span>` : ''}
                                            </div>
                                            <div class="rr-score-wrap">
                                                ${showScoresParam ? `<span class="rr-score-pill">${s1} — ${s2}</span>` : '<span class="rr-vs-pill">vs</span>'}
                                            </div>
                                            <div class="rr-entrant rr-entrant-2${m.winner === e2.name ? ' winner' : ''}">
                                                ${showSeeds && seed2 > 0 ? `<span class="seed-pill">#${seed2}</span>` : ''}
                                                <span class="entrant-name">${esc(e2.name)}</span>
                                                ${showTags && e2.tag ? `<span class="entrant-tag">${esc(e2.tag)}</span>` : ''}
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
            container.innerHTML = html;
        }
        window.renderTournament = renderTournament;

        // Particle Confetti
        function burstConfetti() {
            const ctx = confettiCanvas.getContext('2d');
            const w = confettiCanvas.width = window.innerWidth;
            const h = confettiCanvas.height = window.innerHeight;
            const count = 75;
            const pieces = [];
            const colors = ['#f59e0b', '#3b82f6', '#10b981', '#ec4899', '#8b5cf6', '#ef4444'];

            for (let i = 0; i < count; i++) {
                pieces.push({
                    x: w / 2,
                    y: h * 0.4,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 18,
                    size: Math.random() * 8 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 12
                });
            }

            let start = Date.now();
            function frame() {
                const elapsed = Date.now() - start;
                if (elapsed > 4000) {
                    ctx.clearRect(0, 0, w, h);
                    return;
                }
                ctx.clearRect(0, 0, w, h);
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.35;
                    p.rot += p.vRot;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                    ctx.restore();
                });
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }

        // Fetch initial tournament data
        async function loadInitial() {
            const fallbackSample = getFallbackSample();
            if (forceSample) {
                renderTournament(fallbackSample);
                try {
                    const res = await fetch(tourneyEndpoint);
                    const data = await res.json();
                    if (data.tournament && (data.tournament.logo || data.tournament.logoSize)) {
                        renderTournament({ ...fallbackSample, logo: data.tournament.logo || '', logoSize: data.tournament.logoSize || '' });
                    }
                } catch {}
                return;
            }
            try {
                const res = await fetch(tourneyEndpoint);
                const data = await res.json();
                if (data.tournament) {
                    currentTournament = data.tournament;
                    renderTournament(currentTournament);
                    return;
                }
            } catch (err) {
                console.warn('[Tournament Overlay] Error fetching initial state:', err);
            }
            if (isPreview) renderTournament(fallbackSample);
        }
        loadInitial();

        // WebSocket Connection
        function connectWs() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${proto}//${location.host}/ws`);

            ws.onopen = () => {
                if (window.self === window.top && !isPreview) {
                    ws.send(JSON.stringify({ type: 'overlay-source', key: tourneySource === 'poll' ? 'tournament-poll' : 'tournament' }));
                }
            };

            ws.onmessage = (event) => {
                if (forceSample) return;
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === tourneyWsEvent) {
                        currentTournament = msg.data;
                        renderTournament(currentTournament);
                    } else if (msg.type === 'poll-update' && currentTournament) {
                        const poll = msg.data;
                        if (poll && poll.tournamentMatchId) {
                            const match = currentTournament.matches.find(m => m.id === poll.tournamentMatchId);
                            if (match && poll.choices && poll.choices.length >= 2) {
                                match.entrant1.votes = poll.choices[0].votes;
                                match.entrant1.percent = poll.choices[0].percent;
                                match.entrant2.votes = poll.choices[1].votes;
                                match.entrant2.percent = poll.choices[1].percent;
                                renderTournament(currentTournament);
                            }
                        }
                    }
                } catch { /* ignore parse error */ }
            };

            ws.onclose = () => setTimeout(connectWs, 2000);
        }
        connectWs();
    </script>
</body>
</html>

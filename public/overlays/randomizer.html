<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Choice Randomizer Overlay</title>
    <script src="/overlay-theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--stage-font, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
            -webkit-font-smoothing: antialiased;
        }

        #display-stage {
            --stage-accent: #8b5cf6;
            --stage-indicator: color-mix(in srgb, var(--stage-accent) 85%, #fff);
            --stage-gradient: linear-gradient(135deg, var(--stage-accent) 0%, color-mix(in srgb, var(--stage-accent) 70%, #ec4899) 50%, color-mix(in srgb, var(--stage-accent) 50%, #f97316) 100%);
            --stage-glow: color-mix(in srgb, var(--stage-accent) 40%, transparent);

            --stage-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --stage-weight: 600;
            --stage-text: #ffffff;
            --stage-outline: transparent;
            --stage-outline-shadow: 0 2px 8px rgba(0,0,0,0.4);

            font-family: var(--stage-font);
            font-weight: var(--stage-weight);
            color: var(--stage-text);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: min(94vw, 94vh * 1.3, 620px);
            max-height: 94vh;
            min-height: clamp(280px, 45vmin, 420px);
            transform: scale(var(--stage-scale, 1));
            transform-origin: center center;
            background: var(--overlay-bg, rgba(15, 23, 42, 0.85));
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2px solid color-mix(in srgb, var(--stage-accent) 60%, rgba(255,255,255,0.2));
            border-radius: clamp(10px, 2.2vmin, 18px);
            padding: clamp(1rem, 2.5vmin, 1.75rem) clamp(0.9rem, 2vmin, 1.5rem);
            overflow: hidden;
            box-shadow: 0 16px 50px rgba(0,0,0,0.6);
            margin: auto;
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #display-stage.hidden-stage {
            opacity: 0;
            transform: scale(calc(var(--stage-scale, 1) * 0.9)) translateY(20px);
            pointer-events: none;
        }

        /* 1. Slot-Machine Roller Mode */
        .roller-box {
            width: 100%;
            max-width: clamp(280px, 64vmin, 520px);
            height: clamp(180px, 32vmin, 260px);
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid color-mix(in srgb, var(--stage-accent) 55%, rgba(255,255,255,0.15));
            border-radius: clamp(8px, 1.6vmin, 14px);
            box-shadow: inset 0 0 24px rgba(0,0,0,0.6);
            transition: border-color .2s, box-shadow .2s;
        }
        .roller-box.tricky-suspense {
            animation: suspensePulse 0.35s infinite alternate ease-in-out;
            border-color: var(--stage-indicator) !important;
        }
        @keyframes suspensePulse {
            0% { box-shadow: inset 0 0 24px rgba(0,0,0,0.6), 0 0 10px var(--stage-indicator); }
            100% { box-shadow: inset 0 0 34px rgba(0,0,0,0.8), 0 0 26px var(--stage-indicator); }
        }

        .roller-indicator {
            position: absolute;
            left: 0; right: 0;
            top: calc(50% - 28px);
            height: 56px;
            border-top: 2px solid var(--stage-indicator);
            border-bottom: 2px solid var(--stage-indicator);
            background: linear-gradient(90deg, color-mix(in srgb, var(--stage-indicator) 15%, transparent) 0%, color-mix(in srgb, var(--stage-accent) 22%, transparent) 50%, color-mix(in srgb, var(--stage-indicator) 15%, transparent) 100%);
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 18px color-mix(in srgb, var(--stage-indicator) 30%, transparent);
            transition: border-color .2s;
        }
        .roller-indicator::before { content: ''; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid var(--stage-indicator); }
        .roller-indicator::after { content: ''; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 9px solid var(--stage-indicator); }

        .roller-track {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            will-change: transform;
            pointer-events: none;
        }
        .roller-item {
            height: 56px;
            min-height: 56px;
            max-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: var(--stage-font);
            font-weight: var(--stage-weight);
            padding: 0 clamp(1rem, 3vmin, 2.2rem);
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.12s, transform 0.12s;
            user-select: none;
            font-size: clamp(1rem, 2.2vmin, 1.25rem);
            color: color-mix(in srgb, var(--stage-text) 55%, transparent);
            text-shadow: var(--stage-outline-shadow);
            transform: scale(0.94);
        }
        .roller-item.tertiary {
            font-size: clamp(0.8rem, 1.8vmin, 1rem);
            color: color-mix(in srgb, var(--stage-text) 28%, transparent);
            transform: scale(0.85);
        }
        .roller-item.secondary {
            font-size: clamp(0.95rem, 2.1vmin, 1.2rem);
            color: color-mix(in srgb, var(--stage-text) 65%, transparent);
            transform: scale(0.92);
        }
        .roller-item.active-winner {
            font-size: clamp(1.3rem, 3vmin, 1.75rem);
            font-weight: 800;
            color: var(--stage-text);
            text-shadow: var(--stage-outline-shadow), 0 0 24px var(--stage-glow);
            transform: scale(1.06);
            z-index: 3;
        }

        /* 2. Wheel Canvas Mode */
        .wheel-box {
            position: relative;
            width: clamp(200px, 44vmin, 400px);
            height: clamp(200px, 44vmin, 400px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0,0,0,0.5), 0 0 15px var(--stage-glow);
        }
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid var(--stage-indicator);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            z-index: 10;
            transition: transform 0.05s ease-out;
        }
        .wheel-center-cap {
            position: absolute;
            width: clamp(34px, 7vmin, 48px);
            height: clamp(34px, 7vmin, 48px);
            border-radius: 50%;
            background: var(--stage-gradient);
            border: 3px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
            z-index: 5;
            pointer-events: none;
        }
        .wheel-center-cap::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0,0,0,0.4);
        }

        /* Winner Card */
        .winner-card {
            margin-top: 1.15rem;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 100%;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.7) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .winner-header {
            font-size: clamp(0.72rem, 1.8vmin, 0.95rem);
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--stage-indicator);
            margin-bottom: .35rem;
            text-shadow: 0 0 12px var(--stage-glow);
        }
        .winner-name {
            font-size: clamp(1.4rem, 4.2vmin, 2.2rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 14px rgba(0,0,0,0.7), 0 0 24px var(--stage-glow);
            word-break: break-word;
            padding: 0 .5rem;
        }
        .winner-sub {
            font-size: clamp(0.75rem, 1.8vmin, 0.95rem);
            color: color-mix(in srgb, #fff 80%, transparent);
            margin-top: .4rem;
            font-weight: 500;
            font-style: italic;
        }

        /* Optional Overlay Spin Button */
        .overlay-spin-btn {
            margin-top: 1.25rem;
            background: var(--stage-gradient);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            font-size: 1rem;
            font-weight: 800;
            padding: .75rem 1.6rem;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--stage-glow);
            display: inline-flex;
            align-items: center;
            gap: .55rem;
            transition: all .2s;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }
        .overlay-spin-btn:hover {
            transform: scale(1.04);
            border-color: #fff;
            box-shadow: 0 6px 28px var(--stage-glow);
        }
        .overlay-spin-btn:active {
            transform: scale(0.97);
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }
    </style>
</head>
<body>
    <div id="display-stage">
        <canvas id="confetti-canvas"></canvas>
        
        <!-- Continuous Smooth Roller Visual -->
        <div id="roller-view" class="roller-box" style="display:none;">
            <div class="roller-indicator"></div>
            <div class="roller-track" id="roller-track"></div>
        </div>

        <!-- Wheel Visual -->
        <div id="wheel-view" class="wheel-box" style="display:none;">
            <div class="wheel-pointer" id="wheel-pointer"></div>
            <div class="wheel-center-cap"></div>
            <canvas id="wheel-canvas" width="580" height="580"></canvas>
        </div>

        <!-- Winner Card -->
        <div id="winner-box" class="winner-card" style="display:none;">
            <div class="winner-header" id="winner-header-text">THE UNIVERSE HAS DECIDED</div>
            <div class="winner-name" id="winner-text">Winner Choice</div>
            <div class="winner-sub" id="winner-sub">The timeline has shifted. Fate is sealed.</div>
        </div>

        <!-- Optional Overlay Interactive Spin Button (Touchscreens / Interactive OBS) -->
        <button id="overlay-spin-btn" class="overlay-spin-btn" type="button" style="display:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon></svg>
            <span id="overlay-spin-btn-text">Let Chaos Reign!</span>
        </button>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const params = new URLSearchParams(window.location.search);

        // Sound FX via Web Audio API
        const AudioFX = {
            ctx: null,
            enabled: params.get('sound') !== '0',
            init() {
                if (!this.enabled) return;
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume().catch(() => {});
                }
            },
            tick(speed = 1) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(500 + Math.random() * 80, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.035);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.04);
                } catch {}
            },
            fanfare() {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        const t = this.ctx.currentTime + idx * 0.09;
                        gain.gain.setValueAtTime(0.12, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(t);
                        osc.stop(t + 0.5);
                    });
                } catch {}
            }
        };

        // Confetti Particle Engine
        const Confetti = {
            canvas: null,
            ctx: null,
            particles: [],
            animId: null,
            init(canvasEl) {
                this.canvas = canvasEl;
                if (!this.canvas) return;
                this.ctx = this.canvas.getContext('2d');
            },
            burst() {
                if (!this.canvas) return;
                this.canvas.width = this.canvas.offsetWidth;
                this.canvas.height = this.canvas.offsetHeight;
                const colors = ['#f43f5e', '#ec4899', '#d946ef', '#a855f7', '#6366f1', '#3b82f6', '#06b6d4', '#10b981', '#f59e0b', '#fbbf24'];
                this.particles = [];
                for (let i = 0; i < 90; i++) {
                    this.particles.push({
                        x: this.canvas.width / 2,
                        y: this.canvas.height / 2,
                        vx: (Math.random() - 0.5) * 16,
                        vy: (Math.random() - 0.7) * 16,
                        size: Math.random() * 8 + 4,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rotation: Math.random() * Math.PI * 2,
                        vRot: (Math.random() - 0.5) * 0.2,
                        alpha: 1,
                        gravity: 0.38
                    });
                }
                if (this.animId) cancelAnimationFrame(this.animId);
                this.loop();
            },
            loop() {
                if (!this.ctx || !this.particles.length) return;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.rotation += p.vRot;
                    p.alpha -= 0.012;
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }
                    this.ctx.save();
                    this.ctx.globalAlpha = Math.max(0, p.alpha);
                    this.ctx.translate(p.x, p.y);
                    this.ctx.rotate(p.rotation);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                    this.ctx.restore();
                }
                if (this.particles.length > 0) {
                    this.animId = requestAnimationFrame(() => this.loop());
                } else {
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                }
            }
        };

        // State & Configuration
        const DEFAULT_FALLBACK_CHOICES = [
            "Bidiots", "Blather Round", "Bomb Corp", "Bracketeering", "Champ'd Up",
            "Civic Doodle", "Devils and the Details", "Dictionarium", "Dodo Re Mi",
            "Drawful 2", "Fibbage 3", "Mad Verse City", "Quiplash 3", "Trivia Murder Party 2"
        ];
        let currentMode = params.get('mode') || 'roller';
        let currentPresetId = params.get('preset') || 'jackbox';
        let currentBtnPresetId = params.get('btnPreset') || params.get('btnSet') || 'chaos';
        let currentQuotePresetId = params.get('quotePreset') || 'multiverse';
        let currentSuspense = params.get('suspense') || 'normal';
        let showOverlayButton = params.get('button') === '1';
        let choices = [...DEFAULT_FALLBACK_CHOICES];
        let activeButtonPhrases = [];
        let activeQuotesPool = [];
        let isSpinning = false;
        let autohideTimer = null;
        let idleButtonTimer = null;
        let currentRollerIndex = 0;
        let savedOverlayConfigTheme = null;

        // Hidden state on load only if explicitly passed via &hidden=1
        if (params.get('hidden') === '1') {
            $('display-stage')?.classList.add('hidden-stage');
        }

        Confetti.init($('confetti-canvas'));

        // Dynamic Google / Web Font Loader
        const loadedFonts = new Set();
        function ensureFontLoaded(family, importUrl = null) {
            if (!family) return;
            const cleanName = family.replace(/["']/g, '').trim();
            if (!cleanName || loadedFonts.has(cleanName)) return;

            if (importUrl) {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = importUrl;
                document.head.appendChild(link);
                loadedFonts.add(cleanName);
            } else {
                const isGoogle = (window.OverlayFonts && window.OverlayFonts.google && window.OverlayFonts.google.includes(cleanName)) ||
                    cleanName === 'Jersey 20' || cleanName.includes(' ') || !['Arial', 'Helvetica', 'Georgia', 'Impact', 'Courier New', 'Trebuchet MS', 'sans-serif', 'serif', 'monospace'].includes(cleanName);

                if (isGoogle) {
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(cleanName).replace(/%20/g, '+')}:wght@300;400;500;600;700;800;900&display=swap`;
                    document.head.appendChild(link);
                    loadedFonts.add(cleanName);
                }
            }

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => renderInitialState()).catch(() => {});
            }
        }

        // Curated Color Themes
        const THEMES = {
            system: { id: 'system', accent: '', indicator: '', gradient: '', glow: '', slices: [] },
            purple: {
                accent: '#a855f7', indicator: '#ec4899',
                gradient: 'linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #f97316 100%)',
                glow: 'rgba(168, 85, 247, 0.4)',
                slices: ['#a855f7', '#ec4899', '#f97316', '#eab308', '#10b981', '#06b6d4', '#3b82f6', '#6366f1', '#d946ef']
            },
            rainbow: {
                accent: '#ef4444', indicator: '#fbbf24',
                gradient: 'linear-gradient(135deg, #ef4444 0%, #f97316 20%, #f59e0b 40%, #10b981 60%, #3b82f6 80%, #8b5cf6 100%)',
                glow: 'rgba(239, 68, 68, 0.4)',
                slices: ['#ef4444', '#f97316', '#f59e0b', '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899']
            },
            cyberpunk: {
                accent: '#00f0ff', indicator: '#ff007f',
                gradient: 'linear-gradient(135deg, #00f0ff 0%, #ff007f 100%)',
                glow: 'rgba(0, 240, 255, 0.45)',
                slices: ['#00f0ff', '#ff007f', '#ffe600', '#7928ca', '#00ff66', '#ff003c']
            },
            gold: {
                accent: '#fbbf24', indicator: '#fbbf24',
                gradient: 'linear-gradient(135deg, #fbbf24 0%, #d97706 100%)',
                glow: 'rgba(251, 191, 36, 0.4)',
                slices: ['#fbbf24', '#d97706', '#b45309', '#f59e0b', '#fef3c7', '#78350f', '#eab308']
            },
            fire: {
                accent: '#ef4444', indicator: '#f59e0b',
                gradient: 'linear-gradient(135deg, #ef4444 0%, #f97316 50%, #fbbf24 100%)',
                glow: 'rgba(239, 68, 68, 0.45)',
                slices: ['#ef4444', '#dc2626', '#b91c1c', '#f97316', '#ea580c', '#f59e0b']
            },
            midnight: {
                accent: '#8b5cf6', indicator: '#38bdf8',
                gradient: 'linear-gradient(135deg, #8b5cf6 0%, #3b82f6 50%, #06b6d4 100%)',
                glow: 'rgba(139, 92, 246, 0.4)',
                slices: ['#8b5cf6', '#6366f1', '#3b82f6', '#0ea5e9', '#06b6d4', '#14b8a6']
            },
            matrix: {
                accent: '#10b981', indicator: '#34d399',
                gradient: 'linear-gradient(135deg, #10b981 0%, #059669 100%)',
                glow: 'rgba(16, 185, 129, 0.4)',
                slices: ['#10b981', '#059669', '#047857', '#34d399', '#065f46', '#6ee7b7']
            }
        };

        let currentTheme = 'system';
        let currentThemeSlices = null;

        function applyBackgroundStyle(bgVal) {
            const root = $('display-stage');
            if (!root) return;
            const accent = root.style.getPropertyValue('--stage-accent') || '#8b5cf6';
            const val = (bgVal || '').trim();

            if (!val || val === 'glass') {
                root.style.setProperty('--overlay-bg', 'rgba(15, 23, 42, 0.85)');
                root.style.background = 'var(--overlay-bg)';
                root.style.backdropFilter = 'blur(14px)';
                root.style.webkitBackdropFilter = 'blur(14px)';
                root.style.border = `2px solid color-mix(in srgb, ${accent} 60%, rgba(255,255,255,0.2))`;
                root.style.boxShadow = '0 16px 50px rgba(0,0,0,0.6)';
            } else if (val === 'dark') {
                root.style.setProperty('--overlay-bg', '#0d1117');
                root.style.background = '#0d1117';
                root.style.backdropFilter = 'none';
                root.style.webkitBackdropFilter = 'none';
                root.style.border = `2px solid color-mix(in srgb, ${accent} 60%, #30363d)`;
                root.style.boxShadow = '0 12px 40px rgba(0,0,0,0.7)';
            } else if (val === 'transparent') {
                root.style.setProperty('--overlay-bg', 'transparent');
                root.style.background = 'transparent';
                root.style.backdropFilter = 'none';
                root.style.webkitBackdropFilter = 'none';
                root.style.border = '2px solid transparent';
                root.style.boxShadow = 'none';
            } else {
                root.style.setProperty('--overlay-bg', val);
                root.style.background = val;
                root.style.backdropFilter = 'blur(12px)';
                root.style.webkitBackdropFilter = 'blur(12px)';
                root.style.border = `2px solid color-mix(in srgb, ${accent} 60%, rgba(255,255,255,0.2))`;
                root.style.boxShadow = '0 16px 50px rgba(0,0,0,0.6)';
            }
        }

        async function loadOverlayTheme() {
            try {
                const res = await fetch('/api/config').then(r => r.json());
                if (res && res.theme) savedOverlayConfigTheme = res.theme;
            } catch {}
            applyTheme(params.get('theme') || 'system');
        }

        function applyTheme(themeKey, bgOverride) {
            currentTheme = themeKey || 'system';
            const root = $('display-stage');
            if (!root) return;

            const t = savedOverlayConfigTheme || {};
            let accent, indicator, gradient, glow, slices;
            let text, font, weight, bg, outline, fontImport;

            if (currentTheme !== 'system' && currentTheme !== 'custom' && THEMES[currentTheme]) {
                const preset = THEMES[currentTheme];
                accent = preset.accent;
                indicator = preset.indicator;
                gradient = preset.gradient;
                glow = preset.glow;
                slices = [...preset.slices];
                text = params.get('text') || '#ffffff';
                font = params.get('font') || '';
                weight = params.get('weight') || '600';
                bg = bgOverride || params.get('bg') || 'glass';
                outline = params.get('outline') || '';
            } else if (currentTheme === 'system') {
                accent = params.get('accent') || t.accent_color || '#8b5cf6';
                indicator = `color-mix(in srgb, ${accent} 85%, #fff)`;
                gradient = `linear-gradient(135deg, ${accent} 0%, color-mix(in srgb, ${accent} 70%, #ec4899) 50%, color-mix(in srgb, ${accent} 50%, #f97316) 100%)`;
                glow = `color-mix(in srgb, ${accent} 40%, transparent)`;
                slices = [accent, '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#06b6d4', '#f43f5e', '#eab308'];
                text = params.get('text') || t.text_color || '#ffffff';
                font = params.get('font') || t.font_family || '';
                weight = params.get('weight') || t.font_weight || '600';
                bg = bgOverride || params.get('bg') || (t.background_color && t.background_color !== 'transparent' ? t.background_color : 'glass');
                outline = params.get('outline') || (t.text_outline === false ? 'none' : t.text_outline_color) || '';
                fontImport = t.font_import;
            } else {
                accent = params.get('accent') || t.accent_color || '#8b5cf6';
                indicator = `color-mix(in srgb, ${accent} 85%, #fff)`;
                gradient = `linear-gradient(135deg, ${accent} 0%, color-mix(in srgb, ${accent} 70%, #ec4899) 50%, color-mix(in srgb, ${accent} 50%, #f97316) 100%)`;
                glow = `color-mix(in srgb, ${accent} 40%, transparent)`;
                slices = [accent, '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#06b6d4', '#f43f5e', '#eab308'];
                text = params.get('text') || t.text_color || '#ffffff';
                font = params.get('font') || t.font_family || '';
                weight = params.get('weight') || t.font_weight || '600';
                bg = bgOverride || params.get('bg') || t.background_color || 'glass';
                outline = params.get('outline') || (t.text_outline === false ? 'none' : t.text_outline_color) || '';
            }

            currentThemeSlices = slices;
            ensureFontLoaded(font, fontImport);

            root.style.setProperty('--stage-accent', accent);
            root.style.setProperty('--stage-indicator', indicator);
            root.style.setProperty('--stage-gradient', gradient);
            root.style.setProperty('--stage-glow', glow);
            root.style.setProperty('--stage-font', font ? `"${font}", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif` : '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif');
            root.style.setProperty('--stage-weight', weight || '600');
            root.style.setProperty('--stage-text', text || '#ffffff');
            root.style.setProperty('--stage-outline', (outline && outline !== 'none') ? outline : '');
            root.style.setProperty('--stage-outline-shadow', (outline && outline !== 'none' && outline !== 'transparent')
                ? `-1px -1px 0 ${outline}, 1px -1px 0 ${outline}, -1px 1px 0 ${outline}, 1px 1px 0 ${outline}, 0 2px 8px rgba(0,0,0,0.6)`
                : '0 2px 8px rgba(0,0,0,0.4)');

            if (font) root.style.fontFamily = `"${font}", -apple-system, system-ui, sans-serif`;
            if (weight) root.style.fontWeight = weight;
            if (text) root.style.color = text;
            applyBackgroundStyle(bg);

            const overlayBtn = $('overlay-spin-btn');
            if (overlayBtn) {
                overlayBtn.style.background = gradient;
                overlayBtn.style.boxShadow = `0 4px 20px ${glow}`;
            }
            const winnerHeader = $('winner-header-text');
            if (winnerHeader) winnerHeader.style.color = indicator;

            renderInitialState();
        }

        // On-Overlay Spin Button
        const overlayBtnEl = $('overlay-spin-btn');
        if (overlayBtnEl) {
            overlayBtnEl.style.display = showOverlayButton ? 'inline-flex' : 'none';
            overlayBtnEl.onclick = async () => {
                if (!isSpinning) {
                    updateButtonLabel();
                    try {
                        const res = await fetch('/api/randomizer/spin', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                preset: currentPresetId,
                                choices,
                                mode: currentMode,
                                suspense: currentSuspense,
                                theme: currentTheme,
                                autohide: params.get('autohide') !== null ? Number(params.get('autohide')) : 8
                            })
                        }).then(r => r.json());
                        if (!res || !res.ok) runSpin();
                    } catch {
                        runSpin();
                    }
                }
            };
            overlayBtnEl.onpointerenter = () => {
                if (!isSpinning) updateButtonLabel();
            };
        }

        function updateButtonLabel() {
            let label = 'Let Chaos Reign!';
            const presetVal = params.get('btnPreset') || currentBtnPresetId || 'chaos';

            if (presetVal === 'static') {
                label = params.get('btnText') || 'Spin Now!';
            } else if (activeButtonPhrases && activeButtonPhrases.length) {
                label = activeButtonPhrases[Math.floor(Math.random() * activeButtonPhrases.length)];
            }

            if ($('overlay-spin-btn-text')) $('overlay-spin-btn-text').textContent = label;
            return label;
        }

        idleButtonTimer = setInterval(() => {
            if (!isSpinning && currentBtnPresetId !== 'static' && showOverlayButton) {
                updateButtonLabel();
            }
        }, 6000);

        // Visual Renderers
        function renderInitialState() {
            $('winner-box').style.display = 'none';

            if (currentMode === 'roller') {
                $('wheel-view').style.display = 'none';
                $('roller-view').style.display = 'block';
                renderIdleRoller(currentRollerIndex, choices);
            } else {
                $('roller-view').style.display = 'none';
                $('wheel-view').style.display = 'flex';
                drawWheel(0, choices);
            }
        }

        function renderIdleRoller(centerIdx, list) {
            const track = $('roller-track');
            if (!track) return;
            track.innerHTML = '';
            const n = list.length || 1;
            for (let offset = -4; offset <= 4; offset++) {
                const pos = (centerIdx + offset + n * 1000) % n;
                const div = document.createElement('div');
                div.className = 'roller-item';
                if (offset === 0) div.className = 'roller-item active-winner';
                else if (Math.abs(offset) === 1) div.className = 'roller-item secondary';
                else div.className = 'roller-item tertiary';
                div.textContent = list[pos] || '(empty)';
                track.appendChild(div);
            }
            const boxHeight = $('roller-view')?.clientHeight || 240;
            const centerOffset = (boxHeight - 56) / 2;
            track.style.transform = `translateY(${centerOffset - 4 * 56}px)`;
        }

        function drawWheel(rotationRad = 0, list) {
            const canvas = $('wheel-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const n = Math.max(1, list.length);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = cx - 14;
            const sliceRad = (Math.PI * 2) / n;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const stage = $('display-stage');
            const accent = stage?.style.getPropertyValue('--stage-accent') || '#8b5cf6';
            const colors = (currentThemeSlices && currentThemeSlices.length) ? currentThemeSlices : [
                accent, '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#06b6d4', '#f43f5e', '#eab308'
            ];

            const fontFam = stage?.style.getPropertyValue('--stage-font') || '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';
            const fontWeight = stage?.style.getPropertyValue('--stage-weight') || '700';
            const textColor = stage?.style.getPropertyValue('--stage-text') || '#ffffff';
            const textOutline = stage?.style.getPropertyValue('--stage-outline') || '';

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotationRad);

            for (let i = 0; i < n; i++) {
                const start = i * sliceRad;
                const end = start + sliceRad;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, start, end);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = '#fff';
                ctx.stroke();

                ctx.save();
                ctx.rotate(start + sliceRad / 2);
                ctx.textAlign = 'right';

                const fontSize = Math.max(12, Math.min(18, 380 / n));
                ctx.font = `${fontWeight} ${fontSize}px ${fontFam}`;

                const label = list[i] || '';
                const textX = radius - 18;
                const textY = 5;

                if (textOutline && textOutline !== 'none' && textOutline !== 'transparent') {
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = textOutline;
                    ctx.strokeText(label.slice(0, 24), textX, textY);
                }

                ctx.fillStyle = textColor;
                ctx.shadowColor = 'rgba(0,0,0,0.55)';
                ctx.shadowBlur = 4;
                ctx.fillText(label.slice(0, 24), textX, textY);
                ctx.restore();
            }

            ctx.restore();
        }

        // Spin Animation Execution
        async function runSpin({
            choices: list = choices,
            winner = null,
            winnerHeader = null,
            winnerSub = null,
            mode = (params.get('mode') || currentMode),
            suspense = (params.get('suspense') || currentSuspense),
            theme = (params.get('theme') || currentTheme),
            duration = (Number(params.get('duration')) || 6),
            autohide = null
        } = {}) {
            if (isSpinning) return;
            if (!list || !list.length) list = choices.length ? choices : DEFAULT_FALLBACK_CHOICES;
            if (!list.length) return;

            if (theme && theme !== currentTheme) {
                applyTheme(theme);
            }
            isSpinning = true;

            clearTimeout(autohideTimer);
            $('display-stage')?.classList.remove('hidden-stage');
            if ($('overlay-spin-btn')) $('overlay-spin-btn').disabled = true;
            $('winner-box').style.display = 'none';

            let winnerIdx = -1;
            if (winner) {
                winnerIdx = list.findIndex(c => c.toLowerCase() === String(winner).toLowerCase());
            }
            if (winnerIdx === -1) {
                winnerIdx = Math.floor(Math.random() * list.length);
                winner = list[winnerIdx];
            }

            const totalDurationMs = Math.max(3000, duration * 1000);
            const isTricky = (suspense === 'tricky') && list.length > 2;

            if (mode === 'roller') {
                $('wheel-view').style.display = 'none';
                $('roller-view').style.display = 'block';
                const rollerBox = $('roller-view');
                const track = $('roller-track');
                rollerBox.classList.remove('tricky-suspense');

                const startIdx = currentRollerIndex;
                let nudgeSteps = 0;
                let targetIdxInList = winnerIdx;

                if (isTricky) {
                    nudgeSteps = Math.floor(Math.random() * 2) + 1;
                    targetIdxInList = (winnerIdx - nudgeSteps + list.length * 1000) % list.length;
                }

                const minRollItems = Math.max(32, Math.floor(totalDurationMs / 105));
                const diff = (targetIdxInList - (startIdx % list.length) + list.length) % list.length;
                const cycles = Math.ceil((minRollItems - diff) / list.length);
                let finalStepCount = cycles * list.length + diff;
                if (finalStepCount < minRollItems) finalStepCount += list.length;

                track.innerHTML = '';
                const totalItemsToRender = finalStepCount + nudgeSteps + 5;
                for (let i = 0; i < totalItemsToRender; i++) {
                    const itemText = list[(startIdx + i) % list.length];
                    const div = document.createElement('div');
                    div.className = 'roller-item';
                    if (i === 0) div.className = 'roller-item active-winner';
                    div.textContent = itemText;
                    track.appendChild(div);
                }

                const boxHeight = rollerBox.clientHeight || 240;
                const centerOffset = (boxHeight - 56) / 2;
                track.style.transform = `translateY(${centerOffset}px)`;
                const totalDistance = finalStepCount * 56;
                const startAt = performance.now();
                let lastTickIdx = 0;

                function stepRoll(now) {
                    const elapsed = now - startAt;
                    const progress = Math.min(1, elapsed / totalDurationMs);
                    const ease = 1 - Math.pow(1 - progress, 3.8);
                    const currentTranslate = centerOffset - ease * totalDistance;
                    track.style.transform = `translateY(${currentTranslate.toFixed(1)}px)`;

                    const currentItem = Math.round((centerOffset - currentTranslate) / 56);
                    if (currentItem !== lastTickIdx && currentItem >= 0 && currentItem < track.children.length) {
                        lastTickIdx = currentItem;
                        AudioFX.tick(Math.max(0.35, 1 - progress * 0.65));

                        for (let offset = -2; offset <= 2; offset++) {
                            const node = track.children[currentItem + offset];
                            if (node) {
                                if (offset === 0) node.className = 'roller-item active-winner';
                                else if (Math.abs(offset) === 1) node.className = 'roller-item secondary';
                                else node.className = 'roller-item tertiary';
                            }
                        }
                    }

                    if (progress < 1) {
                        requestAnimationFrame(stepRoll);
                    } else {
                        track.style.transform = `translateY(${centerOffset - totalDistance}px)`;
                        currentRollerIndex = targetIdxInList;

                        if (isTricky) {
                            rollerBox.classList.add('tricky-suspense');
                            setTimeout(() => {
                                let nudgeDone = 0;
                                function doNudge() {
                                    if (nudgeDone < nudgeSteps) {
                                        nudgeDone++;
                                        const fromY = centerOffset - (finalStepCount + nudgeDone - 1) * 56;
                                        const toY = centerOffset - (finalStepCount + nudgeDone) * 56;
                                        const nStart = performance.now();
                                        const nDuration = 220;
                                        AudioFX.tick(0.45);

                                        function animNudge(nNow) {
                                            const np = Math.min(1, (nNow - nStart) / nDuration);
                                            const ne = 1 - Math.pow(1 - np, 2.5);
                                            const curY = fromY + (toY - fromY) * ne;
                                            track.style.transform = `translateY(${curY.toFixed(1)}px)`;

                                            if (np < 1) {
                                                requestAnimationFrame(animNudge);
                                            } else {
                                                track.style.transform = `translateY(${toY}px)`;
                                                const curItem = finalStepCount + nudgeDone;
                                                track.children[curItem - 1]?.classList.remove('active-winner');
                                                track.children[curItem]?.classList.add('active-winner');

                                                if (nudgeDone < nudgeSteps) {
                                                    setTimeout(doNudge, 180);
                                                } else {
                                                    rollerBox.classList.remove('tricky-suspense');
                                                    currentRollerIndex = winnerIdx;
                                                    finishSpin(winner, winnerHeader, winnerSub, autohide);
                                                }
                                            }
                                        }
                                        requestAnimationFrame(animNudge);
                                    }
                                }
                                doNudge();
                            }, 650);
                        } else {
                            currentRollerIndex = winnerIdx;
                            finishSpin(winner, winnerHeader, winnerSub, autohide);
                        }
                    }
                }
                requestAnimationFrame(stepRoll);

            } else {
                $('roller-view').style.display = 'none';
                $('wheel-view').style.display = 'flex';

                const n = list.length;
                const sliceRad = (Math.PI * 2) / n;
                let targetIdxInList = winnerIdx;
                let nudgeSteps = 0;

                if (isTricky) {
                    nudgeSteps = Math.floor(Math.random() * 2) + 1;
                    targetIdxInList = (winnerIdx - nudgeSteps + list.length * 1000) % list.length;
                }

                const targetSliceCenter = targetIdxInList * sliceRad + sliceRad / 2;
                const normalizedTarget = (Math.PI * 1.5 - targetSliceCenter) % (Math.PI * 2);
                const positiveTarget = (normalizedTarget + Math.PI * 2) % (Math.PI * 2);
                const extraRotations = 6 * Math.PI * 2;
                const totalRotation = extraRotations + positiveTarget;

                const startAt = performance.now();
                let lastSliceIdx = -1;

                function stepWheel(now) {
                    const elapsed = now - startAt;
                    const progress = Math.min(1, elapsed / totalDurationMs);
                    const ease = 1 - Math.pow(1 - progress, 3.8);
                    const currentRot = ease * totalRotation;

                    drawWheel(currentRot, list);

                    const slicePassed = Math.floor((currentRot / sliceRad));
                    if (slicePassed !== lastSliceIdx) {
                        lastSliceIdx = slicePassed;
                        AudioFX.tick(Math.max(0.35, 1 - progress * 0.65));
                        const ptr = $('wheel-pointer');
                        if (ptr) {
                            ptr.style.transform = `translateX(-50%) rotate(${Math.sin(currentRot * 10) * 16}deg)`;
                            setTimeout(() => { ptr.style.transform = 'translateX(-50%) rotate(0deg)'; }, 40);
                        }
                    }

                    if (progress < 1) {
                        requestAnimationFrame(stepWheel);
                    } else {
                        drawWheel(totalRotation, list);

                        if (isTricky) {
                            setTimeout(() => {
                                let curNudge = 0;
                                function doWheelNudge() {
                                    if (curNudge < nudgeSteps) {
                                        curNudge++;
                                        const nudgeRot = totalRotation + curNudge * sliceRad;
                                        drawWheel(nudgeRot, list);
                                        AudioFX.tick(0.45);
                                        const ptr = $('wheel-pointer');
                                        if (ptr) {
                                            ptr.style.transform = 'translateX(-50%) rotate(18deg)';
                                            setTimeout(() => { ptr.style.transform = 'translateX(-50%) rotate(0deg)'; }, 60);
                                        }
                                        if (curNudge < nudgeSteps) {
                                            setTimeout(doWheelNudge, 220);
                                        } else {
                                            finishSpin(winner, winnerHeader, winnerSub, autohide);
                                        }
                                    }
                                }
                                doWheelNudge();
                            }, 650);
                        } else {
                            finishSpin(winner, winnerHeader, winnerSub, autohide);
                        }
                    }
                }
                requestAnimationFrame(stepWheel);
            }
        }

        function finishSpin(winner, customHeader = null, customSub = null, autohideSec = null) {
            isSpinning = false;
            if ($('overlay-spin-btn')) $('overlay-spin-btn').disabled = false;
            
            let headerText = customHeader || params.get('winHeader') || 'THE UNIVERSE HAS DECIDED';

            let subText = customSub;
            if (!subText) {
                subText = params.get('winSub');
                if (!subText && activeQuotesPool && activeQuotesPool.length) {
                    subText = activeQuotesPool[Math.floor(Math.random() * activeQuotesPool.length)];
                }
                if (!subText) {
                    subText = 'The timeline has shifted. Fate is sealed.';
                }
            }

            $('winner-box').style.display = 'block';
            const headerEl = $('winner-header-text');
            if (headerEl) headerEl.textContent = headerText;
            $('winner-text').textContent = winner;
            $('winner-sub').textContent = subText;

            AudioFX.fanfare();
            Confetti.burst();

            const dismissSec = autohideSec !== null && autohideSec !== undefined ? Number(autohideSec) : Number(params.get('autohide') !== null ? params.get('autohide') : 8);
            if (dismissSec > 0) {
                autohideTimer = setTimeout(() => {
                    $('display-stage')?.classList.add('hidden-stage');
                }, dismissSec * 1000);
            }
        }

        // Scale parameter support
        const scaleParam = parseFloat(params.get('scale'));
        if (!isNaN(scaleParam) && scaleParam > 0) {
            $('display-stage')?.style.setProperty('--stage-scale', scaleParam);
        }

        // Initial Data Fetch
        if (params.get('theme')) {
            applyTheme(params.get('theme'));
        } else {
            loadOverlayTheme();
        }

        if (params.get('choices')) {
            choices = params.get('choices').split(/[,\n]/).map(s => s.trim()).filter(Boolean);
            renderInitialState();
        }

        if (currentPresetId === 'chatters') {
            fetch('/api/randomizer/chatters').then(r => r.json()).then(res => {
                if (res.chatters && Array.isArray(res.chatters) && res.chatters.length) {
                    if (!params.get('choices')) {
                        choices = res.chatters;
                    }
                    renderInitialState();
                }
            }).catch(() => {});
        } else {
            fetch('/api/randomizer/presets').then(r => r.json()).then(res => {
                if (res.presets && Array.isArray(res.presets) && res.presets.length) {
                    const matched = res.presets.find(p => p.id === currentPresetId) || res.presets[0];
                    if (matched && matched.choices && matched.choices.length) {
                        if (!params.get('choices')) {
                            choices = matched.choices;
                        }
                        renderInitialState();
                    }
                }
            }).catch(() => {});
        }

        fetch('/api/randomizer/quote-presets').then(r => r.json()).then(res => {
            if (res.presets && Array.isArray(res.presets)) {
                const matched = res.presets.find(p => p.id === currentQuotePresetId) || res.presets[0];
                if (matched && matched.quotes) activeQuotesPool = matched.quotes;
            }
        }).catch(() => {});

        fetch('/api/randomizer/button-presets').then(r => r.json()).then(res => {
            if (res.presets && Array.isArray(res.presets)) {
                const matched = res.presets.find(p => p.id === currentBtnPresetId) || res.presets[0];
                if (matched && matched.phrases) {
                    activeButtonPhrases = matched.phrases;
                    updateButtonLabel();
                }
            }
        }).catch(() => {});

        renderInitialState();

        // Real-Time WebSocket Listener (Syncs live spins from Studio and Companion)
        function connectWs() {
            try {
                const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const ws = new WebSocket(`${proto}//${location.host}`);
                ws.onmessage = event => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'randomizer-spin' && msg.data) {
                            const d = msg.data;
                            AudioFX.init();
                            clearTimeout(autohideTimer);
                            $('display-stage')?.classList.remove('hidden-stage');

                            if (d.theme) applyTheme(d.theme);
                            if (d.bg) applyBackgroundStyle(d.bg);
                            if (d.scale) $('display-stage')?.style.setProperty('--stage-scale', d.scale);
                            if (d.accent) $('display-stage')?.style.setProperty('--stage-accent', d.accent);
                            if (d.font) {
                                ensureFontLoaded(d.font);
                                $('display-stage')?.style.setProperty('--stage-font', `"${d.font}", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif`);
                            }
                            if (d.weight) $('display-stage')?.style.setProperty('--stage-weight', d.weight);
                            if (d.text) $('display-stage')?.style.setProperty('--stage-text', d.text);
                            if (d.outline) {
                                $('display-stage')?.style.setProperty('--stage-outline', d.outline === 'none' ? '' : d.outline);
                                $('display-stage')?.style.setProperty('--stage-outline-shadow', (d.outline && d.outline !== 'none')
                                    ? `-1px -1px 0 ${d.outline}, 1px -1px 0 ${d.outline}, -1px 1px 0 ${d.outline}, 1px 1px 0 ${d.outline}, 0 2px 8px rgba(0,0,0,0.6)`
                                    : '0 2px 8px rgba(0,0,0,0.4)');
                            }
                            if (Array.isArray(d.buttonPhrases) && d.buttonPhrases.length) {
                                activeButtonPhrases = d.buttonPhrases;
                                updateButtonLabel();
                            }
                            const spinChoices = (Array.isArray(d.choices) && d.choices.length) ? d.choices : (choices.length ? choices : DEFAULT_FALLBACK_CHOICES);
                            runSpin({
                                choices: spinChoices,
                                winner: d.winner,
                                winnerHeader: d.winnerHeader,
                                winnerSub: d.winnerSub,
                                mode: d.mode || currentMode,
                                suspense: d.suspense || currentSuspense,
                                theme: d.theme || currentTheme,
                                duration: d.duration || 6,
                                autohide: d.autohide
                            });
                        }
                    } catch {}
                };
                ws.onclose = () => setTimeout(connectWs, 3000);
            } catch {
                setTimeout(connectWs, 5000);
            }
        }
        connectWs();
    </script>

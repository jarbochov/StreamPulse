<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse Trivia Overlay</title>
    <script src="/js/overlay-theme.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --font-scale: 1;
            --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --card-bg: rgba(13, 17, 23, 0.94);
            --card-border: rgba(56, 189, 248, 0.35);
            --card-blur: 12px;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
            --accent-color: #3b82f6;
            --correct-color: #22c55e;
            --correct-bg: color-mix(in srgb, var(--correct-color) 16%, var(--choice-bg));
            --correct-glow: 0 0 20px color-mix(in srgb, var(--correct-color) 45%, transparent);
            --incorrect-color: #ef4444;
            --incorrect-opacity: 0.38;
            --choice-bg: rgba(22, 27, 34, 0.88);
            --choice-border: rgba(255, 255, 255, 0.12);
            --choice-border-width: 1.5px;
            --choice-radius: calc(var(--card-radius) - 4px);
            --choice-blur: 8px;
            --choice-font: inherit;
            --choice-color: var(--text-color);
            --choice-weight: 600;
            --choice-shadow: none;
            --timer-color: #38bdf8;
            --timer-warning-color: #f59e0b;
            --timer-critical-color: #ef4444;
            --hint-color: #94a3b8;
            --category-font: inherit;
            --category-color: #a855f7;
            --category-weight: 700;
            --category-transform: uppercase;
            --header-font: inherit;
            --header-color: var(--text-color);
            --header-weight: 700;
            --header-transform: none;
            --header-shadow: none;
            --question-font: inherit;
            --question-color: var(--text-color);
            --question-weight: 700;
            --question-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
            --funfact-font: inherit;
            --funfact-weight: 500;
            --funfact-color: #eab308;
            --funfact-bg: color-mix(in srgb, var(--funfact-color) 12%, rgba(0, 0, 0, 0.4));
            --funfact-shadow: none;
            --phase-font: inherit;
            --phase-weight: 800;
            --phase-transform: uppercase;
            --phase-question-color: var(--accent-color, #38bdf8);
            --phase-answer-color: var(--correct-color, #22c55e);
            --header-font-size: 0.95rem;
            --phase-font-size: var(--header-font-size, 0.95rem);
            --category-font-size: 0.85rem;
            --counter-font-size: 0.85rem;
            --card-radius: 16px;
        }

        /* Responsive base root scaling clamp from 720p to 4K */
        html {
            font-size: calc(clamp(12px, calc(100vw / 100), 28px) * var(--font-scale, 1));
            background: transparent;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-family);
            color: var(--text-color);
            background: transparent;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Theme Presets ───────────────────────────────────────── */
        body[data-theme="modern"] {
            --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --card-bg: rgba(13, 17, 23, 0.94);
            --card-border: rgba(56, 189, 248, 0.35);
            --accent-color: #3b82f6;
            --category-color: #a855f7;
            --timer-color: #38bdf8;
            --correct-color: #22c55e;
            --correct-bg: rgba(34, 197, 94, 0.16);
        }

        body[data-theme="neon"] {
            --font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --question-font: 'Orbitron', sans-serif;
            --choice-font: 'Orbitron', sans-serif;
            --header-font: 'Orbitron', sans-serif;
            --category-font: 'Orbitron', sans-serif;
            --card-bg: rgba(10, 10, 20, 0.96);
            --card-border: rgba(236, 72, 153, 0.6);
            --accent-color: #ec4899;
            --category-color: #06b6d4;
            --timer-color: #ec4899;
            --correct-color: #10b981;
            --correct-bg: rgba(16, 185, 129, 0.2);
        }

        body[data-theme="neon"] .trivia-card {
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.35), inset 0 0 20px rgba(6, 182, 212, 0.15) !important;
        }

        body[data-theme="neon"] .question-title {
            letter-spacing: 0.03em !important;
            text-shadow: 0 0 12px rgba(236, 72, 153, 0.6) !important;
        }

        body[data-theme="retro"] {
            --font-family: 'Righteous', 'Montserrat', cursive, sans-serif;
            --question-font: 'Righteous', sans-serif;
            --choice-font: 'Righteous', sans-serif;
            --header-font: 'Righteous', sans-serif;
            --category-font: 'Righteous', sans-serif;
            --card-bg: rgba(24, 18, 43, 0.96);
            --card-border: rgba(147, 51, 234, 0.6);
            --accent-color: #9333ea;
            --category-color: #eab308;
            --timer-color: #f97316;
            --correct-color: #10b981;
        }

        body[data-theme="retro"] .question-title {
            letter-spacing: 0.02em !important;
            text-shadow: 0 0 15px rgba(147, 51, 234, 0.7) !important;
        }

        body[data-theme="clean"], body[data-theme="minimal"] {
            --font-family: 'Roboto', 'Inter', system-ui, sans-serif;
            --question-font: 'Roboto', 'Inter', sans-serif;
            --choice-font: 'Roboto', 'Inter', sans-serif;
            --header-font: 'Roboto', 'Inter', sans-serif;
            --category-font: 'Roboto', 'Inter', sans-serif;
            --card-bg: #111827;
            --card-border: rgba(255, 255, 255, 0.14);
            --card-radius: 8px;
            --choice-bg: rgba(31, 41, 55, 0.9);
            --choice-border: rgba(255, 255, 255, 0.08);
            --choice-border-width: 1px;
            --choice-radius: 6px;
            --accent-color: #38bdf8;
            --category-color: #94a3b8;
            --timer-color: #38bdf8;
            --correct-color: #22c55e;
            --correct-bg: rgba(34, 197, 94, 0.2);
            --correct-glow: none;
        }

        body[data-theme="clean"] .trivia-card, body[data-theme="minimal"] .trivia-card {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5) !important;
            backdrop-filter: none !important;
        }

        /* ── Retro 8-Bit Arcade ─────────────────────────────────── */
        body[data-theme="arcade"] {
            --font-family: 'Press Start 2P', monospace;
            --question-font: 'Press Start 2P', monospace;
            --choice-font: 'Press Start 2P', monospace;
            --header-font: 'Press Start 2P', monospace;
            --category-font: 'Press Start 2P', monospace;
            --card-bg: #050508;
            --card-border: #facc15;
            --card-radius: 0px;
            --choice-bg: #111116;
            --choice-border: #38bdf8;
            --choice-border-width: 3px;
            --choice-radius: 0px;
            --accent-color: #facc15;
            --category-color: #f43f5e;
            --timer-color: #facc15;
            --correct-color: #4ade80;
            --correct-bg: #14351f;
            --correct-glow: 0 0 20px #4ade80;
        }

        body[data-theme="arcade"] .trivia-card {
            border: 4px solid var(--card-border) !important;
            box-shadow: 0 0 24px rgba(250, 204, 21, 0.4), inset 0 0 12px rgba(250, 204, 21, 0.15) !important;
            border-radius: 0px !important;
        }

        body[data-theme="arcade"] .choice-card {
            border: 3px solid var(--choice-border) !important;
            border-radius: 0px !important;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.8) !important;
        }

        body[data-theme="arcade"] .choice-letter {
            border-radius: 0px !important;
            background: var(--accent-color) !important;
            color: #000 !important;
            font-weight: 900 !important;
            border: 2px solid #fff !important;
        }

        body[data-theme="arcade"] .category-pill {
            border-radius: 0px !important;
            border-width: 2px !important;
            text-transform: uppercase !important;
        }

        body[data-theme="arcade"] .state-indicator, body[data-theme="arcade"] .state-badge {
            background: transparent !important;
            border: none !important;
            text-transform: var(--phase-transform, uppercase) !important;
        }

        body[data-theme="arcade"] .question-title {
            font-size: clamp(0.95rem, 2vw, 1.45rem) !important;
            line-height: 1.55 !important;
            letter-spacing: 0.02em !important;
        }

        body[data-theme="arcade"] .choice-text {
            font-size: clamp(0.72rem, 1.35vw, 0.95rem) !important;
            line-height: 1.5 !important;
            letter-spacing: 0.02em !important;
        }

        body[data-theme="arcade"] .timer-track {
            border-radius: 0px !important;
            height: 10px !important;
            border: 2px solid #fff !important;
            background: #000 !important;
        }

        body[data-theme="arcade"] .timer-bar {
            border-radius: 0px !important;
        }

        /* ── Championship Esports ───────────────────────────────── */
        body[data-theme="esports"] {
            --font-family: 'Rajdhani', 'Oswald', sans-serif;
            --question-font: 'Rajdhani', 'Oswald', sans-serif;
            --choice-font: 'Rajdhani', 'Oswald', sans-serif;
            --header-font: 'Rajdhani', 'Oswald', sans-serif;
            --category-font: 'Rajdhani', 'Oswald', sans-serif;
            --card-bg: linear-gradient(135deg, rgba(10, 15, 29, 0.98), rgba(15, 23, 42, 0.95));
            --card-border: #06b6d4;
            --card-radius: 0px;
            --choice-bg: rgba(15, 23, 42, 0.85);
            --choice-border: rgba(6, 182, 212, 0.4);
            --choice-border-width: 1.5px;
            --choice-radius: 0px;
            --accent-color: #06b6d4;
            --category-color: #f97316;
            --timer-color: #06b6d4;
            --correct-color: #10b981;
            --correct-bg: rgba(16, 185, 129, 0.2);
            --correct-glow: 0 0 25px rgba(16, 185, 129, 0.5);
        }

        body[data-theme="esports"] .trivia-card {
            clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px));
            border: 2px solid var(--card-border) !important;
            border-radius: 0 !important;
        }

        body[data-theme="esports"] .choice-card {
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
            border-radius: 0 !important;
        }

        body[data-theme="esports"] .question-title {
            text-transform: uppercase !important;
            font-style: italic !important;
            letter-spacing: 0.01em !important;
            font-size: clamp(1.4rem, 3.2vw, 2.3rem) !important;
            font-weight: 800 !important;
        }

        body[data-theme="esports"] .choice-text {
            font-size: clamp(1.05rem, 1.8vw, 1.35rem) !important;
            font-weight: 700 !important;
            letter-spacing: 0.02em !important;
        }

        /* ── Broadcast Floating Text (Pure Floating Text / No Card Boxes) ── */
        body[data-theme="broadcast-text"], body[data-theme="nodecg"], body[data-style="text"] {
            --font-family: 'Montserrat', 'Bebas Neue', 'Impact', sans-serif;
            --question-font: 'Montserrat', 'Bebas Neue', 'Impact', sans-serif;
            --choice-font: 'Montserrat', sans-serif;
            --header-font: 'Montserrat', sans-serif;
            --category-font: 'Montserrat', sans-serif;
            --card-bg: transparent !important;
            --card-border: transparent !important;
            --choice-bg: transparent !important;
            --choice-border: transparent !important;
            --choice-border-width: 0px !important;
            --question-shadow: 4px 4px 8px #000, 2px 2px 4px #000;
            --choice-shadow: 3px 3px 6px #000, 1px 1px 3px #000;
            --header-shadow: 4px 4px 8px #000;
            --category-color: #facc15;
            --accent-color: #38bdf8;
            --correct-color: #4ade80;
            --correct-bg: transparent !important;
            --correct-glow: none !important;
        }

        body[data-theme="broadcast-text"] #card, body[data-theme="nodecg"] #card, body[data-style="text"] #card,
        body[data-theme="broadcast-text"] .trivia-card, body[data-theme="nodecg"] .trivia-card, body[data-style="text"] .trivia-card {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            padding: 1rem 0 !important;
        }

        body[data-theme="broadcast-text"] .choice-card, body[data-theme="nodecg"] .choice-card, body[data-style="text"] .choice-card {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            padding: 0.65rem 0.5rem !important;
            border-radius: 0 !important;
            min-height: auto !important;
        }

        body[data-theme="broadcast-text"] .choice-letter, body[data-theme="nodecg"] .choice-letter, body[data-style="text"] .choice-letter {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            font-size: clamp(1.4rem, 2.8vw, 2.2rem) !important;
            font-weight: 800 !important;
            color: var(--accent-color) !important;
            min-width: 2.2rem !important;
            text-shadow: var(--choice-shadow) !important;
            align-self: center !important;
        }

        body[data-theme="broadcast-text"] .question-title, body[data-theme="nodecg"] .question-title, body[data-style="text"] .question-title {
            font-size: clamp(2rem, 4.5vw, 3.8rem) !important;
            line-height: 1.18 !important;
            text-align: center !important;
            text-shadow: var(--question-shadow) !important;
            font-weight: 800 !important;
            font-family: var(--question-font) !important;
        }

        body[data-theme="broadcast-text"] .choice-text, body[data-theme="nodecg"] .choice-text, body[data-style="text"] .choice-text {
            font-size: clamp(1.2rem, 2.5vw, 2rem) !important;
            line-height: 1.25 !important;
            text-shadow: var(--choice-shadow) !important;
            font-weight: 700 !important;
            font-family: var(--choice-font) !important;
            white-space: normal !important;
            overflow-wrap: break-word !important;
            word-break: normal !important;
        }

        body[data-theme="broadcast-text"] .choice-card.correct .choice-text, body[data-theme="nodecg"] .choice-card.correct .choice-text, body[data-style="text"] .choice-card.correct .choice-text {
            color: var(--correct-color) !important;
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.7), 3px 3px 6px #000 !important;
        }

        body[data-theme="broadcast-text"] .choice-meter, body[data-theme="nodecg"] .choice-meter, body[data-style="text"] .choice-meter {
            display: none !important;
        }

        body[data-theme="broadcast-text"] .timer-track, body[data-theme="nodecg"] .timer-track, body[data-style="text"] .timer-track {
            background: rgba(255, 255, 255, 0.2) !important;
            height: 8px !important;
            border-radius: 4px !important;
            box-shadow: 0 2px 6px #000 !important;
        }

        body[data-theme="broadcast-text"] .trivia-footer, body[data-theme="nodecg"] .trivia-footer, body[data-style="text"] .trivia-footer {
            border-top: none !important;
            text-shadow: 2px 2px 4px #000 !important;
        }

        body[data-theme="broadcast-text"] .category-pill, body[data-theme="nodecg"] .category-pill, body[data-style="text"] .category-pill {
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            text-shadow: var(--header-shadow) !important;
            font-size: 1.1rem !important;
        }

        body[data-theme="broadcast-text"] .question-counter, body[data-theme="nodecg"] .question-counter, body[data-style="text"] .question-counter {
            text-shadow: 2px 2px 4px #000 !important;
        }

        /* Staggered entrance animation for choices */
        .choices-grid .choice-card:nth-child(1) { animation: choiceFadeIn 0.5s ease backwards; animation-delay: 0.1s; }
        .choices-grid .choice-card:nth-child(2) { animation: choiceFadeIn 0.5s ease backwards; animation-delay: 0.22s; }
        .choices-grid .choice-card:nth-child(3) { animation: choiceFadeIn 0.5s ease backwards; animation-delay: 0.34s; }
        .choices-grid .choice-card:nth-child(4) { animation: choiceFadeIn 0.5s ease backwards; animation-delay: 0.46s; }
        .choices-grid .choice-card:nth-child(5) { animation: choiceFadeIn 0.5s ease backwards; animation-delay: 0.58s; }
        .choices-grid .choice-card:nth-child(6) { animation: choiceFadeIn 0.5s ease backwards; animation-delay: 0.7s; }

        @keyframes choiceFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Toggleable Elements Visibility Rules ────────────────────── */
        body.hide-category #category,
        body[data-hide-category="true"] #category {
            display: none !important;
        }

        body.hide-counter #counter,
        body[data-hide-counter="true"] #counter {
            display: none !important;
        }

        body.hide-state-badge #state-badge,
        body[data-hide-badge="true"] #state-badge,
        body.hide-phase #state-badge,
        body[data-hide-phase="true"] #state-badge {
            display: none !important;
        }

        body.hide-header .trivia-header,
        body[data-hide-header="true"] .trivia-header {
            display: none !important;
        }

        body.hide-timer #timer-track,
        body[data-hide-timer="true"] #timer-track {
            display: none !important;
        }

        body.hide-votes .total-votes-count,
        body[data-hide-votes="true"] .total-votes-count {
            display: none !important;
        }

        body.hide-percentages .choice-stats,
        body.hide-stats .choice-stats,
        body[data-hide-percentages="true"] .choice-stats,
        body[data-hide-stats="true"] .choice-stats {
            display: none !important;
        }

        body.hide-hint #chat-hint,
        body[data-hide-hint="true"] #chat-hint {
            display: none !important;
        }

        body.hide-footer .trivia-footer,
        body[data-hide-footer="true"] .trivia-footer {
            display: none !important;
        }

        body.hide-funfact #funfact-box,
        body[data-hide-funfact="true"] #funfact-box {
            display: none !important;
        }

        body.hide-letters .choice-letter,
        body[data-hide-letters="true"] .choice-letter {
            display: none !important;
        }

        /* ── Container Layouts ─────────────────────────────────────── */
        #trivia-root {
            width: 100%;
            max-width: 1100px;
            opacity: 0;
            transform: translateY(1.5rem) scale(0.98);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #trivia-root.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .trivia-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: var(--card-radius);
            padding: 1.8rem 2.2rem;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.65), 0 0 24px rgba(56, 189, 248, 0.12);
            backdrop-filter: blur(var(--card-blur, 12px));
            -webkit-backdrop-filter: blur(var(--card-blur, 12px));
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            position: relative;
            overflow: hidden;
        }

        /* ── Top Bar: Category, Centered Phase Indicator & Counter ─── */
        .trivia-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 1rem;
            font-family: var(--header-font);
            color: var(--header-color);
            font-weight: var(--header-weight);
            text-transform: var(--header-transform);
            text-shadow: var(--header-shadow);
            width: 100%;
        }

        .header-left {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-width: 0;
        }

        .header-center {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .header-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            min-width: 0;
        }

        .category-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: color-mix(in srgb, var(--category-color) 18%, transparent);
            border: 1px solid color-mix(in srgb, var(--category-color) 45%, transparent);
            color: var(--category-color);
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            font-size: var(--category-font-size, 0.85rem);
            font-family: var(--category-font);
            font-weight: var(--category-weight);
            letter-spacing: 0.05em;
            text-transform: var(--category-transform);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .category-pill svg {
            width: 1.15em;
            height: 1.15em;
            stroke-width: 2.2;
            flex-shrink: 0;
        }

        .category-pill span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .question-counter {
            font-size: var(--counter-font-size, 0.85rem);
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        .state-indicator,
        .state-badge {
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: var(--phase-font-size, 0.95rem);
            font-family: var(--phase-font, inherit);
            font-weight: var(--phase-weight, 800);
            letter-spacing: 0.14em;
            text-transform: var(--phase-transform, uppercase);
            line-height: 1;
            white-space: nowrap;
            transition: color 0.25s ease;
        }

        .state-indicator.question,
        .state-badge.question {
            color: var(--phase-question-color, var(--accent-color, #38bdf8));
        }

        .state-indicator.reveal,
        .state-badge.reveal {
            color: var(--phase-answer-color, var(--correct-color, #22c55e));
        }

        /* ── Question Text ────────────────────────────────────────── */
        .question-title {
            font-size: 1.55rem;
            font-family: var(--question-font);
            font-weight: var(--question-weight);
            color: var(--question-color);
            line-height: 1.35;
            text-shadow: var(--question-shadow);
        }

        /* ── Progress Timer Bar ───────────────────────────────────── */
        .timer-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .timer-bar {
            height: 100%;
            background: var(--timer-color);
            width: 100%;
            transform-origin: left;
            transition: width 0.1s linear, background-color 0.3s ease;
            box-shadow: 0 0 10px var(--timer-color);
        }

        .timer-bar.warning {
            background: var(--timer-warning-color);
            box-shadow: 0 0 10px var(--timer-warning-color);
        }

        .timer-bar.critical {
            background: var(--timer-critical-color);
            box-shadow: 0 0 12px var(--timer-critical-color);
        }

        /* ── Choices Dynamic Grid (2 to 6 Choices) ───────────────── */
        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.85rem;
            transition: all 0.4s ease;
        }

        .choices-grid[data-count="1"] {
            grid-template-columns: 1fr;
            max-width: 760px;
            margin: 0 auto;
        }

        .choices-grid[data-count="2"] {
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .choices-grid[data-count="2"] .choice-card {
            padding: 1.25rem 1.6rem;
            min-height: 76px;
        }

        .choices-grid[data-count="2"] .choice-text {
            font-size: clamp(1.2rem, 2.3vw, 1.65rem);
            font-weight: 700;
        }

        .choices-grid[data-count="2"] .choice-letter {
            width: 38px;
            height: 38px;
            font-size: 1.1rem;
        }

        .choices-grid[data-count="3"] {
            grid-template-columns: repeat(3, 1fr);
            gap: 0.85rem;
        }

        .choices-grid[data-count="4"] {
            grid-template-columns: 1fr 1fr;
            gap: 0.85rem;
        }

        .choices-grid[data-count="5"],
        .choices-grid[data-count="6"] {
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        /* Adaptive density when choices have long multi-sentence answers */
        .choices-grid.dense-text {
            gap: 0.65rem;
        }

        .choices-grid.dense-text .choice-card {
            padding: 0.75rem 1.05rem;
            min-height: 52px;
        }

        .choices-grid.dense-text .choice-text {
            font-size: clamp(0.88rem, 1.4vw, 1.08rem);
            line-height: 1.28;
        }

        .choice-card {
            background: var(--choice-bg);
            border: var(--choice-border-width) solid var(--choice-border);
            border-radius: var(--choice-radius);
            padding: 0.95rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            position: relative;
            overflow: hidden;
            min-height: 58px;
            box-sizing: border-box;
            backdrop-filter: blur(var(--choice-blur, 8px));
            -webkit-backdrop-filter: blur(var(--choice-blur, 8px));
            transition: opacity 0.45s ease, max-height 0.45s ease, padding 0.45s ease, margin 0.45s ease, transform 0.45s ease, border-width 0.45s ease, background 0.3s ease, border-color 0.3s ease;
        }

        /* Dynamic Vote Fill meter behind choice */
        .choice-meter {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            background: color-mix(in srgb, var(--accent-color) 20%, transparent);
            width: 0%;
            transition: width 0.35s ease;
            z-index: 0;
        }

        .choice-content {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            position: relative;
            z-index: 1;
            flex: 1;
            min-width: 0;
        }

        .choice-letter {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 800;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        /* Full text wrapping — never truncate with ellipsis in broadcast */
        .choice-text {
            font-family: var(--choice-font);
            font-size: clamp(0.96rem, 1.6vw, 1.25rem);
            font-weight: var(--choice-weight);
            color: var(--choice-color);
            text-shadow: var(--choice-shadow);
            white-space: normal;
            overflow-wrap: break-word;
            word-break: normal;
            line-height: 1.34;
            flex: 1;
            min-width: 0;
        }

        .choice-stats {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .vote-pill {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.35);
            padding: 0.2rem 0.55rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-variant-numeric: tabular-nums;
        }

        /* ── Reveal Phase States ──────────────────────────────────── */
        .trivia-card.phase-reveal .choice-card.correct {
            border-color: var(--correct-color);
            background: var(--correct-bg);
            box-shadow: var(--correct-glow);
            transform: scale(1.02);
        }

        .trivia-card.phase-reveal .choice-card.correct .choice-letter {
            background: var(--correct-color);
            color: #000;
            border-color: var(--correct-color);
        }

        .trivia-card.phase-reveal .choice-card.correct .choice-meter {
            background: color-mix(in srgb, var(--correct-color) 25%, transparent);
        }

        .trivia-card.phase-reveal .choice-card.incorrect {
            opacity: var(--incorrect-opacity);
            filter: grayscale(0.4);
            transform: scale(0.99);
        }

        /* ── Collapsed Incorrect Choices on Reveal ───── */
        .trivia-card.phase-reveal.collapse-incorrect .choice-card.incorrect {
            max-height: 0 !important;
            min-height: 0 !important;
            opacity: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            border-width: 0 !important;
            overflow: hidden !important;
            pointer-events: none !important;
            transform: scaleY(0) !important;
        }

        .trivia-card.phase-reveal.collapse-incorrect .choices-grid {
            grid-template-columns: 1fr !important;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* ── Fun Fact Card ────────────────────────────────────────── */
        .funfact-box {
            display: none;
            background: var(--funfact-bg);
            border: 1px solid color-mix(in srgb, var(--funfact-color) 35%, transparent);
            border-radius: calc(var(--card-radius) - 4px);
            padding: 0.85rem 1.15rem;
            font-size: 0.95rem;
            font-family: var(--funfact-font);
            font-weight: var(--funfact-weight, 500);
            line-height: 1.45;
            color: var(--text-color);
            box-shadow: var(--funfact-shadow);
            backdrop-filter: blur(var(--card-blur, 8px));
            -webkit-backdrop-filter: blur(var(--card-blur, 8px));
            align-items: flex-start;
            gap: 0.65rem;
            animation: slide-up 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .funfact-box.active {
            display: flex;
        }

        .funfact-icon {
            color: var(--funfact-color);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .funfact-icon svg {
            width: 18px;
            height: 18px;
        }

        .funfact-text strong {
            color: var(--funfact-color);
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            display: block;
            margin-bottom: 0.15rem;
            font-weight: 800;
        }

        .funfact-text span {
            font-family: var(--funfact-font);
            font-weight: var(--funfact-weight, 500);
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(0.5rem); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Voting Chat Instructions Footer ──────────────────────── */
        .trivia-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 0.85rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .chat-hint {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            color: var(--hint-color, var(--text-muted));
        }

        .chat-hint kbd {
            background: color-mix(in srgb, var(--hint-color, #ffffff) 10%, rgba(255, 255, 255, 0.08));
            border: 1px solid color-mix(in srgb, var(--hint-color, #ffffff) 25%, rgba(255, 255, 255, 0.18));
            border-radius: 4px;
            padding: 0.1rem 0.35rem;
            font-family: monospace;
            font-weight: 700;
            color: var(--hint-color, var(--text-color));
        }
            padding: 0.1rem 0.35rem;
            font-family: monospace;
            font-weight: 700;
            color: var(--text-color);
        }

        .total-votes-count {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* ── Compact Lower-Third Mode (?layout=compact or ?mode=compact) ── */
        body[data-layout="compact"], body[data-mode="compact"] {
            padding: 1rem;
            align-items: flex-end;
        }

        body[data-layout="compact"] #trivia-root, body[data-mode="compact"] #trivia-root {
            max-width: 100%;
        }

        body[data-layout="compact"] .trivia-card, body[data-mode="compact"] .trivia-card {
            padding: 1rem 1.4rem;
            gap: 0.75rem;
        }

        body[data-layout="compact"] .question-title, body[data-mode="compact"] .question-title {
            font-size: 1.15rem;
        }

        body[data-layout="compact"] .choices-grid, body[data-mode="compact"] .choices-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 0.6rem;
        }

        body[data-layout="compact"] .choices-grid[data-count="2"], body[data-mode="compact"] .choices-grid[data-count="2"] {
            grid-template-columns: repeat(2, 1fr);
        }

        body[data-layout="compact"] .choices-grid[data-count="3"], body[data-mode="compact"] .choices-grid[data-count="3"] {
            grid-template-columns: repeat(3, 1fr);
        }

        body[data-layout="compact"] .choices-grid[data-count="5"], body[data-mode="compact"] .choices-grid[data-count="5"] {
            grid-template-columns: repeat(5, 1fr);
        }

        body[data-layout="compact"] .choices-grid[data-count="6"], body[data-mode="compact"] .choices-grid[data-count="6"] {
            grid-template-columns: repeat(6, 1fr);
        }

        body[data-layout="compact"] .choice-card, body[data-mode="compact"] .choice-card {
            padding: 0.6rem 0.85rem;
        }

        body[data-layout="compact"] .choice-text, body[data-mode="compact"] .choice-text {
            font-size: 0.95rem;
        }

        /* ── Corner HUD Mode (?layout=hud or ?mode=hud) ───────────── */
        body[data-layout="hud"], body[data-mode="hud"] {
            padding: 1.5rem;
            align-items: flex-start;
            justify-content: flex-start;
        }

        body[data-layout="hud"] #trivia-root, body[data-mode="hud"] #trivia-root {
            max-width: 440px;
        }

        body[data-layout="hud"] .choices-grid, body[data-mode="hud"] .choices-grid {
            grid-template-columns: 1fr;
            gap: 0.5rem;
        }

        body[data-layout="hud"] .question-title, body[data-mode="hud"] .question-title {
            font-size: 1.1rem;
        }
    </style>

<body>
    <div id="trivia-root">
        <div class="trivia-card" id="card">
            <!-- Header -->
            <div class="trivia-header">
                <div class="header-left">
                    <span class="category-pill" id="category">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                        <span id="category-text">Category</span>
                    </span>
                </div>
                <div class="header-center">
                    <span class="state-indicator question" id="state-badge">Question</span>
                </div>
                <div class="header-right">
                    <span class="question-counter" id="counter">Question 1 of 5</span>
                </div>
            </div>

            <!-- Question -->
            <h1 class="question-title" id="question-text">Question loading…</h1>

            <!-- Timer Bar -->
            <div class="timer-track" id="timer-track">
                <div class="timer-bar" id="timer-bar"></div>
            </div>

            <!-- Choices Grid -->
            <div class="choices-grid" id="choices-grid">
                <!-- Dynamically populated choices A-D -->
            </div>

            <!-- Fun Fact / Explanation (revealed in reveal phase) -->
            <div class="funfact-box" id="funfact-box">
                <div class="funfact-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
                </div>
                <div class="funfact-text">
                    <strong>Did you know?</strong>
                    <span id="funfact-content"></span>
                </div>
            </div>

            <!-- Footer -->
            <div class="trivia-footer">
                <div class="chat-hint" id="chat-hint">
                    <span>Vote in chat:</span>
                    <kbd>!a</kbd> <kbd>!b</kbd> <kbd>!c</kbd> <kbd>!d</kbd>
                </div>
                <div class="total-votes-count">
                    <span id="votes-count">0</span> votes cast
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL Parameter handling & Real-time Live Preview state
        let params = new URLSearchParams(window.location.search);
        let hasThemeParam = false;
        let themeParam = '';
        let rawMode = '';
        let rawLayout = '';
        let rawView = '';
        let layout = 'full';
        let displayMode = 'auto';
        let soundParam = true;
        let showVotesParam = true;
        let showTimerParam = true;
        let showFunFactParam = true;
        let previewParam = false;
        let scaleParam = 0;

        function refreshRuntimeParams() {
            hasThemeParam = params.has('theme');
            themeParam = params.get('theme') || '';
            rawMode = (params.get('mode') || '').toLowerCase();
            rawLayout = (params.get('layout') || '').toLowerCase();
            rawView = (params.get('view') || params.get('display') || '').toLowerCase();

            layout = 'full';
            if (['compact', 'hud'].includes(rawLayout)) layout = rawLayout;
            else if (['compact', 'hud'].includes(rawMode)) layout = rawMode;

            displayMode = 'auto';
            if (['question', 'answer'].includes(rawView)) displayMode = rawView;
            else if (['question', 'answer'].includes(rawMode)) displayMode = rawMode;

            soundParam = params.get('sound') !== '0';
            showVotesParam = (params.get('showVotes') !== '0') && (params.get('votes') !== '0');
            showTimerParam = (params.get('showTimer') !== '0') && (params.get('timer') !== '0');
            showFunFactParam = (params.get('showFunFact') !== '0') && (params.get('funfact') !== '0');
            previewParam = params.get('preview') === 'true' || params.get('preview') === '1';
            scaleParam = parseFloat(params.get('scale') || params.get('fontscale') || '0');
            if (scaleParam > 0) {
                document.documentElement.style.setProperty('--font-scale', scaleParam);
            }

            document.body.dataset.theme = (hasThemeParam && themeParam) ? themeParam : (document.body.dataset.theme || 'modern');
            document.body.dataset.mode = layout;
            document.body.dataset.layout = layout;
            document.body.dataset.displayMode = displayMode;
        }

        refreshRuntimeParams();

        const SAMPLE_QUESTION = {
            id: 'sample-preview',
            category: 'Retro Gaming',
            question: 'Which legendary 1990 launch title introduced Yoshi to the gaming world?',
            choices: [
                { letter: 'A', text: 'Super Mario Bros. 3', votes: 14, percent: 18 },
                { letter: 'B', text: 'Super Mario World', votes: 52, percent: 68 },
                { letter: 'C', text: 'Yoshi’s Island', votes: 7, percent: 9 },
                { letter: 'D', text: 'Super Mario Kart', votes: 4, percent: 5 }
            ],
            correctIndex: 1,
            funfact: 'Super Mario World was created by a 16-person Nintendo team and took three years to develop.',
            totalVotes: 77
        };

        // Real-Time Preview PostMessage listener (instant zero-flicker live updates)
        window.addEventListener('message', (event) => {
            if (!event.data) return;
            if (event.data.type === 'trivia:preview-config' || event.data.type === 'trivia:preview-update') {
                if (typeof event.data.query === 'string') {
                    params = new URLSearchParams(event.data.query);
                } else if (event.data.params && typeof event.data.params === 'object') {
                    params = new URLSearchParams();
                    Object.entries(event.data.params).forEach(([k, v]) => {
                        if (v !== undefined && v !== null && v !== '') {
                            params.set(k, String(v));
                        }
                    });
                }
                refreshRuntimeParams();
                if (!currentState) {
                    currentState = {
                        status: displayMode === 'answer' ? 'reveal' : 'question',
                        currentIndex: 0,
                        totalQuestions: 5,
                        activeQuestion: SAMPLE_QUESTION
                    };
                }
                render(currentState);
            }
        });

        // Web Audio Chime Synthesizer
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        const PRESET_FONTS = {
            modern: 'Inter',
            'broadcast-text': 'Montserrat',
            nodecg: 'Montserrat',
            arcade: 'Press Start 2P',
            esports: 'Rajdhani',
            minimal: 'Roboto',
            neon: 'Orbitron',
            retro: 'Righteous'
        };

        function formatFontFamily(raw) {
            if (!raw || raw === 'inherit' || raw === 'default') return '';
            const clean = String(raw).replace(/["';\\]/g, '').trim();
            if (!clean) return '';
            return `"${clean}", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        }

        function formatCssColor(val) {
            if (!val || typeof val !== 'string') return '';
            const s = val.trim();
            if (!s) return '';
            if (s.toLowerCase() === 'transparent') return 'transparent';
            if (/^[0-9a-fA-F]{3,8}$/.test(s)) return '#' + s;
            return s;
        }

        function formatFontSize(val) {
            if (!val || val === 'inherit' || val === 'default') return '';
            const s = String(val).trim();
            if (!s) return '';
            if (/^\d+(\.\d+)?$/.test(s)) return `${s}px`;
            return s;
        }

        function applyCssVar(name, value) {
            if (value === undefined || value === null || value === '') return;
            document.documentElement.style.setProperty(name, value);
            document.body.style.setProperty(name, value);
        }

        function applyFontVar(cssVar, fontName) {
            if (!fontName) return;
            window.loadUrlFont?.(fontName);
            const formatted = formatFontFamily(fontName);
            if (formatted) {
                applyCssVar(cssVar, formatted);
            }
        }

        function playSound(type, settings = currentState?.settings || {}) {
            const enabled = params.has('sound') ? soundParam : settings.soundEnabled !== false;
            const volume = Math.max(0, Math.min(100, Number(settings.soundVolume ?? 75))) / 100;
            if (!enabled || !Number.isFinite(volume) || volume === 0) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;
                if (type === 'tick') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.04 * volume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'reveal') {
                    // Gentle major-third harmonic chime
                    [523.25, 659.25, 783.99].forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + (i * 0.08));
                        gain.gain.setValueAtTime(0.08 * volume, now + (i * 0.08));
                        gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.08) + 0.6);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + (i * 0.08));
                        osc.stop(now + (i * 0.08) + 0.6);
                    });
                }
            } catch {}
        }

        // State & DOM elements
        const rootEl = document.getElementById('trivia-root');
        const cardEl = document.getElementById('card');
        const categoryTextEl = document.getElementById('category-text');
        const counterEl = document.getElementById('counter');
        const stateBadgeEl = document.getElementById('state-badge');
        const questionTextEl = document.getElementById('question-text');
        const timerBarEl = document.getElementById('timer-bar');
        const choicesGridEl = document.getElementById('choices-grid');
        const funfactBoxEl = document.getElementById('funfact-box');
        const funfactContentEl = document.getElementById('funfact-content');
        const votesCountEl = document.getElementById('votes-count');

        let currentState = null;
        let timerRaf = null;

        function esc(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function updateTimerBar(startedAt, endsAt) {
            if (!startedAt || !endsAt) {
                timerBarEl.style.width = '100%';
                timerBarEl.className = 'timer-bar';
                return;
            }

            const total = endsAt - startedAt;
            const now = Date.now();
            const remaining = Math.max(0, endsAt - now);
            const ratio = total > 0 ? Math.min(1, Math.max(0, remaining / total)) : 0;

            timerBarEl.style.width = `${(ratio * 100).toFixed(1)}%`;

            if (ratio < 0.25) {
                timerBarEl.className = 'timer-bar critical';
            } else if (ratio < 0.5) {
                timerBarEl.className = 'timer-bar warning';
            } else {
                timerBarEl.className = 'timer-bar';
            }

            if (remaining > 0 && currentState?.status === 'question') {
                timerRaf = requestAnimationFrame(() => updateTimerBar(startedAt, endsAt));
            }
        }

        function render(data) {
            if (!data) return;
            currentState = data;

            const t = data.theme || {};

            // 1. Determine active preset & card style
            const activePreset = (hasThemeParam && themeParam) ? themeParam : (t.preset || 'modern');
            document.body.dataset.theme = activePreset;

            const styleParam = (params.get('style') || '').toLowerCase();
            const activeStyle = styleParam || t.cardStyle || ((activePreset === 'broadcast-text' || activePreset === 'nodecg') ? 'text' : 'cards');
            document.body.dataset.style = activeStyle;

            // Preload signature font for preset
            const presetFont = PRESET_FONTS[activePreset];
            if (presetFont) {
                window.loadUrlFont?.(presetFont);
            }

            // 2. Custom container styles (from service theme or URL parameters)
            const cardBgParam = params.get('cardbg') || params.get('cardBg') || params.get('bg') || params.get('glassbg');
            const cardBgVal = cardBgParam || t.cardBg;
            if (cardBgVal) applyCssVar('--card-bg', formatCssColor(cardBgVal));

            const cardBorderParam = params.get('cardborder') || params.get('cardBorder') || params.get('border');
            const cardBorderVal = cardBorderParam || t.cardBorder || t.cardBorderColor;
            if (cardBorderVal) applyCssVar('--card-border', formatCssColor(cardBorderVal));

            const choiceBgParam = params.get('choicebg') || params.get('choiceBg');
            const choiceBgVal = choiceBgParam || t.choiceBg;
            if (choiceBgVal) applyCssVar('--choice-bg', formatCssColor(choiceBgVal));

            const choiceBorderParam = params.get('choiceborder') || params.get('choiceBorder');
            const choiceBorderVal = choiceBorderParam || t.choiceBorder || t.choiceBorderColor;
            if (choiceBorderVal) applyCssVar('--choice-border', formatCssColor(choiceBorderVal));

            const blurParam = params.get('blur');
            const blurVal = blurParam !== null && blurParam !== undefined ? `${blurParam}px` : (t.cardBlur !== undefined ? `${t.cardBlur}px` : null);
            if (blurVal) {
                applyCssVar('--card-blur', blurVal);
                applyCssVar('--choice-blur', blurVal);
            }

            if (t.textColor) applyCssVar('--text-color', formatCssColor(t.textColor));
            if (t.choiceBorderWidth !== undefined) applyCssVar('--choice-border-width', `${t.choiceBorderWidth}px`);
            if (t.choiceRadius !== undefined) applyCssVar('--choice-radius', `${t.choiceRadius}px`);
            if (t.cardRadius !== undefined) applyCssVar('--card-radius', `${t.cardRadius}px`);
            if (t.timerColor) applyCssVar('--timer-color', formatCssColor(t.timerColor));
            if (t.timerWarningColor) applyCssVar('--timer-warning-color', formatCssColor(t.timerWarningColor));
            if (t.timerCriticalColor) applyCssVar('--timer-critical-color', formatCssColor(t.timerCriticalColor));

            const hintColorParam = params.get('hintcolor') || params.get('hintColor');
            const hintColorVal = hintColorParam || t.hintColor;
            if (hintColorVal) applyCssVar('--hint-color', formatCssColor(hintColorVal));

            const catColorParam = params.get('catcolor') || params.get('categoryColor');
            const catColorVal = catColorParam || t.categoryColor;
            if (catColorVal) applyCssVar('--category-color', formatCssColor(catColorVal));

            const ffColorParam = params.get('fcolor') || params.get('funfactcolor') || params.get('funfactColor');
            const ffColorVal = ffColorParam || t.funfactColor;
            if (ffColorVal) applyCssVar('--funfact-color', formatCssColor(ffColorVal));

            const ffBgParam = params.get('fbg') || params.get('funfactbg') || params.get('funfactBg');
            const ffBgVal = ffBgParam || t.funfactBg;
            if (ffBgVal) applyCssVar('--funfact-bg', formatCssColor(ffBgVal));

            if (t.incorrectOpacity !== undefined) applyCssVar('--incorrect-opacity', t.incorrectOpacity);

            // 3. Colors from URL parameters or saved theme
            const accentParam = params.get('accent') || params.get('accentColor');
            const correctParam = params.get('correct') || params.get('correctColor');
            const accentVal = accentParam || t.accentColor;
            if (accentVal) {
                const formattedAccent = formatCssColor(accentVal);
                applyCssVar('--accent-color', formattedAccent);
                applyCssVar('--accent', formattedAccent);
            }
            const correctVal = correctParam || t.correctColor;
            if (correctVal) {
                const formattedCorrect = formatCssColor(correctVal);
                applyCssVar('--correct-color', formattedCorrect);
                applyCssVar('--correct', formattedCorrect);
            }

            // 4. Granular Typography & Shadows
            const qFontParam = params.get('qfont') || params.get('questionFont');
            const hFontParam = params.get('hfont') || params.get('headerFont');
            const cFontParam = params.get('cfont') || params.get('choiceFont');
            const ffFontParam = params.get('ffont') || params.get('funfactfont') || params.get('funfactFont');
            const globalFontParam = params.get('font') || params.get('fontfamily');

            const qFont = qFontParam || t.questionFont;
            if (qFont) applyFontVar('--question-font', qFont);
            if (t.questionColor) applyCssVar('--question-color', t.questionColor);
            const qWeight = params.get('qweight') || params.get('questionWeight') || t.questionWeight;
            if (qWeight) applyCssVar('--question-weight', qWeight);
            if (t.questionShadow) applyCssVar('--question-shadow', t.questionShadow);

            const hFont = hFontParam || t.headerFont;
            if (hFont) {
                applyFontVar('--header-font', hFont);
                applyFontVar('--category-font', hFont);
            }
            if (t.headerColor) applyCssVar('--header-color', t.headerColor);
            const hWeight = params.get('hweight') || params.get('headerWeight') || t.headerWeight;
            if (hWeight) {
                applyCssVar('--header-weight', hWeight);
                applyCssVar('--category-weight', hWeight);
            }
            if (t.headerTransform) applyCssVar('--header-transform', t.headerTransform);
            if (t.headerShadow) applyCssVar('--header-shadow', t.headerShadow);

            if (t.categoryFont) applyFontVar('--category-font', t.categoryFont);
            if (t.categoryWeight) applyCssVar('--category-weight', t.categoryWeight);
            if (t.categoryTransform) applyCssVar('--category-transform', t.categoryTransform);

            const cFont = cFontParam || t.choiceFont;
            if (cFont) applyFontVar('--choice-font', cFont);
            if (t.choiceColor) applyCssVar('--choice-color', t.choiceColor);
            const cWeight = params.get('cweight') || params.get('choiceWeight') || t.choiceWeight;
            if (cWeight) applyCssVar('--choice-weight', cWeight);
            if (t.choiceShadow) applyCssVar('--choice-shadow', t.choiceShadow);

            const ffFont = ffFontParam || t.funfactFont;
            if (ffFont) applyFontVar('--funfact-font', ffFont);
            const ffWeight = params.get('fweight') || params.get('funfactweight') || params.get('funfactWeight') || t.funfactWeight;
            if (ffWeight) applyCssVar('--funfact-weight', ffWeight);
            if (t.funfactShadow) applyCssVar('--funfact-shadow', t.funfactShadow);

            // Phase indicator typography, transform & colors
            const pTransformParam = params.get('ptransform') || params.get('phaseTransform');
            const pTransformVal = pTransformParam || t.phaseTransform;
            if (pTransformVal) applyCssVar('--phase-transform', pTransformVal);

            const pFontParam = params.get('pfont') || params.get('phaseFont');
            const pFontVal = pFontParam || t.phaseFont;
            if (pFontVal) applyFontVar('--phase-font', pFontVal);

            const pWeightParam = params.get('pweight') || params.get('phaseWeight');
            const pWeightVal = pWeightParam || t.phaseWeight;
            if (pWeightVal) applyCssVar('--phase-weight', pWeightVal);

            const qColorParam = params.get('qcolor') || params.get('phaseqcolor') || params.get('phaseQuestionColor');
            const qColorVal = qColorParam || t.phaseQuestionColor;
            if (qColorVal) applyCssVar('--phase-question-color', formatCssColor(qColorVal));

            const aColorParam = params.get('acolor') || params.get('phaseacolor') || params.get('phaseAnswerColor');
            const aColorVal = aColorParam || t.phaseAnswerColor;
            if (aColorVal) applyCssVar('--phase-answer-color', formatCssColor(aColorVal));

            // Header & Phase font size
            const hSizeParam = params.get('hsize') || params.get('headersize') || params.get('headerFontSize');
            const hSizeVal = hSizeParam || t.headerFontSize || t.headerSize;
            if (hSizeVal) {
                const formattedHSize = formatFontSize(hSizeVal);
                if (formattedHSize) {
                    applyCssVar('--header-font-size', formattedHSize);
                    applyCssVar('--phase-font-size', formattedHSize);
                }
            } else {
                applyCssVar('--header-font-size', '0.95rem');
                applyCssVar('--phase-font-size', '0.95rem');
            }

            const pSizeParam = params.get('psize') || params.get('phasesize') || params.get('phaseFontSize');
            const pSizeVal = pSizeParam || t.phaseFontSize;
            if (pSizeVal) {
                const formattedPSize = formatFontSize(pSizeVal);
                if (formattedPSize) applyCssVar('--phase-font-size', formattedPSize);
            }

            // Category badge font size (strictly independent from header phase title size)
            const catSizeParam = params.get('catsize') || params.get('categorysize') || params.get('categoryFontSize');
            const catSizeVal = catSizeParam || t.categoryFontSize;
            if (catSizeVal) {
                const formattedCatSize = formatFontSize(catSizeVal);
                if (formattedCatSize) applyCssVar('--category-font-size', formattedCatSize);
            } else {
                applyCssVar('--category-font-size', '0.85rem');
            }

            // Question counter font size (independent from header phase title size)
            const counterSizeParam = params.get('countersize') || params.get('counterFontSize');
            const counterSizeVal = counterSizeParam || t.counterFontSize;
            if (counterSizeVal) {
                const formattedCounterSize = formatFontSize(counterSizeVal);
                if (formattedCounterSize) applyCssVar('--counter-font-size', formattedCounterSize);
            } else {
                applyCssVar('--counter-font-size', '0.85rem');
            }

            const globalFont = globalFontParam || t.font;
            if (globalFont) {
                applyFontVar('--font-family', globalFont);
                if (!qFont) applyFontVar('--question-font', globalFont);
                if (!hFont) {
                    applyFontVar('--header-font', globalFont);
                    applyFontVar('--category-font', globalFont);
                }
                if (!cFont) applyFontVar('--choice-font', globalFont);
            }

            // 5. Typography Scale
            const scaleVal = scaleParam > 0 ? scaleParam : parseFloat(t.fontScale || t.scale || 1.0);
            if (scaleVal > 0) {
                applyCssVar('--font-scale', scaleVal);
            }

            // 6. Collapse incorrect choices
            if (params.has('collapse')) {
                document.body.dataset.collapse = params.get('collapse') === '1' ? 'true' : 'false';
            } else if (t.collapseIncorrect !== undefined) {
                document.body.dataset.collapse = t.collapseIncorrect ? 'true' : 'false';
            }

            // 7. Element visibility toggles: URL parameters take precedence over saved theme options
            const hideCategory = params.has('category')
                ? (params.get('category') === '0' || params.get('category') === 'false')
                : (params.has('hideCategory') ? (params.get('hideCategory') === '1' || params.get('hideCategory') === 'true') : (t.showCategory === false));
            document.body.dataset.hideCategory = hideCategory ? 'true' : 'false';
            document.body.classList.toggle('hide-category', hideCategory);

            const hideCounter = (params.has('counter') || params.has('questionNumber'))
                ? (params.get('counter') === '0' || params.get('questionNumber') === '0' || params.get('counter') === 'false')
                : (params.has('hideCounter') ? (params.get('hideCounter') === '1' || params.get('hideCounter') === 'true') : (t.showQuestionNumber === false));
            document.body.dataset.hideCounter = hideCounter ? 'true' : 'false';
            document.body.classList.toggle('hide-counter', hideCounter);

            const hidePhase = (params.has('phase') || params.has('badge'))
                ? (params.get('phase') === '0' || params.get('badge') === '0' || params.get('phase') === 'false')
                : (params.has('hidePhase') || params.has('hideBadge') ? true : (t.showPhaseIndicator === false));
            document.body.dataset.hidePhase = hidePhase ? 'true' : 'false';
            document.body.dataset.hideBadge = hidePhase ? 'true' : 'false';
            document.body.classList.toggle('hide-phase', hidePhase);
            document.body.classList.toggle('hide-state-badge', hidePhase);

            const hideTimer = (params.has('timer') || params.has('showTimer'))
                ? (params.get('timer') === '0' || params.get('showTimer') === '0' || params.get('timer') === 'false')
                : (params.has('hideTimer') ? true : (t.showTimer === false));
            document.body.dataset.hideTimer = hideTimer ? 'true' : 'false';
            document.body.classList.toggle('hide-timer', hideTimer);

            const hideVotes = (params.has('votes') || params.has('showVotes'))
                ? (params.get('votes') === '0' || params.get('showVotes') === '0' || params.get('votes') === 'false')
                : (params.has('hideVotes') ? true : (t.showVoteCounts === false));
            document.body.dataset.hideVotes = hideVotes ? 'true' : 'false';
            document.body.classList.toggle('hide-votes', hideVotes);

            const hidePercentages = (params.has('percentages') || params.has('stats'))
                ? (params.get('percentages') === '0' || params.get('stats') === '0' || params.get('percentages') === 'false')
                : (params.has('hidePercentages') ? true : (t.showPercentages === false));
            document.body.dataset.hidePercentages = hidePercentages ? 'true' : 'false';
            document.body.classList.toggle('hide-percentages', hidePercentages);
            document.body.classList.toggle('hide-stats', hidePercentages);

            const hideHint = (params.has('hint') || params.has('chat'))
                ? (params.get('hint') === '0' || params.get('chat') === '0' || params.get('hint') === 'false')
                : (params.has('hideHint') ? true : (t.showChatHint === false));
            document.body.dataset.hideHint = hideHint ? 'true' : 'false';
            document.body.classList.toggle('hide-hint', hideHint);

            const hideFunFact = (params.has('funfact') || params.has('showFunFact'))
                ? (params.get('funfact') === '0' || params.get('showFunFact') === '0' || params.get('funfact') === 'false')
                : (params.has('hideFunFact') ? true : (t.showFunFact === false));
            document.body.dataset.hideFunFact = hideFunFact ? 'true' : 'false';
            document.body.classList.toggle('hide-funfact', hideFunFact);

            const hideLetters = params.has('letters')
                ? (params.get('letters') === '0' || params.get('letters') === 'false')
                : (params.has('hideLetters') ? true : (t.showLetterBadges === false));
            document.body.dataset.hideLetters = hideLetters ? 'true' : 'false';
            document.body.classList.toggle('hide-letters', hideLetters);

            const shouldCollapse = params.has('collapse')
                ? (params.get('collapse') === '1' || params.get('collapse') === 'true')
                : (t.collapseIncorrect !== undefined ? t.collapseIncorrect === true : (activePreset === 'broadcast-text' || activePreset === 'nodecg' || activeStyle === 'text'));
            document.body.dataset.collapse = shouldCollapse ? 'true' : 'false';
            document.body.classList.toggle('collapse-incorrect', shouldCollapse);

            const sampleParam = params.get('sample') === '1' || params.get('sample') === 'true';
            const isSample = sampleParam || (previewParam && (!data?.activeQuestion || data?.status === 'idle'));
            const q = isSample ? (data?.activeQuestion || SAMPLE_QUESTION) : data?.activeQuestion;

            if (!q || (!isSample && data.status === 'idle')) {
                if (!previewParam) {
                    rootEl.classList.remove('active');
                    if (timerRaf) cancelAnimationFrame(timerRaf);
                    return;
                }
            }

            rootEl.classList.add('active');

            // Category, Counter & Header Labels
            const questionLabel = params.get('qlabel') || params.get('questionLabel') || t.questionLabel || 'Question';
            const answerLabel = params.get('alabel') || params.get('answerLabel') || t.answerLabel || 'Answer';
            const counterFormat = (params.get('cformat') || params.get('counterFormat') || t.counterFormat || 'full').toLowerCase();

            categoryTextEl.textContent = q?.category || 'General';

            const currentNum = isSample ? 1 : ((data.currentIndex ?? 0) + 1);
            const totalNum = isSample ? 5 : (data.totalQuestions || 1);

            let counterText = '';
            if (counterFormat === 'compact') {
                counterText = `${currentNum} of ${totalNum}`;
            } else if (counterFormat === 'slash') {
                counterText = `${currentNum} / ${totalNum}`;
            } else if (counterFormat === 'number') {
                counterText = `Q${currentNum}`;
            } else {
                // 'full'
                counterText = `${questionLabel} ${currentNum} of ${totalNum}`;
            }
            counterEl.textContent = counterText;

            // Phase / Reveal state determined by displayMode parameter or live server state
            let isReveal = false;
            if (displayMode === 'question') {
                isReveal = false;
            } else if (displayMode === 'answer') {
                isReveal = true;
            } else {
                isReveal = (data.status === 'reveal');
            }

            // Voting capability check
            const votingParam = params.get('voting') ?? params.get('chat') ?? params.get('chatvoting');
            let isVotingOpen = false;
            if (votingParam !== null && votingParam !== undefined) {
                isVotingOpen = (votingParam === '1' || votingParam === 'true' || votingParam === 'on');
            } else {
                const chatVotingSetting = (data.settings?.chatVoting !== false);
                const chatVotingActive = (data.chatVotingActive !== false);
                const chatbotEnabled = (data.chatbotEnabled !== false || data.settings?.forceChatVoting === true);
                isVotingOpen = chatVotingSetting && chatVotingActive && chatbotEnabled;
            }

            if (isReveal) {
                stateBadgeEl.textContent = answerLabel;
                stateBadgeEl.className = 'state-indicator reveal';
                stateBadgeEl.style.display = '';
            } else {
                stateBadgeEl.textContent = questionLabel;
                stateBadgeEl.className = 'state-indicator question';
                stateBadgeEl.style.display = '';
            }
            cardEl.className = `trivia-card ${isReveal ? 'phase-reveal' : 'phase-question'} ${shouldCollapse ? 'collapse-incorrect' : ''}`;

            // Question Title
            questionTextEl.textContent = q?.question || 'Question title';

            // Timer
            if (timerRaf) cancelAnimationFrame(timerRaf);
            if (!isReveal && q?.startedAt && q?.endsAt) {
                updateTimerBar(q.startedAt, q.endsAt);
            } else {
                timerBarEl.style.width = isReveal ? '0%' : '100%';
            }

            // Choices Grid (2-6 dynamic count)
            const choices = q?.choices || [];
            const correctIdx = q?.correctIndex;
            choicesGridEl.dataset.count = choices.length;

            const maxTextLen = choices.reduce((max, c) => Math.max(max, String(c.text || '').length), 0);
            if (maxTextLen > 75) {
                choicesGridEl.classList.add('dense-text');
            } else {
                choicesGridEl.classList.remove('dense-text');
            }

            choicesGridEl.innerHTML = choices.map((c, idx) => {
                const letter = c.letter || String.fromCharCode(65 + idx);
                const isCorrect = isReveal && idx === correctIdx;
                const isIncorrect = isReveal && idx !== correctIdx;
                const statusClass = isCorrect ? 'correct' : (isIncorrect ? 'incorrect' : '');
                const percent = showVotesParam ? (c.percent || 0) : 0;
                const votes = showVotesParam ? (c.votes || 0) : 0;

                return `
                    <div class="choice-card ${statusClass}" data-index="${idx}">
                        <div class="choice-meter" style="width: ${percent}%"></div>
                        <div class="choice-content">
                            <span class="choice-letter">${esc(letter)}</span>
                            <span class="choice-text">${esc(c.text)}</span>
                        </div>
                        <div class="choice-stats">
                            <span class="vote-pill">${percent}%</span>
                        </div>
                    </div>
                `;
            }).join('');

            // Fun Fact Box
            if (isReveal && showFunFactParam && q?.funfact) {
                funfactContentEl.textContent = q.funfact;
                funfactBoxEl.classList.add('active');
            } else {
                funfactBoxEl.classList.remove('active');
            }

            // Chat hint footer for True/False and 2-6 choices
            const chatHintEl = document.getElementById('chat-hint');
            if (chatHintEl) {
                if (!isVotingOpen || hideHint || isReveal || choices.length === 0) {
                    chatHintEl.style.display = 'none';
                } else {
                    chatHintEl.style.display = 'inline-flex';
                    const isTrueFalse = q?.isTrueFalse || (choices.length === 2 && choices.every(c => /^(true|false)$/i.test(String(c.text || '').trim())));
                    if (isTrueFalse) {
                        chatHintEl.innerHTML = `<span>Vote in chat:</span> <kbd>!true</kbd> <kbd>!false</kbd> <span>or</span> <kbd>!a</kbd> <kbd>!b</kbd>`;
                    } else {
                        const kbds = choices.map((c, i) => `<kbd>!${(c.letter || String.fromCharCode(65 + i)).toLowerCase()}</kbd>`).join(' ');
                        chatHintEl.innerHTML = `<span>Vote in chat:</span> ${kbds}`;
                    }
                }
            }

            // Total Votes
            const votesWrapEl = document.querySelector('.total-votes-count');
            if (votesWrapEl) {
                votesWrapEl.style.display = (!isVotingOpen && !isReveal) ? 'none' : '';
            }
            votesCountEl.textContent = q?.totalVotes || 0;
        }

        // Real-Time Vote Update Handler (fast path without full re-render)
        function updateVotes(voteData) {
            if (!voteData || !voteData.choices) return;
            const choices = voteData.choices;
            choices.forEach((c, idx) => {
                const card = choicesGridEl.querySelector(`.choice-card[data-index="${idx}"]`);
                if (card) {
                    const meter = card.querySelector('.choice-meter');
                    const pill = card.querySelector('.vote-pill');
                    if (meter) meter.style.width = `${c.percent || 0}%`;
                    if (pill) pill.textContent = `${c.percent || 0}%`;
                }
            });
            if (voteData.totalVotes !== undefined) {
                votesCountEl.textContent = voteData.totalVotes;
            }
        }

        // Data Fetch & WebSocket synchronization
        async function fetchState() {
            try {
                const res = await fetch('/api/trivia');
                if (res.ok) {
                    const data = await res.json();
                    render(data);
                }
            } catch (err) {
                console.warn('[Trivia] Fetch error:', err);
            }
        }

        function connectWs() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${location.host}/ws`);

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'trivia:state') {
                        render(msg.data);
                    } else if (msg.type === 'trivia:start') {
                        playSound('tick', msg.data?.settings || currentState?.settings);
                        fetchState();
                    } else if (msg.type === 'trivia:reveal') {
                        playSound('reveal', msg.data?.settings || currentState?.settings);
                        fetchState();
                    } else if (msg.type === 'trivia:vote-update') {
                        updateVotes(msg.data);
                    } else if (msg.type === 'trivia:reset') {
                        fetchState();
                    }
                } catch {}
            };

            ws.onclose = () => setTimeout(connectWs, 2500);
        }

        // Preview Mode fallback if server is inactive
        if (previewParam) {
            render({
                status: displayMode === 'answer' ? 'reveal' : 'question',
                currentIndex: 0,
                totalQuestions: 5,
                theme: { preset: themeParam },
                activeQuestion: SAMPLE_QUESTION
            });
        }

        fetchState();
        connectWs();

        if (previewParam) {
            try { window.parent?.postMessage({ type: 'trivia:overlay-ready' }, '*'); } catch {}
        }
    </script>
</body>
</html>

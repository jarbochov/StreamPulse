<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse Trivia Overlay</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --card-bg: rgba(13, 17, 23, 0.94);
            --card-border: rgba(56, 189, 248, 0.35);
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
            --accent-color: #3b82f6;
            --correct-color: #22c55e;
            --incorrect-color: #ef4444;
            --choice-bg: rgba(22, 27, 34, 0.88);
            --choice-border: rgba(255, 255, 255, 0.12);
            --timer-color: #38bdf8;
            --category-color: #a855f7;
            --funfact-color: #eab308;
            --card-radius: 16px;
        }

        /* Responsive base root scaling clamp from 720p to 4K */
        html {
            font-size: clamp(12px, calc(100vw / 100), 28px);
            background: transparent;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-family);
            color: var(--text-color);
            background: transparent;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Theme Presets ───────────────────────────────────────── */
        body[data-theme="neon"] {
            --card-bg: rgba(10, 10, 20, 0.96);
            --card-border: rgba(236, 72, 153, 0.5);
            --accent-color: #ec4899;
            --category-color: #06b6d4;
            --timer-color: #ec4899;
            --correct-color: #10b981;
        }

        body[data-theme="retro"] {
            --card-bg: rgba(24, 18, 43, 0.96);
            --card-border: rgba(147, 51, 234, 0.5);
            --accent-color: #9333ea;
            --category-color: #eab308;
            --timer-color: #f97316;
            --correct-color: #10b981;
        }

        body[data-theme="clean"] {
            --card-bg: rgba(15, 23, 42, 0.95);
            --card-border: rgba(255, 255, 255, 0.15);
            --accent-color: #38bdf8;
            --category-color: #818cf8;
            --timer-color: #38bdf8;
            --correct-color: #34d399;
        }

        body[data-theme="arcade"] {
            --card-bg: rgba(0, 0, 0, 0.95);
            --card-border: #facc15;
            --accent-color: #facc15;
            --category-color: #f43f5e;
            --timer-color: #facc15;
            --correct-color: #4ade80;
            --choice-bg: rgba(30, 30, 30, 0.9);
        }

        /* ── Container Layouts ─────────────────────────────────────── */
        #trivia-root {
            width: 100%;
            max-width: 1100px;
            opacity: 0;
            transform: translateY(1.5rem) scale(0.98);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #trivia-root.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .trivia-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: var(--card-radius);
            padding: 1.8rem 2.2rem;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.65), 0 0 24px rgba(56, 189, 248, 0.12);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            position: relative;
            overflow: hidden;
        }

        /* ── Top Bar: Category, Question Counter & Live Badge ─────── */
        .trivia-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .category-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: color-mix(in srgb, var(--category-color) 18%, transparent);
            border: 1px solid color-mix(in srgb, var(--category-color) 45%, transparent);
            color: var(--category-color);
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .category-pill svg {
            width: 14px;
            height: 14px;
            stroke-width: 2.2;
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .question-counter {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }

        .state-badge {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.2rem 0.65rem;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .state-badge.question {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            animation: pulse-border 2s infinite ease-in-out;
        }

        .state-badge.reveal {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        @keyframes pulse-border {
            0%, 100% { border-color: rgba(56, 189, 248, 0.3); }
            50% { border-color: rgba(56, 189, 248, 0.75); }
        }

        /* ── Question Text ────────────────────────────────────────── */
        .question-title {
            font-size: 1.55rem;
            font-weight: 700;
            line-height: 1.35;
            color: var(--text-color);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* ── Progress Timer Bar ───────────────────────────────────── */
        .timer-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .timer-bar {
            height: 100%;
            background: var(--timer-color);
            width: 100%;
            transform-origin: left;
            transition: width 0.1s linear, background-color 0.3s ease;
            box-shadow: 0 0 10px var(--timer-color);
        }

        .timer-bar.warning {
            background: #f59e0b;
            box-shadow: 0 0 10px #f59e0b;
        }

        .timer-bar.critical {
            background: #ef4444;
            box-shadow: 0 0 12px #ef4444;
        }

        /* ── Choices Grid ─────────────────────────────────────────── */
        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .choice-card {
            background: var(--choice-bg);
            border: 1.5px solid var(--choice-border);
            border-radius: calc(var(--card-radius) - 4px);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Dynamic Vote Fill meter behind choice */
        .choice-meter {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            background: color-mix(in srgb, var(--accent-color) 20%, transparent);
            width: 0%;
            transition: width 0.35s ease;
            z-index: 0;
        }

        .choice-content {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            position: relative;
            z-index: 1;
            flex: 1;
            min-width: 0;
        }

        .choice-letter {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 800;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .choice-text {
            font-size: 1.12rem;
            font-weight: 600;
            color: var(--text-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .choice-stats {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .vote-pill {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.35);
            padding: 0.2rem 0.55rem;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-variant-numeric: tabular-nums;
        }

        /* ── Reveal Phase States ──────────────────────────────────── */
        .trivia-card.phase-reveal .choice-card.correct {
            border-color: var(--correct-color);
            background: color-mix(in srgb, var(--correct-color) 16%, var(--choice-bg));
            box-shadow: 0 0 20px color-mix(in srgb, var(--correct-color) 45%, transparent);
            transform: scale(1.02);
        }

        .trivia-card.phase-reveal .choice-card.correct .choice-letter {
            background: var(--correct-color);
            color: #000;
            border-color: var(--correct-color);
        }

        .trivia-card.phase-reveal .choice-card.correct .choice-meter {
            background: color-mix(in srgb, var(--correct-color) 25%, transparent);
        }

        .trivia-card.phase-reveal .choice-card.incorrect {
            opacity: 0.38;
            filter: grayscale(0.4);
            transform: scale(0.99);
        }

        /* ── Fun Fact Card ────────────────────────────────────────── */
        .funfact-box {
            display: none;
            background: color-mix(in srgb, var(--funfact-color) 12%, rgba(0, 0, 0, 0.4));
            border: 1px solid color-mix(in srgb, var(--funfact-color) 35%, transparent);
            border-radius: calc(var(--card-radius) - 4px);
            padding: 0.85rem 1.15rem;
            font-size: 0.95rem;
            line-height: 1.45;
            color: var(--text-color);
            align-items: flex-start;
            gap: 0.65rem;
            animation: slide-up 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .funfact-box.active {
            display: flex;
        }

        .funfact-icon {
            color: var(--funfact-color);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .funfact-icon svg {
            width: 18px;
            height: 18px;
        }

        .funfact-text strong {
            color: var(--funfact-color);
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            display: block;
            margin-bottom: 0.15rem;
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(0.5rem); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Voting Chat Instructions Footer ──────────────────────── */
        .trivia-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 0.85rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .chat-hint {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .chat-hint kbd {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            padding: 0.1rem 0.35rem;
            font-family: monospace;
            font-weight: 700;
            color: var(--text-color);
        }

        .total-votes-count {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* ── Compact Lower-Third Mode (?mode=compact) ──────────────── */
        body[data-mode="compact"] {
            padding: 1rem;
            align-items: flex-end;
        }

        body[data-mode="compact"] #trivia-root {
            max-width: 100%;
        }

        body[data-mode="compact"] .trivia-card {
            padding: 1rem 1.4rem;
            gap: 0.75rem;
        }

        body[data-mode="compact"] .question-title {
            font-size: 1.15rem;
        }

        body[data-mode="compact"] .choices-grid {
            grid-template-columns: repeat(4, 1fr);
            gap: 0.6rem;
        }

        body[data-mode="compact"] .choice-card {
            padding: 0.6rem 0.85rem;
        }

        body[data-mode="compact"] .choice-text {
            font-size: 0.95rem;
        }

        /* ── Corner HUD Mode (?mode=hud) ──────────────────────────── */
        body[data-mode="hud"] {
            padding: 1.5rem;
            align-items: flex-start;
            justify-content: flex-start;
        }

        body[data-mode="hud"] #trivia-root {
            max-width: 440px;
        }

        body[data-mode="hud"] .choices-grid {
            grid-template-columns: 1fr;
            gap: 0.5rem;
        }

        body[data-mode="hud"] .question-title {
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div id="trivia-root">
        <div class="trivia-card" id="card">
            <!-- Header -->
            <div class="trivia-header">
                <span class="category-pill" id="category">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    <span id="category-text">Category</span>
                </span>
                <div class="header-meta">
                    <span class="question-counter" id="counter">Question 1 of 5</span>
                    <span class="state-badge question" id="state-badge">Active</span>
                </div>
            </div>

            <!-- Question -->
            <h1 class="question-title" id="question-text">Question loading…</h1>

            <!-- Timer Bar -->
            <div class="timer-track" id="timer-track">
                <div class="timer-bar" id="timer-bar"></div>
            </div>

            <!-- Choices Grid -->
            <div class="choices-grid" id="choices-grid">
                <!-- Dynamically populated choices A-D -->
            </div>

            <!-- Fun Fact / Explanation (revealed in reveal phase) -->
            <div class="funfact-box" id="funfact-box">
                <div class="funfact-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
                </div>
                <div class="funfact-text">
                    <strong>Did you know?</strong>
                    <span id="funfact-content"></span>
                </div>
            </div>

            <!-- Footer -->
            <div class="trivia-footer">
                <div class="chat-hint" id="chat-hint">
                    <span>Vote in chat:</span>
                    <kbd>!a</kbd> <kbd>!b</kbd> <kbd>!c</kbd> <kbd>!d</kbd>
                </div>
                <div class="total-votes-count">
                    <span id="votes-count">0</span> votes cast
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL Parameter handling
        const params = new URLSearchParams(window.location.search);
        const themeParam = params.get('theme') || 'modern';
        const modeParam = params.get('mode') || 'full';
        const soundParam = params.get('sound') !== '0';
        const showVotesParam = params.get('showVotes') !== '0';
        const showTimerParam = params.get('showTimer') !== '0';
        const showFunFactParam = params.get('showFunFact') !== '0';
        const previewParam = params.get('preview') === 'true';

        document.body.dataset.theme = themeParam;
        document.body.dataset.mode = modeParam;

        if (!showTimerParam) {
            document.getElementById('timer-track').style.display = 'none';
        }

        // Web Audio Chime Synthesizer
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!soundParam) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const now = audioCtx.currentTime;
                if (type === 'tick') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'reveal') {
                    // Gentle major-third harmonic chime
                    [523.25, 659.25, 783.99].forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + (i * 0.08));
                        gain.gain.setValueAtTime(0.08, now + (i * 0.08));
                        gain.gain.exponentialRampToValueAtTime(0.001, now + (i * 0.08) + 0.6);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + (i * 0.08));
                        osc.stop(now + (i * 0.08) + 0.6);
                    });
                }
            } catch {}
        }

        // State & DOM elements
        const rootEl = document.getElementById('trivia-root');
        const cardEl = document.getElementById('card');
        const categoryTextEl = document.getElementById('category-text');
        const counterEl = document.getElementById('counter');
        const stateBadgeEl = document.getElementById('state-badge');
        const questionTextEl = document.getElementById('question-text');
        const timerBarEl = document.getElementById('timer-bar');
        const choicesGridEl = document.getElementById('choices-grid');
        const funfactBoxEl = document.getElementById('funfact-box');
        const funfactContentEl = document.getElementById('funfact-content');
        const votesCountEl = document.getElementById('votes-count');

        let currentState = null;
        let timerRaf = null;

        function esc(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function updateTimerBar(startedAt, endsAt) {
            if (!startedAt || !endsAt) {
                timerBarEl.style.width = '100%';
                timerBarEl.className = 'timer-bar';
                return;
            }

            const total = endsAt - startedAt;
            const now = Date.now();
            const remaining = Math.max(0, endsAt - now);
            const ratio = total > 0 ? Math.min(1, Math.max(0, remaining / total)) : 0;

            timerBarEl.style.width = `${(ratio * 100).toFixed(1)}%`;

            if (ratio < 0.25) {
                timerBarEl.className = 'timer-bar critical';
            } else if (ratio < 0.5) {
                timerBarEl.className = 'timer-bar warning';
            } else {
                timerBarEl.className = 'timer-bar';
            }

            if (remaining > 0 && currentState?.status === 'question') {
                timerRaf = requestAnimationFrame(() => updateTimerBar(startedAt, endsAt));
            }
        }

        function render(data) {
            if (!data) return;
            currentState = data;

            // Apply custom theme variables if passed from service
            if (data.theme) {
                const root = document.documentElement;
                if (data.theme.cardBg) root.style.setProperty('--card-bg', data.theme.cardBg);
                if (data.theme.textColor) root.style.setProperty('--text-color', data.theme.textColor);
                if (data.theme.accentColor) root.style.setProperty('--accent-color', data.theme.accentColor);
                if (data.theme.correctColor) root.style.setProperty('--correct-color', data.theme.correctColor);
                if (data.theme.incorrectColor) root.style.setProperty('--incorrect-color', data.theme.incorrectColor);
                if (data.theme.choiceBg) root.style.setProperty('--choice-bg', data.theme.choiceBg);
                if (data.theme.timerColor) root.style.setProperty('--timer-color', data.theme.timerColor);
                if (data.theme.categoryColor) root.style.setProperty('--category-color', data.theme.categoryColor);
                if (data.theme.funfactColor) root.style.setProperty('--funfact-color', data.theme.funfactColor);
                if (data.theme.cardRadius) root.style.setProperty('--card-radius', `${data.theme.cardRadius}px`);
                if (data.theme.preset && !params.has('theme')) document.body.dataset.theme = data.theme.preset;
            }

            const q = data.activeQuestion;
            if (!q || data.status === 'idle') {
                if (!previewParam) {
                    rootEl.classList.remove('active');
                    if (timerRaf) cancelAnimationFrame(timerRaf);
                    return;
                }
            }

            rootEl.classList.add('active');

            // Category & Counter
            categoryTextEl.textContent = q?.category || 'General';
            counterEl.textContent = `Question ${(data.currentIndex ?? 0) + 1} of ${data.totalQuestions || 1}`;

            // Phase Badge
            const isReveal = data.status === 'reveal';
            stateBadgeEl.textContent = isReveal ? 'Answer Reveal' : 'Voting Open';
            stateBadgeEl.className = `state-badge ${isReveal ? 'reveal' : 'question'}`;
            cardEl.className = `trivia-card ${isReveal ? 'phase-reveal' : 'phase-question'}`;

            // Question Title
            questionTextEl.textContent = q?.question || 'Question title';

            // Timer
            if (timerRaf) cancelAnimationFrame(timerRaf);
            if (!isReveal && q?.startedAt && q?.endsAt) {
                updateTimerBar(q.startedAt, q.endsAt);
            } else {
                timerBarEl.style.width = isReveal ? '0%' : '100%';
            }

            // Choices Grid
            const choices = q?.choices || [];
            const correctIdx = q?.correctIndex;

            choicesGridEl.innerHTML = choices.map((c, idx) => {
                const letter = c.letter || String.fromCharCode(65 + idx);
                const isCorrect = isReveal && idx === correctIdx;
                const isIncorrect = isReveal && idx !== correctIdx;
                const statusClass = isCorrect ? 'correct' : (isIncorrect ? 'incorrect' : '');
                const percent = showVotesParam ? (c.percent || 0) : 0;
                const votes = showVotesParam ? (c.votes || 0) : 0;

                return `
                    <div class="choice-card ${statusClass}" data-index="${idx}">
                        <div class="choice-meter" style="width: ${percent}%"></div>
                        <div class="choice-content">
                            <span class="choice-letter">${esc(letter)}</span>
                            <span class="choice-text">${esc(c.text)}</span>
                        </div>
                        ${showVotesParam ? `
                            <div class="choice-stats">
                                <span class="vote-pill">${percent}%</span>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            // Fun Fact Box
            if (isReveal && showFunFactParam && q?.funfact) {
                funfactContentEl.textContent = q.funfact;
                funfactBoxEl.classList.add('active');
            } else {
                funfactBoxEl.classList.remove('active');
            }

            // Total Votes
            votesCountEl.textContent = q?.totalVotes || 0;
        }

        // Real-Time Vote Update Handler (fast path without full re-render)
        function updateVotes(voteData) {
            if (!voteData || !voteData.choices) return;
            const choices = voteData.choices;
            choices.forEach((c, idx) => {
                const card = choicesGridEl.querySelector(`.choice-card[data-index="${idx}"]`);
                if (card) {
                    const meter = card.querySelector('.choice-meter');
                    const pill = card.querySelector('.vote-pill');
                    if (meter) meter.style.width = `${c.percent || 0}%`;
                    if (pill) pill.textContent = `${c.percent || 0}%`;
                }
            });
            if (voteData.totalVotes !== undefined) {
                votesCountEl.textContent = voteData.totalVotes;
            }
        }

        // Data Fetch & WebSocket synchronization
        async function fetchState() {
            try {
                const res = await fetch('/api/trivia');
                if (res.ok) {
                    const data = await res.json();
                    render(data);
                }
            } catch (err) {
                console.warn('[Trivia] Fetch error:', err);
            }
        }

        function connectWs() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${location.host}/ws`);

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'trivia:state') {
                        render(msg.data);
                    } else if (msg.type === 'trivia:start') {
                        playSound('tick');
                        fetchState();
                    } else if (msg.type === 'trivia:reveal') {
                        playSound('reveal');
                        fetchState();
                    } else if (msg.type === 'trivia:vote-update') {
                        updateVotes(msg.data);
                    } else if (msg.type === 'trivia:reset') {
                        fetchState();
                    }
                } catch {}
            };

            ws.onclose = () => setTimeout(connectWs, 2500);
        }

        // Preview Mode fallback if server is inactive
        if (previewParam) {
            render({
                status: 'question',
                currentIndex: 0,
                totalQuestions: 5,
                theme: { preset: themeParam },
                activeQuestion: {
                    category: 'Retro Gaming',
                    question: 'In what year was the original Super Mario World released in Japan?',
                    choices: [
                        { index: 0, letter: 'A', text: '1988', votes: 2, percent: 10 },
                        { index: 1, letter: 'B', text: '1990', votes: 14, percent: 70 },
                        { index: 2, letter: 'C', text: '1991', votes: 3, percent: 15 },
                        { index: 3, letter: 'D', text: '1992', votes: 1, percent: 5 }
                    ],
                    correctIndex: 1,
                    funfact: 'Super Mario World was a launch title for the Super Famicom in Japan on November 21, 1990.',
                    totalVotes: 20,
                    startedAt: Date.now(),
                    endsAt: Date.now() + 15000
                }
            });
        }

        fetchState();
        connectWs();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/admin.css">
    <script src="/appearance.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Custom Overlays</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg-page); color: var(--text); min-height: 100vh; font-size: 14px; }
        .header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.3rem; font-weight: 600; }
        .header h1 span { color: var(--accent); }
        .container { max-width: 1300px; margin: 0 auto; padding: 1.5rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.9rem 1.1rem; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
        .toolbar .grow { flex: 1; min-width: 180px; }
        input, select { padding: 0.45rem 0.65rem; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font: inherit; min-width: 0; }
        input:focus, select:focus { outline: none; border-color: var(--accent); }
        .btn { border: 1px solid var(--border); background: var(--bg-raised); color: var(--text); border-radius: 6px; padding: 0.45rem 0.8rem; font: inherit; font-size: 0.82rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem; }
        .btn:hover { border-color: var(--accent); }
        .btn.primary { background: var(--success-strong); border-color: var(--success-strong); color: #fff; }
        .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
        .btn.small { padding: 0.28rem 0.6rem; font-size: 0.78rem; }
        .btn.active { border-color: var(--accent); background: var(--accent-bg); }
        .summary { color: var(--text-muted); font-size: 0.8rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card, 300px), 1fr)); gap: 0.9rem; }
        .size { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--text-muted); font-size: 0.78rem; }
        .size input { padding: 0; width: 120px; accent-color: var(--accent); }
        .overlay { border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); overflow: hidden; display: flex; flex-direction: column; }
        .overlay:hover { border-color: var(--border-strong); }
        .preview { position: relative; height: calc(var(--card, 300px) * 0.57); overflow: hidden; background: conic-gradient(var(--bg-raised) 25%, var(--bg-card) 0 50%, var(--bg-raised) 0 75%, var(--bg-card) 0) 0 0 / 16px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
        .preview.off { display: none; }
        .preview-thumb { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; user-select: none; }
        .preview-live-btn { position: absolute; top: 6px; right: 6px; z-index: 2; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); font-size: 0.72rem; font-weight: 600; padding: 0.2rem 0.48rem; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 0.25rem; opacity: 0; transition: opacity 0.15s ease, color 0.15s ease, border-color 0.15s ease, background 0.15s ease; }
        .preview:hover .preview-live-btn, .preview:focus-within .preview-live-btn, .preview-live-btn.active { opacity: 1; }
        .preview-live-btn:hover { color: var(--text); border-color: var(--accent); background: var(--bg-raised); }
        .preview-live-btn.active { color: #fff; background: var(--accent); border-color: var(--accent); }
        .preview iframe { position: absolute; top: 50%; left: 50%; border: 0; background: transparent; transform-origin: 0 0; pointer-events: auto; }
        .body { padding: 0.7rem 0.85rem 0.8rem; display: grid; gap: 0.35rem; flex: 1; grid-template-rows: auto auto 1fr; }
        .title { font-weight: 600; font-size: 0.98rem; overflow-wrap: anywhere; }
        .meta { color: var(--text-muted); font-size: 0.76rem; line-height: 1.5; }
        .actions { display: grid; gap: 0.4rem; margin-top: 0.35rem; align-self: end; }
        .act-main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.35rem; }
        .act-main .btn { text-align: center; white-space: nowrap; }
        .act-main .primary { grid-column: 1 / -1; order: 0; }
        .act-main .ctl { order: 1; }
        .act-main .btn:not(.primary):not(.ctl) { order: 2; }
        .act-main:has(.ctl) .primary { grid-column: auto; }
        .act-main .btn, .act-more .btn { padding-inline: 0.4rem; overflow: hidden; text-overflow: ellipsis; }
        .act-more { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.1rem; padding-top: 0.4rem; border-top: 1px solid var(--border); }
        .act-more .btn { padding-inline: 0.15rem; font-size: 0.74rem; border-color: transparent; background: transparent; color: var(--text-muted); }
        .act-more .btn:hover { color: var(--text); background: var(--bg-raised); border-color: var(--border); }
        .act-more .btn { text-align: center; white-space: nowrap; }
        .act-more .danger:hover { background: transparent; }
        .empty { color: var(--text-muted); text-align: center; padding: 2.5rem 1rem; grid-column: 1 / -1; }
        .list .overlay { flex-direction: row; align-items: center; }
        .list .preview { width: calc(var(--card, 300px) * 0.73); height: calc(var(--card, 300px) * 0.41); flex: none; border-bottom: 0; border-right: 1px solid var(--border); }
        .list .body { flex: 1; grid-template-rows: none; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0.2rem 1rem; }
        .list .actions { margin: 0; min-width: 270px; grid-row: 1 / span 2; grid-column: 2; }
        .list.grid { grid-template-columns: 1fr; }
        #toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); background: var(--bg-raised); border: 1px solid var(--border); padding: 0.55rem 1rem; border-radius: 8px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 10; }
        #toast.show { opacity: 1; }
        @media (max-width: 800px) { .container { padding: 1rem; } .list .overlay { flex-direction: column; align-items: stretch; } .list .preview { width: auto; height: 170px; } .list .body { grid-template-columns: 1fr; } .list .actions { grid-row: auto; grid-column: auto; justify-content: flex-start; } }
    </style>
</head>
<body>
    <header class="header"><h1>StreamPulse <span>Custom Overlays</span></h1><div id="main-nav" class="nav"></div></header>
    <script src="/nav.js"></script>
    <main class="container">
        <div class="card toolbar">
            <a class="btn primary" href="/custom-overlay-editor.html?new=1">+ Create overlay</a>
            <input id="search" class="grow" type="search" placeholder="Search overlays…" aria-label="Search overlays">
            <select id="sort" aria-label="Sort">
                <option value="updated">Recently edited</option><option value="created">Recently created</option><option value="name">Name A–Z</option><option value="elements">Most elements</option>
            </select>
            <button class="btn" id="toggle-preview" title="Show or hide live previews">Previews</button>
            <label class="size">Size <input id="card-size" type="range" min="200" max="560" step="10" value="300"></label>
            <button class="btn" id="toggle-view" title="Switch between grid and list">List view</button>
            <a class="btn" href="/assets.html">Asset Library →</a>
        </div>
        <div class="summary" id="summary"></div>
        <div id="overlay-list" class="grid"><div class="empty">Loading overlays…</div></div>
    </main>
    <div id="toast"></div>
    <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const urlParams = new URLSearchParams(location.search);
    const prefs = Object.assign({ previews: true, view: 'grid', sort: 'updated', size: 300 }, JSON.parse(localStorage.getItem('customOverlaysPrefs') || '{}'));
    if (urlParams.has('view')) prefs.view = urlParams.get('view');
    if (urlParams.has('sort')) prefs.sort = urlParams.get('sort');
    const savePrefs = () => {
        localStorage.setItem('customOverlaysPrefs', JSON.stringify(prefs));
        try {
            const u = new URL(location.href);
            u.searchParams.set('view', prefs.view);
            history.replaceState(null, '', u.toString());
        } catch {}
    };
    let overlays = [];

    function toast(text) {
        const el = $('toast');
        el.textContent = text;
        el.classList.add('show');
        clearTimeout(toast.t);
        toast.t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    async function api(url, options) {
        const response = await fetch(url, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
        return data;
    }

    const ago = iso => {
        const seconds = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
        if (!Number.isFinite(seconds)) return '—';
        if (seconds < 60) return 'just now';
        if (seconds < 3600) return `${Math.floor(seconds / 60)} min ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)} h ago`;
        if (seconds < 86400 * 30) return `${Math.floor(seconds / 86400)} d ago`;
        return new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
    };

    const SORTS = {
        updated: (a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)),
        created: (a, b) => String(b.createdAt || b.updatedAt).localeCompare(String(a.createdAt || a.updatedAt)),
        name: (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base', numeric: true }),
        elements: (a, b) => b.elementCount - a.elementCount
    };

    function fitActiveLiveFrames() {
        for (const frame of document.querySelectorAll('.preview iframe')) {
            const box = frame.parentElement;
            if (!box) continue;
            const width = Number(frame.dataset.w) || 1920, height = Number(frame.dataset.h) || 1080;
            const scale = Math.min(box.clientWidth / width, box.clientHeight / height) * 0.96;
            frame.style.width = `${width}px`;
            frame.style.height = `${height}px`;
            frame.style.transform = `scale(${scale}) translate(-50%, -50%)`;
        }
    }

    function toggleLivePreview(liveBtn) {
        const box = liveBtn.closest('.preview');
        if (!box) return;
        const id = liveBtn.dataset.liveId;
        const existing = box.querySelector('iframe');
        if (existing) {
            try { existing.src = 'about:blank'; } catch {}
            existing.remove();
            liveBtn.classList.remove('active');
            liveBtn.title = 'Mount live preview frame';
            liveBtn.innerHTML = `<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><polygon points="6 4 19 12 6 20 6 4"/></svg><span>Live</span>`;
            const thumb = box.querySelector('.preview-thumb');
            if (thumb) thumb.style.display = '';
        } else {
            const width = Number(box.dataset.w) || 1920;
            const height = Number(box.dataset.h) || 1080;
            const frame = document.createElement('iframe');
            frame.tabIndex = -1;
            frame.dataset.w = String(width);
            frame.dataset.h = String(height);
            frame.title = `Live preview of ${id}`;
            frame.src = `/custom-overlay.html?id=${encodeURIComponent(id)}&preview=true`;
            frame.style.position = 'absolute';
            frame.style.top = '50%';
            frame.style.left = '50%';
            frame.style.border = '0';
            frame.style.background = 'transparent';
            frame.style.transformOrigin = '0 0';
            frame.style.pointerEvents = 'auto';

            const scale = Math.min(box.clientWidth / width, box.clientHeight / height) * 0.96;
            frame.style.width = `${width}px`;
            frame.style.height = `${height}px`;
            frame.style.transform = `scale(${scale}) translate(-50%, -50%)`;

            const thumb = box.querySelector('.preview-thumb');
            if (thumb) thumb.style.display = 'none';

            box.appendChild(frame);
            liveBtn.classList.add('active');
            liveBtn.title = 'Unmount live frame and return to static thumbnail';
            liveBtn.innerHTML = `<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span>Static</span>`;
        }
    }

    function render() {
        const query = $('search').value.trim().toLowerCase();
        const shown = overlays.filter(o => !query || `${o.name} ${o.id}`.toLowerCase().includes(query)).sort(SORTS[prefs.sort] || SORTS.updated);
        $('summary').textContent = overlays.length ? `${shown.length} of ${overlays.length} overlays` : '';
        const list = $('overlay-list');
        list.querySelectorAll('iframe').forEach(f => { try { f.src = 'about:blank'; } catch {} });
        list.className = prefs.view === 'list' ? 'grid list' : 'grid';
        $('toggle-preview').classList.toggle('active', prefs.previews);
        $('toggle-view').textContent = prefs.view === 'list' ? 'Grid view' : 'List view';
        list.innerHTML = shown.length ? shown.map(o => `
            <article class="overlay">
                <div class="preview${prefs.previews ? '' : ' off'}" data-id="${esc(o.id)}" data-w="${o.canvas.width}" data-h="${o.canvas.height}">
                    ${prefs.previews ? `
                        <img class="preview-thumb" src="/api/custom-overlays/${encodeURIComponent(o.id)}/thumbnail?v=${encodeURIComponent(o.updatedAt || o.revision)}" alt="Thumbnail of ${esc(o.name)}" loading="lazy">
                        <button type="button" class="preview-live-btn" data-live-id="${esc(o.id)}" title="Mount live preview frame">
                            <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><polygon points="6 4 19 12 6 20 6 4"/></svg>
                            <span>Live</span>
                        </button>
                    ` : ''}
                </div>
                <div class="body">
                    <div class="title">${esc(o.name)}</div>
                    <div class="meta">${esc(o.id)} · ${o.canvas.width}×${o.canvas.height} · ${o.elementCount} element${o.elementCount === 1 ? '' : 's'}${o.pageCount ? ` · ${o.pageCount} pages` : ''}<br>Edited ${ago(o.updatedAt)} · revision ${o.revision}</div>
                    <div class="actions">
                        <div class="act-main">
                            <a class="btn small primary" href="/custom-overlay-editor.html?id=${encodeURIComponent(o.id)}">Edit</a>
                            <a class="btn small" href="/custom-overlay.html?id=${encodeURIComponent(o.id)}&preview=true" target="_blank" rel="noopener">Open</a>${(o.pageCount > 0 || o.hasControls) ? `<a class="btn small ctl" href="/overlay-control.html?id=${encodeURIComponent(o.id)}" target="_blank" rel="noopener" title="Open overlay controls">Control</a>` : ''}
                            <button class="btn small" data-act="copy" data-id="${esc(o.id)}">Copy OBS URL</button>
                        </div>
                        <div class="act-more">
                            <button class="btn small" data-act="rename-id" data-id="${esc(o.id)}" title="Change the id used in the OBS URL">Rename ID</button>
                            <button class="btn small" data-act="duplicate" data-id="${esc(o.id)}">Duplicate</button>
                            <button class="btn small danger" data-act="delete" data-id="${esc(o.id)}">Delete</button>
                        </div>
                    </div>
                </div>
            </article>`).join('') : `<div class="empty">${overlays.length ? 'No overlays match your search.' : 'No custom overlays yet. Create your first one.'}</div>`;
        requestAnimationFrame(fitActiveLiveFrames);
    }

    async function load() {
        overlays = await api('/api/custom-overlays', { cache: 'no-store' });
        render();
    }

    function uniqueId(base) {
        const slug = String(base).toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'overlay';
        const taken = new Set(overlays.map(o => o.id));
        let candidate = `${slug}-copy`;
        for (let n = 2; taken.has(candidate); n++) candidate = `${slug}-copy-${n}`;
        return candidate;
    }

    async function duplicate(id) {
        const source = await api(`/api/custom-overlays/${encodeURIComponent(id)}`);
        const copy = await api('/api/custom-overlays', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: uniqueId(source.id), name: `${source.name} copy`, canvas: source.canvas, elements: source.elements })
        });
        toast(`Duplicated as "${copy.name}"`);
        await load();
    }

    $('overlay-list').addEventListener('click', async event => {
        const liveBtn = event.target.closest('.preview-live-btn');
        if (liveBtn) {
            event.preventDefault();
            event.stopPropagation();
            toggleLivePreview(liveBtn);
            return;
        }

        const button = event.target.closest('[data-act]');
        if (!button) return;
        const id = button.dataset.id;
        const overlay = overlays.find(o => o.id === id);
        try {
            if (button.dataset.act === 'copy') {
                await navigator.clipboard.writeText(`${location.origin}/custom-overlay.html?id=${encodeURIComponent(id)}`);
                toast('OBS URL copied');
            } else if (button.dataset.act === 'rename-id') {
                const suggestion = String(overlay?.name || id).toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
                const next = await StreamPulse.prompt('Rename Overlay ID', `Enter a new ID for "${overlay?.name || id}". Any browser source using the old URL will need to be updated.`, suggestion);
                if (next === null || !next.trim() || next.trim() === id) return;
                await api(`/api/custom-overlays/${encodeURIComponent(id)}/rename-id`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ newId: next.trim() }) });
                toast('ID changed');
                await load();
            } else if (button.dataset.act === 'duplicate') {
                button.disabled = true;
                await duplicate(id);
            } else if (button.dataset.act === 'delete') {
                if (!await StreamPulse.confirm('Delete Overlay', `Delete "${overlay?.name || id}"? Its revision history will also be permanently removed.`, { danger: true, confirmText: 'Delete' })) return;
                await api(`/api/custom-overlays/${encodeURIComponent(id)}`, { method: 'DELETE' });
                await load();
            }
        } catch (error) { StreamPulse.toast(error.message, 'error'); button.disabled = false; }
    });

    let searchTimer = null;
    $('search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(render, 150); });
    $('sort').value = prefs.sort;
    $('sort').addEventListener('change', () => { prefs.sort = $('sort').value; savePrefs(); render(); });
    const applySize = () => { $('overlay-list').style.setProperty('--card', `${prefs.size}px`); fitActiveLiveFrames(); };
    $('card-size').value = prefs.size;
    let cardSizeTimer = null;
    $('card-size').addEventListener('input', () => {
        prefs.size = Number($('card-size').value);
        applySize();
        clearTimeout(cardSizeTimer);
        cardSizeTimer = setTimeout(savePrefs, 200);
    });
    $('overlay-list').style.setProperty('--card', `${prefs.size}px`);
    $('toggle-preview').addEventListener('click', () => { prefs.previews = !prefs.previews; savePrefs(); render(); });
    $('toggle-view').addEventListener('click', () => { prefs.view = prefs.view === 'list' ? 'grid' : 'list'; savePrefs(); render(); });
    window.addEventListener('resize', fitActiveLiveFrames);

    load().catch(error => { $('overlay-list').innerHTML = `<div class="empty">${esc(error.message)}</div>`; });
    </script>
</body>
</html>

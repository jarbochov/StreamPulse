<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/admin.css">
    <script src="/appearance.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StreamPulse Alert Queue</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg-inset, #0d1117); color: var(--text, #c9d1d9); font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        header { position: sticky; top: 0; background: var(--bg-card, #161b22); border-bottom: 1px solid var(--border, #30363d); padding: .6rem .8rem; z-index: 2; display: flex; flex-direction: column; gap: .5rem; }
        .status-row { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
        .status { font-size: .8rem; color: var(--text-muted, #8b949e); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: .4rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; display: inline-block; }
        .status-dot.paused { background: #d29922; }
        .ctl { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
        button { background: var(--bg-raised, #21262d); color: var(--text, #c9d1d9); border: 1px solid var(--border, #30363d); border-radius: 6px; padding: .32rem .65rem; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s ease; display: inline-flex; align-items: center; gap: .35rem; }
        button:hover { border-color: var(--accent, #58a6ff); color: #fff; background: var(--bg-card, #161b22); }
        button.rp { padding: .25rem .45rem; flex: none; border-radius: 4px; }
        button.rp svg { display: block; }
        .filter-toggle { display: inline-flex; align-items: center; gap: .35rem; font-size: 12px; color: var(--text-muted, #8b949e); cursor: pointer; margin-left: auto; user-select: none; }
        .filter-toggle input { cursor: pointer; accent-color: var(--accent, #58a6ff); margin: 0; }
        h2 { margin: 0; padding: .75rem .8rem .35rem; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted, #8b949e); }
        .list { display: flex; flex-direction: column; }
        .list > div { display: flex; align-items: center; gap: .6rem; padding: .45rem .8rem; border-bottom: 1px solid var(--border, #21262d); transition: background .12s ease; }
        .list > div:hover { background: rgba(255, 255, 255, 0.02); }
        .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .grow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .event-title { font-weight: 500; color: var(--text, #f0f6fc); display: flex; align-items: center; gap: .4rem; }
        .sub { font-size: 11px; color: var(--text-muted, #8b949e); display: flex; align-items: center; gap: .4rem; }
        .badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; display: inline-flex; align-items: center; }
        .badge-shown { background: rgba(63, 185, 80, 0.15); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.35); }
        .badge-test { background: rgba(163, 113, 247, 0.15); color: #d2a8ff; border: 1px solid rgba(163, 113, 247, 0.35); }
        .badge-nomatch { background: rgba(139, 148, 158, 0.12); color: #8b949e; border: 1px solid rgba(139, 148, 158, 0.25); }
        .empty { padding: .75rem .8rem; color: var(--text-muted, #8b949e); font-size: 12px; font-style: italic; }
        #toast { position: fixed; bottom: .75rem; left: .75rem; right: .75rem; background: var(--danger-bg, #b91c1c); color: #fff; padding: .5rem .75rem; border-radius: 6px; display: none; z-index: 10; font-size: 12px; }
    </style>
</head>
<body>
<header>
    <div class="status-row">
        <div class="status" id="status"><span class="status-dot"></span> Loading…</div>
        <div class="ctl">
            <button data-queue="skip">Skip</button>
            <button data-queue="clear" title="Drop alerts waiting to play">Clear waiting</button>
            <button data-queue="clear-log" title="Empty the lists below">Clear lists</button>
            <button id="pause" data-queue="pause">Pause</button>
        </div>
    </div>
    <div style="display: flex; gap: .5rem; align-items: center; justify-content: space-between; flex-wrap: wrap;">
        <div style="display: flex; gap: .4rem; align-items: center; flex: 1; min-width: 260px; flex-wrap: wrap;">
            <select id="type-filter" style="background: var(--bg-raised, #21262d); color: var(--text, #c9d1d9); border: 1px solid var(--border, #30363d); border-radius: 6px; padding: .28rem .45rem; font: inherit; font-size: 11px;">
                <option value="all">All Events</option>
                <option value="follow">Follows</option>
                <option value="sub">Subs &amp; Resubs</option>
                <option value="gift">Gifted Subs</option>
                <option value="bits">Bits &amp; Cheers</option>
                <option value="raid">Raids</option>
                <option value="redeem">Redeems</option>
                <option value="chat_word">Chat Words</option>
                <option value="test">Test Alerts Only</option>
            </select>
            <input type="search" id="queue-search" placeholder="Search user or rule…" style="background: var(--bg-inset, #0d1117); color: var(--text, #c9d1d9); border: 1px solid var(--border, #30363d); border-radius: 6px; padding: .26rem .55rem; font: inherit; font-size: 11px; flex: 1; min-width: 120px;">
            <label class="filter-toggle" title="Filter out stream events that didn't trigger an alert">
                <input type="checkbox" id="hide-unmatched">
                <span>Hide unmatched</span>
            </label>
        </div>
        <div style="display: flex; gap: .35rem; align-items: center;">
            <select id="quick-test-type" style="background: var(--bg-raised, #21262d); color: var(--text, #c9d1d9); border: 1px solid var(--border, #30363d); border-radius: 6px; padding: .28rem .45rem; font: inherit; font-size: 11px;">
                <option value="follow">Follow</option>
                <option value="sub">Sub (T1)</option>
                <option value="resub">Resub (12 mos)</option>
                <option value="gift">Gift Sub (5x)</option>
                <option value="bits">Bits (500)</option>
                <option value="raid">Raid (50)</option>
                <option value="redeem">Redeem</option>
                <option value="chat_word">Chat Word</option>
            </select>
            <button type="button" id="btn-quick-test" title="Dispatch simulated test event to alerts queue">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>Dispatch Test</span>
            </button>
        </div>
    </div>
</header>
<h2>Events (latest 100)</h2>
<div class="list" id="events"></div>
<h2>Alerts shown</h2>
<div class="list" id="history"></div>
<div id="toast"></div>
<script src="/poll.js"></script>
<script>
(() => {
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const TYPES = { follow: 'Follow', sub: 'Sub', resub: 'Resub', milestone: 'Milestone', gift: 'Gifted subs', bits: 'Bits', donation: 'Donation', raid: 'Raid', redeem: 'Redeem', chat_word: 'Chat word', chat_command: 'Chat command' };
    const REPLAY_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"></path><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>';
    const $ = id => document.getElementById(id);
    let queue = {};
    let hideUnmatched = localStorage.getItem('alerts.hideUnmatched') === '1';
    let typeFilter = localStorage.getItem('alerts.queueTypeFilter') || 'all';
    let searchQuery = localStorage.getItem('alerts.queueSearchQuery') || '';

    $('hide-unmatched').checked = hideUnmatched;
    $('hide-unmatched').addEventListener('change', e => {
        hideUnmatched = e.target.checked;
        localStorage.setItem('alerts.hideUnmatched', hideUnmatched ? '1' : '0');
        render();
    });

    if ($('type-filter')) {
        $('type-filter').value = typeFilter;
        $('type-filter').addEventListener('change', e => {
            typeFilter = e.target.value;
            localStorage.setItem('alerts.queueTypeFilter', typeFilter);
            render();
        });
    }

    if ($('queue-search')) {
        $('queue-search').value = searchQuery;
        $('queue-search').addEventListener('input', e => {
            searchQuery = e.target.value.trim().toLowerCase();
            localStorage.setItem('alerts.queueSearchQuery', searchQuery);
            render();
        });
    }

    const samplePayloads = {
        follow: { type: 'follow', user: 'SampleFollower' },
        sub: { type: 'sub', user: 'SampleSub', tier: '1000' },
        resub: { type: 'resub', user: 'SampleResub', months: 12, cumulativeMonths: 12, tier: '1000' },
        gift: { type: 'gift', user: 'SampleGifter', count: 5, tier: '1000' },
        bits: { type: 'bits', user: 'SampleCheerer', amount: 500 },
        raid: { type: 'raid', user: 'SampleRaider', viewers: 50 },
        redeem: { type: 'redeem', user: 'SampleViewer', title: 'Hydrate' },
        chat_word: { type: 'chat_word', user: 'SampleChatter', word: '!hype', message: '!hype' }
    };
    $('btn-quick-test')?.addEventListener('click', async () => {
        const type = $('quick-test-type')?.value || 'follow';
        const payload = samplePayloads[type] || samplePayloads.follow;
        try {
            await post('/api/alerts/test-event', payload);
            refresh();
            toast(`Dispatched test ${type} event`);
        } catch (err) {
            toast(err.message);
        }
    });

    function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    async function post(url, body) {
        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Request failed');
    }

    function matchesTypeFilter(type, isTest) {
        if (typeFilter === 'all') return true;
        if (typeFilter === 'test') return Boolean(isTest);
        if (typeFilter === 'sub') return type === 'sub' || type === 'resub';
        if (typeFilter === 'chat_word') return type === 'chat_word' || type === 'chat_command';
        return type === typeFilter;
    }

    function matchesSearch(text) {
        if (!searchQuery) return true;
        return String(text || '').toLowerCase().includes(searchQuery);
    }

    let _lastStatusHtml = '', _lastEventsHtml = '', _lastHistoryHtml = '';
    function render() {
        const isPaused = Boolean(queue.paused);
        const statusHtml = `<span class="status-dot ${isPaused ? 'paused' : ''}"></span> ${queue.current ? 'Showing: ' + esc(queue.current.title || queue.current.ruleName) : 'Idle'} · ${queue.pending || 0} waiting${isPaused ? ' · paused' : ''}`;
        if (statusHtml !== _lastStatusHtml) {
            _lastStatusHtml = statusHtml;
            $('status').innerHTML = statusHtml;
        }
        $('pause').textContent = isPaused ? 'Resume' : 'Pause';
        $('pause').dataset.queue = isPaused ? 'resume' : 'pause';

        const rawEvents = queue.events || [];
        const ev = rawEvents.filter(e => {
            if (hideUnmatched && e.status === 'no matching rule') return false;
            if (!matchesTypeFilter(e.event?.type, e.test || e.status === 'test')) return false;
            if (searchQuery) {
                const combined = `${e.event?.user || ''} ${e.event?.name || ''} ${e.event?.command || ''} ${e.event?.type || ''} ${e.status || ''}`;
                if (!matchesSearch(combined)) return false;
            }
            return true;
        });
        const eventsHtml = ev.length ? ev.map(e => {
            const isShown = e.status === 'shown';
            const statusBadge = isShown
                ? '<span class="badge badge-shown">Shown</span>'
                : e.status === 'no matching rule'
                ? '<span class="badge badge-nomatch">No Match</span>'
                : `<span class="badge">${esc(e.status)}</span>`;

            return `<div>
                <span class="grow">
                    <span class="event-title">${esc(TYPES[e.event.type] || e.event.type)}: ${esc(e.event.user || e.event.name || '')}${e.event.command ? ' (!' + esc(e.event.command) + ')' : ''}${e.event.amount ? ' · ' + esc(e.event.amount) : ''}</span>
                    <span class="sub">${statusBadge}<span>${new Date(e.at).toLocaleTimeString()}</span></span>
                </span>
                <button class="rp" data-event="${esc(e.id)}" title="Run through current rules again">${REPLAY_ICON}</button>
            </div>`;
        }).join('') : `<div class="empty">${hideUnmatched && rawEvents.length ? 'All events filtered or hidden. Adjust your filters to view them.' : 'No events matching current filter.'}</div>`;
        if (eventsHtml !== _lastEventsHtml) {
            _lastEventsHtml = eventsHtml;
            $('events').innerHTML = eventsHtml;
        }

        const rawHistory = queue.history || [];
        const h = rawHistory.filter(a => {
            if (!matchesTypeFilter(a.type, a.test)) return false;
            if (searchQuery) {
                const combined = `${a.title || ''} ${a.message || ''} ${a.ruleName || ''} ${a.user || ''} ${a.type || ''}`;
                if (!matchesSearch(combined)) return false;
            }
            return true;
        });
        const historyHtml = h.length ? h.map(a => `<div>
            <span class="grow">
                <span class="event-title">${a.test ? '<span class="badge badge-test">Test</span>' : ''}${esc(a.title || a.message || a.ruleName)}</span>
                <span class="sub">${new Date(a.shownAt || a.at).toLocaleTimeString()}</span>
            </span>
            <button class="rp" data-alert="${esc(a.id)}" title="Show this exact alert again">${REPLAY_ICON}</button>
        </div>`).join('') : '<div class="empty">No alerts shown matching current filter.</div>';
        if (historyHtml !== _lastHistoryHtml) {
            _lastHistoryHtml = historyHtml;
            $('history').innerHTML = historyHtml;
        }
    }

    async function refresh() {
        try {
            const res = await fetch('/api/alerts', { cache: 'no-store' });
            queue = (await res.json()).queue || {};
            render();
        } catch { /* server restarting */ }
    }

    document.addEventListener('click', async event => {
        const b = event.target.closest('button');
        if (!b) return;
        try {
            if (b.dataset.queue) await post('/api/alerts/queue', { action: b.dataset.queue });
            else if (b.dataset.event) await post('/api/alerts/replay', { eventId: b.dataset.event });
            else if (b.dataset.alert) await post('/api/alerts/replay', { alertId: b.dataset.alert });
            else return;
            refresh();
        } catch (err) { toast(err.message); }
    });

    pollVisible(refresh, 2000);
    refresh();
})();
</script>
</body>
</html>

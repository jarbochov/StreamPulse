<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/admin.css">
    <script src="/appearance.js"></script>
    <script src="/js/image-picker.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Overlay Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg-page); color: var(--text); padding: 1rem; max-width: 640px; margin: 0 auto; }
        h1 { font-size: 1.1rem; margin-bottom: .2rem; }
        .sub { color: var(--text-muted); font-size: .8rem; margin-bottom: .9rem; }
        .btn { border: 1px solid var(--border); background: var(--bg-raised); color: var(--text); border-radius: 8px; padding: .7rem 1rem; font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:hover { border-color: var(--accent); }
        .btn.primary { background: var(--success-strong); border-color: var(--success-strong); color: #fff; }
        .btn.active { border-color: var(--accent); background: var(--accent-bg); }
        .nav { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: .6rem; }
        .row { display: flex; gap: .5rem; margin-bottom: .9rem; }
        .row .btn { flex: 1; }
        .pages { display: grid; gap: .45rem; }
        .page { text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .page.current { border-color: var(--accent); background: var(--accent-bg); }
        .page small { color: var(--text-muted); font-weight: 400; }
        .page-entry { display:flex; gap:.6rem; align-items:center; }
        .page-entry .page { flex:1; min-width:0; gap:.5rem; }
        .page-entry .page span { overflow-wrap:anywhere; }
        .page-entry .page:disabled { opacity:.45; }
        .page-toggle { display:flex; align-items:center; justify-content:center; width:44px; min-height:44px; flex:none; cursor:pointer; }
        .page-toggle:has(input:disabled) { cursor:not-allowed; opacity:.5; }
        .msg { padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); }
        h2 { font-size: .95rem; margin: 1.2rem 0 .5rem; display: flex; align-items: center; gap: 6px; }
        .status { font-size: .8rem; color: var(--text-muted); margin-top: .8rem; }
        .tabs { display:flex; gap:.5rem; margin-bottom:1rem; }
        [hidden] { display:none !important; }
        .speaker-fields { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:1rem .8rem; margin:1rem 0; }
        .speaker-fields label { display:grid; gap:.3rem; font-size:.8rem; color:var(--text-muted); }
        .speaker-fields .wide { grid-column:1 / -1; }
        .speaker-field { display:grid; gap:.4rem; min-width:0; align-content:start; font-size:.875rem; }
        .speaker-input-row { position:relative; min-width:0; flex:1; }
        .speaker-fields input:not([type="checkbox"]) { width:100%; min-width:0; padding:.6rem; border:1px solid var(--border); border-radius:6px; background:var(--bg-inset); color:var(--text); font:inherit; }
        .speaker-input-row.has-toggle input:not([type="checkbox"]) { padding-right:52px; }
        .speaker-fields .speaker-toggle { position:absolute; right:.3rem; top:50%; transform:translateY(-50%); display:flex; align-items:center; justify-content:center; width:40px; height:36px; cursor:pointer; }
        .speaker-toggle input, .page-toggle input { appearance:none; width:28px !important; height:16px !important; border:1px solid var(--border); border-radius:999px; background:var(--bg-inset); cursor:inherit; position:relative; flex:none; }
        .speaker-toggle input::before, .page-toggle input::before { content:''; position:absolute; width:10px; height:10px; top:2px; left:2px; border-radius:50%; background:var(--text-muted); }
        .speaker-toggle input:checked, .page-toggle input:checked { background:var(--accent); border-color:var(--accent); }
        .speaker-toggle input:checked::before, .page-toggle input:checked::before { transform:translateX(12px); background:var(--bg-page); }
        .speaker-toggle input:focus-visible, .page-toggle input:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
        .avatar-source { display:grid; grid-template-columns:64px minmax(0, 1fr); gap:.75rem; align-items:start; }
        .avatar-preview { width:64px; height:64px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:10px; background:var(--bg-inset); overflow:hidden; color:var(--text-muted); }
        .avatar-preview img { width:100%; height:100%; object-fit:contain; }
        .avatar-controls { display:grid; gap:.55rem; min-width:0; }
        .avatar-actions { display:flex; flex-wrap:wrap; gap:.4rem; }
        .avatar-actions .btn { padding:.4rem .6rem; font-size:.78rem; font-weight:500; }
        .avatar-source .hint { margin:0; font-size:.72rem; }
        [data-avatar-field]:focus-visible { outline:2px solid var(--accent); outline-offset:4px; border-radius:6px; }
        .hint { font-size:.8rem; color:var(--text-muted); margin:.5rem 0; }
        .speaker-card { margin-bottom:.8rem; }
        .speaker-card summary { cursor:pointer; font-weight:600; }
        @media (max-width:520px) { .speaker-fields { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <header class="header" style="margin-bottom: 0.75rem;">
        <h1>StreamPulse <span id="title">Overlay Control</span></h1>
        <div id="main-nav" class="nav"></div>
    </header>
    <script src="/nav.js"></script>
    <p class="sub" id="sub"></p>
    <nav class="tabs-nav tabs" role="tablist" aria-label="Overlay controls" style="margin-bottom:1rem;">
        <button class="tab-btn btn active" id="tab-playback" role="tab" data-tab="playback" aria-controls="body" aria-selected="true">Playback</button>
        <button class="tab-btn btn" id="tab-speakers" role="tab" data-tab="speakers" aria-controls="speakers-panel" aria-selected="false">Speakers</button>
    </nav>
    <div id="body" role="tabpanel" aria-labelledby="tab-playback"><div class="msg">Loading…</div></div>
    <div id="speakers-panel" role="tabpanel" aria-labelledby="tab-speakers" hidden>
        <p class="hint" id="audio-status"></p>
        <button class="btn" type="button" id="refresh-speakers">Refresh badges &amp; audio sources</button>
        <p class="hint">Audio must exceed the badge's sensitivity gate. Adjust the gate in the overlay editor if normal speech stays below it.</p>
        <datalist id="speaker-audio-inputs"></datalist>
        <div id="speaker-badges" style="margin-top:1rem;"></div>
    </div>
    <p class="status" id="status"></p>
    <script>
    const id = new URLSearchParams(location.search).get('id') || '';
    const api = `/api/custom-overlays/${encodeURIComponent(id)}/page`;
    const slideApi = `/api/custom-overlays/${encodeURIComponent(id)}/slideshow`;
    const videoApi = `/api/custom-overlays/${encodeURIComponent(id)}/video`;
    const cutoutApi = `/api/custom-overlays/${encodeURIComponent(id)}/cutout`;
    const speakersApi = `/api/custom-overlays/${encodeURIComponent(id)}/speakers`;
    const $ = key => document.getElementById(key);
    const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let state = null, slides = [], videos = [], cutouts = [];
    let speakers = [], activeTab = localStorage.getItem(`overlay-control:${id}:tab`) || 'playback';
    const drafts = new Map();
    const dirtySpeakers = new Set();
    const avatarUploads = new Set();

    function setTab(tab) {
        activeTab = tab === 'speakers' ? 'speakers' : 'playback';
        for (const button of document.querySelectorAll('[data-tab]')) {
            const active = button.dataset.tab === activeTab;
            button.classList.toggle('active', active);
            button.setAttribute('aria-selected', String(active));
            button.tabIndex = active ? 0 : -1;
        }
        $('body').hidden = activeTab !== 'playback';
        $('speakers-panel').hidden = activeTab !== 'speakers';
        localStorage.setItem(`overlay-control:${id}:tab`, activeTab);
    }

    function speakerValues(badge) {
        const config = badge.speakerBadge || {}, speaker = config.speaker || {};
        return { name: speaker.name || '', handle: speaker.handle || '', pronouns: speaker.pronouns || '',
            avatarSrc: speaker.avatarSrc || '', statusText: speaker.callIn?.statusText || '', location: speaker.callIn?.location || '',
            showHandle: speaker.showHandle !== false, showPronouns: speaker.showPronouns !== false,
            showAvatar: speaker.showAvatar !== false, callInEnabled: speaker.callIn?.enabled === true,
            showLocation: speaker.callIn?.showLocation !== false,
            inputName: config.audio?.inputName || 'Mic/Aux' };
    }

    function readSpeakerForm(form) {
        const values = Object.fromEntries(new FormData(form));
        for (const key of ['showHandle', 'showPronouns', 'showAvatar', 'callInEnabled', 'showLocation']) {
            values[key] = form.elements[key].checked;
        }
        return values;
    }

    function avatarField(badge, values) {
        return `<div class="speaker-field wide" data-avatar-field tabindex="0" aria-label="Avatar image. Paste a copied image here.">
            <label for="${esc(badge.id)}-avatarSrc">Avatar image</label>
            <div class="avatar-source">
                <div class="avatar-preview" data-avatar-preview></div>
                <div class="avatar-controls">
                    <div class="speaker-input-row has-toggle"><input id="${esc(badge.id)}-avatarSrc" name="avatarSrc" value="${esc(values.avatarSrc)}" maxlength="500" placeholder="Image URL or library path" aria-label="Avatar image URL">
                        <label class="speaker-toggle" title="Show avatar"><input type="checkbox" role="switch" name="showAvatar" aria-label="Show avatar" ${values.showAvatar ? 'checked' : ''}></label>
                    </div>
                    <div class="avatar-actions">
                        <button class="btn" type="button" data-speaker-avatar>Library...</button>
                        <button class="btn" type="button" data-avatar-upload>Upload...</button>
                        <button class="btn" type="button" data-avatar-paste>Paste image</button>
                    </div>
                    <input type="file" accept="image/*" data-avatar-file hidden>
                    <p class="hint">Upload, paste a copied image here, or enter an image URL. Save badge to apply.</p>
                    <p class="hint" data-avatar-status role="status" hidden></p>
                </div>
            </div>
        </div>`;
    }

    function updateAvatarPreview(form) {
        const preview = form.querySelector('[data-avatar-preview]');
        const src = form.elements.avatarSrc.value.trim();
        const placeholder = () => {
            preview.innerHTML = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>';
            preview.title = src ? 'Image could not be loaded' : 'No avatar image selected';
        };
        placeholder();
        if (!src) return;
        const image = new Image();
        image.alt = 'Selected avatar';
        image.onload = () => {
            if (form.elements.avatarSrc.value.trim() !== src) return;
            preview.replaceChildren(image);
            preview.title = 'Selected avatar';
        };
        image.src = src;
    }

    function speakerForm(element) {
        return [...document.querySelectorAll('[data-speaker-form]')].find(form => form.dataset.speakerForm === element);
    }

    function setAvatar(element, url) {
        const form = speakerForm(element);
        if (!form) return;
        form.elements.avatarSrc.value = url;
        form.elements.avatarSrc.dispatchEvent(new Event('input', { bubbles:true }));
    }

    function avatarStatus(element, message) {
        const hint = speakerForm(element)?.querySelector('[data-avatar-status]');
        if (hint) { hint.textContent = message; hint.hidden = !message; }
    }

    async function uploadAvatar(element, file) {
        if (avatarUploads.has(element)) return;
        if (!file.type.startsWith('image/')) { avatarStatus(element, 'Choose an image file.'); return; }
        avatarUploads.add(element);
        setAvatarBusy(element, true);
        avatarStatus(element, 'Uploading image...');
        try {
            const response = await fetch('/api/custom-overlays/assets', {
                method:'POST', headers:{ 'Content-Type':file.type, 'X-Asset-Name':file.name || 'pasted-avatar' }, body:file
            });
            const data = await response.json();
            if (!response.ok || !data.url) throw new Error(data.error || 'Image upload failed');
            setAvatar(element, data.url);
            avatarStatus(element, 'Image added to the library. Save badge to apply.');
        } catch (error) { avatarStatus(element, error.message); }
        finally { avatarUploads.delete(element); setAvatarBusy(element, false); }
    }

    function setAvatarBusy(element, busy) {
        const form = speakerForm(element);
        if (!form) return;
        form.querySelector('[data-avatar-field]').setAttribute('aria-busy', String(busy));
        form.elements.avatarSrc.readOnly = busy;
        form.querySelectorAll('.avatar-actions button, button[type="submit"]').forEach(button => { button.disabled = busy; });
    }

    function drawSpeakers() {
        const open = new Set([...document.querySelectorAll('[data-speaker][open]')].map(card => card.dataset.speaker));
        $('speaker-badges').innerHTML = speakers.length ? speakers.map((badge, index) => {
            const values = drafts.get(badge.id) || speakerValues(badge);
            const fields = [['name', 'Display name', 80], ['handle', 'Handle / subtitle', 60, 'showHandle'], ['pronouns', 'Pronouns', 30, 'showPronouns'],
                ['avatarSrc', 'Avatar URL / library asset', 500, 'showAvatar'], ['statusText', 'Call-in status', 40, 'callInEnabled'], ['location', 'Caller location', 80, 'showLocation'], ['inputName', 'OBS audio source', 100]];
            return `<details class="msg speaker-card" data-speaker="${esc(badge.id)}" ${open.has(badge.id) || index === 0 ? 'open' : ''}>
                <summary>${esc(badge.name)}${badge.page ? ` <small>(${esc(badge.page)})</small>` : ''}</summary>
                <form data-speaker-form="${esc(badge.id)}"><div class="speaker-fields">${fields.map(([key, label, max, toggle]) =>
                    key === 'avatarSrc' ? avatarField(badge, values) : `<div class="speaker-field ${key === 'inputName' ? 'wide' : ''}"><label for="${esc(badge.id)}-${key}">${label}</label><div class="speaker-input-row${toggle ? ' has-toggle' : ''}"><input id="${esc(badge.id)}-${key}" name="${key}" value="${esc(values[key])}" maxlength="${max}" ${key === 'inputName' ? 'list="speaker-audio-inputs"' : ''}>${toggle ? `<label class="speaker-toggle" title="Show ${label.toLowerCase()}"><input type="checkbox" role="switch" name="${toggle}" aria-label="Show ${label.toLowerCase()}" ${values[toggle] ? 'checked' : ''}></label>` : ''}</div></div>`).join('')}</div>
                <button class="btn primary" type="submit">Save badge</button>
                <span class="hint" data-speaker-status>${dirtySpeakers.has(badge.id) ? 'Unsaved changes' : ''}</span>
                <p class="hint" data-speaker-meter style="font-variant-numeric:tabular-nums;min-height:2.5em;">Waiting for this source's live audio meter.</p></form></details>`;
        }).join('') : '<div class="msg">No speaker badges in this overlay. Add a Speaker Badge in the custom overlay editor.</div>';
        for (const form of document.querySelectorAll('[data-speaker-form]')) {
            updateAvatarPreview(form);
            if (avatarUploads.has(form.dataset.speakerForm)) {
                setAvatarBusy(form.dataset.speakerForm, true);
                avatarStatus(form.dataset.speakerForm, 'Uploading image...');
            }
        }
    }

    async function loadSpeakers() {
        const response = await fetch(speakersApi, { cache:'no-store' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not load speaker badges');
        speakers = data.speakers || [];
        drawSpeakers();
    }

    async function loadAudioInputs() {
        try {
            const response = await fetch('/api/obs/audio-inputs', { cache:'no-store' });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Audio sources unavailable');
            $('speaker-audio-inputs').innerHTML = (data.inputs || []).map(name => `<option value="${esc(name)}"></option>`).join('');
            $('audio-status').textContent = data.connected ? `OBS connected · ${(data.inputs || []).length} audio sources. You can also type an exact source name.` : '';
            if (!data.connected) $('audio-status').innerHTML = 'OBS disconnected. Configure the global connection in <a href="/config-editor.html#connection" target="_blank" rel="noopener">System Config → Connection &amp; Security → OBS Connection</a>. You can still save source names.';
        } catch (error) { $('audio-status').textContent = error.message; }
    }

    document.addEventListener('input', event => {
        const form = event.target.closest('[data-speaker-form]');
        if (!form) return;
        drafts.set(form.dataset.speakerForm, readSpeakerForm(form));
        dirtySpeakers.add(form.dataset.speakerForm);
        form.querySelector('[data-speaker-status]').textContent = 'Unsaved changes';
        if (event.target.name === 'avatarSrc') updateAvatarPreview(form);
    });
    document.addEventListener('change', event => {
        if (event.target.matches('[data-page-toggle]')) {
            const toggle = event.target;
            toggle.disabled = true;
            send({ action:toggle.checked ? 'enable' : 'disable', page:toggle.dataset.pageToggle });
            return;
        }
        if (!event.target.matches('[data-avatar-file]')) return;
        const file = event.target.files[0], form = event.target.closest('[data-speaker-form]');
        event.target.value = '';
        if (file) uploadAvatar(form.dataset.speakerForm, file);
    });
    document.addEventListener('paste', event => {
        const field = event.target.closest('[data-avatar-field]');
        if (!field) return;
        const file = [...(event.clipboardData?.files || [])].find(item => item.type.startsWith('image/'));
        if (!file) return;
        event.preventDefault();
        uploadAvatar(field.closest('[data-speaker-form]').dataset.speakerForm, file);
    });
    document.addEventListener('submit', async event => {
        const form = event.target.closest('[data-speaker-form]');
        if (!form) return;
        event.preventDefault();
        const element = form.dataset.speakerForm, values = readSpeakerForm(form);
        if (avatarUploads.has(element)) return;
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        try {
            const response = await fetch(speakersApi, { method:'PATCH', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({
                element, speaker:{ name:values.name, handle:values.handle, pronouns:values.pronouns, avatarSrc:values.avatarSrc,
                    showAvatar:values.showAvatar, showHandle:values.showHandle, showPronouns:values.showPronouns,
                    callIn:{ enabled:values.callInEnabled, showLocation:values.showLocation, statusText:values.statusText, location:values.location } }, audio:{ inputName:values.inputName }
            }) });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Could not save badge');
            dirtySpeakers.delete(element);
            drafts.delete(element);
            speakers = data.speakers || [];
            drawSpeakers();
            $('status').textContent = 'Speaker badge saved. Connected overlays update immediately.';
        } catch (error) { form.querySelector('[data-speaker-status]').textContent = error.message; }
        finally { button.disabled = false; }
    });

    async function slide(action, element) {
        try {
            const r = await fetch(slideApi, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, element }) });
            const d = await r.json();
            $('status').textContent = d.listeners ? `Slideshow: ${action}` : 'No live overlay connected (open in OBS or runtime).';
        } catch (error) { $('status').textContent = error.message; }
    }

    async function videoCtl(action, element) {
        try {
            const r = await fetch(videoApi, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, element }) });
            const d = await r.json();
            $('status').textContent = d.listeners ? `Video: ${action}` : 'No live overlay connected (open in OBS or runtime).';
        } catch (error) { $('status').textContent = error.message; }
    }

    async function cutoutCtl(action, element) {
        try {
            const r = await fetch(cutoutApi, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, element }) });
            const d = await r.json();
            $('status').textContent = d.listeners ? `Cutout: ${action}` : 'No live overlay connected (open in OBS or runtime).';
        } catch (error) { $('status').textContent = error.message; }
    }

    function slideHtml() {
        if (!slides.length) return '';
        return '<h2><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Slideshows</h2><div class="pages">' + slides.map(s => `<div class="msg"><b>${esc(s.name)}</b>
            <div class="nav" style="margin:.5rem 0 0"><button class="btn" data-slide="prev" data-el="${esc(s.id)}">Previous</button><button class="btn primary" data-slide="next" data-el="${esc(s.id)}">Next</button></div>
            <div class="row" style="margin:.5rem 0 0"><button class="btn" data-slide="toggle" data-el="${esc(s.id)}">Pause / play</button></div></div>`).join('') + '</div>';
    }

    function videoHtml() {
        if (!videos.length) return '';
        return '<h2><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>Video playback</h2><div class="pages">' + videos.map(v => `<div class="msg"><b>${esc(v.name)}</b>
            <div class="nav" style="margin:.5rem 0 0">
                <button class="btn primary" data-video="toggle" data-el="${esc(v.id)}">Play / Pause</button>
                <button class="btn" data-video="restart" data-el="${esc(v.id)}">Restart</button>
            </div>
            <div class="row" style="margin:.5rem 0 0">
                <button class="btn" data-video="stop" data-el="${esc(v.id)}">Stop</button>
                <button class="btn" data-video="toggle-mute" data-el="${esc(v.id)}">Mute / Unmute</button>
            </div></div>`).join('') + '</div>';
    }

    function cutoutHtml() {
        if (!cutouts.length) return '';
        return '<h2><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="4"/></svg>Cutouts (Alpha Punchthrough)</h2><div class="pages">' + cutouts.map(c => `<div class="msg"><b>${esc(c.name)}</b> <small style="color:var(--text-muted);text-transform:capitalize;">(${esc(c.shape)})</small>
            <div class="nav" style="margin:.5rem 0 0">
                <button class="btn primary" data-cutout="toggle" data-el="${esc(c.id)}">Toggle Hole</button>
                <button class="btn" data-cutout="show" data-el="${esc(c.id)}">Punch Hole</button>
            </div>
            <div class="row" style="margin:.5rem 0 0">
                <button class="btn" data-cutout="hide" data-el="${esc(c.id)}">Fill (Cover Hole)</button>
            </div></div>`).join('') + '</div>';
    }

    async function send(body) {
        try {
            const response = await fetch(api, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Request failed');
            state = data; draw();
        } catch (error) { draw(); $('status').textContent = error.message; }
    }

    function draw() {
        if (!state) return;
        $('title').textContent = `Overlay control · ${id}`;
        const extra = slideHtml() + videoHtml() + cutoutHtml();
        if (!state.enabled) {
            $('body').innerHTML = (extra ? '' : '<div class="msg">This overlay does not have pages, slideshows, videos, or cutouts configured.</div>') + extra;
            $('sub').textContent = '';
            return;
        }
        $('sub').textContent = `Showing “${state.name}” (${state.index + 1} of ${state.count})`;
        $('body').innerHTML = `
            <div class="nav">
                <button class="btn" data-act="prev"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Previous</button>
                <button class="btn primary" data-act="next">Next<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
            </div>
            <div class="row">
                <button class="btn" data-act="first"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>First</button>
                <button class="btn" data-act="last">Last<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
                <button class="btn${state.auto ? ' active' : ''}" data-act="auto">${state.auto ? 'Pause Auto' : 'Start Auto'}</button>
            </div>
            <p class="hint">Switch pages on or off. Changes save immediately; disabled pages are skipped during playback.</p>
            <div class="pages">${state.pages.map((p, i) => {
                const enabled = p.enabled !== false;
                const lastEnabled = enabled && state.pages.filter(page => page.enabled !== false).length === 1;
                const title = lastEnabled ? 'At least one page must stay enabled' : `${enabled ? 'Disable' : 'Enable'} ${p.name}`;
                return `<div class="page-entry"><button class="btn page${i === state.index ? ' current' : ''}" data-page="${esc(p.id)}"${enabled ? '' : ' disabled'}><span>${i + 1}. ${esc(p.name)}</span><small>${enabled ? (p.duration ? `${p.duration}s` : '') : 'Off'}</small></button>
                    <label class="page-toggle" title="${esc(title)}"><input type="checkbox" role="switch" data-page-toggle="${esc(p.id)}" aria-label="Enable ${esc(p.name)}" ${enabled ? 'checked' : ''} ${lastEnabled ? 'disabled' : ''}></label></div>`;
            }).join('')}</div>` + extra;
    }

    document.addEventListener('click', event => {
        const t = event.target.closest('button'); if (!t) return;
        if (t.dataset.tab) return setTab(t.dataset.tab);
        if (t.hasAttribute('data-avatar-upload')) {
            t.closest('[data-speaker-form]').querySelector('[data-avatar-file]').click();
            return;
        }
        if (t.hasAttribute('data-avatar-paste')) {
            const form = t.closest('[data-speaker-form]'), element = form.dataset.speakerForm;
            (async () => {
                try {
                    if (!navigator.clipboard?.read) throw new Error('Clipboard image access is unavailable.');
                    const items = await navigator.clipboard.read();
                    for (const item of items) {
                        const type = item.types.find(type => type.startsWith('image/'));
                        if (type) { await uploadAvatar(element, await item.getType(type)); return; }
                    }
                    throw new Error('No image found in the clipboard.');
                } catch (error) {
                    avatarStatus(element, `${error.message} Focus the avatar area and press Ctrl+V or Cmd+V to paste an image.`);
                    speakerForm(element)?.querySelector('[data-avatar-field]').focus();
                }
            })();
            return;
        }
        if (t.hasAttribute('data-speaker-avatar')) {
            const form = t.closest('[data-speaker-form]'), element = form.dataset.speakerForm;
            ImagePicker.open({ value:form.elements.avatarSrc.value, onPick: url => setAvatar(element, url) });
            return;
        }
        if (t.id === 'refresh-speakers') {
            Promise.all([loadSpeakers(), loadAudioInputs()]).catch(error => { $('status').textContent = error.message; });
            return;
        }
        if (t.dataset.video) return videoCtl(t.dataset.video, t.dataset.el);
        if (t.dataset.cutout) return cutoutCtl(t.dataset.cutout, t.dataset.el);
        if (t.dataset.slide) return slide(t.dataset.slide, t.dataset.el);
        if (t.dataset.page) send({ action: 'goto', page: t.dataset.page });
        else if (t.dataset.act === 'auto') send({ action: 'auto', auto: !state.auto });
        else if (t.dataset.act) send({ action: t.dataset.act });
    });

    document.addEventListener('keydown', event => {
        if (event.target.matches('[data-tab]') && ['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(event.key)) {
            event.preventDefault();
            setTab(event.key === 'Home' ? 'playback' : event.key === 'End' ? 'speakers' : activeTab === 'speakers' ? 'playback' : 'speakers');
            $(`tab-${activeTab}`).focus();
            return;
        }
        if (event.target.matches('input, textarea, select') || activeTab !== 'playback') return;
        if (event.key === 'ArrowRight') send({ action: 'next' });
        else if (event.key === 'ArrowLeft') send({ action: 'prev' });
    });

    async function load() {
        const response = await fetch(api, { cache: 'no-store' });
        if (!response.ok) { $('body').innerHTML = `<div class="msg">Overlay “${esc(id)}” not found.</div>`; return; }
        state = await response.json();
        try {
            const o = await (await fetch(`/api/custom-overlays/${encodeURIComponent(id)}`, { cache: 'no-store' })).json();
            const list = o.overlay || o;
            slides = (list.elements || []).filter(e => e.type === 'slideshow').map((e, i) => ({ id: e.id, name: e.name || `Slideshow ${i + 1}` }));
            videos = (list.elements || []).filter(e => e.type === 'video' || (e.type === 'embed' && /youtube\.com|youtu\.be/i.test(e.src || ''))).map((e, i) => ({ id: e.id, name: e.name || (e.type === 'video' ? `Video ${i + 1}` : `YouTube Embed ${i + 1}`), src: e.src || '' }));
            cutouts = (list.elements || []).filter(e => e.type === 'cutout').map((e, i) => ({ id: e.id, name: e.name || `Cutout ${i + 1}`, shape: e.cutout?.shape || 'rectangle' }));
        } catch { slides = []; videos = []; cutouts = []; }
        draw();
        await loadSpeakers();
    }

    function connect() {
        const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`);
        socket.addEventListener('message', event => {
            try {
                const m = JSON.parse(event.data);
                if (m.type === 'obs-audio-meter' && Number.isFinite(m.data?.db)) {
                    for (const form of document.querySelectorAll('[data-speaker-form]')) {
                        if (form.elements.inputName.value !== m.data.input) continue;
                        const badge = speakers.find(item => item.id === form.dataset.speakerForm);
                        const gate = badge?.speakerBadge?.audio?.thresholdDb ?? -36;
                        const hint = form.querySelector('[data-speaker-meter]'), now = Date.now();
                        if (hint._source !== m.data.input) { hint._source = m.data.input; hint._smoothDb = m.data.db; }
                        else hint._smoothDb += (m.data.db - hint._smoothDb) * Math.min(1, (now - hint._seenAt) / 300);
                        hint._seenAt = now;
                        if (now - (hint._readoutAt || 0) < 300) continue;
                        hint._readoutAt = now;
                        hint.textContent = `Input: ${Math.round(hint._smoothDb)} dB / Gate: ${gate} dB`;
                    }
                }
                if (m.type === 'custom-overlay-page' && m.data?.id === id) { state = m.data; draw(); }
                else if (m.type === 'custom-overlay-update' && m.data?.id === id) load().catch(error => { $('status').textContent = error.message; });
            } catch {}
        });
        socket.addEventListener('close', () => setTimeout(connect, 2000));
    }
    setTab(activeTab);
    load().catch(error => { $('status').textContent = error.message; });
    loadAudioInputs();
    connect();
    </script>
</body>
</html>

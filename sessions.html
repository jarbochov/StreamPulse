<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Credits — Session History</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; }

        .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.3rem; font-weight: 600; }
        .header h1 span { color: #58a6ff; }
        .nav { display: flex; gap: 0.75rem; }
        .nav a { color: #8b949e; text-decoration: none; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s; }
        .nav a:hover { color: #e1e4e8; background: #21262d; }

        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }

        .session-list { display: flex; flex-direction: column; gap: 0.5rem; }

        .session-item { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem 1.25rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .session-item:hover { border-color: #58a6ff; background: #1a2332; }
        .session-item.active { border-color: #58a6ff; background: #1a2332; }
        .session-date { font-weight: 600; font-size: 1rem; }
        .session-meta { display: flex; gap: 1rem; font-size: 0.8rem; color: #8b949e; }
        .session-meta .badge { background: #21262d; padding: 0.2rem 0.6rem; border-radius: 4px; }

        .detail-panel { margin-top: 1.5rem; background: #161b22; border: 1px solid #30363d; border-radius: 8px; display: none; }
        .detail-panel.open { display: block; }
        .detail-header { padding: 1.25rem; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .detail-header h2 { font-size: 1.1rem; }
        .detail-close { background: none; border: none; color: #8b949e; font-size: 1.2rem; cursor: pointer; }
        .detail-close:hover { color: #e1e4e8; }

        .detail-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 0.5rem; padding: 1.25rem; border-bottom: 1px solid #30363d; }
        .detail-stat { text-align: center; padding: 0.5rem; background: #0d1117; border-radius: 6px; }
        .detail-stat .value { font-size: 1.3rem; font-weight: 700; color: #58a6ff; }
        .detail-stat .label { font-size: 0.7rem; color: #8b949e; margin-top: 0.15rem; }

        .detail-tabs { display: flex; border-bottom: 1px solid #30363d; padding: 0 1.25rem; }
        .tab { padding: 0.75rem 1rem; font-size: 0.85rem; color: #8b949e; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab:hover { color: #e1e4e8; }
        .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }

        .tab-content { padding: 1.25rem; max-height: 400px; overflow-y: auto; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .entry { display: flex; align-items: center; gap: 0.6rem; padding: 0.35rem 0; border-bottom: 1px solid #21262d; font-size: 0.85rem; }
        .entry:last-child { border-bottom: none; }
        .entry img { width: 22px; height: 22px; border-radius: 50%; }
        .entry .name { flex: 1; }
        .entry .count { color: #8b949e; }

        .empty { color: #484f58; text-align: center; padding: 2rem; font-size: 0.9rem; }

        .compare-bar { display: none; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 0.75rem 1.25rem; margin-bottom: 1rem; align-items: center; gap: 0.75rem; }
        .compare-bar.show { display: flex; }
        .compare-bar span { font-size: 0.85rem; color: #8b949e; }
        .compare-bar .sel { color: #58a6ff; font-weight: 600; }
        .compare-btn { padding: 0.4rem 0.8rem; background: #1f6feb; border: none; border-radius: 6px; color: white; font-size: 0.8rem; cursor: pointer; }
        .compare-btn:hover { background: #388bfd; }
        .compare-btn.cancel { background: #21262d; color: #8b949e; }

        .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
        .compare-col { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.25rem; }
        .compare-col h3 { font-size: 0.95rem; color: #58a6ff; margin-bottom: 1rem; }
        .compare-stat { display: flex; justify-content: space-between; padding: 0.3rem 0; font-size: 0.85rem; border-bottom: 1px solid #21262d; }
        .compare-stat:last-child { border-bottom: none; }
        .compare-stat .label { color: #8b949e; }
        .compare-stat .value { font-weight: 600; }
        .compare-stat .value.higher { color: #3fb950; }
        .compare-stat .value.lower { color: #f85149; }

        .session-checkbox { margin-right: 0.5rem; accent-color: #58a6ff; }

        .nav .dropdown { position: relative; display: flex; align-items: center; }
        .nav .dropdown-toggle { color: #8b949e; text-decoration: none; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s; cursor: pointer; display: block; }
        .nav .dropdown-toggle:hover { color: #e1e4e8; background: #21262d; }
        .nav .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 0.4rem 0; min-width: 180px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .nav .dropdown::after { content: ''; position: absolute; top: 100%; left: 0; right: 0; height: 8px; }
        .nav .dropdown:hover .dropdown-menu { display: block; }
        .nav .dropdown-menu a { display: block; padding: 0.5rem 1rem; color: #8b949e; text-decoration: none; font-size: 0.85rem; transition: all 0.15s; }
        .nav .dropdown-menu a:hover { color: #e1e4e8; background: #21262d; }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .session-item { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            .header { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Session <span>History</span></h1>
        <div class="nav">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/credits.html">Credits</a>
            <a href="/credits.html?preview=true" target="_blank">Preview</a>
            <a href="/stats.html">Stats</a>
            <a href="/hashtags.html">Hashtags</a>
            <div class="dropdown">
                <a href="#" class="dropdown-toggle">Manage ▾</a>
                <div class="dropdown-menu">
                    <a href="/config-editor.html">⚙️ Config</a>
                    <a href="/manage-hashtags.html">🏷️ Hashtag Tools</a>
                    <a href="/sessions.html">📁 Sessions</a>
                </div>
            </div>
            <a href="/api.html">API</a>
            <a href="/docs.html">Docs</a>
        </div>
    </div>

    <div class="container">
        <div class="compare-bar" id="compare-bar">
            <span>Compare: <span class="sel" id="compare-sel-1">—</span> vs <span class="sel" id="compare-sel-2">—</span></span>
            <button class="compare-btn" id="compare-go" onclick="runCompare()" disabled>Compare</button>
            <button class="compare-btn cancel" onclick="cancelCompare()">Cancel</button>
        </div>

        <div style="margin-bottom: 0.75rem;">
            <button class="compare-btn" id="compare-toggle" onclick="toggleCompareMode()" style="background: #21262d; color: #8b949e;">📊 Compare Sessions</button>
        </div>

        <div class="session-list" id="session-list">
            <div class="empty">Loading sessions...</div>
        </div>

        <div class="compare-grid" id="compare-grid" style="display: none;"></div>

        <div class="detail-panel" id="detail-panel">
            <div class="detail-header">
                <h2 id="detail-title">Session Details</h2>
                <button class="detail-close" onclick="closeDetail()">✕</button>
            </div>
            <div class="detail-stats" id="detail-stats"></div>
            <div class="detail-tabs" id="detail-tabs"></div>
            <div class="tab-content" id="tab-content"></div>
        </div>
    </div>

    <script>
    let sessions = [];
    let activeSession = null;
    let compareMode = false;
    let compareSelections = [];

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    async function loadSessions() {
        try {
            const res = await fetch('/api/sessions');
            sessions = await res.json();

            const list = document.getElementById('session-list');
            if (sessions.length === 0) {
                list.innerHTML = '<div class="empty">No archived sessions yet. Sessions are archived when the server restarts.</div>';
                return;
            }

            list.innerHTML = sessions.map(f => {
                const dateMatch = f.match(/chat-(\d{4}-\d{2}-\d{2})/);
                const dateStr = dateMatch ? dateMatch[1] : f.replace('.json', '');
                return `<div class="session-item" data-file="${f}" onclick="handleSessionClick('${f}', this)">
                    <input type="checkbox" class="session-checkbox" style="display: none;" onclick="event.stopPropagation(); toggleCompareSelection('${f}')">
                    <span class="session-date">${dateStr}</span>
                    <div class="session-meta">
                        <span class="badge">${f}</span>
                    </div>
                </div>`;
            }).join('');
        } catch {
            document.getElementById('session-list').innerHTML = '<div class="empty">Failed to load sessions</div>';
        }
    }

    async function loadSession(filename, el) {
        document.querySelectorAll('.session-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');

        try {
            const res = await fetch(`/api/sessions/${filename}`);
            const data = await res.json();
            activeSession = data;
            renderDetail(data, filename);
        } catch {
            document.getElementById('detail-panel').innerHTML = '<div class="empty">Failed to load session</div>';
        }
    }

    function renderDetail(data, filename) {
        const panel = document.getElementById('detail-panel');
        panel.classList.add('open');

        const dateMatch = filename.match(/chat-(\d{4}-\d{2}-\d{2})/);
        document.getElementById('detail-title').textContent = dateMatch ? `Session — ${dateMatch[1]}` : filename;

        const chatters = Object.keys(data.chatters || {}).length;
        const messages = data.messageCount || 0;
        const emotes = Object.keys(data.emotes || {}).length;
        const hashtags = Object.keys(data.hashtags || {}).length;
        const subs = (data.subscribers || []).length;
        const followers = (data.followers || []).length;
        const raids = (data.raids || []).length;

        document.getElementById('detail-stats').innerHTML = [
            { v: messages, l: 'Messages' },
            { v: chatters, l: 'Chatters' },
            { v: emotes, l: 'Emotes' },
            { v: hashtags, l: 'Hashtags' },
            { v: subs, l: 'Subs' },
            { v: followers, l: 'Followers' },
            { v: raids, l: 'Raids' }
        ].map(s => `<div class="detail-stat"><div class="value">${s.v}</div><div class="label">${s.l}</div></div>`).join('');

        const tabs = [
            { id: 'chatters', label: 'Chatters' },
            { id: 'emotes', label: 'Emotes' },
            { id: 'hashtags', label: 'Hashtags' },
            { id: 'subs', label: 'Subs' },
            { id: 'followers', label: 'Followers' },
            { id: 'raids', label: 'Raids' }
        ];

        document.getElementById('detail-tabs').innerHTML = tabs.map((t, i) =>
            `<div class="tab${i === 0 ? ' active' : ''}" onclick="switchTab('${t.id}', this)">${t.label}</div>`
        ).join('');

        const content = document.getElementById('tab-content');
        content.innerHTML = tabs.map((t, i) => `<div class="tab-pane${i === 0 ? ' active' : ''}" id="pane-${t.id}"></div>`).join('');

        // Chatters
        const chatterEntries = Object.values(data.chatters || {}).sort((a, b) => (b.messageCount || 0) - (a.messageCount || 0));
        document.getElementById('pane-chatters').innerHTML = chatterEntries.length
            ? chatterEntries.map(c => `<div class="entry">
                ${c.chatimg ? `<img src="${c.chatimg}" alt="" onerror="this.style.display='none'">` : ''}
                <span class="name">${escapeHtml(c.chatname)}</span>
                <span class="count">${c.messageCount || 0} msgs</span>
            </div>`).join('')
            : '<div class="empty">No chatters</div>';

        // Emotes
        const emoteEntries = Object.entries(data.emotes || {}).sort((a, b) => (b[1].count || 0) - (a[1].count || 0));
        document.getElementById('pane-emotes').innerHTML = emoteEntries.length
            ? emoteEntries.map(([name, e]) => `<div class="entry">
                ${e.imageUrl ? `<img src="${e.imageUrl}" alt="${escapeHtml(name)}" style="width:22px;height:22px;">` : ''}
                <span class="name">${escapeHtml(name)}</span>
                <span class="count">×${e.count || 0}</span>
            </div>`).join('')
            : '<div class="empty">No emotes</div>';

        // Hashtags
        const hashEntries = Object.entries(data.hashtags || {}).sort((a, b) => (b[1].count || 0) - (a[1].count || 0));
        document.getElementById('pane-hashtags').innerHTML = hashEntries.length
            ? hashEntries.map(([tag, h]) => `<div class="entry">
                <span class="name">${escapeHtml(tag)}</span>
                <span class="count">×${h.count || 0}</span>
            </div>`).join('')
            : '<div class="empty">No hashtags</div>';

        // Subs
        const subEntries = data.subscribers || [];
        document.getElementById('pane-subs').innerHTML = subEntries.length
            ? subEntries.map(s => `<div class="entry">
                ${s.chatimg ? `<img src="${s.chatimg}" alt="" onerror="this.style.display='none'">` : ''}
                <span class="name">${escapeHtml(s.chatname)}</span>
                ${s.membership ? `<span class="count">${escapeHtml(s.membership)}</span>` : ''}
            </div>`).join('')
            : '<div class="empty">No subscribers</div>';

        // Followers
        const followerEntries = data.followers || [];
        document.getElementById('pane-followers').innerHTML = followerEntries.length
            ? followerEntries.map(f => `<div class="entry">
                ${f.chatimg ? `<img src="${f.chatimg}" alt="" onerror="this.style.display='none'">` : ''}
                <span class="name">${escapeHtml(f.chatname)}</span>
            </div>`).join('')
            : '<div class="empty">No followers</div>';

        // Raids
        const raidEntries = data.raids || [];
        document.getElementById('pane-raids').innerHTML = raidEntries.length
            ? raidEntries.map(r => `<div class="entry">
                ${r.chatimg ? `<img src="${r.chatimg}" alt="" onerror="this.style.display='none'">` : ''}
                <span class="name">${escapeHtml(r.chatname)}</span>
                ${r.viewers ? `<span class="count">${r.viewers} viewers</span>` : ''}
            </div>`).join('')
            : '<div class="empty">No raids</div>';
    }

    function switchTab(id, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        document.getElementById(`pane-${id}`).classList.add('active');
    }

    function closeDetail() {
        document.getElementById('detail-panel').classList.remove('open');
        document.querySelectorAll('.session-item').forEach(i => i.classList.remove('active'));
    }

    function handleSessionClick(filename, el) {
        if (compareMode) return; // Use checkboxes in compare mode
        loadSession(filename, el);
    }

    // Compare mode
    function toggleCompareMode() {
        compareMode = !compareMode;
        compareSelections = [];
        const bar = document.getElementById('compare-bar');
        const toggle = document.getElementById('compare-toggle');
        const checkboxes = document.querySelectorAll('.session-checkbox');
        const grid = document.getElementById('compare-grid');

        if (compareMode) {
            bar.classList.add('show');
            toggle.textContent = '✕ Cancel Compare';
            toggle.style.background = '#f8514930';
            toggle.style.color = '#f85149';
            checkboxes.forEach(cb => { cb.style.display = 'inline'; cb.checked = false; });
            closeDetail();
            grid.style.display = 'none';
        } else {
            cancelCompare();
        }
        updateCompareBar();
    }

    function cancelCompare() {
        compareMode = false;
        compareSelections = [];
        document.getElementById('compare-bar').classList.remove('show');
        const toggle = document.getElementById('compare-toggle');
        toggle.textContent = '📊 Compare Sessions';
        toggle.style.background = '#21262d';
        toggle.style.color = '#8b949e';
        document.querySelectorAll('.session-checkbox').forEach(cb => { cb.style.display = 'none'; cb.checked = false; });
        document.getElementById('compare-grid').style.display = 'none';
    }

    function toggleCompareSelection(filename) {
        const idx = compareSelections.indexOf(filename);
        if (idx > -1) {
            compareSelections.splice(idx, 1);
        } else if (compareSelections.length < 2) {
            compareSelections.push(filename);
        } else {
            // Deselect oldest
            const oldCb = document.querySelector(`[data-file="${compareSelections[0]}"] .session-checkbox`);
            if (oldCb) oldCb.checked = false;
            compareSelections.shift();
            compareSelections.push(filename);
        }
        updateCompareBar();
    }

    function updateCompareBar() {
        const getName = f => { const m = f?.match(/chat-(\d{4}-\d{2}-\d{2})/); return m ? m[1] : f || '—'; };
        document.getElementById('compare-sel-1').textContent = getName(compareSelections[0]);
        document.getElementById('compare-sel-2').textContent = getName(compareSelections[1]);
        document.getElementById('compare-go').disabled = compareSelections.length < 2;
    }

    async function runCompare() {
        if (compareSelections.length < 2) return;
        try {
            const [res1, res2] = await Promise.all([
                fetch(`/api/sessions/${compareSelections[0]}`).then(r => r.json()),
                fetch(`/api/sessions/${compareSelections[1]}`).then(r => r.json())
            ]);
            renderCompare(compareSelections[0], res1, compareSelections[1], res2);
        } catch { /* ignore */ }
    }

    function renderCompare(name1, data1, name2, data2) {
        const grid = document.getElementById('compare-grid');
        grid.style.display = 'grid';
        closeDetail();

        const getLabel = f => { const m = f.match(/chat-(\d{4}-\d{2}-\d{2})/); return m ? m[1] : f; };
        const metrics = [
            { label: 'Messages', fn: d => d.messageCount || 0 },
            { label: 'Chatters', fn: d => Object.keys(d.chatters || {}).length },
            { label: 'Emotes', fn: d => Object.keys(d.emotes || {}).length },
            { label: 'Hashtags', fn: d => Object.keys(d.hashtags || {}).length },
            { label: 'Subscribers', fn: d => (d.subscribers || []).length },
            { label: 'Followers', fn: d => (d.followers || []).length },
            { label: 'Raids', fn: d => (d.raids || []).length },
        ];

        function renderCol(name, data, otherData) {
            return `<div class="compare-col">
                <h3>${getLabel(name)}</h3>
                ${metrics.map(m => {
                    const v = m.fn(data);
                    const ov = m.fn(otherData);
                    const cls = v > ov ? 'higher' : v < ov ? 'lower' : '';
                    return `<div class="compare-stat">
                        <span class="label">${m.label}</span>
                        <span class="value ${cls}">${v.toLocaleString()}</span>
                    </div>`;
                }).join('')}
            </div>`;
        }

        grid.innerHTML = renderCol(name1, data1, data2) + renderCol(name2, data2, data1);
    }

    loadSessions();
    </script>
</body>
</html>

name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish installers to GitHub Pre-Release?'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Target tag/version for release (e.g. v0.12.0-preview)'
        required: false
        type: string
        default: 'v0.12.0-preview'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron & Builder for packaging
        run: npm install --no-save electron@33.2.1 electron-builder@25.1.8

      - name: Run Test Suite
        run: npm test

      - name: Build macOS Application (.dmg / .zip)
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish never

      - name: Build Windows Application (.exe / portable)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Upload Desktop Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StreamPulse-Desktop-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: warn

  publish-release:
    name: Publish Pre-Release Installers
    needs: build-desktop
    if: github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: StreamPulse-Desktop-macos-latest
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: StreamPulse-Desktop-windows-latest
          path: release-assets

      - name: Create or Update Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v0.12.0-preview' }}
          name: StreamPulse Desktop ${{ github.event.inputs.release_tag || 'v0.12.0-preview' }}
          prerelease: true
          draft: false
          files: release-assets/*
          body: |
            ## StreamPulse Desktop App Preview Build
            
            Standalone desktop application for macOS and Windows.
            - macOS: `.dmg` installer and `.zip` archive (Apple Silicon and Intel)
            - Windows: `.exe` setup installer and portable executable
            
            ### macOS Gatekeeper Note
            StreamPulse is an open-source, self-hosted companion. Because pre-release builds are not signed with a paid Apple Developer ID, macOS Gatekeeper may flag the download with:
            > “StreamPulse.app” is damaged and can’t be opened. You should move it to the Trash.
            
            **To open on macOS:**
            1. Open the `.dmg` and drag **StreamPulse.app** to `/Applications`.
            2. Open **Terminal** and run:
               ```bash
               xattr -cr /Applications/StreamPulse.app
               ```
            3. Launch **StreamPulse** from Applications or Spotlight!


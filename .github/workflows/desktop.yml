name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Collect all test results, or package an already validated commit'
        type: choice
        options: [diagnostics, build]
        default: diagnostics
      validated_run_id:
        description: 'Successful diagnostics run ID for this exact commit (required for build)'
        type: string
        default: ''
      publish_release:
        description: 'Publish installers to the GitHub release?'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Target tag/version for release (e.g. v0.12.0-preview)'
        required: false
        type: string
        default: 'v0.12.0-preview'

permissions:
  contents: write
  actions: read

jobs:
  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify diagnostics run
        if: inputs.mode == 'build'
        uses: actions/github-script@v7
        env:
          DIAGNOSTICS_RUN_ID: ${{ inputs.validated_run_id }}
        with:
          script: |
            const runId = Number(process.env.DIAGNOSTICS_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) throw new Error('A successful diagnostics run ID is required.');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: runId
            });
            if (run.conclusion !== 'success' || run.head_sha !== context.sha ||
                run.path !== '.github/workflows/desktop.yml') {
              throw new Error('Diagnostics must have passed for this exact commit.');
            }

      - name: Download validation evidence
        if: inputs.mode == 'build'
        uses: actions/download-artifact@v4
        with:
          pattern: release-diagnostics-*
          path: ${{ runner.temp }}/validated-diagnostics
          run-id: ${{ inputs.validated_run_id }}
          github-token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Verify both platform summaries
        if: inputs.mode == 'build'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { testGroups } = require('./scripts/release-diagnostics.cjs');
          const expected = testGroups(require('./package.json').scripts).map(args => args.join(' '));
          for (const os of ['macos-latest', 'windows-latest']) {
            const summary = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/validated-diagnostics/release-diagnostics-${os}/results.json`));
            if (summary.sha !== process.env.GITHUB_SHA || summary.groups?.length !== expected.length ||
                summary.groups.some((group, index) => group.exitCode !== 0 || group.command !== expected[index])) {
              throw new Error(`Missing successful diagnostics for ${os} at this commit`);
            }
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Install Electron & Builder for packaging
        run: npm install --no-save electron@33.2.1 electron-builder@25.1.8

      - name: Collect every test group
        if: inputs.mode == 'diagnostics'
        run: node scripts/release-diagnostics.cjs "${{ runner.temp }}/release-diagnostics"

      - name: Upload diagnostics and logs
        if: always() && inputs.mode == 'diagnostics'
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/release-diagnostics/
          if-no-files-found: error

      - name: Build macOS Application (.dmg / .zip)
        if: inputs.mode == 'build' && runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish never

      - name: Build Windows Application (.exe / portable)
        if: inputs.mode == 'build' && runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Upload Desktop Dist Artifacts
        if: inputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: StreamPulse-Desktop-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish Release Installers
    needs: build-desktop
    if: inputs.mode == 'build' && inputs.publish_release
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: StreamPulse-Desktop-macos-latest
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: StreamPulse-Desktop-windows-latest
          path: release-assets

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v0.12.0-preview' }}
          name: StreamPulse Desktop ${{ github.event.inputs.release_tag || 'v0.12.0-preview' }}
          prerelease: ${{ contains(github.event.inputs.release_tag || 'v0.12.0-preview', '-pre') || contains(github.event.inputs.release_tag || 'v0.12.0-preview', '-beta') || contains(github.event.inputs.release_tag || 'v0.12.0-preview', '-rc') || contains(github.event.inputs.release_tag || 'v0.12.0-preview', '-alpha') }}
          make_latest: ${{ !(contains(github.event.inputs.release_tag || 'v0.12.0-preview', '-pre')) }}
          draft: false
          files: release-assets/*
          append_body: true
          body: |
            ## StreamPulse Desktop App Installers
            
            Standalone desktop application for macOS and Windows.
            - macOS: `.dmg` installer and `.zip` archive (Apple Silicon and Intel)
            - Windows: `.exe` setup installer and portable executable
            
            ### macOS Gatekeeper Note
            StreamPulse is an open-source, self-hosted companion. Because pre-release builds are not signed with a paid Apple Developer ID, macOS Gatekeeper may flag the download with:
            > “StreamPulse.app” is damaged and can’t be opened. You should move it to the Trash.
            
            **To open on macOS:**
            1. Open the `.dmg` and drag **StreamPulse.app** to `/Applications`.
            2. Open **Terminal** and run:
               ```bash
               xattr -cr /Applications/StreamPulse.app
               ```
            3. Launch **StreamPulse** from Applications or Spotlight!

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Now Playing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: transparent; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

        :root {
            --music-font-family: 'Segoe UI', system-ui, sans-serif;
            --music-text-color: #ffffff;
            --music-accent-color: #58a6ff;
            --music-bg-color: rgba(0, 0, 0, 0.7);
            --music-art-scrim: rgba(0, 0, 0, 0.85);
            --music-art-w: 200px;
            --music-art-h: 200px;
            --music-full-w: 420px;
            --music-full-h: 120px;
            --music-full-art: 0px;
            --music-full-art-actual: calc(var(--music-full-h) - 1rem);
            --music-font-scale: 1;
        }

        /* ===== ART MODE ===== */
        .mode-art {
            display: flex;
            align-items: center;
            justify-content: center;
            width: var(--music-art-w);
            height: var(--music-art-h);
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }
        .mode-art .artwork {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            filter: brightness(var(--music-art-brightness, 1));
        }
        .mode-art .art-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent 0%, var(--music-art-scrim) 40%);
            backdrop-filter: blur(var(--music-art-blur, 0px));
            -webkit-backdrop-filter: blur(var(--music-art-blur, 0px));
            padding: 0.6rem 0.6rem 0.5rem;
            min-height: 40%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transform: translateY(100%);
            transition: transform 0.4s ease;
            border-radius: 0 0 8px 8px;
        }
        .mode-art .art-overlay.visible {
            transform: translateY(0);
        }
        .mode-art .art-overlay .track-name {
            font-size: calc(14px * var(--music-font-scale));
            font-weight: 600;
            color: var(--music-text-color);
            font-family: var(--music-font-family);
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            width: 100%;
            min-width: 0;
        }
        .mode-art .art-overlay .artist-name {
            font-size: calc(11px * var(--music-font-scale));
            color: var(--music-accent-color);
            font-family: var(--music-font-family);
            margin-top: 2px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
            width: 100%;
            min-width: 0;
        }
        .mode-art .art-overlay .album-name {
            font-size: calc(10px * var(--music-font-scale));
            color: rgba(255,255,255,0.5);
            font-family: var(--music-font-family);
            margin-top: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
            width: 100%;
            min-width: 0;
        }
        .mode-art .art-overlay .year-name {
            font-size: calc(9px * var(--music-font-scale));
            color: rgba(255,255,255,0.35);
            font-family: var(--music-font-family);
            margin-top: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
        }
        .mode-art .no-art {
            width: 100%;
            height: 100%;
            background: var(--music-bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(48px * var(--music-font-scale));
            border-radius: 8px;
        }

        /* ===== NOW PLAYING LABEL (all modes) ===== */
        .np-label {
            font-size: calc(9px * var(--music-font-scale));
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--music-accent-color);
            font-family: var(--music-font-family);
            opacity: 0.85;
            margin-bottom: 2px;
        }
        /* Art mode: label sits above the art square */
        .art-wrapper { display: flex; flex-direction: column; align-items: center; }
        .art-wrapper > .np-label {
            font-size: calc(10px * var(--music-font-scale));
            margin-bottom: 0.35rem;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }
        .mode-mini .np-label { font-size: calc(9px * var(--music-font-scale)); margin-bottom: 0; margin-right: 0.4rem; flex-shrink: 0; }
        .mode-mini.layout-two .np-label,
        .mode-mini.layout-two-album .np-label { margin-right: 0; margin-bottom: 1px; }

        /* ===== FULL MODE ===== */
        .mode-full {
            display: flex;
            gap: 0.75rem;
            background: var(--music-bg-color);
            border-radius: 10px;
            padding: 0.5rem;
            max-width: var(--music-full-w);
            align-items: center;
        }
        .mode-full .artwork {
            width: var(--music-full-art-actual);
            height: var(--music-full-art-actual);
            min-width: var(--music-full-art-actual);
            object-fit: cover;
            border-radius: 6px;
        }
        .mode-full .no-art {
            width: var(--music-full-art-actual);
            height: var(--music-full-art-actual);
            min-width: var(--music-full-art-actual);
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(28px * var(--music-font-scale));
            border-radius: 6px;
        }
        .mode-full .meta {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.15rem;
            overflow: hidden;
            min-width: 0;
            flex: 1;
        }
        .mode-full .track-name {
            font-size: calc(16px * var(--music-font-scale));
            font-weight: 600;
            color: var(--music-text-color);
            font-family: var(--music-font-family);
        }
        .mode-full .artist-name {
            font-size: calc(13px * var(--music-font-scale));
            color: var(--music-accent-color);
            font-family: var(--music-font-family);
        }
        .mode-full .album-name {
            font-size: calc(11px * var(--music-font-scale));
            color: rgba(255,255,255,0.5);
            font-family: var(--music-font-family);
        }
        .mode-full .year-name {
            font-size: calc(10px * var(--music-font-scale));
            color: rgba(255,255,255,0.35);
            font-family: var(--music-font-family);
        }

        /* ===== PROGRESS BAR (all modes) ===== */
        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 0.3rem;
            overflow: hidden;
        }
        .progress-bar .progress-fill {
            height: 100%;
            background: var(--music-accent-color);
            border-radius: 2px;
            transition: width 1s linear;
        }
        .mode-art .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0;
            border-radius: 0 0 8px 8px;
            height: 3px;
            z-index: 2;
        }

        /* ===== MINI MODE ===== */
        .mode-mini {
            background: var(--music-bg-color);
            border-radius: 6px;
            padding: 0.35rem 0.75rem;
            max-width: 400px;
        }
        /* single-line layout */
        .mode-mini.layout-single .meta {
            display: flex;
            gap: 0.25rem;
            align-items: baseline;
            overflow: hidden;
            white-space: nowrap;
        }
        .mode-mini.layout-single .track-name {
            font-weight: 600;
        }
        .mode-mini.layout-single .sep {
            color: rgba(255,255,255,0.3);
            flex-shrink: 0;
        }
        /* two-line layout */
        .mode-mini.layout-two .meta {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            overflow: hidden;
        }
        /* two-line-album layout */
        .mode-mini.layout-two-album .meta {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            overflow: hidden;
        }
        .mode-mini.layout-two-album .line2 {
            display: flex;
            gap: 0.3rem;
            align-items: baseline;
        }
        .mode-mini.layout-two-album .sep {
            color: rgba(255,255,255,0.3);
            flex-shrink: 0;
        }
        /* shared mini text styles */
        .mode-mini .track-name {
            font-size: calc(14px * var(--music-font-scale));
            font-weight: 600;
            color: var(--music-text-color);
            font-family: var(--music-font-family);
        }
        .mode-mini .artist-name {
            font-size: calc(12px * var(--music-font-scale));
            color: var(--music-accent-color);
            font-family: var(--music-font-family);
        }
        .mode-mini .album-name {
            font-size: calc(11px * var(--music-font-scale));
            color: rgba(255,255,255,0.4);
            font-family: var(--music-font-family);
        }
        .mode-mini .sep {
            font-size: calc(11px * var(--music-font-scale));
        }
        .mode-mini .year-name {
            font-size: calc(10px * var(--music-font-scale));
            color: rgba(255,255,255,0.3);
            font-family: var(--music-font-family);
        }

        /* ===== MARQUEE (all modes) ===== */
        .marquee-wrap {
            overflow: hidden;
            white-space: nowrap;
        }
        .marquee-wrap .marquee-text {
            display: inline-block;
        }
        .marquee-wrap.scrolling .marquee-text {
            display: inline-block;
            animation: marquee var(--marquee-duration, 10s) linear infinite;
            animation-delay: 1.5s;
            padding-right: 3rem;
        }
        .marquee-wrap.scrolling .marquee-text::after {
            content: attr(data-text);
            padding-left: 3rem;
        }
        @keyframes marquee {
            0%, 8% { transform: translateX(0); }
            92%, 100% { transform: translateX(-50%); }
        }

        /* ===== TRANSITIONS ===== */
        .player-container {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .player-container.visible {
            opacity: 1;
        }
        .player-container.hidden-by-api {
            opacity: 0 !important;
            pointer-events: none;
        }
        .player-container.paused {
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="player" class="player-container"></div>

<script>
    const params = new URLSearchParams(window.location.search);
    const MODE = params.get('mode') || 'full';
    const POLL_INTERVAL = 3000;
    const ART_OVERLAY_DURATION = 5000;

    let currentTrack = '';
    let artOverlayTimer = null;
    let musicTheme = {};
    let artPersistInfo = false;
    let miniLayout = 'single';
    let hasFallbackArt = false;
    let labelText = '♫ Now Playing';
    let labelShow = { art: false, full: true, mini: true };

    const DEFAULT_ART_SVG = `data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#161b22"/><text x="100" y="112" text-anchor="middle" font-size="64" fill="#30363d">♫</text></svg>')}`;

    function escapeHtml(str) {
        return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function applyMusicTheme(theme) {
        const root = document.documentElement;
        if (theme.font_family) {
            // Ensure Google Font names are quoted for CSS
            const ff = theme.font_family;
            const quoted = ff.includes(',') || ff.startsWith("'") || ff.startsWith('"') ? ff : `'${ff}'`;
            root.style.setProperty('--music-font-family', quoted);
        }
        if (theme.text_color) root.style.setProperty('--music-text-color', theme.text_color);
        if (theme.accent_color) root.style.setProperty('--music-accent-color', theme.accent_color);
        if (theme.bg_color) root.style.setProperty('--music-bg-color', theme.bg_color);
        if (theme.art_scrim_color) root.style.setProperty('--music-art-scrim', theme.art_scrim_color);
        if (theme.art_brightness != null) root.style.setProperty('--music-art-brightness', theme.art_brightness);
        if (theme.art_blur != null) root.style.setProperty('--music-art-blur', theme.art_blur + 'px');
        const sizes = theme.sizes || {};
        const art = sizes.art || {};
        const full = sizes.full || {};
        root.style.setProperty('--music-art-w', (art.width || 200) + 'px');
        root.style.setProperty('--music-art-h', (art.height || 200) + 'px');
        root.style.setProperty('--music-full-w', (full.width || 420) + 'px');
        root.style.setProperty('--music-full-h', (full.height || 120) + 'px');
        // Full art thumbnail: 0 = auto (height - 1rem)
        const fullArt = parseInt(theme.full_art_size) || 0;
        root.style.setProperty('--music-full-art', fullArt ? fullArt + 'px' : '0px');
        root.style.setProperty('--music-full-art-actual', fullArt ? fullArt + 'px' : `calc(var(--music-full-h) - 1rem)`);
        if (theme.font_scale) root.style.setProperty('--music-font-scale', theme.font_scale);

        // Load Google Font — generate import URL if not provided
        const fontImport = theme.font_import || generateFontImport(theme.font_family);
        if (theme.font_family && fontImport) {
            let link = document.getElementById('music-font-link');
            if (!link) {
                link = document.createElement('link');
                link.id = 'music-font-link';
                link.rel = 'stylesheet';
                document.head.appendChild(link);
            }
            link.href = fontImport;
        }
    }

    function generateFontImport(fontFamily) {
        if (!fontFamily || fontFamily.includes('system-ui') || fontFamily.includes('Segoe UI')) return '';
        const name = fontFamily.replace(/'/g, '').trim();
        const slug = name.replace(/\s+/g, '+');
        return `https://fonts.googleapis.com/css2?family=${slug}&display=swap`;
    }

    function marqueeWrap(text, extraClass) {
        const cls = extraClass || '';
        return `<div class="marquee-wrap ${cls}"><span class="marquee-text" data-text="${escapeHtml(text)}">${escapeHtml(text)}</span></div>`;
    }

    // Measure rendered text vs container, apply scrolling only when text overflows
    function applyDynamicMarquee() {
        const SCROLL_SPEED = 40; // pixels per second
        document.querySelectorAll('.marquee-wrap').forEach(wrap => {
            const span = wrap.querySelector('.marquee-text');
            if (!span) return;
            // Reset to measure natural width
            wrap.classList.remove('scrolling');
            span.style.animation = 'none';
            // Force reflow
            void span.offsetWidth;
            const textW = span.scrollWidth;
            const containerW = wrap.clientWidth;
            if (textW > containerW) {
                const scrollTime = (textW + 48) / SCROLL_SPEED; // time for the actual scroll
                const duration = scrollTime / 0.84; // 8% pause at start + 8% at end = 84% scrolling
                wrap.style.setProperty('--marquee-duration', duration + 's');
                wrap.classList.add('scrolling');
                span.style.animation = '';
            }
        });
    }

    window.addEventListener('resize', () => requestAnimationFrame(applyDynamicMarquee));

    // Visibility settings from theme (defaults: track/artist/album on; year/progress off)
    function showField(field) {
        if (!musicTheme.fields) {
            return field !== 'year' && field !== 'progress';
        }
        return musicTheme.fields[field] !== false;
    }

    function renderLabel(mode) {
        if (!labelText || !labelShow[mode]) return '';
        return `<div class="np-label">${escapeHtml(labelText)}</div>`;
    }

    function fallbackArtSrc() {
        return hasFallbackArt ? '/api/music/fallback-art?t=' + Date.now() : DEFAULT_ART_SVG;
    }

    function renderProgressBar(data) {
        if (!showField('progress') || !data.duration) return '';
        const pct = Math.min(100, (data.position / data.duration) * 100);
        return `<div class="progress-bar"><div class="progress-fill" style="width:${pct.toFixed(1)}%"></div></div>`;
    }

    function renderArt(data) {
        const artSrc = data.artworkUrl || '';
        const artHtml = artSrc
            ? `<img class="artwork" src="${artSrc}" alt="Album Art">`
            : `<img class="artwork" src="${fallbackArtSrc()}" alt="No Art">`;

        const trackHtml = showField('track') ? `<div class="track-name">${marqueeWrap(data.track)}</div>` : '';
        const artistHtml = showField('artist') ? `<div class="artist-name">${escapeHtml(data.artist)}</div>` : '';
        const albumHtml = showField('album') ? `<div class="album-name">${escapeHtml(data.album)}</div>` : '';
        const yearHtml = showField('year') && data.year && String(data.year) !== '0' ? `<div class="year-name">${escapeHtml(String(data.year))}</div>` : '';

        return `<div class="art-wrapper">
            ${renderLabel('art')}
            <div class="mode-art">
                ${artHtml}
                <div class="art-overlay" id="art-overlay">
                    ${trackHtml}
                    ${artistHtml}
                    ${albumHtml}
                    ${yearHtml}
                </div>
                ${renderProgressBar(data)}
            </div>
        </div>`;
    }

    function renderFull(data) {
        const artSrc = data.artworkUrl || '';
        const artHtml = artSrc
            ? `<img class="artwork" src="${artSrc}" alt="Album Art">`
            : `<img class="artwork" src="${fallbackArtSrc()}" alt="No Art">`;

        const trackHtml = showField('track') ? `<div class="track-name">${marqueeWrap(data.track)}</div>` : '';
        const artistHtml = showField('artist') ? `<div class="artist-name">${escapeHtml(data.artist)}</div>` : '';
        const albumHtml = showField('album') ? `<div class="album-name">${escapeHtml(data.album)}</div>` : '';
        const yearHtml = showField('year') && data.year && String(data.year) !== '0' ? `<div class="year-name">${escapeHtml(String(data.year))}</div>` : '';

        return `<div class="mode-full">
            ${artHtml}
            <div class="meta">
                ${renderLabel('full')}
                ${trackHtml}
                ${artistHtml}
                ${albumHtml}
                ${yearHtml}
                ${renderProgressBar(data)}
            </div>
        </div>`;
    }

    function renderMini(data) {
        const layout = miniLayout || 'single';
        const lbl = renderLabel('mini');

        if (layout === 'single') {
            const parts = [];
            if (showField('track')) parts.push(`<span class="track-name">${escapeHtml(data.track)}</span>`);
            if (showField('artist')) parts.push(`<span class="artist-name">${escapeHtml(data.artist)}</span>`);
            return `<div class="mode-mini layout-single">
                <div class="meta">${lbl}${parts.join('<span class="sep"> — </span>')}</div>
            </div>`;
        }

        if (layout === 'two') {
            const trackHtml = showField('track') ? `<div class="track-name">${marqueeWrap(data.track)}</div>` : '';
            const artistHtml = showField('artist') ? `<div class="artist-name">${escapeHtml(data.artist)}</div>` : '';
            return `<div class="mode-mini layout-two">
                <div class="meta">${lbl}${trackHtml}${artistHtml}</div>
            </div>`;
        }

        // two-album
        const trackHtml = showField('track') ? `<div class="track-name">${marqueeWrap(data.track)}</div>` : '';
        const line2Parts = [];
        if (showField('artist')) line2Parts.push(`<span class="artist-name">${escapeHtml(data.artist)}</span>`);
        if (showField('album')) line2Parts.push(`<span class="album-name">${escapeHtml(data.album)}</span>`);
        const line2 = line2Parts.length ? `<div class="line2">${line2Parts.join('<span class="sep">·</span>')}</div>` : '';
        return `<div class="mode-mini layout-two-album">
            <div class="meta">${lbl}${trackHtml}${line2}</div>
        </div>`;
    }

    let prevState = 'stopped';

    function render(data) {
        const player = document.getElementById('player');

        if (!data || data.state === 'stopped' || !data.track) {
            player.classList.remove('visible', 'paused');
            currentTrack = '';
            prevState = 'stopped';
            return;
        }

        const trackKey = `${data.track}|${data.artist}|${data.album}`;
        const trackChanged = trackKey !== currentTrack;
        const resumed = prevState !== 'playing' && data.state === 'playing';
        currentTrack = trackKey;
        prevState = data.state;

        if (trackChanged) {
            switch (MODE) {
                case 'art': player.innerHTML = renderArt(data); break;
                case 'mini': player.innerHTML = renderMini(data); break;
                default: player.innerHTML = renderFull(data); break;
            }
            requestAnimationFrame(applyDynamicMarquee);
        }

        // Show/hide based on state
        player.classList.toggle('paused', data.state === 'paused');
        player.classList.add('visible');

        // Art mode: show overlay on track change OR resume from stopped/paused
        if (MODE === 'art' && (trackChanged || resumed)) {
            if (artOverlayTimer) clearTimeout(artOverlayTimer);
            const overlay = document.getElementById('art-overlay');
            if (overlay) {
                setTimeout(() => {
                    overlay.classList.add('visible');
                    // Wait for slide transition (400ms) before measuring marquee
                    setTimeout(() => requestAnimationFrame(applyDynamicMarquee), 450);
                }, 50);
                if (!artPersistInfo) {
                    artOverlayTimer = setTimeout(() => overlay.classList.remove('visible'), ART_OVERLAY_DURATION);
                }
            }
        }

        // Update progress bar without full re-render
        if (!trackChanged && showField('progress') && data.duration) {
            const fill = player.querySelector('.progress-fill');
            if (fill) fill.style.width = Math.min(100, (data.position / data.duration) * 100).toFixed(1) + '%';
        }
    }

    function applyLabelSettings(theme) {
        const label = theme.label || {};
        labelText = label.text ?? '♫ Now Playing';
        labelShow = {
            art: label.show_art ?? false,
            full: label.show_full ?? true,
            mini: label.show_mini ?? true
        };
    }

    // URL param overrides (applied after config load)
    function applyUrlOverrides() {
        if (params.get('font')) {
            musicTheme.font_family = params.get('font');
            const gf = { 'Jersey 20':'Jersey+20','Press Start 2P':'Press+Start+2P','Bebas Neue':'Bebas+Neue','Fredoka One':'Fredoka+One','Bangers':'Bangers','Orbitron':'Orbitron','Righteous':'Righteous','Permanent Marker':'Permanent+Marker','Inter':'Inter' };
            musicTheme.font_import = gf[params.get('font')] ? `https://fonts.googleapis.com/css2?family=${gf[params.get('font')]}&display=swap` : '';
        }
        if (params.get('textColor')) musicTheme.text_color = params.get('textColor');
        if (params.get('accentColor')) musicTheme.accent_color = params.get('accentColor');
        if (params.get('bgColor')) musicTheme.bg_color = params.get('bgColor');
        if (params.get('scrimColor')) musicTheme.art_scrim_color = params.get('scrimColor');
        if (params.get('artBrightness')) musicTheme.art_brightness = parseFloat(params.get('artBrightness'));
        if (params.get('artBlur')) musicTheme.art_blur = parseInt(params.get('artBlur'));
        if (params.get('fontScale')) musicTheme.font_scale = parseFloat(params.get('fontScale'));
        if (params.get('w') || params.get('h')) {
            if (!musicTheme.sizes) musicTheme.sizes = {};
            if (!musicTheme.sizes[MODE]) musicTheme.sizes[MODE] = {};
            if (params.get('w')) musicTheme.sizes[MODE].width = parseInt(params.get('w'));
            if (params.get('h')) musicTheme.sizes[MODE].height = parseInt(params.get('h'));
        }
        if (params.get('artSize')) musicTheme.full_art_size = parseInt(params.get('artSize'));
        if (params.has('label')) {
            const lv = params.get('label');
            if (!musicTheme.label) musicTheme.label = {};
            if (lv === 'off' || lv === '') {
                labelShow = { art: false, full: false, mini: false };
            } else {
                musicTheme.label.text = lv;
                labelText = lv;
            }
        }
        if (params.has('labelArt')) labelShow.art = params.get('labelArt') === '1';
        if (params.has('labelFull')) labelShow.full = params.get('labelFull') === '1';
        if (params.has('labelMini')) labelShow.mini = params.get('labelMini') === '1';
        if (params.get('fields')) {
            const allowed = params.get('fields').split(',');
            musicTheme.fields = { track: false, artist: false, album: false, year: false, progress: false };
            for (const f of allowed) { if (f in musicTheme.fields) musicTheme.fields[f] = true; }
        }
        if (params.has('persist')) artPersistInfo = params.get('persist') === '1';
        if (params.get('layout')) miniLayout = params.get('layout');
    }

    // Load theme from config
    async function loadTheme() {
        try {
            const res = await fetch('/api/config');
            if (res.ok) {
                const cfg = await res.json();
                musicTheme = cfg.music?.theme || {};
                artPersistInfo = musicTheme.art_persist_info || false;
                miniLayout = musicTheme.mini_layout || 'single';
                applyLabelSettings(musicTheme);
                applyUrlOverrides();
                applyMusicTheme(musicTheme);
            }
        } catch {}
    }

    // Listen for live theme updates from music-editor (postMessage)
    window.addEventListener('message', (e) => {
        if (e.data?.type === 'music-theme-update') {
            musicTheme = e.data.theme || {};
            artPersistInfo = musicTheme.art_persist_info || false;
            miniLayout = musicTheme.mini_layout || 'single';
            applyLabelSettings(musicTheme);
            applyMusicTheme(musicTheme);
            currentTrack = '';
            pollNowPlaying();
        }
    });

    // WebSocket connection
    function connectWS() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${location.host}`);

        ws.onmessage = (e) => {
            try {
                const msg = JSON.parse(e.data);
                if (msg.type === 'music') {
                    render(msg.data);
                } else if (msg.type === 'overlay-visibility') {
                    const player = document.getElementById('player');
                    if (msg.data.visible) {
                        player.classList.remove('hidden-by-api');
                    } else {
                        player.classList.add('hidden-by-api');
                    }
                }
            } catch {}
        };

        ws.onclose = () => setTimeout(connectWS, 3000);
        ws.onerror = () => ws.close();
    }

    // Also poll on interval as fallback
    async function pollNowPlaying() {
        try {
            const res = await fetch('/api/music/now-playing');
            if (res.ok) render(await res.json());
        } catch {}
    }

    // Check for custom fallback art
    async function checkFallbackArt() {
        try {
            const res = await fetch('/api/music/fallback-art', { method: 'HEAD' });
            hasFallbackArt = res.ok;
        } catch { hasFallbackArt = false; }
    }

    // Check overlay visibility on load
    async function checkOverlayVisibility() {
        try {
            const res = await fetch('/api/music/overlay');
            if (res.ok) {
                const data = await res.json();
                if (!data.visible) {
                    document.getElementById('player').classList.add('hidden-by-api');
                }
            }
        } catch {}
    }

    // Init
    Promise.all([loadTheme(), checkFallbackArt(), checkOverlayVisibility()]).then(() => {
        connectWS();
        pollNowPlaying();
        setInterval(pollNowPlaying, 5000);
    });
</script>
</body>
</html>

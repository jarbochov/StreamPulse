<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Goal Overlay</title>
    <style>
        :root {
            --goal-font-family: 'Segoe UI', system-ui, sans-serif;
            --goal-text-color: rgb(214, 227, 225);
            --goal-accent-color: rgb(255, 255, 255);
            --goal-muted-color: rgba(214, 227, 225, 0.7);
            --goal-background: rgba(0, 0, 0, 0.45);
            --goal-outline-color: #000000aa;
            --goal-font-scale: 1;
            --goal-bar-bg: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        body {
            font-family: var(--goal-font-family);
            color: var(--goal-text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(4px, 1.5vmin, 16px);
        }

        .overlay {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            min-width: 0;
            min-height: 0;
            padding: clamp(8px, max(2.5vmin, 8cqh), 28px) clamp(12px, max(3vmin, 4cqw), 36px);
            background: var(--goal-background);
            border-radius: clamp(8px, 2vmin, 16px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(6px, max(1.8vmin, 6cqh), 14px);
            overflow: hidden;
            container-type: size;
            transition: all 0.25s ease;
        }

        /* Large canvas constraint (e.g. 1920x1080) so card doesn't stretch 1920px wide */
        @media (min-width: 900px) and (min-height: 500px) {
            .overlay {
                max-width: 720px;
                max-height: 220px;
            }
        }

        .hidden { display: none !important; }

        .title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: clamp(8px, 2vmin, 16px);
            width: 100%;
            min-width: 0;
        }

        .title {
            font-size: calc(clamp(0.85rem, max(2.8vmin, 14cqh), 2.4rem) * var(--goal-font-scale));
            line-height: 1.15;
            font-weight: 700;
            text-shadow: 0 2px 8px var(--goal-outline-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: left;
            flex: 1;
            min-width: 0;
        }

        .value {
            font-size: calc(clamp(0.85rem, max(2.8vmin, 14cqh), 2.4rem) * var(--goal-font-scale));
            font-weight: 700;
            color: var(--goal-accent-color);
            text-shadow: 0 2px 6px var(--goal-outline-color);
            white-space: nowrap;
            flex-shrink: 0;
            text-align: right;
        }

        .bar {
            width: 100%;
            height: clamp(6px, max(1.8vmin, 8cqh), 22px);
            background: var(--goal-bar-bg);
            border-radius: 999px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--goal-accent-color), var(--goal-text-color));
            transition: width 0.4s ease;
            border-radius: 999px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            gap: clamp(0.4rem, 2vmin, 1.25rem);
            align-items: baseline;
            width: 100%;
            min-width: 0;
        }

        .remaining {
            font-size: calc(clamp(0.68rem, max(1.8vmin, 9cqh), 1.3rem) * var(--goal-font-scale));
            color: var(--goal-muted-color);
            text-shadow: 0 1px 4px var(--goal-outline-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .metric-label {
            font-size: calc(clamp(0.65rem, max(1.8vmin, 8.5cqh), 1.25rem) * var(--goal-font-scale));
            color: var(--goal-muted-color);
            text-shadow: 0 1px 4px var(--goal-outline-color);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .complete {
            font-size: calc(clamp(0.68rem, max(1.8vmin, 9cqh), 1.3rem) * var(--goal-font-scale));
            color: #7ee787;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Layout: Bar (Compact Banner) */
        .overlay.layout-bar {
            padding: clamp(6px, 1.8vmin, 16px) clamp(10px, 2.5vmin, 24px);
            gap: clamp(4px, 1.2vmin, 8px);
            border-radius: clamp(6px, 1.8vmin, 14px);
        }
        @media (min-width: 900px) and (min-height: 500px) {
            .overlay.layout-bar {
                max-width: 820px;
                max-height: 90px;
            }
        }
        .overlay.layout-bar .footer {
            display: none;
        }

        /* Layout: Pill (Capsule Badge) */
        .overlay.layout-pill {
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, max(2vmin, 3cqw), 20px);
            padding: clamp(6px, 1.5vmin, 14px) clamp(12px, 3vmin, 28px);
            border-radius: 999px;
            width: auto;
            max-width: 100%;
        }
        @media (min-width: 900px) and (min-height: 500px) {
            .overlay.layout-pill {
                max-width: 560px;
                max-height: 70px;
            }
        }
        .overlay.layout-pill .title-row {
            display: contents;
        }
        .overlay.layout-pill .bar {
            width: clamp(60px, max(16vmin, 20cqw), 240px);
            height: clamp(6px, max(1.5vmin, 14cqh), 16px);
            flex-shrink: 0;
        }
        .overlay.layout-pill .footer {
            display: none;
        }

        /* Layout: Minimal */
        .overlay.layout-minimal {
            background: transparent !important;
            padding: clamp(4px, 1.2vmin, 10px);
            gap: clamp(3px, 1vmin, 8px);
            box-shadow: none !important;
        }
        @media (min-width: 900px) and (min-height: 500px) {
            .overlay.layout-minimal {
                max-width: 720px;
                max-height: 90px;
            }
        }
        .overlay.layout-minimal .footer {
            display: none;
        }
    </style>
</head>
<body>
    <div id="overlay" class="overlay hidden">
        <div class="title-row" id="goal-title-row">
            <div class="title" id="goal-title"></div>
            <div class="value" id="goal-value">0 / 100</div>
        </div>
        <div class="bar"><div class="fill" id="goal-fill"></div></div>
        <div class="footer">
            <div class="remaining" id="goal-remaining">100 remaining</div>
            <div class="metric-label hidden" id="goal-metric-label"></div>
            <div class="complete hidden" id="goal-complete">Complete</div>
        </div>
    </div>

    <script src="/overlay-visibility.js" data-key="goal"></script>
    <script src="/url-params.js"></script>
    <script src="/overlay-theme.js"></script>
    <script>
    const params = overlayParams();
    const singleGoalId = (params.get('goal') || '').trim().toLowerCase();
    const overlayMode = params.get('mode') === 'cycle' ? 'cycle' : 'single';
    const goalLayout = (params.get('layout') || 'card').toLowerCase();
    const goalAlign = (params.get('align') || 'center').toLowerCase();
    const subsetIds = (params.get('ids') || '')
        .split(',')
        .map(item => item.trim().toLowerCase())
        .filter(Boolean);

    const overlayEl = document.getElementById('overlay');
    if (goalLayout && goalLayout !== 'card') {
        overlayEl.classList.add(`layout-${goalLayout}`);
    }
    if (goalAlign === 'left' || goalAlign === 'start') {
        document.body.style.justifyContent = 'flex-start';
    } else if (goalAlign === 'right' || goalAlign === 'end') {
        document.body.style.justifyContent = 'flex-end';
    } else {
        document.body.style.justifyContent = 'center';
    }

    let configSnapshot = null;
    let goalsSnapshot = null;
    let cycleTimer = null;
    let cycleIndex = 0;
    let currentGoalId = '';

    function formatValue(value, goal) {
        if (goal?.unit !== 'usd') return formatNumber(value);
        const num = Number(value) || 0;
        return `$${num.toLocaleString(undefined, { minimumFractionDigits: Number.isInteger(num) ? 0 : 2, maximumFractionDigits: 2 })}`;
    }

    function formatNumber(value) {
        const num = Number(value) || 0;
        return Number.isInteger(num)
            ? num.toLocaleString()
            : num.toLocaleString(undefined, { maximumFractionDigits: 2 });
    }

    function booleanParam(name, fallback) {
        if (!params.has(name)) return fallback;
        const value = String(params.get(name)).toLowerCase();
        return value === '1' || value === 'true' || value === 'yes' || value === 'on';
    }

    function numberParam(name, fallback) {
        if (!params.has(name)) return fallback;
        const value = Number(params.get(name));
        return Number.isFinite(value) ? value : fallback;
    }

    function withAlpha(color, alpha) {
        if (!color) return `rgba(214, 227, 225, ${alpha})`;
        if (color.startsWith('rgb(')) return color.replace('rgb(', 'rgba(').replace(')', `, ${alpha})`);
        if (color.startsWith('#') && (color.length === 7 || color.length === 4)) return color;
        return color;
    }

    function applyTheme() {
        const root = document.documentElement;
        const resolved = applyOverlayTheme(configSnapshot?.theme, {
            font: '--goal-font-family', text: '--goal-text-color', accent: '--goal-accent-color',
            background: '--goal-background', outline: '--goal-outline-color', scale: '--goal-font-scale'
        }, { defaultFont: 'Segoe UI', fontFallback: 'system-ui, sans-serif', backgroundKey: 'goal_background_color' });
        root.style.setProperty('--goal-muted-color', withAlpha(resolved.text, 0.72));
    }

    function getCycleSettings() {
        const settings = goalsSnapshot?.settings || {};
        return {
            interval: Math.max(3, numberParam('interval', settings.rotate_seconds || 8)),
            skipCompleted: booleanParam('skipcompleted', settings.skip_completed !== false),
            pauseComplete: Math.max(0, numberParam('pausecomplete', settings.pause_completed_seconds || 0))
        };
    }

    function getEnabledGoals() {
        if (goalsSnapshot?.settings?.enabled === false) return [];
        let items = (goalsSnapshot?.items || []).filter(item => item.enabled);
        if (subsetIds.length > 0) {
            items = items.filter(item => subsetIds.includes(item.id));
        }
        return items;
    }

    function chooseGoal() {
        const enabled = getEnabledGoals();
        if (!enabled.length) return null;

        if (overlayMode === 'single') {
            return enabled.find(item => item.id === singleGoalId) || enabled[0];
        }

        const settings = getCycleSettings();
        let candidates = settings.skipCompleted ? enabled.filter(item => !item.complete) : enabled;
        if (!candidates.length) candidates = enabled;
        if (!candidates.length) return null;

        if (currentGoalId) {
            const currentIndexInCandidates = candidates.findIndex(item => item.id === currentGoalId);
            if (currentIndexInCandidates >= 0) {
                cycleIndex = currentIndexInCandidates;
            }
        }

        cycleIndex = cycleIndex % candidates.length;
        return candidates[cycleIndex];
    }

    function renderGoal(goal) {
        const overlay = document.getElementById('overlay');
        const title = document.getElementById('goal-title');
        const metricLabel = document.getElementById('goal-metric-label');
        const value = document.getElementById('goal-value');
        const fill = document.getElementById('goal-fill');
        const remaining = document.getElementById('goal-remaining');
        const complete = document.getElementById('goal-complete');

        if (!goal) {
            overlay.classList.remove('hidden');
            title.textContent = 'No enabled goals';
            metricLabel.textContent = 'Add or enable a goal in Goals Manager';
            value.textContent = '0 / 0';
            fill.style.width = '0%';
            remaining.textContent = 'Waiting for goal setup';
            complete.classList.add('hidden');
            return;
        }

        currentGoalId = goal.id;
        overlay.classList.remove('hidden');
        title.textContent = goal.title || '';
        // "auto" hides the type label when the title already says it (e.g. title "Donations" over label "Donations").
        const labelMode = (params.get('showlabel') || 'auto').toLowerCase();
        const norm = text => String(text || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
        const redundant = norm(goal.title).includes(norm(goal.metric_label)) || norm(goal.metric_label).includes(norm(goal.title));
        const showLabel = labelMode === 'auto' ? !!goal.metric_label && !redundant : ['1', 'true', 'yes', 'on'].includes(labelMode);
        metricLabel.textContent = showLabel ? goal.metric_label || '' : '';
        metricLabel.classList.toggle('hidden', !showLabel);
        value.textContent = `${formatValue(goal.progress, goal)} / ${formatValue(goal.target, goal)}`;
        fill.style.width = `${Math.max(0, Math.min(100, Number(goal.percent) || 0))}%`;
        remaining.textContent = goal.complete
            ? `${formatValue(goal.progress, goal)} reached`
            : `${formatValue(goal.remaining, goal)} remaining`;
        complete.classList.toggle('hidden', !goal.complete);
    }

    function scheduleCycle(goal) {
        if (cycleTimer) {
            clearTimeout(cycleTimer);
            cycleTimer = null;
        }
        if (overlayMode !== 'cycle') return;

        const enabled = getEnabledGoals();
        if (enabled.length <= 1) return;

        const settings = getCycleSettings();
        const delay = goal?.complete && settings.pauseComplete > 0
            ? settings.pauseComplete * 1000
            : settings.interval * 1000;

        cycleTimer = setTimeout(() => {
            cycleIndex += 1;
            refreshRenderedGoal();
        }, delay);
    }

    function refreshRenderedGoal() {
        const goal = chooseGoal();
        renderGoal(goal);
        scheduleCycle(goal);
    }

    async function loadInitialState() {
        const [configRes, goalsRes] = await Promise.all([
            fetch('/api/config'),
            fetch('/api/goals')
        ]);
        configSnapshot = await configRes.json();
        goalsSnapshot = await goalsRes.json();
        applyTheme();
        refreshRenderedGoal();
        connectWebSocket();
    }

    function connectWebSocket() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${location.host}`);
        ws.onmessage = (event) => {
            let msg;
            try { msg = JSON.parse(event.data); } catch { return; }
            if (msg.type === 'goals-update') {
                goalsSnapshot = msg.data || goalsSnapshot;
                refreshRenderedGoal();
            }
        };
        ws.onclose = () => setTimeout(connectWebSocket, 5000);
    }

    loadInitialState().catch(err => {
        document.getElementById('overlay').classList.remove('hidden');
        document.getElementById('goal-title').textContent = 'Goal overlay unavailable';
        document.getElementById('goal-metric-label').textContent = err.message || 'Failed to load goals';
    });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Stream Credits</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --text-outline-color: #00000066;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Jersey 20", sans-serif;
            font-size: 3vw;
            color: rgb(214, 227, 225);
            text-shadow: -1px -1px 0 var(--text-outline-color), 1px -1px 0 var(--text-outline-color), -1px 1px 0 var(--text-outline-color), 1px 1px 0 var(--text-outline-color);
        }

        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        #credits-container {
            width: 100%;
            text-align: center;
            position: absolute;
            transform: translate(0, 20%);
            opacity: 1;
            transition: opacity 2s;
        }

        #credits-container.scrollIt {
            animation: scroll-credits linear forwards;
        }

        #credits-container.fadeOut {
            opacity: 0;
        }

        @keyframes scroll-credits {
            from {
                transform: translate(0, 20%);
            }
            to {
                transform: translate(0, -100%);
            }
        }

        #social-links-container {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0;
            transition: opacity 2s;
        }

        #social-links-container.fadeIn {
            opacity: 1;
        }

        .section {
            margin-top: 100px;
            margin-bottom: 100px;
        }

        h1 {
            font-size: 6vw;
            text-transform: uppercase;
        }

        h2 {
            font-size: 6vw;
            text-transform: uppercase;
        }

        h3 {
            font-size: 3.7vw;
            text-transform: uppercase;
        }

        .smallerheader {
            font-size: 25px;
        }

        .header-img {
            max-width: 80%;
            height: auto;
            margin: 0 auto 50px auto;
            display: block;
        }

        .people-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .people-list.two-col .person {
            flex-basis: 50%;
        }

        .people-list.three-col .person {
            flex-basis: 33.333%;
        }

        .person {
            padding: 10px 0;
            font-size: 3vw;
            line-height: 150%;
        }

        .emote-item {
            display: inline-block;
            margin: 20px 30px;
            text-align: center;
        }

        .emote-img {
            width: 48px;
            height: 48px;
            display: block;
            margin: 0 auto 10px auto;
        }

        .emote-name {
            font-size: 2.5vw;
        }

        .emote-stats {
            font-size: 2vw;
            opacity: 0.8;
        }

        .hashtag-item {
            padding: 10px 0;
            font-size: 3vw;
            line-height: 150%;
        }

        .hashtag-tag {
            color: rgb(145, 71, 255);
        }

        .social-icon {
            font-size: 4vw;
            margin: 0 20px;
            color: rgb(214, 227, 225);
        }
    </style>
</head>
<body>
    <div id="credits-container"></div>
    <div id="social-links-container"></div>

    <script>
        // ============================================================================
        // CONFIGURATION
        // ============================================================================
        
        const urlParams = new URLSearchParams(window.location.search);
        const SESSION_ID = urlParams.get('session');
        const WSS_SERVER = urlParams.get('server') || 'wss://io.socialstream.ninja';
        const SPEED_MULTIPLIER = parseFloat(urlParams.get('speed')) || 1.0;
        const DATA_PATH = urlParams.get('datapath') || './data';
        
        if (!SESSION_ID) {
            console.error('ERROR: No session ID provided. Add ?session=YOUR_SESSION_ID to the URL');
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;font-family:sans-serif;text-align:center;"><div><h1>⚠️ Configuration Error</h1><p>No session ID provided. Add <code>?session=YOUR_SESSION_ID</code> to the URL.</p></div></div>';
        }

        // Adjust animation speed based on multiplier
        if (SPEED_MULTIPLIER !== 1.0) {
            const baseSpeed = 60; // seconds
            const adjustedSpeed = baseSpeed / SPEED_MULTIPLIER;
            document.documentElement.style.setProperty('--credits-speed', `${adjustedSpeed}s`);
        }

        // ============================================================================
        // DATA STORAGE
        // ============================================================================
        
        const liveData = {
            chatters: new Map(), // username -> { chatname, chatimg, type, messageCount }
            followers: [], // { chatname, chatimg, timestamp }
            subscribers: [], // { chatname, membership, chatimg }
            giftSubs: [], // { chatname, chatimg }
            bits: [], // { chatname, amount, chatimg }
            donations: [], // { chatname, amount, chatimg }
            hashtags: new Map(), // hashtag -> { count, users: Set }
            emotes: new Map() // emote name -> { count, imageUrl, users: Set }
        };

        const prefetchedData = {
            subs: [],
            bits: [],
            followers: []
        };

        // ============================================================================
        // WEBSOCKET CONNECTION (SocialStream Ninja)
        // ============================================================================
        
        let socket = null;
        let reconnectTimer = null;

        function connectSSN() {
            if (!SESSION_ID) {
                console.error('Cannot connect to SSN: No session ID');
                return;
            }

            console.log(`[SSN] Connecting to ${WSS_SERVER}...`);
            socket = new WebSocket(WSS_SERVER);

            socket.onopen = function() {
                console.log('[SSN] Connected! Joining session:', SESSION_ID);
                const joinMessage = {
                    join: SESSION_ID,
                    in: 4,
                    out: 3
                };
                socket.send(JSON.stringify(joinMessage));
            };

            socket.onmessage = function(event) {
                try {
                    let data = JSON.parse(event.data);
                    
                    // Unwrap overlayNinja wrapper if present
                    if (data.overlayNinja) {
                        data = data.overlayNinja;
                    }

                    processSSNMessage(data);
                } catch (err) {
                    console.error('[SSN] Message parse error:', err);
                }
            };

            socket.onerror = function(error) {
                console.error('[SSN] WebSocket error:', error);
            };

            socket.onclose = function() {
                console.log('[SSN] Connection closed. Reconnecting in 3 seconds...');
                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(connectSSN, 3000);
            };
        }

        function processSSNMessage(data) {
            // Filter out bot messages
            if (data.bot === true) {
                return;
            }

            const chatname = data.chatname;
            const chatimg = data.chatimg;
            const type = data.type;

            // Track chatters (messages without event flag)
            if (!data.event && chatname) {
                if (!liveData.chatters.has(chatname)) {
                    liveData.chatters.set(chatname, {
                        chatname: chatname,
                        chatimg: chatimg,
                        type: type,
                        messageCount: 0
                    });
                }
                liveData.chatters.get(chatname).messageCount++;
                console.log(`[Chatter] ${chatname} - Total messages: ${liveData.chatters.get(chatname).messageCount}`);
            }

            // Track new followers
            if (data.event === 'follow' && chatname) {
                liveData.followers.push({
                    chatname: chatname,
                    chatimg: chatimg,
                    timestamp: Date.now()
                });
                console.log(`[New Follower] ${chatname}`);
            }

            // Track new subscribers and gift subs
            if (data.membership && chatname) {
                // Check if this is a gift sub
                if (data.membership.toLowerCase().includes('gift') || data.contentimg) {
                    liveData.giftSubs.push({
                        chatname: chatname,
                        chatimg: chatimg
                    });
                    console.log(`[Gift Sub] ${chatname}`);
                } else {
                    liveData.subscribers.push({
                        chatname: chatname,
                        membership: data.membership,
                        chatimg: chatimg
                    });
                    console.log(`[New Subscriber] ${chatname} - ${data.membership}`);
                }
            }

            // Track bits/donations
            if (data.hasDonation && chatname) {
                const donationData = {
                    chatname: chatname,
                    amount: data.hasDonation,
                    chatimg: chatimg
                };
                
                // Separate bits from other donations
                if (data.hasDonation.toLowerCase().includes('bit')) {
                    liveData.bits.push(donationData);
                    console.log(`[Bits] ${chatname} - ${data.hasDonation}`);
                } else {
                    liveData.donations.push(donationData);
                    console.log(`[Donation] ${chatname} - ${data.hasDonation}`);
                }
            }

            // Track emotes from chatmessage <img> tags
            if (data.chatmessage) {
                const emoteRegex = /<img[^>]+alt="([^"]+)"[^>]+src="([^"]+)"[^>]*>/gi;
                let emoteMatch;
                while ((emoteMatch = emoteRegex.exec(data.chatmessage)) !== null) {
                    const emoteName = emoteMatch[1];
                    const emoteUrl = emoteMatch[2];
                    
                    if (!liveData.emotes.has(emoteName)) {
                        liveData.emotes.set(emoteName, {
                            count: 0,
                            imageUrl: emoteUrl,
                            users: new Set()
                        });
                    }
                    const emoteData = liveData.emotes.get(emoteName);
                    emoteData.count++;
                    if (chatname) {
                        emoteData.users.add(chatname);
                    }
                }
            }

            // Track hashtags - strip HTML first
            if (data.chatmessage) {
                // Strip HTML tags before parsing hashtags
                const strippedMessage = data.chatmessage.replace(/<[^>]+>/g, '');
                const hashtags = strippedMessage.match(/#\w+/g);
                if (hashtags) {
                    hashtags.forEach(tag => {
                        const normalizedTag = tag.toLowerCase();
                        if (!liveData.hashtags.has(normalizedTag)) {
                            liveData.hashtags.set(normalizedTag, {
                                count: 0,
                                users: new Set()
                            });
                        }
                        const hashtagData = liveData.hashtags.get(normalizedTag);
                        hashtagData.count++;
                        if (chatname) {
                            hashtagData.users.add(chatname);
                        }
                    });
                }
            }
        }

        // ============================================================================
        // PRE-FETCHED DATA LOADING
        // ============================================================================
        
        async function loadPrefetchedData() {
            console.log('[Data] Loading pre-fetched data...');
            
            // Load subscribers
            try {
                const subsResponse = await fetch(`${DATA_PATH}/subs.json`);
                if (subsResponse.ok) {
                    const subsJson = await subsResponse.json();
                    prefetchedData.subs = subsJson.data || [];
                    console.log(`[Data] Loaded ${prefetchedData.subs.length} subscribers`);
                }
            } catch (err) {
                console.warn('[Data] Could not load subs.json:', err.message);
            }

            // Load bits leaderboard
            try {
                const bitsResponse = await fetch(`${DATA_PATH}/bits.json`);
                if (bitsResponse.ok) {
                    const bitsJson = await bitsResponse.json();
                    prefetchedData.bits = bitsJson.data || [];
                    console.log(`[Data] Loaded ${prefetchedData.bits.length} bits leaders`);
                }
            } catch (err) {
                console.warn('[Data] Could not load bits.json:', err.message);
            }

            // Load followers
            try {
                const followersResponse = await fetch(`${DATA_PATH}/followers.json`);
                if (followersResponse.ok) {
                    const followersJson = await followersResponse.json();
                    prefetchedData.followers = followersJson.data || [];
                    console.log(`[Data] Loaded ${prefetchedData.followers.length} followers`);
                }
            } catch (err) {
                console.warn('[Data] Could not load followers.json:', err.message);
            }
        }

        function refreshData() {
            console.log('[Data] Refreshing pre-fetched data...');
            loadPrefetchedData();
        }

        // ============================================================================
        // CREDITS RENDERING
        // ============================================================================
        
        function renderCredits() {
            const container = document.getElementById('credits-container');
            const socialLinksContainer = document.getElementById('social-links-container');
            let html = '';

            // Header image
            html += '<div class="section">';
            html += '<img src="https://cdn.streamelements.com/uploads/638fc6af-7d92-4f44-9fae-3d7cb65375a8.gif" class="header-img" alt="Header">';
            html += '</div>';

            // Header text
            html += '<div class="section">';
            html += '<h1>Thank you for your support!</h1>';
            html += '<h3>The room where it happens</h3>';
            html += '</div>';

            // Subscribers section
            const allSubs = mergeSubscribers();
            if (allSubs.length > 0) {
                html += '<div class="section">';
                html += '<h2>Subscribers</h2>';
                html += '<h3>Remember to feed your Wii U a disc</h3>';
                html += '<div class="people-list two-col">';
                allSubs.forEach(sub => {
                    html += `<div class="person">${escapeHtml(sub.name)}`;
                    if (sub.tier) {
                        html += ` (${escapeHtml(sub.tier)})`;
                    }
                    html += '</div>';
                });
                html += '</div>';
                html += '</div>';
            }

            // New Followers section
            const allFollowers = mergeFollowers();
            if (allFollowers.length > 0) {
                html += '<div class="section">';
                html += '<h2>New Followers</h2>';
                html += '<h3>(not a cult)</h3>';
                html += '<div class="people-list three-col">';
                allFollowers.forEach(follower => {
                    html += `<div class="person">${escapeHtml(follower.name)}</div>`;
                });
                html += '</div>';
                html += '</div>';
            }

            // Donations section
            if (liveData.donations.length > 0) {
                html += '<div class="section">';
                html += '<h2>Donators</h2>';
                html += '<h3 class="smallerheader">Can I have fifty dollars?</h3>';
                html += '<div class="people-list two-col">';
                liveData.donations.forEach(donation => {
                    html += `<div class="person">${escapeHtml(donation.chatname)}`;
                    html += ` (${escapeHtml(donation.amount)})</div>`;
                });
                html += '</div>';
                html += '</div>';
            }

            // Gift Subs section
            if (liveData.giftSubs.length > 0) {
                html += '<div class="section">';
                html += '<h2>Gift Subs</h2>';
                html += '<div class="people-list two-col">';
                liveData.giftSubs.forEach(gift => {
                    html += `<div class="person">${escapeHtml(gift.chatname)}</div>`;
                });
                html += '</div>';
                html += '</div>';
            }

            // Bits/Cheers section
            const allBits = mergeBits();
            if (allBits.length > 0) {
                html += '<div class="section">';
                html += '<h2>Cheerers</h2>';
                html += '<div class="people-list two-col">';
                allBits.forEach(bit => {
                    html += `<div class="person">${escapeHtml(bit.name)}`;
                    html += ` (${escapeHtml(bit.amount)})</div>`;
                });
                html += '</div>';
                html += '</div>';
            }

            // Top Emotes section
            const topEmotes = getTopEmotes(5);
            if (topEmotes.length > 0) {
                html += '<div class="section">';
                html += '<h2>Top Emotes</h2>';
                html += '<h3>Chat\'s Mood Board</h3>';
                html += '<div>';
                topEmotes.forEach(emote => {
                    html += '<div class="emote-item">';
                    html += `<img src="${emote.imageUrl}" class="emote-img" alt="${escapeHtml(emote.name)}">`;
                    html += `<div class="emote-name">${escapeHtml(emote.name)}</div>`;
                    html += `<div class="emote-stats">${emote.count} uses by ${emote.uniqueUsers} chatters</div>`;
                    html += '</div>';
                });
                html += '</div>';
                html += '</div>';
            }

            // Trending Hashtags section
            const topHashtags = getTopHashtags(10);
            if (topHashtags.length > 0) {
                html += '<div class="section">';
                html += '<h2>Trending Hashtags</h2>';
                html += '<h3>What we\'re talking about</h3>';
                html += '<div class="people-list three-col">';
                topHashtags.forEach(hashtag => {
                    html += '<div class="hashtag-item">';
                    html += `<span class="hashtag-tag">${escapeHtml(hashtag.tag)}</span>`;
                    html += ` (${hashtag.count} uses)`;
                    html += '</div>';
                });
                html += '</div>';
                html += '</div>';
            }

            // Chatters section
            const sortedChatters = Array.from(liveData.chatters.values())
                .sort((a, b) => b.messageCount - a.messageCount);
            
            if (sortedChatters.length > 0) {
                html += '<div class="section">';
                html += '<h2>Today\'s Chatters</h2>';
                html += '<h3>The Peanut Gallery</h3>';
                html += '<div class="people-list three-col">';
                sortedChatters.forEach(chatter => {
                    html += `<div class="person">${escapeHtml(chatter.chatname)}</div>`;
                });
                html += '</div>';
                html += '</div>';
            }

            // Ending statement
            html += '<div class="section">';
            html += '<h1>Never forget that you\'re awesome and that you matter. Thanks for being you!</h1>';
            html += '</div>';

            container.innerHTML = html;

            // Social links
            let socialHtml = '';
            socialHtml += '<h2>SEE YA NEXT TIME!</h2>';
            socialHtml += '<h3>Follow For More Randomness</h3>';
            socialHtml += '<div>';
            socialHtml += '<a href="https://www.threads.net/@jarbochov" class="social-icon"><i class="fab fa-threads"></i></a>';
            socialHtml += '<a href="https://social.4score7pongs.com/@jarbochov" class="social-icon"><i class="fab fa-mastodon"></i></a>';
            socialHtml += '<a href="https://bsky.app/profile/wyomingjarbo.com" class="social-icon">🦋</a>';
            socialHtml += '<a href="https://wyomingjarbo.com" class="social-icon"><i class="fas fa-globe"></i></a>';
            socialHtml += '</div>';
            socialLinksContainer.innerHTML = socialHtml;

            // Start scroll animation after delay
            const socialLinkDelay = 82000; // 82 seconds default
            setTimeout(() => {
                container.style.animationDuration = `${socialLinkDelay / 1000}s`;
                container.classList.add('scrollIt');
                
                // After scroll completes, fade out credits and fade in social links
                setTimeout(() => {
                    container.classList.add('fadeOut');
                    setTimeout(() => {
                        socialLinksContainer.classList.add('fadeIn');
                    }, 2000);
                }, socialLinkDelay);
            }, 100);
        }

        // ============================================================================
        // DATA MERGING HELPERS
        // ============================================================================
        
        function mergeSubscribers() {
            const subsMap = new Map();

            // Add pre-fetched subscribers
            prefetchedData.subs.forEach(sub => {
                const name = sub.user_name || sub.user_login;
                if (name) {
                    subsMap.set(name.toLowerCase(), {
                        name: name,
                        tier: sub.tier ? `Tier ${sub.tier / 1000}` : '',
                        chatimg: null
                    });
                }
            });

            // Add live subscribers (with avatar)
            liveData.subscribers.forEach(sub => {
                const key = sub.chatname.toLowerCase();
                subsMap.set(key, {
                    name: sub.chatname,
                    tier: sub.membership || '',
                    chatimg: sub.chatimg
                });
            });

            return Array.from(subsMap.values());
        }

        function mergeFollowers() {
            const followersMap = new Map();

            // Add pre-fetched followers
            prefetchedData.followers.forEach(follower => {
                const name = follower.user_name || follower.user_login;
                if (name) {
                    followersMap.set(name.toLowerCase(), {
                        name: name
                    });
                }
            });

            // Add live followers
            liveData.followers.forEach(follower => {
                const key = follower.chatname.toLowerCase();
                followersMap.set(key, {
                    name: follower.chatname
                });
            });

            return Array.from(followersMap.values());
        }

        function mergeBits() {
            const bitsMap = new Map();

            // Add pre-fetched bits leaderboard
            prefetchedData.bits.forEach(bit => {
                const name = bit.user_name || bit.user_login;
                if (name) {
                    bitsMap.set(name.toLowerCase(), {
                        name: name,
                        amount: `${bit.score} bits`,
                        chatimg: null,
                        score: bit.score
                    });
                }
            });

            // Add live bits
            liveData.bits.forEach(bit => {
                const key = bit.chatname.toLowerCase();
                if (!bitsMap.has(key)) {
                    // Parse amount if possible
                    const match = bit.amount.match(/(\d+)/);
                    const score = match ? parseInt(match[1]) : 0;
                    bitsMap.set(key, {
                        name: bit.chatname,
                        amount: bit.amount,
                        chatimg: bit.chatimg,
                        score: score
                    });
                } else {
                    // Update with avatar if we have it
                    if (bit.chatimg) {
                        bitsMap.get(key).chatimg = bit.chatimg;
                    }
                }
            });

            // Sort by score
            return Array.from(bitsMap.values())
                .sort((a, b) => b.score - a.score);
        }

        function getTopHashtags(limit) {
            const hashtags = Array.from(liveData.hashtags.entries())
                .map(([tag, data]) => ({
                    tag: tag,
                    count: data.count,
                    uniqueUsers: data.users.size
                }))
                .sort((a, b) => b.count - a.count)
                .slice(0, limit);

            return hashtags;
        }

        function getTopEmotes(limit) {
            const emotes = Array.from(liveData.emotes.entries())
                .map(([name, data]) => ({
                    name: name,
                    count: data.count,
                    imageUrl: data.imageUrl,
                    uniqueUsers: data.users.size
                }))
                .sort((a, b) => b.count - a.count)
                .slice(0, limit);

            return emotes;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================================
        // INITIALIZATION
        // ============================================================================
        
        async function init() {
            console.log('[Init] Starting stream credits overlay...');
            console.log('[Init] Session ID:', SESSION_ID);
            console.log('[Init] WSS Server:', WSS_SERVER);
            console.log('[Init] Speed Multiplier:', SPEED_MULTIPLIER);
            console.log('[Init] Data Path:', DATA_PATH);

            // Load pre-fetched data
            await loadPrefetchedData();

            // Connect to SSN WebSocket
            if (SESSION_ID) {
                connectSSN();
            }

            // Set up data refresh interval (every 60 seconds)
            setInterval(refreshData, 60000);

            // Render credits immediately (will update as data comes in via SSN)
            renderCredits();

            console.log('[Init] Credits overlay initialized and scrolling!');
        }

        // Start when page loads
        window.addEventListener('DOMContentLoaded', init);

        // Public API for manual refresh
        window.refreshData = refreshData;
    </script>
</body>
</html>

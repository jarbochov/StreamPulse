<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Stats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-outline-color: #00000066;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Jersey 20", sans-serif;
            color: rgb(214, 227, 225);
            text-shadow: -1px -1px 0 var(--text-outline-color), 1px -1px 0 var(--text-outline-color),
                         -1px 1px 0 var(--text-outline-color), 1px 1px 0 var(--text-outline-color);
        }

        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .stats-container {
            width: 100%;
            display: flex;
            gap: 40px;
            justify-content: center;
        }

        .stats-column {
            flex: 1;
            max-width: 580px;
        }

        h2 {
            font-size: 3vw;
            text-align: center;
            margin-bottom: 20px;
        }

        .stats-list {
            list-style: none;
        }

        .stats-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            font-size: 1.8vw;
            border-bottom: 1px solid rgba(214, 227, 225, 0.1);
        }

        .stats-item .rank {
            width: 40px;
            opacity: 0.6;
        }

        .stats-item .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .stats-item .count {
            text-align: right;
            min-width: 80px;
            opacity: 0.8;
        }

        .emote-img {
            width: 28px;
            height: 28px;
            vertical-align: middle;
            margin-right: 8px;
        }

        .hashtag-name {
            color: rgb(255, 255, 255);
        }

        .filter-info {
            width: 100%;
            text-align: center;
            font-size: 1.2vw;
            opacity: 0.5;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="filter-info" id="filter-info"></div>
    <div class="stats-container" id="stats-container">
        <p style="font-size: 2vw; text-align: center; width: 100%;">Loading stats...</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const DAYS = parseInt(urlParams.get('days')) || 0;
        const DATE = urlParams.get('date') || '';
        const FROM = urlParams.get('from') || '';
        const TO = urlParams.get('to') || '';
        const LIMIT = parseInt(urlParams.get('limit')) || 20;
        const REFRESH = parseInt(urlParams.get('refresh')) || 60;

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Get the date range to filter by
        function getDateRange() {
            if (DATE) {
                return { from: DATE, to: DATE };
            }
            if (FROM || TO) {
                return {
                    from: FROM || '1970-01-01',
                    to: TO || '9999-12-31'
                };
            }
            if (DAYS) {
                const from = new Date(Date.now() - DAYS * 24 * 60 * 60 * 1000)
                    .toISOString().slice(0, 10);
                return { from, to: '9999-12-31' };
            }
            return null; // no filter, sum everything
        }

        // Sum daily buckets within a date range
        function sumBuckets(days, range) {
            if (!days || typeof days !== 'object') return 0;
            let total = 0;
            for (const [date, count] of Object.entries(days)) {
                if (!range || (date >= range.from && date <= range.to)) {
                    total += count;
                }
            }
            return total;
        }

        // Backward compat: get count from old or new format
        function getCount(entry, range) {
            if (entry.days) return sumBuckets(entry.days, range);
            // Old format fallback
            return entry.messageCount || entry.count || 0;
        }

        function getFilterLabel() {
            if (DATE) return `Date: ${DATE}`;
            if (FROM && TO) return `${FROM} to ${TO}`;
            if (FROM) return `From ${FROM}`;
            if (TO) return `Until ${TO}`;
            if (DAYS) return `Last ${DAYS} days`;
            return '';
        }

        function renderStats(data) {
            const container = document.getElementById('stats-container');
            const range = getDateRange();

            // Build sorted lists with computed counts
            const topChatters = Object.entries(data.chatters || {})
                .map(([name, d]) => ({ name, count: getCount(d, range), data: d }))
                .filter(e => e.count > 0)
                .sort((a, b) => b.count - a.count)
                .slice(0, LIMIT);

            const topEmotes = Object.entries(data.emotes || {})
                .map(([name, d]) => ({ name, count: getCount(d, range), data: d }))
                .filter(e => e.count > 0)
                .sort((a, b) => b.count - a.count)
                .slice(0, LIMIT);

            const topHashtags = Object.entries(data.hashtags || {})
                .map(([tag, d]) => ({ tag, count: getCount(d, range), data: d }))
                .filter(e => e.count > 0)
                .sort((a, b) => b.count - a.count)
                .slice(0, LIMIT);

            const filterEl = document.getElementById('filter-info');
            filterEl.textContent = getFilterLabel();

            let html = '';

            // Chatters column
            html += '<div class="stats-column">';
            html += '<h2>Top Chatters</h2>';
            html += '<ul class="stats-list">';
            topChatters.forEach((entry, i) => {
                html += `<li class="stats-item">
                    <span class="rank">${i + 1}.</span>
                    <span class="name">${escapeHtml(entry.name)}</span>
                    <span class="count">${entry.count} msgs</span>
                </li>`;
            });
            if (topChatters.length === 0) html += '<li class="stats-item"><span class="name">No data yet</span></li>';
            html += '</ul></div>';

            // Emotes column
            html += '<div class="stats-column">';
            html += '<h2>Top Emotes</h2>';
            html += '<ul class="stats-list">';
            topEmotes.forEach((entry, i) => {
                const img = entry.data.imageUrl ? `<img src="${entry.data.imageUrl}" class="emote-img" alt="${escapeHtml(entry.name)}">` : '';
                html += `<li class="stats-item">
                    <span class="rank">${i + 1}.</span>
                    <span class="name">${img}${escapeHtml(entry.name)}</span>
                    <span class="count">${entry.count}x</span>
                </li>`;
            });
            if (topEmotes.length === 0) html += '<li class="stats-item"><span class="name">No data yet</span></li>';
            html += '</ul></div>';

            // Hashtags column
            html += '<div class="stats-column">';
            html += '<h2>Top Hashtags</h2>';
            html += '<ul class="stats-list">';
            topHashtags.forEach((entry, i) => {
                html += `<li class="stats-item">
                    <span class="rank">${i + 1}.</span>
                    <span class="name hashtag-name">${escapeHtml(entry.tag)}</span>
                    <span class="count">${entry.count}x</span>
                </li>`;
            });
            if (topHashtags.length === 0) html += '<li class="stats-item"><span class="name">No data yet</span></li>';
            html += '</ul></div>';

            container.innerHTML = html;
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                if (res.ok) {
                    const data = await res.json();
                    renderStats(data);
                }
            } catch (err) {
                console.error('[Stats] Load error:', err);
            }
        }

        loadStats();
        setInterval(loadStats, REFRESH * 1000);
    </script>
</body>
</html>

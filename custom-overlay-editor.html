<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Overlay Editor</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0f1117; color: #e1e4e8; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .header { display: flex; align-items: center; gap: 1rem; padding: 1rem 2rem; background: #161b22; border-bottom: 1px solid #30363d; }
        .header a { color: #8b949e; text-decoration: none; }
        .layout { display: grid; grid-template-columns: 240px minmax(500px, 1fr) 300px; gap: 1rem; padding: 1rem; max-width: 1500px; margin: 0 auto; }
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: .75rem; min-width: 0; }
        .panel h2 { font-size: .85rem; margin: 0 0 .75rem; color: #c9d1d9; }
        button, input, select, textarea { font: inherit; }
        button { border: 1px solid #30363d; border-radius: 6px; padding: .45rem .65rem; background: #21262d; color: #e1e4e8; cursor: pointer; }
        button:hover { border-color: #58a6ff; }
        button.primary { background: #1a2332; border-color: #1f6feb; }
        input, select, textarea { width: 100%; padding: .45rem .55rem; color: #e1e4e8; background: #0d1117; border: 1px solid #30363d; border-radius: 5px; }
        input[type="color"] { height: 2.1rem; padding: .15rem; cursor: pointer; }
        textarea { min-height: 110px; resize: vertical; }
        label { display: grid; gap: .25rem; color: #8b949e; font-size: .75rem; margin-bottom: .65rem; }
        .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .5rem; }
        .color-control { display: grid; grid-template-columns: minmax(0, 1fr) 3rem; gap: .4rem; align-items: end; }
        .color-control input[type="color"] { width: 3rem; }
        .section { border-top: 1px solid #30363d; margin-top: .8rem; padding-top: .8rem; }
        .button-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .35rem; }
        .button-grid button { padding: .35rem .25rem; font-size: .72rem; }
        .selection-count { color: #58a6ff; font-size: .75rem; margin: .4rem 0 .65rem; }
        .asset-preview { max-width: 100%; max-height: 120px; display: block; margin-top: .4rem; border: 1px solid #30363d; border-radius: 4px; }
        .variable-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .4rem; align-items: end; }
        @keyframes overlay-marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
        .toolbar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; align-items: center; }
        #canvas-wrap { overflow: auto; position: relative; background: #0d1117; border: 1px solid #30363d; padding: 2.25rem 1rem 1rem; min-height: 620px; cursor: grab; }
        #canvas-wrap.panning { cursor: grabbing; }
        #canvas-frame { position: relative; border: 2px solid #58a6ff; box-shadow: 0 0 0 1px #58a6ff33, 0 8px 24px #0008; transform-origin: top left; }
        #canvas-frame::before { content: attr(data-bounds); position: absolute; left: 0; top: -1.6rem; color: #58a6ff; font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
        #canvas { position: relative; transform-origin: top left; background-image: linear-gradient(#ffffff0b 1px, transparent 1px), linear-gradient(90deg, #ffffff0b 1px, transparent 1px); background-size: 20px 20px; }
        .canvas-element { position: absolute; overflow: hidden; white-space: pre-wrap; word-break: break-word; cursor: move; }
        .canvas-element.selected { outline: 2px solid #58a6ff; outline-offset: 2px; }
        .resize-handle { position: absolute; width: 9px; height: 9px; background: #58a6ff; border: 1px solid #dbeafe; border-radius: 2px; z-index: 20; pointer-events: none; }
        .resize-handle.nw { left: 0; top: 0; cursor: nwse-resize; }.resize-handle.ne { right: 0; top: 0; cursor: nesw-resize; }
        .resize-handle.sw { left: 0; bottom: 0; cursor: nesw-resize; }.resize-handle.se { right: 0; bottom: 0; cursor: nwse-resize; }
        .canvas-element img, .canvas-element video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .canvas-element.markdown { white-space: normal; }
        .canvas-element.markdown p { margin: 0 0 .5em; }
        .canvas-element.markdown p:last-child { margin-bottom: 0; }
        .layer { padding: .5rem; border: 1px solid #30363d; border-radius: 5px; margin-bottom: .4rem; cursor: grab; background: #0d1117; }
        .layer.selected { border-color: #58a6ff; color: #58a6ff; }
        .hint, #status { color: #8b949e; font-size: .75rem; line-height: 1.4; }
        @media (max-width: 1100px) { .layout { grid-template-columns: 210px 1fr; } .properties { grid-column: 1 / -1; } }
        @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } .properties { grid-column: auto; } }
    </style>
</head>
<body>
    <header class="header"><a href="/custom-overlays.html">← Custom Overlays</a><strong id="title">Overlay Editor</strong></header>
    <main class="layout">
        <section class="panel">
            <h2>Elements</h2>
            <div class="toolbar">
                <button data-add="text">Text</button><button data-add="random-text">Random Text</button><button data-add="markdown">Markdown</button>
                <button data-add="image">Image</button><button data-add="video">Video</button><button data-add="embed">Webpage</button><button data-add="shape">Shape</button>
            </div>
            <div id="layers"></div>
            <p class="hint">Drag elements on the canvas. Hold Ctrl/Cmd or Shift to select multiple elements.</p>
        </section>
        <section>
            <div class="toolbar">
                <button class="primary" id="save">Save and Push Live</button>
                <button id="preview">Open Runtime</button>
                <button id="reset-view" title="Reset canvas pan">Reset View</button>
                <label style="display:flex;align-items:center;gap:.4rem;margin:0;min-width:150px;">Zoom <input id="zoom" type="range" min="25" max="150" value="50" step="5"><span id="zoom-value">50%</span></label>
                <span id="status"></span>
            </div>
            <div id="canvas-wrap"><div id="canvas-frame" data-bounds="1920 × 1080"><div id="canvas"></div></div></div>
        </section>
        <section class="panel properties">
            <h2>Overlay</h2>
            <label>Name<input id="overlay-name"></label>
            <div class="row"><label>Width<input id="canvas-width" type="number"></label><label>Height<input id="canvas-height" type="number"></label></div>
            <label>Background<div class="row"><input id="canvas-background" placeholder="transparent or rgba(...)"><input id="canvas-background-color" type="color" value="#000000" title="Pick background color"></div></label>
            <hr>
            <h2>Selected element</h2>
            <div id="properties"><p class="hint">Select an element.</p></div>
        </section>
    </main>
    <script src="/vendor/interact.min.js"></script>
    <script src="/vendor/Sortable.min.js"></script>
    <script src="/vendor/marked.umd.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const overlayId = params.get('id') || 'new-overlay';
        let isNew = params.get('new') === '1';
        let overlay = { id: overlayId, name: overlayId, revision: 1, canvas: { width: 1920, height: 1080, background: 'transparent' }, elements: [] };
        let selectedIds = new Set();
        const canvas = document.getElementById('canvas');
        const canvasFrame = document.getElementById('canvas-frame');
        const layers = document.getElementById('layers');
        const properties = document.getElementById('properties');
        const status = document.getElementById('status');
        const defaults = { text: 'Text element', 'random-text': 'Random phrase', markdown: '**Markdown** element', image: '', video: '', embed: '', shape: '' };
        let zoom = 0.5;
        let viewPan = { x: 0, y: 0 };
        const GOOGLE_FONTS = new Set(['Roboto', 'Open Sans', 'Lato', 'Montserrat', 'Oswald', 'Poppins', 'Raleway', 'Merriweather', 'Playfair Display', 'Bebas Neue', 'Fira Code']);
        function esc(value) { return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function safeColor(value) { return /^#[0-9a-f]{6}$/i.test(String(value || '')) ? value : '#000000'; }
        function loadGoogleFont(fontFamily) {
            const name = String(fontFamily || '').replace(/^['"]|['"]$/g, '').split(',')[0].trim();
            if (!GOOGLE_FONTS.has(name)) return;
            const id = `google-font-${name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`;
            if (document.getElementById(id)) return;
            const link = document.createElement('link');
            link.id = id;
            link.rel = 'stylesheet';
            link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(name).replace(/%20/g, '+')}:wght@400;600;700;900&display=swap`;
            document.head.appendChild(link);
        }
        function selected() { return selectedIds.size === 1 ? overlay.elements.find(item => selectedIds.has(item.id)) : null; }
        function selectedElements() { return overlay.elements.filter(item => selectedIds.has(item.id)); }
        function selectElement(id, additive = false) {
            if (!additive) selectedIds = new Set([id]);
            else if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            render();
        }
        function renderMarkdown(value) { return DOMPurify.sanitize(marked.parse(value || '', { breaks: true })); }
        function syncOverlayFields() {
            document.getElementById('title').textContent = `${overlay.name} — Overlay Editor`;
            document.getElementById('overlay-name').value = overlay.name;
            document.getElementById('canvas-width').value = overlay.canvas.width;
            document.getElementById('canvas-height').value = overlay.canvas.height;
            document.getElementById('canvas-background').value = overlay.canvas.background;
            document.getElementById('canvas-background-color').value = safeColor(overlay.canvas.background);
            canvas.style.width = `${overlay.canvas.width}px`;
            canvas.style.height = `${overlay.canvas.height}px`;
            canvas.style.background = overlay.canvas.background || '#0d1117';
            canvas.style.transform = `scale(${zoom})`;
            canvasFrame.style.width = `${overlay.canvas.width * zoom}px`;
            canvasFrame.style.height = `${overlay.canvas.height * zoom}px`;
            canvasFrame.style.transform = `translate(${viewPan.x}px, ${viewPan.y}px)`;
            canvasFrame.dataset.bounds = `${overlay.canvas.width} × ${overlay.canvas.height}`;
            document.getElementById('zoom').value = Math.round(zoom * 100);
            document.getElementById('zoom-value').textContent = `${Math.round(zoom * 100)}%`;
        }
        const SNAP_DISTANCE = 10;
        function snapValue(value, candidates) {
            const closest = candidates.reduce((best, candidate) => Math.abs(candidate - value) < Math.abs(best - value) ? candidate : best, value);
            return Math.abs(closest - value) <= SNAP_DISTANCE ? closest : value;
        }
        function snapElement(element) {
            const others = overlay.elements.filter(item => item.id !== element.id && item.visible !== false);
            const xCandidates = [0, overlay.canvas.width / 2 - element.width / 2, overlay.canvas.width - element.width];
            const yCandidates = [0, overlay.canvas.height / 2 - element.height / 2, overlay.canvas.height - element.height];
            for (const other of others) {
                xCandidates.push(other.x, other.x + other.width - element.width, other.x + other.width / 2 - element.width / 2);
                yCandidates.push(other.y, other.y + other.height - element.height, other.y + other.height / 2 - element.height / 2);
            }
            element.x = Math.max(0, Math.min(overlay.canvas.width - element.width, snapValue(element.x, xCandidates)));
            element.y = Math.max(0, Math.min(overlay.canvas.height - element.height, snapValue(element.y, yCandidates)));
        }
        function renderCanvas() {
            syncOverlayFields();
            canvas.replaceChildren();
            for (const element of overlay.elements) {
                const node = document.createElement('div');
                node.className = `canvas-element ${element.type}${selectedIds.has(element.id) ? ' selected' : ''}`;
                node.dataset.id = element.id;
                Object.assign(node.style, { left: `${element.x}px`, top: `${element.y}px`, width: `${element.width}px`, height: `${element.height}px`, zIndex: element.zIndex, opacity: element.style.opacity, background: element.style.background, border: `${element.style.borderWidth}px solid ${element.style.borderColor}`, borderRadius: `${element.style.borderRadius}px`, fontFamily: element.style.fontFamily, fontSize: `${element.style.fontSize}px`, fontWeight: element.style.fontWeight, color: element.style.color, textAlign: element.style.textAlign, lineHeight: element.style.lineHeight, letterSpacing: `${element.style.letterSpacing}px`, display: element.style.verticalAlign === 'top' ? 'block' : 'flex', alignItems: element.style.verticalAlign === 'middle' ? 'center' : element.style.verticalAlign === 'bottom' ? 'flex-end' : 'flex-start', justifyContent: element.style.textAlign === 'center' ? 'center' : element.style.textAlign === 'right' ? 'flex-end' : 'flex-start' });
                if (element.type === 'shape') {
                    if (element.style.shape === 'circle') node.style.borderRadius = '50%';
                    if (element.style.shape === 'pill') node.style.borderRadius = '999px';
                    if (element.style.shape === 'line') { node.style.height = `${Math.max(1, element.style.borderWidth || 4)}px`; node.style.border = '0'; }
                }
                if (element.type === 'image' || element.type === 'video') {
                    const media = document.createElement(element.type === 'image' ? 'img' : 'video'); media.src = element.src; media.controls = element.type === 'video'; media.muted = true; media.loop = true; media.style.cssText = 'width:100%;height:100%;object-fit:' + element.style.objectFit; media.addEventListener('error', () => { status.textContent = 'Asset could not be displayed. Check the asset URL or upload it again.'; }); node.appendChild(media);
                } else if (element.type === 'embed') {
                    const frame = document.createElement('iframe'); frame.src = element.src || 'about:blank'; frame.sandbox = 'allow-forms allow-popups allow-scripts'; frame.style.cssText = 'width:100%;height:100%;border:0;pointer-events:none;'; node.appendChild(frame);
                } else if (element.type === 'markdown') node.innerHTML = renderMarkdown(element.content);
                else if (element.type === 'random-text') {
                    const items = element.items || [];
                    node.textContent = items.length ? items[0] : element.content || '';
                    if (element.random?.marquee) {
                        node.style.whiteSpace = 'nowrap';
                        node.style.overflow = 'hidden';
                        node.innerHTML = `<span style="display:inline-block;min-width:100%;animation:overlay-marquee ${Math.max(10, element.random.marqueeSpeed || 60)}s linear infinite">${esc(node.textContent)}</span>`;
                    }
                }
                else node.textContent = element.content || '';
                loadGoogleFont(element.style.fontFamily);
                if (selectedIds.has(element.id)) {
                    for (const corner of ['nw', 'ne', 'sw', 'se']) {
                        const handle = document.createElement('span');
                        handle.className = `resize-handle ${corner}`;
                        handle.setAttribute('aria-hidden', 'true');
                        node.appendChild(handle);
                    }
                }
                node.addEventListener('click', event => { event.stopPropagation(); selectElement(element.id, event.shiftKey || event.ctrlKey || event.metaKey); });
                canvas.appendChild(node);
            }
            enableDragging();
        }
        function render() {
            renderCanvas();
            renderLayers();
            renderProperties();
        }
        function renderLayers() {
            layers.innerHTML = overlay.elements.slice().reverse().map(element => `<div class="layer${selectedIds.has(element.id) ? ' selected' : ''}" data-id="${esc(element.id)}">${esc(element.type)} · ${esc(element.id)}</div>`).join('');
            layers.querySelectorAll('.layer').forEach(node => node.addEventListener('click', event => selectElement(node.dataset.id, event.shiftKey || event.ctrlKey || event.metaKey)));
        }
        function renderProperties() {
            const selection = selectedElements();
            if (!selection.length) { properties.innerHTML = '<p class="hint">Select an element.</p>'; return; }
            if (selection.length > 1) {
                properties.innerHTML = `<div class="selection-count">${selection.length} elements selected</div>
                    <p class="hint">Alignment applies to the whole selection.</p>
                    <div class="section"><strong>Align selection</strong><div class="button-grid" style="margin-top:.5rem">
                        <button type="button" data-align="left">Left</button><button type="button" data-align="center">Center</button><button type="button" data-align="right">Right</button>
                        <button type="button" data-align="top">Top</button><button type="button" data-align="middle">Middle</button><button type="button" data-align="bottom">Bottom</button>
                    </div></div><button id="delete-element">Delete selected</button>`;
                document.querySelectorAll('[data-align]').forEach(button => button.addEventListener('click', () => alignSelection(button.dataset.align)));
                document.getElementById('delete-element').addEventListener('click', () => { overlay.elements = overlay.elements.filter(item => !selectedIds.has(item.id)); selectedIds.clear(); render(); });
                return;
            }
            const element = selection[0];
            properties.innerHTML = `
                <label>${element.type === 'random-text' ? 'Fallback text' : 'Content'}<textarea id="element-content">${esc(element.content)}</textarea></label>
                <div class="variable-row"><label>Insert placeholder<select id="variable-picker"><option value="">Choose a variable…</option>
                    <optgroup label="Viewers"><option value="{{viewers.current}}">Current viewers</option><option value="{{viewers.peak}}">Peak viewers</option><option value="{{viewers.average}}">Average viewers</option></optgroup>
                    <optgroup label="Chat"><option value="{{chatters}}">Chatters</option><option value="{{messages}}">Messages</option><option value="{{followers}}">Followers</option><option value="{{subscribers}}">Subscribers</option></optgroup>
                    <optgroup label="Engagement"><option value="{{gift_subs}}">Gift subs</option><option value="{{bits}}">Bits</option><option value="{{donations}}">Donations</option></optgroup>
                    <optgroup label="Hashtags"><option value="{{hashtags.top}}">Most popular hashtag overall</option><option value="{{hashtags.session_top}}">Most popular hashtag this session</option><option value="{{hashtags.total}}">Total hashtag mentions</option></optgroup>
                    <optgroup label="Stream"><option value="{{music.title}}">Music title</option><option value="{{music.artist}}">Music artist</option><option value="{{stream.title}}">Stream title</option><option value="{{overlay.name}}">Overlay name</option></optgroup>
                </select></label><button type="button" id="insert-variable">Insert</button></div>
                ${element.type === 'random-text' ? `<label>Random text pool<textarea id="element-items">${esc((element.items || []).join('\n'))}</textarea><span class="hint">One phrase per line.</span></label>
                    <div class="section"><strong>Random text behavior</strong>
                        <div class="row"><label>Display<select id="random-mode"><option value="random">Random order</option><option value="order">In entered order</option></select></label><label>Refresh every (seconds)<input id="random-interval" type="number" min="1" max="3600" value="${element.random?.intervalSeconds || 5}"></label></div>
                        <label><span><input id="random-typewriter" type="checkbox" ${element.random?.typewriter ? 'checked' : ''}> Typewriter effect</span></label>
                        <div class="row"><label>Typewriter speed (ms)<input id="random-typewriter-speed" type="number" min="10" max="500" value="${element.random?.typewriterSpeed || 45}"></label><label><span><input id="random-marquee" type="checkbox" ${element.random?.marquee ? 'checked' : ''}> Marquee text</span></label></div>
                        <label>Marquee speed (seconds)<input id="random-marquee-speed" type="number" min="10" max="240" value="${element.random?.marqueeSpeed || 60}"></label>
                    </div>` : ''}
                <label>Source URL<input id="element-src" value="${esc(element.src)}" placeholder="Image, video, or webpage URL"></label>
                ${(element.type === 'image' || element.type === 'video') ? `<label>Upload asset<input id="element-upload" type="file" accept="${element.type === 'image' ? 'image/*' : 'video/*'}"><span class="hint">Uploads to StreamPulse's custom overlay asset folder.</span>${element.src ? `<img class="asset-preview" src="${esc(element.src)}" onerror="this.style.display='none'">` : ''}</label>` : ''}
                <div class="row"><label>X<input id="element-x" type="number" value="${element.x}"></label><label>Y<input id="element-y" type="number" value="${element.y}"></label></div>
                <div class="row"><label>Width<input id="element-width" type="number" value="${element.width}"></label><label>Height<input id="element-height" type="number" value="${element.height}"></label></div>
                <div class="row"><label>Font size<input id="element-font-size" type="number" value="${element.style.fontSize}"></label><label>Font color<div class="color-control"><input id="element-color" value="${esc(element.style.color)}"><input id="element-color-picker" type="color" value="${safeColor(element.style.color)}"></div></label></div>
                <label>Font family<select id="element-font"><option value="sans-serif">System sans-serif</option><option value="Arial, sans-serif">Arial</option><option value="Helvetica, sans-serif">Helvetica</option><option value="Georgia, serif">Georgia</option><option value="Impact, sans-serif">Impact</option><option value="monospace">Monospace</option><option value="'Courier New', monospace">Courier New</option><option value="'Trebuchet MS', sans-serif">Trebuchet MS</option><optgroup label="Google Fonts"><option value="'Roboto', sans-serif">Roboto</option><option value="'Open Sans', sans-serif">Open Sans</option><option value="'Lato', sans-serif">Lato</option><option value="'Montserrat', sans-serif">Montserrat</option><option value="'Oswald', sans-serif">Oswald</option><option value="'Poppins', sans-serif">Poppins</option><option value="'Raleway', sans-serif">Raleway</option><option value="'Merriweather', serif">Merriweather</option><option value="'Playfair Display', serif">Playfair Display</option><option value="'Bebas Neue', sans-serif">Bebas Neue</option><option value="'Fira Code', monospace">Fira Code</option></optgroup></select></label>
                <div class="row"><label>Weight<select id="element-weight"><option value="400">Normal</option><option value="600">Semi-bold</option><option value="700">Bold</option><option value="900">Black</option></select></label><label>Text align<select id="element-align"><option>left</option><option>center</option><option>right</option></select></label></div>
                <div class="row"><label>Vertical align<select id="element-vertical"><option value="top">Top</option><option value="middle">Middle</option><option value="bottom">Bottom</option></select></label><label>Line height<input id="element-line-height" type="number" step="0.1" value="${element.style.lineHeight}"></label></div>
                <div class="row"><label>Background<div class="color-control"><input id="element-background" value="${esc(element.style.background)}"><input id="element-background-picker" type="color" value="${safeColor(element.style.background)}"></div></label><label>Shape<select id="element-shape"><option value="rectangle">Rectangle</option><option value="circle">Circle</option><option value="pill">Pill</option><option value="line">Line</option></select></label></div>
                <div class="row"><label>Border width<input id="element-border-width" type="number" value="${element.style.borderWidth}"></label><label>Border color<div class="color-control"><input id="element-border-color" value="${esc(element.style.borderColor)}"><input id="element-border-color-picker" type="color" value="${safeColor(element.style.borderColor)}"></div></label></div>
                <div class="section"><strong>Align selected element</strong><div class="button-grid" style="margin-top:.5rem"><button type="button" data-align="left">Left</button><button type="button" data-align="center">Center</button><button type="button" data-align="right">Right</button><button type="button" data-align="top">Top</button><button type="button" data-align="middle">Middle</button><button type="button" data-align="bottom">Bottom</button></div></div>
                <button id="delete-element">Delete Element</button>`;
            document.getElementById('element-font').value = element.style.fontFamily;
            document.getElementById('element-weight').value = element.style.fontWeight;
            document.getElementById('element-align').value = element.style.textAlign;
            document.getElementById('element-vertical').value = element.style.verticalAlign;
            document.getElementById('element-shape').value = element.style.shape;
            const fields = ['content', 'src', 'x', 'y', 'width', 'height', 'font-size', 'color', 'font', 'background', 'border-width', 'border-color', 'weight', 'align', 'vertical', 'line-height', 'shape'];
            fields.forEach(name => document.getElementById(`element-${name}`).addEventListener('input', event => {
                const value = event.target.value;
                if (name === 'content' || name === 'src') element[name] = value;
                else if (['x', 'y', 'width', 'height'].includes(name)) element[name] = Number(value) || 0;
                else if (name === 'font-size') element.style.fontSize = Number(value) || 32;
                else if (name === 'border-width') element.style.borderWidth = Number(value) || 0;
                else if (name === 'color') element.style.color = value;
                else if (name === 'font') { element.style.fontFamily = value; loadGoogleFont(value); }
                else if (name === 'background') element.style.background = value;
                else if (name === 'border-color') element.style.borderColor = value;
                else if (name === 'weight') element.style.fontWeight = value;
                else if (name === 'align') element.style.textAlign = value;
                else if (name === 'vertical') element.style.verticalAlign = value;
                else if (name === 'line-height') element.style.lineHeight = Number(value) || 1.2;
                else if (name === 'shape') element.style.shape = value;
                renderCanvas();
            }));
            for (const [textId, pickerId] of [['element-color', 'element-color-picker'], ['element-background', 'element-background-picker'], ['element-border-color', 'element-border-color-picker']]) {
                document.getElementById(pickerId).addEventListener('input', event => { document.getElementById(textId).value = event.target.value; const field = textId.replace('element-', ''); element.style[field === 'color' ? 'color' : field === 'background' ? 'background' : 'borderColor'] = event.target.value; renderCanvas(); });
            }
            document.getElementById('insert-variable').addEventListener('click', () => {
                const picker = document.getElementById('variable-picker');
                const input = document.getElementById('element-content');
                if (!picker.value) return;
                const start = input.selectionStart;
                element.content = `${element.content.slice(0, start)}${picker.value}${element.content.slice(input.selectionEnd)}`;
                renderProperties();
                renderCanvas();
            });
            document.getElementById('element-upload')?.addEventListener('change', async event => {
                const file = event.target.files[0];
                if (!file) return;
                status.textContent = 'Uploading asset…';
                const response = await fetch('/api/custom-overlays/assets', { method: 'POST', headers: { 'Content-Type': file.type || 'application/octet-stream', 'X-Asset-Name': file.name }, body: file });
                const data = await response.json();
                if (!response.ok) { status.textContent = data.error || 'Asset upload failed'; return; }
                element.src = `${data.url}?v=${Date.now()}`;
                status.textContent = 'Asset uploaded';
                render();
            });
            document.querySelectorAll('[data-align]').forEach(button => button.addEventListener('click', () => alignSelection(button.dataset.align)));
            if (element.type === 'random-text') {
                document.getElementById('element-items').addEventListener('input', event => { element.items = event.target.value.split('\n').map(item => item.trim()).filter(Boolean); renderCanvas(); });
                document.getElementById('random-mode').value = element.random?.mode || 'random';
                document.getElementById('random-mode').addEventListener('input', event => { element.random.mode = event.target.value; renderCanvas(); });
                document.getElementById('random-interval').addEventListener('input', event => { element.random.intervalSeconds = Number(event.target.value) || 5; });
                document.getElementById('random-typewriter-speed').addEventListener('input', event => { element.random.typewriterSpeed = Number(event.target.value) || 45; });
                document.getElementById('random-marquee-speed').addEventListener('input', event => { element.random.marqueeSpeed = Number(event.target.value) || 60; renderCanvas(); });
                document.getElementById('random-typewriter').addEventListener('change', event => { element.random.typewriter = event.target.checked; renderCanvas(); });
                document.getElementById('random-marquee').addEventListener('change', event => { element.random.marquee = event.target.checked; renderCanvas(); });
            }
            document.getElementById('delete-element').addEventListener('click', () => { overlay.elements = overlay.elements.filter(item => item.id !== element.id); selectedIds.clear(); render(); });
        }
        function alignSelection(mode) {
            const selection = selectedElements();
            if (!selection.length) return;
            const bounds = selection.reduce((result, item) => ({ left: Math.min(result.left, item.x), top: Math.min(result.top, item.y), right: Math.max(result.right, item.x + item.width), bottom: Math.max(result.bottom, item.y + item.height) }), { left: Infinity, top: Infinity, right: -Infinity, bottom: -Infinity });
            const target = mode === 'left' ? bounds.left : mode === 'center' ? (bounds.left + bounds.right) / 2 : mode === 'right' ? bounds.right : mode === 'top' ? bounds.top : mode === 'middle' ? (bounds.top + bounds.bottom) / 2 : bounds.bottom;
            for (const item of selection) {
                if (['left', 'center', 'right'].includes(mode)) item.x = Math.round(mode === 'left' ? target : mode === 'center' ? target - item.width / 2 : target - item.width);
                else item.y = Math.round(mode === 'top' ? target : mode === 'middle' ? target - item.height / 2 : target - item.height);
            }
            render();
        }
        function enableDragging() {
            interact('.canvas-element').draggable({
                listeners: {
                    move(event) {
                        const element = overlay.elements.find(item => item.id === event.target.dataset.id);
                        if (!element) return;
                        const moving = selectedIds.has(element.id) ? selectedElements() : [element];
                        for (const item of moving) {
                            item.x += event.dx / zoom;
                            item.y += event.dy / zoom;
                        }
                        if (moving.length === 1) snapElement(element);
                        for (const item of moving) {
                            const node = canvas.querySelector(`[data-id="${CSS.escape(item.id)}"]`);
                            if (node) { node.style.left = `${item.x}px`; node.style.top = `${item.y}px`; }
                        }
                        renderLayers();
                    }
                }
            });
            interact('.canvas-element').resizable({
                edges: { top: true, right: true, bottom: true, left: true },
                listeners: {
                    move(event) {
                        const element = overlay.elements.find(item => item.id === event.target.dataset.id);
                        if (!element || !selectedIds.has(element.id)) return;
                        element.width = Math.max(20, Math.min(overlay.canvas.width, event.rect.width / zoom));
                        element.height = Math.max(20, Math.min(overlay.canvas.height, event.rect.height / zoom));
                        element.x += event.deltaRect.left / zoom;
                        element.y += event.deltaRect.top / zoom;
                        element.x = Math.max(0, Math.min(overlay.canvas.width - element.width, element.x));
                        element.y = Math.max(0, Math.min(overlay.canvas.height - element.height, element.y));
                        event.target.style.left = `${element.x}px`;
                        event.target.style.top = `${element.y}px`;
                        event.target.style.width = `${element.width}px`;
                        event.target.style.height = `${element.height}px`;
                        for (const [id, value] of [['element-x', element.x], ['element-y', element.y], ['element-width', element.width], ['element-height', element.height]]) {
                            const field = document.getElementById(id);
                            if (field) field.value = Math.round(value);
                        }
                    }
                },
                modifiers: [interact.modifiers.restrictSize({ min: { width: 20, height: 20 } })]
            });
        }
        function addElement(type) {
            const id = `${type}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
            overlay.elements.push({ id, type, content: defaults[type], items: type === 'random-text' ? ['Random phrase one', 'Random phrase two'] : [], random: { mode: 'random', intervalSeconds: 5, typewriter: false, typewriterSpeed: 45, marquee: false, marqueeSpeed: 60 }, src: '', x: 100, y: 100, width: type === 'shape' ? 500 : 600, height: type === 'shape' ? 180 : 120, zIndex: overlay.elements.length, visible: true, style: { fontFamily: 'sans-serif', fontSize: 32, fontWeight: '400', color: '#ffffff', textAlign: 'left', verticalAlign: 'top', lineHeight: 1.2, letterSpacing: 0, background: type === 'shape' ? '#161b22' : 'transparent', borderColor: 'transparent', borderWidth: 0, borderRadius: 0, opacity: 1, objectFit: 'cover', shape: 'rectangle' } });
            selectedIds = new Set([id]); render();
        }
        async function load() {
            if (!isNew) {
                const response = await fetch(`/api/custom-overlays/${encodeURIComponent(overlayId)}`);
                if (!response.ok) throw new Error('Overlay not found');
                overlay = await response.json();
            }
            render();
        }
        document.querySelectorAll('[data-add]').forEach(button => button.addEventListener('click', () => addElement(button.dataset.add)));
        document.getElementById('overlay-name').addEventListener('input', event => { overlay.name = event.target.value; });
        document.getElementById('canvas-width').addEventListener('input', event => { overlay.canvas.width = Number(event.target.value) || 1920; syncOverlayFields(); });
        document.getElementById('canvas-height').addEventListener('input', event => { overlay.canvas.height = Number(event.target.value) || 1080; syncOverlayFields(); });
        document.getElementById('canvas-background').addEventListener('input', event => { overlay.canvas.background = event.target.value; syncOverlayFields(); });
        document.getElementById('canvas-background-color').addEventListener('input', event => {
            overlay.canvas.background = event.target.value;
            document.getElementById('canvas-background').value = event.target.value;
            syncOverlayFields();
        });
        document.getElementById('zoom').addEventListener('input', event => { zoom = Number(event.target.value) / 100; syncOverlayFields(); });
        document.getElementById('reset-view').addEventListener('click', () => {
            zoom = 0.5;
            viewPan = { x: 0, y: 0 };
            document.getElementById('canvas-wrap').scrollTo({ left: 0, top: 0, behavior: 'smooth' });
            syncOverlayFields();
            status.textContent = 'View reset';
            setTimeout(() => { if (status.textContent === 'View reset') status.textContent = ''; }, 1200);
        });
        const canvasWrap = document.getElementById('canvas-wrap');
        let panStart = null;
        canvasWrap.addEventListener('pointerdown', event => {
            if (event.target.closest('.canvas-element') && event.button !== 1 && !event.shiftKey && !event.altKey) return;
            panStart = { x: event.clientX, y: event.clientY, panX: viewPan.x, panY: viewPan.y };
            canvasWrap.classList.add('panning');
            canvasWrap.setPointerCapture(event.pointerId);
        });
        canvasWrap.addEventListener('pointermove', event => {
            if (!panStart) return;
            viewPan.x = panStart.panX + event.clientX - panStart.x;
            viewPan.y = panStart.panY + event.clientY - panStart.y;
            canvasFrame.style.transform = `translate(${viewPan.x}px, ${viewPan.y}px)`;
        });
        canvasWrap.addEventListener('pointerup', () => { panStart = null; canvasWrap.classList.remove('panning'); });
        canvasWrap.addEventListener('pointercancel', () => { panStart = null; canvasWrap.classList.remove('panning'); });
        document.getElementById('save').addEventListener('click', async () => {
            const method = isNew ? 'POST' : 'PUT';
            const url = isNew ? '/api/custom-overlays' : `/api/custom-overlays/${encodeURIComponent(overlay.id)}`;
            const response = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(overlay) });
            const data = await response.json();
            if (!response.ok) { status.textContent = data.error || 'Save failed'; return; }
            overlay = data; isNew = false; status.textContent = `Saved revision ${overlay.revision}; live overlays updated`; setTimeout(() => status.textContent = '', 4000); render();
        });
        document.getElementById('preview').addEventListener('click', () => window.open(`/custom-overlay.html?id=${encodeURIComponent(overlay.id)}`, '_blank', 'noopener'));
        new Sortable(layers, { animation: 150, onEnd(event) { const [moved] = overlay.elements.splice(overlay.elements.length - 1 - event.oldIndex, 1); overlay.elements.splice(overlay.elements.length - 1 - event.newIndex, 0, moved); render(); } });
        load().catch(error => { status.textContent = error.message; });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/admin.css">
    <script src="/appearance.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Quotes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg-page); color: var(--text); min-height: 100vh; }
        .wrap { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; display: grid; gap: 1rem; }
        h1 { font-size: 1.4rem; } h1 span { color: var(--accent); }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1.1rem; }
        .card h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-bottom: .6rem; }
        .muted { color: var(--text-muted); font-size: .82rem; line-height: 1.5; }
        table.help { border-collapse: collapse; width: 100%; font-size: .85rem; }
        table.help td { padding: .35rem .5rem; border-bottom: 1px solid var(--bg-raised); vertical-align: top; }
        table.help td:first-child { white-space: nowrap; }
        code { background: var(--bg-inset); padding: .1rem .35rem; border-radius: 4px; }
        input { width: 100%; padding: .55rem .7rem; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font: inherit; }
        .quote { display: grid; grid-template-columns: 3rem 1fr; gap: .6rem; padding: .6rem 0; border-bottom: 1px solid var(--bg-raised); }
        .num { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
        .meta { font-size: .72rem; color: var(--text-muted); margin-top: .1rem; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>StreamPulse <span>Quotes</span> <span class="muted" id="count"></span></h1>

    <div class="card">
        <h2>Chat commands</h2>
        <table class="help" id="help"></table>
    </div>

    <div class="card">
        <h2 style="display:flex;justify-content:space-between;align-items:center;">All quotes <button id="md" style="padding:.3rem .7rem;background:var(--bg-raised);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;">Export Markdown</button></h2>
        <input id="search" type="search" placeholder="Search by text, game, author or number">
        <div id="list" style="margin-top:.5rem;"></div>
    </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = v => { const d = document.createElement('div'); d.textContent = v ?? ''; return d.innerHTML; };
let state = { quotes: [], settings: {} };
const who = a => ({ everyone: 'Everyone', subs: 'Subscribers and mods', mods: 'Mods only' })[a] || 'Everyone';

function renderHelp() {
    const p = state.settings.prefix || '!', b = state.settings.builtins || {};
    const rows = [
        ['quote', 'A random quote', 'quote'],
        ['quote 12', 'Quote number 12', 'quote'],
        ['quote word', 'A random quote containing "word"', 'quote'],
        ['quote details', 'Add <code>details</code> to any of the above to also show game, author and date, e.g. <code>' + p + 'quote 12 details</code>', 'quote'],
        ['quotes', 'How many quotes are saved', 'quotes'],
        ['addquote text', 'Add a new quote', 'addquote'],
        ['delquote 12', 'Remove quote number 12', 'delquote']
    ];
    $('help').innerHTML = rows.map(([cmd, desc, key]) => `<tr><td><code>${esc(p + cmd)}</code></td><td>${desc}</td><td class="muted">${who(b[key]?.access)}</td></tr>`).join('');
}

function renderList() {
    const term = $('search').value.trim().toLowerCase().replace(/^#/, '');
    const shown = state.quotes.filter(q => !term || [q.text, q.game, q.by, String(q.id)].some(v => String(v || '').toLowerCase().includes(term)));
    $('count').textContent = `(${state.quotes.length})`;
    $('list').innerHTML = shown.length ? shown.map(q => `<div class="quote"><span class="num">#${q.id}</span><div><div>${esc(q.text)}</div><div class="meta">${[q.game, q.by && 'Added by ' + q.by, new Date(q.at).toLocaleDateString(undefined, { month: 'short', year: 'numeric' })].filter(Boolean).map(esc).join(' · ')}</div></div></div>`).join('') : '<div class="muted">No quotes found.</div>';
}

$('md').onclick = () => {
    const lines = state.quotes.map(q => {
        const meta = [q.game, q.by && 'added by ' + q.by, new Date(q.at).toLocaleDateString(undefined, { month: 'short', year: 'numeric' })].filter(Boolean).join(', ');
        return `${q.id}. "${q.text}" (${meta})`;
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([`# Quotes\n\n${lines.join('\n')}\n`], { type: 'text/markdown' }));
    a.download = 'streampulse-quotes.md'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('search').addEventListener('input', renderList);
fetch('/api/chatbot', { cache: 'no-store' }).then(r => r.json()).then(d => { state = d; renderHelp(); renderList(); });
</script>
</body>
</html>

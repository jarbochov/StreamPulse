<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StreamPulse — The Broadcast Companion Suite</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="StreamPulse - The self-hosted broadcast companion and overlay suite for SocialStream Ninja and Twitch. Cinematic OBS browser overlays, choice randomizers, credits rolls, and community CRM.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.css">
  <style>
    :root {
      --theme-color: #6366f1;
      --base-font-size: 15px;
      --base-line-height: 1.65;
      --accent-color: #6366f1;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #090d16;
      color: #cbd5e1;
      -webkit-font-smoothing: antialiased;
    }
    .sidebar {
      background-color: #0f1422;
      color: #94a3b8;
      border-right: 1px solid #1e293b;
    }
    .sidebar-nav a {
      color: #cbd5e1;
      font-size: 14px;
      transition: all 0.15s ease;
      border-radius: 6px;
      padding: 4px 8px;
    }
    .sidebar-nav a:hover {
      color: #6366f1;
      background: rgba(99, 102, 241, 0.08);
    }
    .sidebar-nav li.active > a {
      color: #ffffff;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.15);
      border-left: 3px solid #6366f1;
    }
    .sidebar-nav strong {
      color: #64748b;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 1.5rem;
      margin-bottom: 0.35rem;
      display: inline-block;
    }
    .app-name-link {
      font-weight: 800;
      font-size: 1.25rem;
      color: #ffffff !important;
      letter-spacing: -0.02em;
    }
    .app-name-link::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #6366f1;
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 12px #6366f1;
    }
    @media (min-width: 769px) {
      .sidebar-toggle {
        display: none !important;
      }
    }

    /* Sidebar Accordion / Collapsible Non-Open Sections */
    .sidebar-nav > ul > li {
      margin-bottom: 0.6rem;
    }
    .sidebar-nav > ul > li > p,
    .sidebar-nav > ul > li > strong {
      display: flex !important;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.15s ease, color 0.15s ease;
      margin-top: 0.5rem;
      margin-bottom: 0.25rem;
    }
    .sidebar-nav > ul > li > p:hover,
    .sidebar-nav > ul > li > strong:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff !important;
    }
    .sidebar-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      color: #64748b;
      margin-left: auto;
      pointer-events: none;
    }
    .sidebar-nav > ul > li.is-collapsed .sidebar-chevron {
      transform: rotate(-90deg);
    }
    .sidebar-nav > ul > li:not(.is-collapsed) .sidebar-chevron {
      transform: rotate(0deg);
      color: #818cf8;
    }
    .sidebar-nav > ul > li.is-collapsed > ul {
      display: none !important;
    }

    /* Sidebar Funding Card */
    .sidebar-funding-card {
      margin: 1.5rem 0.85rem 2rem;
      padding: 14px 14px 12px;
      background: linear-gradient(180deg, rgba(23, 31, 51, 0.75) 0%, rgba(15, 20, 34, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }
    .sidebar-funding-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #ff5e5b, #ff8583);
    }
    .sidebar-funding-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #ff8583;
      background: rgba(255, 94, 91, 0.12);
      border: 1px solid rgba(255, 94, 91, 0.25);
      border-radius: 4px;
      padding: 2px 7px;
      margin-bottom: 8px;
    }
    .sidebar-funding-title {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .sidebar-funding-desc {
      font-size: 11.5px;
      line-height: 1.45;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .sidebar-funding-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff !important;
      background: linear-gradient(135deg, #ff5e5b 0%, #fa4744 100%);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-decoration: none !important;
      box-shadow: 0 2px 8px rgba(255, 94, 91, 0.35);
      transition: all 0.15s ease;
    }
    .sidebar-funding-btn:hover {
      background: linear-gradient(135deg, #fa4744 0%, #e0322f 100%);
      box-shadow: 0 4px 14px rgba(255, 94, 91, 0.55);
      transform: translateY(-1px);
      color: #ffffff !important;
    }

    /* Content & Markdown Clearance */
    .content {
      padding-top: 0;
    }
    .markdown-section {
      max-width: 1040px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }
    .markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4 {
      color: #f8fafc;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .markdown-section h1 { font-size: 2.2rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.6rem; margin-top: 1rem; }
    .markdown-section h2 { font-size: 1.55rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.4rem; margin-top: 2.5rem; }
    .markdown-section h3 { font-size: 1.25rem; margin-top: 1.8rem; color: #e2e8f0; }
    .markdown-section p, .markdown-section ul, .markdown-section ol {
      color: #cbd5e1;
      line-height: 1.7;
    }
    .markdown-section a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
    }
    .markdown-section a:hover {
      text-decoration: underline;
      color: #a5b4fc;
    }
    .markdown-section img {
      border-radius: 10px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65);
      border: 1px solid #1e293b;
      margin: 1.5rem 0;
      max-width: 100%;
      background: #090d16;
      display: block;
    }
    .markdown-section pre {
      background-color: #0f1422 !important;
      border: 1px solid #1e293b;
      border-radius: 8px;
    }
    .markdown-section code {
      background-color: rgba(99, 102, 241, 0.12);
      color: #c7d2fe;
      border-radius: 4px;
      padding: 0.15em 0.4em;
      font-size: 0.9em;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    .markdown-section pre > code {
      background-color: transparent !important;
      color: #cbd5e1;
      padding: 0;
    }
    /* Complete Dark Mode Table Architecture */
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: separate !important;
      border-spacing: 0 !important;
      margin: 2rem 0 !important;
      border-radius: 10px !important;
      border: 1px solid #1e293b !important;
      background: #0b0f19 !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4) !important;
      overflow: hidden !important;
    }
    .markdown-section tr {
      background: transparent !important;
      border: none !important;
      border-top: none !important;
    }
    .markdown-section thead tr {
      background: #111827 !important;
    }
    .markdown-section tbody tr {
      background-color: transparent !important;
    }
    .markdown-section tr:nth-child(2n),
    .markdown-section tbody tr:nth-child(even),
    .markdown-section tbody tr:nth-child(2n) {
      background-color: rgba(15, 23, 42, 0.65) !important;
    }
    .markdown-section th {
      background: #111827 !important;
      color: #94a3b8 !important;
      font-size: 11.5px !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.07em !important;
      padding: 13px 18px !important;
      border: none !important;
      border-bottom: 2px solid #1e293b !important;
      text-align: left !important;
      white-space: nowrap !important;
    }
    .markdown-section td {
      padding: 14px 18px !important;
      border: none !important;
      border-bottom: 1px solid #172033 !important;
      color: #cbd5e1 !important;
      font-size: 13.5px !important;
      line-height: 1.65 !important;
      background: transparent !important;
      transition: background 0.15s ease !important;
      vertical-align: top !important;
    }
    .markdown-section tr:last-child td {
      border-bottom: none !important;
    }
    .markdown-section tbody tr:hover td {
      background-color: rgba(99, 102, 241, 0.1) !important;
      color: #f8fafc !important;
    }
    .markdown-section td strong {
      color: #f1f5f9 !important;
      font-weight: 600 !important;
      display: inline-block;
      margin-bottom: 2px;
    }
    .markdown-section td code {
      display: inline-block !important;
      font-size: 12px !important;
      padding: 3px 7px !important;
      margin: 2px 3px !important;
      background: rgba(99, 102, 241, 0.14) !important;
      color: #c7d2fe !important;
      border: 1px solid rgba(99, 102, 241, 0.28) !important;
      border-radius: 4px !important;
      line-height: 1.4 !important;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace !important;
    }
    .markdown-section blockquote {
      border-left: 4px solid #6366f1;
      background: rgba(99, 102, 241, 0.08);
      color: #cbd5e1;
      border-radius: 0 8px 8px 0;
      padding: 14px 18px;
      margin: 1.5rem 0;
    }
    .search input {
      background: #090d16 !important;
      border: 1px solid #1e293b !important;
      color: #f8fafc !important;
      border-radius: 6px !important;
    }
    .search .matching-post {
      border-bottom: 1px solid #1e293b;
    }

    /* Tabs styling */
    .docsify-tabs__tab {
      background: #0f1422 !important;
      color: #94a3b8 !important;
      border: 1px solid #1e293b !important;
      border-bottom: none !important;
      font-weight: 600;
    }
    .docsify-tabs__tab--active {
      background: #090d16 !important;
      color: #f8fafc !important;
      border-top: 2px solid #6366f1 !important;
    }
    .docsify-tabs__content {
      background: #090d16 !important;
      border: 1px solid #1e293b !important;
      border-radius: 0 0 8px 8px;
    }

    /* Pagination footer */
    .pagination-item-title {
      color: #f8fafc !important;
      font-weight: 600;
    }
    .pagination-item-subtitle {
      color: #64748b !important;
      font-size: 11px !important;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Coverpage Hero Section - ONLY displayed on homepage */
    section.cover:not(.show) {
      display: none !important;
    }
    section.cover.show {
      background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #090d16 55%, #05070c 100%) !important;
      color: #f8fafc;
      min-height: 100vh;
      display: flex !important;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    section.cover .cover-main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      text-align: center;
    }
    .cover-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .cover-pill {
      display: inline-block;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.2);
    }
    section.cover h1 {
      font-size: clamp(2.5rem, 5.5vw, 4.2rem) !important;
      font-weight: 900 !important;
      letter-spacing: -0.04em !important;
      background: linear-gradient(135deg, #ffffff 30%, #c7d2fe 70%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 1rem 0 !important;
      border: none !important;
      line-height: 1.15;
    }
    .cover-subtitle {
      color: #94a3b8;
      font-size: clamp(1rem, 2vw, 1.25rem);
      max-width: 760px;
      margin: 0 auto 2rem auto;
      line-height: 1.6;
    }
    .cover-cta-row {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }
    .cover-btn {
      text-decoration: none !important;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .cover-btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff !important;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .cover-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(99, 102, 241, 0.6);
    }
    .cover-btn-secondary {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc !important;
      backdrop-filter: blur(8px);
    }
    .cover-btn-secondary:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: #6366f1;
      transform: translateY(-2px);
    }
    .cover-btn-ghost {
      background: transparent;
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #cbd5e1 !important;
    }
    .cover-btn-ghost:hover {
      border-color: #f8fafc;
      color: #ffffff !important;
      transform: translateY(-2px);
    }
    .cover-btn-sponsor {
      background: rgba(255, 94, 91, 0.14);
      border: 1px solid rgba(255, 94, 91, 0.4);
      color: #ff8583 !important;
      backdrop-filter: blur(8px);
      gap: 8px;
    }
    .cover-btn-sponsor:hover {
      background: #ff5e5b;
      border-color: #ff5e5b;
      color: #ffffff !important;
      box-shadow: 0 4px 20px rgba(255, 94, 91, 0.45);
      transform: translateY(-2px);
    }
    .cover-preview-card {
      max-width: 960px;
      margin: 0 auto 2.5rem auto;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #090d16;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }
    .cover-preview-card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.5);
    }
    .cover-preview-card img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    .cover-preview-caption {
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      background: #0d121f;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      letter-spacing: 0.02em;
    }
    .cover-features-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
    }
    .cover-feature-pill {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px 18px;
      text-align: left;
      transition: border-color 0.2s ease;
    }
    .cover-feature-pill:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }
    .cover-feature-title {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .cover-feature-desc {
      font-size: 12px;
      color: #8b949e;
      line-height: 1.4;
    }

    /* In-Doc Feature Grid & Cards */
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin: 1.75rem 0;
    }
    .feature-card {
      background: #0f1422;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 18px 20px;
      transition: transform 0.15s ease, border-color 0.15s ease;
      text-decoration: none !important;
      display: block;
    }
    .feature-card:hover {
      border-color: #6366f1;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .feature-card h4 {
      margin: 0 0 6px 0;
      color: #f8fafc;
      font-size: 15px;
      font-weight: 700;
    }
    .feature-card p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: #94a3b8;
    }

    /* Pele Mermaid Diagram Container */
    .mermaid-diagram {
      margin: 2.25rem 0;
      background: #0f1422;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1.75rem;
      overflow-x: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --pele-bg: #0f1422;
      --pele-fg: #f8fafc;
      --pele-muted: #94a3b8;
      --pele-line: #818cf8;
      --pele-surface: #1e293b;
      --pele-surface-alt: #161f30;
      --pele-border: #334155;
      --pele-accent: #6366f1;
      --pele-radius: 8px;
      --pele-error: #ef4444;
      --pele-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .mermaid-diagram svg {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .mermaid-diagram .pele-title {
      font-weight: 700;
      fill: #f8fafc;
    }
    .mermaid-diagram .pele-cluster-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      fill: #818cf8;
    }
    .mermaid-error {
      color: #ef4444;
      padding: 12px;
      font-size: 13px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="app">Loading StreamPulse Documentation...</div>
  <!-- Pele Library for Mermaid-to-SVG compilation -->
  <script src="vendor/pele.global.js"></script>
  <script>
    if (!window.pele) {
      document.write('<script src="//cdn.jsdelivr.net/npm/pele@1/dist/pele.global.js"><\/script>');
    }
  </script>
  <script>
    window.$docsify = {
      name: 'StreamPulse',
      repo: 'https://github.com/jarbochov/StreamPulse',
      coverpage: true,
      onlyCover: false,
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No matching guides found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous Guide',
        nextText: 'Next Guide',
        crossChapter: true,
        crossChapterText: true
      },
      tabs: {
        persist: true,
        sync: true,
        theme: 'classic',
        tabComments: true,
        tabHeadings: true
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === "mermaid") {
              if (window.pele && typeof window.pele.render === 'function') {
                try {
                  var res = window.pele.render(code, { responsive: true, autoDirection: true });
                  return '<div class="mermaid-diagram" data-pele-rendered="true">' + res.svg + '</div>';
                } catch (err) {
                  console.warn("Pele render error:", err);
                  return '<div class="mermaid-diagram mermaid-error"><pre><code>' + (err.snippet || err.message || err) + '</code></pre></div>';
                }
              }
              return '<div class="mermaid-diagram" data-pele-pending="true" data-source="' + encodeURIComponent(code) + '"></div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook, vm) {
          hook.doneEach(function() {

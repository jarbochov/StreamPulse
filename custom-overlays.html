<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Custom Overlays</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0f1117; color: #e1e4e8; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 2rem; background: #161b22; border-bottom: 1px solid #30363d; }
        h1 { font-size: 1.25rem; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem; }
        .toolbar, .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; }
        .toolbar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        button, a.btn, label.btn { border: 1px solid #30363d; border-radius: 6px; padding: .5rem .75rem; background: #21262d; color: #e1e4e8; cursor: pointer; text-decoration: none; font: inherit; }
        button:hover, a.btn:hover, label.btn:hover { border-color: #58a6ff; background: #1a2332; }
        button.primary { border-color: #1f6feb; background: #1a2332; }
        .overlay-list { display: grid; gap: .75rem; }
        .overlay-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .meta { color: #8b949e; font-size: .8rem; margin-top: .3rem; }
        h2 { font-size: 1rem; margin: 0 0 .75rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .assets { margin-top: 1.5rem; }
        .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .75rem; }
        .asset { border: 1px solid #30363d; border-radius: 8px; overflow: hidden; background: #0d1117; display: flex; flex-direction: column; }
        .asset .thumb { position: relative; flex: none; height: 120px; overflow: hidden; background: conic-gradient(#1c2128 25%, #161b22 0 50%, #1c2128 0 75%, #161b22 0) 0 0 / 16px 16px; }
        .asset .thumb img, .asset .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
        .asset .info { padding: .55rem .65rem; display: grid; gap: .25rem; font-size: .8rem; }
        .asset .name { overflow-wrap: anywhere; font-weight: 600; }
        select { background: #21262d; color: #e1e4e8; border: 1px solid #30363d; border-radius: 6px; padding: .45rem .5rem; font: inherit; }
        #asset-drop.over { border-color: #58a6ff !important; color: #58a6ff; }
        .asset .sample { position: absolute; inset: 0; display: grid; place-items: center; padding: .4rem; font-size: 1.15rem; text-align: center; color: #e1e4e8; }
        .badge { display: inline-block; padding: .05rem .4rem; border-radius: 999px; font-size: .7rem; border: 1px solid #30363d; color: #8b949e; }
        .badge.used { border-color: #1f6feb; color: #58a6ff; }
        .asset button { margin-top: .3rem; padding: .3rem .5rem; font-size: .8rem; }
        .empty { color: #8b949e; text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <header class="header"><h1>StreamPulse <span style="color:#58a6ff">Custom Overlays</span></h1><div id="main-nav" class="nav"></div></header>
    <script src="/nav.js"></script>
    <main class="container">
        <div class="toolbar">
            <a class="btn primary" href="/custom-overlay-editor.html?new=1">Create Overlay</a>
            <a class="btn" href="/overlays.html">All Overlays</a>
            <a class="btn" href="/custom-overlay.html?id=stream-start" target="_blank" rel="noopener">Runtime Example URL</a>
        </div>
        <section class="card">
            <div id="overlay-list" class="overlay-list"><div class="empty">Loading overlays...</div></div>
        </section>
        <section class="card assets">
            <h2>Assets <span style="display:flex;gap:.5rem;flex-wrap:wrap"><select id="asset-filter" aria-label="Filter assets"><option value="all">All</option><option value="image">Images</option><option value="video">Videos</option><option value="font">Fonts</option></select><label class="btn" for="asset-upload">Upload…</label><input id="asset-upload" type="file" multiple hidden accept=".png,.jpg,.jpeg,.gif,.webp,.svg,.mp4,.webm,.ogg,.ttf,.otf,.woff,.woff2"><button id="purge-btn" hidden>Delete all unused</button></span></h2>
            <div id="asset-drop" class="empty" style="padding:.6rem;margin-bottom:.75rem;border:1px dashed #30363d;border-radius:8px">Drop images, videos or fonts here to upload (100 MB max each)</div>
            <div id="asset-list" class="asset-grid"><div class="empty">Loading assets...</div></div>
        </section>
    </main>
    <script>
        const list = document.getElementById('overlay-list');
        function esc(value) { return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        async function load() {
            const response = await fetch('/api/custom-overlays', { cache: 'no-store' });
            const overlays = await response.json();
            list.innerHTML = overlays.length ? overlays.map(overlay => `
                <article class="overlay-row">
                    <div><strong>${esc(overlay.name)}</strong><div class="meta">${esc(overlay.id)} · ${overlay.canvas.width}×${overlay.canvas.height} · revision ${overlay.revision}</div></div>
                    <div><a class="btn" href="/custom-overlay-editor.html?id=${encodeURIComponent(overlay.id)}">Edit</a> <a class="btn" href="/custom-overlay.html?id=${encodeURIComponent(overlay.id)}" target="_blank" rel="noopener">Open</a> <button data-delete="${esc(overlay.id)}">Delete</button></div>
                </article>`).join('') : '<div class="empty">No custom overlays yet.</div>';
            list.querySelectorAll('[data-delete]').forEach(button => button.addEventListener('click', async () => {
                if (!confirm(`Delete ${button.dataset.delete}?`)) return;
                await fetch(`/api/custom-overlays/${encodeURIComponent(button.dataset.delete)}`, { method: 'DELETE' });
                load();
            }));
        }
        const assetList = document.getElementById('asset-list');
        const purgeBtn = document.getElementById('purge-btn');
        const formatSize = bytes => bytes >= 1048576 ? `${(bytes / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(bytes / 1024))} KB`;
        const filterSelect = document.getElementById('asset-filter');
        const dropZone = document.getElementById('asset-drop');
        const fileInput = document.getElementById('asset-upload');
        const TYPES = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', mp4: 'video/mp4', webm: 'video/webm', ogg: 'video/ogg', ttf: 'font/ttf', otf: 'font/otf', woff: 'font/woff', woff2: 'font/woff2' };
        let assets = [];
        let visible = [];
        async function api(url, options) {
            const response = await fetch(url, options);
            const data = await response.json().catch(() => ({}));
            if (!response.ok) { const error = new Error(data.error || `Request failed (${response.status})`); error.data = data; throw error; }
            return data;
        }
        async function uploadFiles(files) {
            const failures = [];
            for (const file of files) {
                const type = TYPES[(file.name.split('.').pop() || '').toLowerCase()];
                if (!type) { failures.push(`${file.name}: unsupported file type`); continue; }
                try { await api('/api/custom-overlays/assets', { method: 'POST', headers: { 'Content-Type': type, 'X-Asset-Name': file.name.replace(/[^\x20-\x7e]+/g, '-') }, body: file }); }
                catch (error) { failures.push(`${file.name}: ${error.message}`); }
            }
            if (failures.length) alert(failures.join('\n'));
            await loadAssets();
        }
        async function loadAssets() {
            assets = await api('/api/custom-overlays/assets', { cache: 'no-store' });
            const faces = assets.filter(asset => asset.kind === 'font').map(asset => `@font-face { font-family: '${asset.family}'; src: url('${asset.url}'); }`).join('\n');
            let style = document.getElementById('asset-fonts');
            if (!style) { style = document.createElement('style'); style.id = 'asset-fonts'; document.head.appendChild(style); }
            style.textContent = faces;
            const unused = assets.filter(asset => !asset.usedBy.length);
            purgeBtn.hidden = !unused.length;
            purgeBtn.textContent = `Delete ${unused.length} unused`;
            renderAssets();
        }
        function renderAssets() {
            const filter = filterSelect.value;
            visible = assets.filter(asset => filter === 'all' || asset.kind === filter);
            assetList.innerHTML = visible.length ? visible.map((asset, index) => `
                <article class="asset">
                    <div class="thumb">${asset.kind === 'video' ? `<video src="${esc(asset.url)}" muted preload="metadata"></video>` : asset.kind === 'font' ? `<div class="sample" style="font-family:'${esc(asset.family)}', sans-serif">The quick brown fox 123</div>` : `<img src="${esc(asset.url)}" alt="">`}</div>
                    <div class="info">
                        <div class="name">${esc(asset.label)}</div>
                        <div class="meta" style="margin:0">${esc(asset.kind)} · ${formatSize(asset.size)}</div>
                        <div>${asset.usedBy.length ? `<span class="badge used" title="${esc(asset.usedBy.map(o => o.id).join(', '))}">Used by ${asset.usedBy.map(o => esc(o.name || o.id)).join(', ')}</span>` : '<span class="badge">Unused</span>'}</div>
                        <div style="display:flex;gap:.4rem"><button data-rename="${index}" style="flex:1">Rename</button><button data-asset="${index}" style="flex:1">Delete</button></div>
                    </div>
                </article>`).join('') : `<div class="empty">No ${filter === 'all' ? '' : filter + ' '}assets.</div>`;
        }
        assetList.addEventListener('click', async event => {
            const rename = event.target.closest('[data-rename]');
            const remove = event.target.closest('[data-asset]');
            if (rename) {
                const asset = visible[Number(rename.dataset.rename)];
                const next = prompt('Rename asset', asset.label);
                if (next === null || !next.trim() || next.trim() === asset.label) return;
                try {
                    const result = await api(`/api/custom-overlays/assets/${encodeURIComponent(asset.name)}/rename`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: next }) });
                    if (result.updated?.length) alert(`Renamed. Updated ${result.updated.length} overlay(s): ${result.updated.join(', ')}.`);
                } catch (error) { alert(error.message); }
                loadAssets();
                return;
            }
            if (!remove) return;
            const asset = visible[Number(remove.dataset.asset)];
            const warning = asset.usedBy.length ? `\n\nThis asset is used by: ${asset.usedBy.map(o => o.name || o.id).join(', ')}. Those overlays will show a broken file.` : '';
            if (!confirm(`Permanently delete ${asset.label}?${warning}`)) return;
            try { await api(`/api/custom-overlays/assets/${encodeURIComponent(asset.name)}${asset.usedBy.length ? '?force=1' : ''}`, { method: 'DELETE' }); } catch (error) { alert(error.message); }
            loadAssets();
        });
        purgeBtn.addEventListener('click', async () => {
            const unused = assets.filter(asset => !asset.usedBy.length);
            if (!unused.length || !confirm(`Permanently delete ${unused.length} unused asset(s)?`)) return;
            for (const asset of unused) { try { await api(`/api/custom-overlays/assets/${encodeURIComponent(asset.name)}`, { method: 'DELETE' }); } catch (error) { alert(error.message); break; } }
            loadAssets();
        });
        filterSelect.addEventListener('change', renderAssets);
        fileInput.addEventListener('change', () => { const files = [...fileInput.files]; fileInput.value = ''; if (files.length) uploadFiles(files); });
        ['dragenter', 'dragover'].forEach(name => dropZone.addEventListener(name, event => { event.preventDefault(); dropZone.classList.add('over'); }));
        ['dragleave', 'drop'].forEach(name => dropZone.addEventListener(name, event => { event.preventDefault(); dropZone.classList.remove('over'); }));
        dropZone.addEventListener('drop', event => { const files = [...event.dataTransfer.files]; if (files.length) uploadFiles(files); });
        load().catch(error => { list.innerHTML = `<div class="empty">${esc(error.message)}</div>`; });
        loadAssets().catch(error => { assetList.innerHTML = `<div class="empty">${esc(error.message)}</div>`; });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Custom Overlays</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; font-size: 14px; }
        .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.3rem; font-weight: 600; }
        .header h1 span { color: #58a6ff; }
        .container { max-width: 1300px; margin: 0 auto; padding: 1.5rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 0.9rem 1.1rem; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
        .toolbar .grow { flex: 1; min-width: 180px; }
        input, select { padding: 0.45rem 0.65rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e1e4e8; font: inherit; min-width: 0; }
        input:focus, select:focus { outline: none; border-color: #58a6ff; }
        .btn { border: 1px solid #30363d; background: #21262d; color: #e1e4e8; border-radius: 6px; padding: 0.45rem 0.8rem; font: inherit; font-size: 0.82rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem; }
        .btn:hover { border-color: #58a6ff; }
        .btn.primary { background: #238636; border-color: #238636; }
        .btn.danger:hover { border-color: #f85149; color: #f85149; }
        .btn.small { padding: 0.28rem 0.6rem; font-size: 0.78rem; }
        .btn.active { border-color: #58a6ff; background: #1a2332; }
        .summary { color: #8b949e; font-size: 0.8rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.9rem; }
        .overlay { border: 1px solid #30363d; border-radius: 8px; background: #161b22; overflow: hidden; display: flex; flex-direction: column; }
        .overlay:hover { border-color: #3d4651; }
        .preview { position: relative; height: 170px; overflow: hidden; background: conic-gradient(#1c2128 25%, #161b22 0 50%, #1c2128 0 75%, #161b22 0) 0 0 / 16px 16px; border-bottom: 1px solid #30363d; }
        .preview.off { display: none; }
        .preview iframe { position: absolute; top: 50%; left: 50%; border: 0; background: transparent; transform-origin: 0 0; pointer-events: none; }
        .body { padding: 0.7rem 0.85rem 0.8rem; display: grid; gap: 0.35rem; }
        .title { font-weight: 600; font-size: 0.98rem; overflow-wrap: anywhere; }
        .meta { color: #8b949e; font-size: 0.76rem; line-height: 1.5; }
        .actions { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.35rem; }
        .empty { color: #8b949e; text-align: center; padding: 2.5rem 1rem; grid-column: 1 / -1; }
        .list .overlay { flex-direction: row; align-items: center; }
        .list .preview { width: 220px; height: 124px; flex: none; border-bottom: 0; border-right: 1px solid #30363d; }
        .list .body { flex: 1; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0.2rem 1rem; }
        .list .actions { margin: 0; justify-content: flex-end; grid-row: 1 / span 2; grid-column: 2; }
        .list.grid { grid-template-columns: 1fr; }
        #toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); background: #21262d; border: 1px solid #30363d; padding: 0.55rem 1rem; border-radius: 8px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 10; }
        #toast.show { opacity: 1; }
        @media (max-width: 800px) { .container { padding: 1rem; } .list .overlay { flex-direction: column; align-items: stretch; } .list .preview { width: auto; height: 170px; } .list .body { grid-template-columns: 1fr; } .list .actions { grid-row: auto; grid-column: auto; justify-content: flex-start; } }
    </style>
</head>
<body>
    <header class="header"><h1>StreamPulse <span>Custom Overlays</span></h1><div id="main-nav" class="nav"></div></header>
    <script src="/nav.js"></script>
    <main class="container">
        <div class="card toolbar">
            <a class="btn primary" href="/custom-overlay-editor.html?new=1">+ Create overlay</a>
            <input id="search" class="grow" type="search" placeholder="Search overlays…" aria-label="Search overlays">
            <select id="sort" aria-label="Sort">
                <option value="updated">Recently edited</option><option value="created">Recently created</option><option value="name">Name A–Z</option><option value="elements">Most elements</option>
            </select>
            <button class="btn" id="toggle-preview" title="Show or hide live previews">Previews</button>
            <button class="btn" id="toggle-view" title="Switch between grid and list">List view</button>
            <a class="btn" href="/assets.html">Asset Library →</a>
        </div>
        <div class="summary" id="summary"></div>
        <div id="overlay-list" class="grid"><div class="empty">Loading overlays…</div></div>
    </main>
    <div id="toast"></div>
    <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const prefs = Object.assign({ previews: true, view: 'grid', sort: 'updated' }, JSON.parse(localStorage.getItem('customOverlaysPrefs') || '{}'));
    const savePrefs = () => localStorage.setItem('customOverlaysPrefs', JSON.stringify(prefs));
    let overlays = [];

    function toast(text) {
        const el = $('toast');
        el.textContent = text;
        el.classList.add('show');
        clearTimeout(toast.t);
        toast.t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    async function api(url, options) {
        const response = await fetch(url, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
        return data;
    }

    const ago = iso => {
        const seconds = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
        if (!Number.isFinite(seconds)) return '—';
        if (seconds < 60) return 'just now';
        if (seconds < 3600) return `${Math.floor(seconds / 60)} min ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)} h ago`;
        if (seconds < 86400 * 30) return `${Math.floor(seconds / 86400)} d ago`;
        return new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
    };

    const SORTS = {
        updated: (a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)),
        created: (a, b) => String(b.createdAt || b.updatedAt).localeCompare(String(a.createdAt || a.updatedAt)),
        name: (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base', numeric: true }),
        elements: (a, b) => b.elementCount - a.elementCount
    };

    function fitPreviews() {
        for (const box of document.querySelectorAll('.preview:not(.off)')) {
            const frame = box.firstElementChild;
            if (!frame) continue;
            const width = Number(frame.dataset.w), height = Number(frame.dataset.h);
            const scale = Math.min(box.clientWidth / width, box.clientHeight / height) * 0.96;
            frame.style.width = `${width}px`;
            frame.style.height = `${height}px`;
            frame.style.transform = `scale(${scale}) translate(-50%, -50%)`;
        }
    }

    function render() {
        const query = $('search').value.trim().toLowerCase();
        const shown = overlays.filter(o => !query || `${o.name} ${o.id}`.toLowerCase().includes(query)).sort(SORTS[prefs.sort] || SORTS.updated);
        $('summary').textContent = overlays.length ? `${shown.length} of ${overlays.length} overlays` : '';
        const list = $('overlay-list');
        list.className = prefs.view === 'list' ? 'grid list' : 'grid';
        $('toggle-preview').classList.toggle('active', prefs.previews);
        $('toggle-view').textContent = prefs.view === 'list' ? 'Grid view' : 'List view';
        list.innerHTML = shown.length ? shown.map(o => `
            <article class="overlay">
                <div class="preview${prefs.previews ? '' : ' off'}">${prefs.previews ? `<iframe loading="lazy" tabindex="-1" data-w="${o.canvas.width}" data-h="${o.canvas.height}" src="/custom-overlay.html?id=${encodeURIComponent(o.id)}" title="Preview of ${esc(o.name)}"></iframe>` : ''}</div>
                <div class="body">
                    <div class="title">${esc(o.name)}</div>
                    <div class="meta">${esc(o.id)} · ${o.canvas.width}×${o.canvas.height} · ${o.elementCount} element${o.elementCount === 1 ? '' : 's'}<br>Edited ${ago(o.updatedAt)} · revision ${o.revision}</div>
                    <div class="actions">
                        <a class="btn small primary" href="/custom-overlay-editor.html?id=${encodeURIComponent(o.id)}">Edit</a>
                        <a class="btn small" href="/custom-overlay.html?id=${encodeURIComponent(o.id)}" target="_blank" rel="noopener">Open</a>
                        <button class="btn small" data-act="copy" data-id="${esc(o.id)}">Copy OBS URL</button>
                        <button class="btn small" data-act="duplicate" data-id="${esc(o.id)}">Duplicate</button>
                        <button class="btn small danger" data-act="delete" data-id="${esc(o.id)}">Delete</button>
                    </div>
                </div>
            </article>`).join('') : `<div class="empty">${overlays.length ? 'No overlays match your search.' : 'No custom overlays yet. Create your first one.'}</div>`;
        requestAnimationFrame(fitPreviews);
    }

    async function load() {
        overlays = await api('/api/custom-overlays', { cache: 'no-store' });
        render();
    }

    function uniqueId(base) {
        const slug = String(base).toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'overlay';
        const taken = new Set(overlays.map(o => o.id));
        let candidate = `${slug}-copy`;
        for (let n = 2; taken.has(candidate); n++) candidate = `${slug}-copy-${n}`;
        return candidate;
    }

    async function duplicate(id) {
        const source = await api(`/api/custom-overlays/${encodeURIComponent(id)}`);
        const copy = await api('/api/custom-overlays', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: uniqueId(source.id), name: `${source.name} copy`, canvas: source.canvas, elements: source.elements })
        });
        toast(`Duplicated as "${copy.name}"`);
        await load();
    }

    $('overlay-list').addEventListener('click', async event => {
        const button = event.target.closest('[data-act]');
        if (!button) return;
        const id = button.dataset.id;
        const overlay = overlays.find(o => o.id === id);
        try {
            if (button.dataset.act === 'copy') {
                await navigator.clipboard.writeText(`${location.origin}/custom-overlay.html?id=${encodeURIComponent(id)}`);
                toast('OBS URL copied');
            } else if (button.dataset.act === 'duplicate') {
                button.disabled = true;
                await duplicate(id);
            } else if (button.dataset.act === 'delete') {
                if (!confirm(`Delete "${overlay?.name || id}"? Its revision history is deleted too.`)) return;
                await api(`/api/custom-overlays/${encodeURIComponent(id)}`, { method: 'DELETE' });
                await load();
            }
        } catch (error) { alert(error.message); button.disabled = false; }
    });

    $('search').addEventListener('input', render);
    $('sort').value = prefs.sort;
    $('sort').addEventListener('change', () => { prefs.sort = $('sort').value; savePrefs(); render(); });
    $('toggle-preview').addEventListener('click', () => { prefs.previews = !prefs.previews; savePrefs(); render(); });
    $('toggle-view').addEventListener('click', () => { prefs.view = prefs.view === 'list' ? 'grid' : 'list'; savePrefs(); render(); });
    window.addEventListener('resize', fitPreviews);

    load().catch(error => { $('overlay-list').innerHTML = `<div class="empty">${esc(error.message)}</div>`; });
    </script>
</body>
</html>

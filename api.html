<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/admin.css">
    <script src="/appearance.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — API Reference</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg-page); color: var(--text); min-height: 100vh; }

        .header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.3rem; font-weight: 600; }
        .header h1 span { color: var(--accent); }
        .nav { display: flex; gap: 0.75rem; }
        .nav a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s; }
        .nav a:hover { color: var(--text); background: var(--bg-raised); }
        .nav a.active { color: var(--accent); background: var(--accent-bg); }

        .container { max-width: 1240px; margin: 0 auto; padding: 1.5rem 2rem; }
        .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 2rem; align-items: start; }
        .side { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; display: grid; gap: 0.7rem; }
        .search { width: 100%; padding: 0.55rem 0.75rem; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font: inherit; font-size: 0.85rem; }
        .search:focus { outline: none; border-color: var(--accent); }
        .toc { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem; }
        .toc h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin: 0.2rem 0.5rem 0.4rem; }
        .toc a { color: var(--text-muted); text-decoration: none; font-size: 0.84rem; display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.38rem 0.6rem; border-radius: 6px; border-left: 2px solid transparent; }
        .toc a span { color: var(--border-strong); font-size: 0.72rem; }
        .toc a:hover { color: var(--text); background: var(--bg-raised); }
        .toc a.active { color: var(--accent); background: var(--accent-bg); border-left-color: var(--accent); }
        .toc a.dim { opacity: 0.35; }
        .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
        .chip { background: var(--bg-raised); border: 1px solid var(--border); color: var(--text-muted); border-radius: 999px; padding: 0.2rem 0.6rem; font: inherit; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
        .chip:hover { border-color: var(--accent); color: var(--text); }
        .chip.active { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
        .side-actions { display: flex; gap: 0.5rem; }
        .side-actions button { flex: 1; background: var(--bg-raised); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 0.4rem; font: inherit; font-size: 0.78rem; cursor: pointer; }
        .side-actions button:hover { border-color: var(--accent); }
        .no-results { color: var(--text-muted); text-align: center; padding: 3rem 1rem; display: none; }
        .hidden { display: none !important; }
        .section-title { scroll-margin-top: 1rem; display: flex; align-items: baseline; gap: 0.5rem; }
        .section-title small { color: var(--border-strong); font-size: 0.72rem; text-transform: none; letter-spacing: 0; }
        html { scroll-behavior: smooth; }

        .intro { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem; line-height: 1.5; }
        .intro code { background: var(--bg-raised); padding: 0.15rem 0.4rem; border-radius: 4px; color: var(--text); font-size: 0.85rem; }

        .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); margin: 2rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--bg-raised); }
        .section-title:first-of-type { margin-top: 0; }

        .endpoint { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.75rem; overflow: hidden; }
        .endpoint-header { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; cursor: pointer; user-select: none; }
        .endpoint-header:hover { background: var(--bg-raised); }
        .method { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; padding: 0.2rem 0.5rem; border-radius: 4px; min-width: 52px; text-align: center; flex-shrink: 0; }
        .method.get { background: color-mix(in srgb, var(--accent) 22%, var(--bg-card)); color: var(--accent-soft); }
        .method.post { background: color-mix(in srgb, var(--success) 22%, var(--bg-card)); color: var(--success); }
        .method.put { background: var(--warn-bg); color: var(--warn); }
        .method.delete { background: var(--danger-bg); color: var(--danger); }
        .method.ws { background: color-mix(in srgb, var(--purple) 22%, var(--bg-card)); color: var(--purple); }
        .endpoint-path { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.85rem; flex: 1; }
        .endpoint-desc { color: var(--text-muted); font-size: 0.8rem; }
        .endpoint-chevron { color: var(--border-strong); font-size: 0.7rem; transition: transform 0.2s; }
        .endpoint.open .endpoint-chevron { transform: rotate(90deg); }

        .endpoint-body { display: none; padding: 0 1rem 1rem; border-top: 1px solid var(--bg-raised); }
        .endpoint.open .endpoint-body { display: block; padding-top: 0.75rem; }

        .detail-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.35rem; margin-top: 0.75rem; }
        .detail-label:first-child { margin-top: 0; }
        .detail-text { font-size: 0.85rem; color: var(--text); line-height: 1.5; }

        .url-box { display: flex; align-items: center; gap: 0.5rem; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.75rem; margin-top: 0.35rem; }
        .url-box code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; flex: 1; word-break: break-all; color: var(--text); }
        .copy-btn { background: var(--bg-raised); border: 1px solid var(--border); color: var(--text-muted); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .copy-btn:hover { border-color: var(--accent); color: var(--text); }
        .copy-btn.copied { border-color: var(--success); color: var(--success); }

        .param-table { width: 100%; border-collapse: collapse; margin-top: 0.35rem; font-size: 0.8rem; }
        .param-table th { text-align: left; color: var(--text-muted); font-weight: 600; padding: 0.4rem 0.75rem; background: var(--bg-inset); }
        .param-table td { padding: 0.4rem 0.75rem; border-top: 1px solid var(--bg-raised); }
        .param-table code { background: var(--bg-raised); padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.8rem; }

        .companion-badge { display: inline-block; font-size: 0.65rem; background: var(--accent-bg); color: var(--accent); border: 1px solid var(--border); padding: 0.15rem 0.4rem; border-radius: 4px; margin-left: 0.5rem; vertical-align: middle; }

        .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--accent-strong); color: white; padding: 0.75rem 1.25rem; border-radius: 8px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
        .toast.show { opacity: 1; }

        .nav .dropdown { position: relative; display: flex; align-items: center; }
        .nav .dropdown-toggle { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s; cursor: pointer; display: block; }
        .nav .dropdown-toggle:hover { color: var(--text); background: var(--bg-raised); }
        .nav .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.4rem 0; min-width: 180px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .nav .dropdown::after { content: ''; position: absolute; top: 100%; left: 0; right: 0; height: 8px; }
        .nav .dropdown:hover .dropdown-menu { display: block; }
        .nav .dropdown-menu a { display: block; padding: 0.5rem 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; transition: all 0.15s; }
        .nav .dropdown-menu a:hover { color: var(--text); background: var(--bg-raised); }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .side { position: static; max-height: none; }
        }
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header { flex-direction: column; gap: 0.5rem; }
            .endpoint-header { flex-wrap: wrap; }
            .endpoint-desc { width: 100%; margin-top: 0.25rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>StreamPulse <span>API Reference</span></h1>
        <div id="main-nav" class="nav"></div>
        <script src="/nav.js"></script>
    </div>

    <div class="container">
        <div class="intro">
            Base URL: <code id="base-url"></code>
            — All endpoints return JSON unless noted. Use these URLs directly in
            <strong>Bitfocus Companion</strong> Generic HTTP module actions.
        </div>

        <div class="layout">
            <aside class="side">
                <input id="search" class="search" type="search" placeholder="Search endpoints…  ( / )" aria-label="Search endpoints">
                <div class="chips" id="chips"></div>
                <nav class="toc" id="toc"><h2>Sections</h2></nav>
                <div class="side-actions"><button id="expand-all">Expand all</button><button id="collapse-all">Collapse all</button></div>
            </aside>
            <main>
                <div id="endpoints"></div>
                <div class="no-results" id="no-results">No endpoints match your search.</div>
            </main>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    const BASE = window.location.origin;
    document.getElementById('base-url').textContent = BASE;

    const endpoints = [
        {
            section: 'Session Lifecycle',
            items: [
                {
                    method: 'GET', path: '/api/status',
                    desc: 'Server health, connections, session stats, hourly volume',
                    companion: true,
                    details: 'Returns uptime, SSN connection state, Twitch token status, overlay client count, session counters, sessionActive flag, and hourly message volume data.'
                },
                {
                    method: 'GET', path: '/api/start-session',
                    desc: 'Start a new session (reset data, re-fetch Twitch)',
                    companion: true,
                    details: 'Resets all chat data, sets a new startedAt timestamp, marks sessionActive=true, and triggers a Twitch API refresh. Use after ending a session to begin a new stream.'
                },
                {
                    method: 'GET', path: '/api/end-session',
                    desc: 'Archive session data and reset for next stream',
                    companion: true,
                    details: 'Saves current chat data, archives it to data/sessions/, resets all counters, and marks sessionActive=false. Server keeps running — call /api/start-session when ready.'
                },
                {
                    method: 'GET', path: '/api/shutdown',
                    desc: 'Archive session and gracefully stop the server',
                    companion: true,
                    details: 'Archives session data then shuts down the Node.js process. The server will need to be restarted with npm start.'
                },
                {
                    method: 'GET', path: '/api/reset',
                    desc: 'Clear session chat data without archiving',
                    companion: true,
                    details: 'Resets all in-memory chat data (chatters, emotes, hashtags, subs, etc.) without archiving. Does not affect persistent stats.'
                }
            ]
        },
        {
            section: 'Twitch',
            items: [
                {
                    method: 'GET', path: '/api/fetch',
                    desc: 'Trigger Twitch API data refresh',
                    companion: true,
                    details: 'Fetches subscribers, followers, bits, and cheerers from the Twitch API using the stored OAuth token. Returns counts of each data type fetched.'
                },
                {
                    method: 'GET', path: '/api/twitch/auth/status',
                    desc: 'Twitch connection status',
                    details: 'Returns connected, auth mode (shared_device or own_app), client ID and granted scopes.'
                },
                {
                    method: 'POST', path: '/api/twitch/auth/device/start',
                    desc: 'Start device-code sign-in',
                    details: 'Returns userCode and verificationUri. Open the URI, enter the code, then poll /api/twitch/auth/device/poll until status is authorized.'
                },
                {
                    method: 'GET', path: '/api/twitch/auth/device/poll',
                    desc: 'Poll device-code sign-in',
                    details: 'Returns status: idle, pending, authorized, expired or error. Saves the token and fills in broadcaster ID and name on success.'
                },
                {
                    method: 'POST', path: '/api/twitch/auth/disconnect',
                    desc: 'Remove the stored Twitch token'
                },
                {
                    method: 'GET', path: '/auth/twitch',
                    desc: 'Start Twitch OAuth authorization flow',
                    details: 'With no client secret configured this redirects to /twitch-connect.html (device-code sign-in; see /api/twitch/auth/status, /api/twitch/auth/device/start, /api/twitch/auth/device/poll and /api/twitch/auth/disconnect). With your own app it opens the Twitch authorization page. After approval, redirects to /auth/callback which stores the token. Open this in a browser — not suitable for Companion.'
                }
            ]
        },
        {
            section: 'Configuration',
            items: [
                {
                    method: 'GET', path: '/api/config',
                    desc: 'Get current config (sections, social links, options)',
                    details: 'Returns the full credits configuration including section titles, subtitles, enabled/disabled state, social links, header, closing, and filter settings.'
                },
                {
                    method: 'PUT', path: '/api/config',
                    desc: 'Update config (hot-reload, no restart needed)',
                    details: 'Accepts JSON body with editable fields: days_filter, subs_source, active_subs_only, exclude_users, and credits (sections, header, closing, social_links). Saves to config.json and hot-reloads immediately.',
                    body: '{\n  "credits": {\n    "header": { "title": "My Stream" },\n    "sections": { "chatters": { "enabled": true, "title": "Chatters" } }\n  }\n}'
                }
            ]
        },
        {
            section: 'Stats & Data',
            items: [
                {
                    method: 'GET', path: '/api/stats',
                    desc: 'Raw persistent stats JSON (daily buckets)',
                    details: 'Returns the full stats.json with cumulative daily-bucketed data for chatters, emotes, hashtags, subscribers, followers, raids, giftSubs, bits, and donations.'
                },
                {
                    method: 'GET', path: '/api/stats/reset',
                    desc: 'Clear all persistent stats',
                    companion: true,
                    details: 'Resets the entire stats.json to empty. This cannot be undone (but auto-backups exist in data/.stats-backup-*.json).'
                },
                {
                    method: 'GET', path: '/api/export',
                    desc: 'Export stats as CSV',
                    details: 'Downloads a CSV file of stats data. Supports date filtering.',
                    params: [
                        { name: 'type', desc: 'Data type to export', values: 'chatters, emotes, hashtags, all', default: 'all' },
                        { name: 'days', desc: 'Limit to last N days', values: 'number', default: '0 (all time)' },
                        { name: 'date', desc: 'Single date filter', values: 'YYYY-MM-DD', default: '—' },
                        { name: 'from', desc: 'Start date for range', values: 'YYYY-MM-DD', default: '—' },
                        { name: 'to', desc: 'End date for range', values: 'YYYY-MM-DD', default: '—' }
                    ]
                }
            ]
        },
        {
            section: 'Sessions',
            items: [
                {
                    method: 'GET', path: '/api/sessions',
                    desc: 'List archived session files',
                    details: 'Returns an array of archived session filenames (e.g., chat-2026-03-14-19-30.json), sorted newest first.'
                },
                {
                    method: 'GET', path: '/api/sessions/:file',
                    desc: 'Get a specific archived session\'s data',
                    details: 'Returns the full chat data JSON for a specific archived session. Replace :file with the filename from /api/sessions.'
                }
            ]
        },
        {
            section: 'Chat Logs',
            items: [
                {
                    method: 'GET', path: '/api/chat',
                    desc: 'Live chat data (current session)',
                    details: 'Returns the current session chat data object with chatters, messages, events, emotes, hashtags, subscribers, followers, donations, bits, raids, giftSubs, viewerStats, and session metadata. Used by the live Current Session view.'
                },
                {
                    method: 'GET', path: '/api/chat-log',
                    desc: 'Current session chat log',
                    details: 'Returns all individual chat messages from the current session. Each message includes: ts (timestamp), user, avatar, message (plain text), messageHtml (raw HTML with emotes), type, event, donation, membership.'
                },
                {
                    method: 'GET', path: '/api/sessions/:file/chat-log',
                    desc: 'Archived session chat log',
                    details: 'Returns chat log for a specific archived session. Replace :file with the session filename (e.g., chat-2026-03-14.json). Only available for sessions recorded after chat logging was enabled.'
                },
                {
                    method: 'GET', path: '/api/chat-log/search',
                    desc: 'Search chat messages across sessions',
                    details: 'Query params: q (text search), user (filter by username), session ("all", "current", or specific filename), type ("links", "events", or "donations"), limit (default 200), offset (pagination). Prefix user search with @ in the sessions UI. Example: /api/chat-log/search?q=hello&limit=50&type=links',
                    params: [
                        { name: 'q', desc: 'Text search query', values: 'string', default: '—' },
                        { name: 'user', desc: 'Filter by username', values: 'string', default: '—' },
                        { name: 'session', desc: 'Session filter', values: 'all, current, filename', default: 'all' },
                        { name: 'type', desc: 'Message type filter', values: 'links, events, donations', default: '— (all)' },
                        { name: 'limit', desc: 'Max results', values: 'number', default: '200' },
                        { name: 'offset', desc: 'Pagination offset', values: 'number', default: '0' }
                    ]
                },
                {
                    method: 'GET', path: '/api/chat-log/export',
                    desc: 'Export chat log as TSV, TXT, or PDF',
                    details: 'Query params: format ("tsv", "txt", or "pdf"), q, user, session ("all", "current", or specific filename), and type ("links", "events", or "donations"). Export filtering uses the same quoted phrase, AND/OR, and user:name matching rules as /api/chat-log/search. Example: /api/chat-log/export?format=pdf&session=chat-2026-03-23T19-30.json&q="good game"+OR+hype'
                }
            ]
        },
        {
            section: 'Viewers & Goals',
            items: [
                {
                    method: 'GET', path: '/api/viewers',
                    desc: 'Current viewer summary',
                    details: 'Returns current viewer tracking data for the live session: enabled, live, current, peak, average, source, sampledAt, streamStartedAt, sampleCount, and samples[]. Pass ?samples=false to omit the full samples array.'
                },
                {
                    method: 'GET', path: '/api/goals',
                    desc: 'Computed goals snapshot',
                    details: 'Returns the normalized saved goal settings, computed live progress for every goal, summary counts, and the current metrics used to calculate progress. Includes persistent/session metrics and viewer stats.'
                },
                {
                    method: 'GET', path: '/api/goals/config',
                    desc: 'Goal and viewer settings',
                    details: 'Returns the editable viewer_tracking and goals config sections exactly as the Goals Manager uses them.'
                },
                {
                    method: 'PUT', path: '/api/goals/config',
                    desc: 'Save goal and viewer settings',
                    details: 'Updates viewer_tracking and/or goals in config.json, hot-reloads them, and broadcasts the new computed goal state to overlays.',
                    body: '{ "viewer_tracking": { "enabled": true, "poll_seconds": 60 }, "goals": { "enabled": true, "rotate_seconds": 8, "items": [...] } }'
                },
                {
                    method: 'POST', path: '/api/goals/{id}/reset',
                    desc: 'Reset a persistent goal baseline',
                    details: 'Resets a persistent goal so its baseline becomes the current metric value. Supported for persistent numeric goals and persistent community goals. Viewer goals and session goals do not use baseline reset.'
                },
                {
                    method: 'POST', path: '/api/goals/{id}/toggle',
                    desc: 'Toggle a goal',
                    details: 'Toggles a goal enabled/disabled. You can also call /api/goals/{id}/enable or /api/goals/{id}/disable.'
                }
            ]
        },
        {
            section: 'Hashtag Moderation',
            items: [
                {
                    method: 'GET', path: '/api/hashtags/stats',
                    desc: 'Detailed hashtag stats summary',
                    details: 'Returns { summary, hashtags, range } for the hashtag admin table. Supports optional date filters with ?days=7, ?date=2026-03-14, or ?from=2026-03-01&to=2026-03-14. Each hashtag row includes tag, count, sessionCount, uniqueDays, firstUsed, lastUsed, and banned.'
                },
                {
                    method: 'GET', path: '/api/hashtags/banned',
                    desc: 'List banned hashtags and active session hashtags',
                    details: 'Returns { banned: [...], session: [{ tag, count }], stats: [{ tag, count }] } with all currently banned hashtags plus current session and persistent stats hashtag counts.'
                },
                {
                    method: 'POST', path: '/api/hashtags/banned',
                    desc: 'Ban a hashtag',
                    details: 'Bans a hashtag and purges it from both session chat data and persistent stats. Send JSON body with { "tag": "#example" }.',
                    body: '{ "tag": "#example" }'
                },
                {
                    method: 'DELETE', path: '/api/hashtags/banned',
                    desc: 'Unban a hashtag',
                    details: 'Removes a hashtag from the banned list. Does NOT restore previously purged data. Send JSON body with { "tag": "#example" }.',
                    body: '{ "tag": "#example" }'
                }
            ]
        },
        {
            section: 'Backup & Restore',
            items: [
                {
                    method: 'GET', path: '/api/backup',
                    desc: 'Download a full backup ZIP',
                    details: 'Streams a ZIP file containing config.json, current live session files (data/chat.json and data/chat-log.jsonl), stats, timers, archived sessions, highlights, and other data files. Excludes sensitive files (.twitch-token.json). Supports GET downloads and HEAD checks. Filename includes date: streampulse-backup-YYYY-MM-DD.zip.'
                },
                {
                    method: 'POST', path: '/api/restore',
                    desc: 'Restore from a backup ZIP',
                    details: 'Accepts a raw ZIP body (Content-Type: application/zip). Extracts and restores files to their correct locations, reloads live session, stats, highlights, timers, and hot-reloadable config, then reports whether a restart is still required for restored startup-bound settings like Twitch/SSN connection fields. The ZIP must contain at least data/stats.json to be valid.',
                    body: '(raw ZIP binary body)'
                }
            ]
        },
        {
            section: 'Highlights',
            items: [
                {
                    method: 'GET', path: '/api/highlights',
                    desc: 'List pinned/highlighted messages',
                    details: 'Returns all highlighted messages. Supports optional ?session= query param to filter by session name.',
                    params: [
                        { name: 'session', desc: 'Filter by session name', values: 'session filename', default: '— (all)' }
                    ]
                },
                {
                    method: 'POST', path: '/api/highlights',
                    desc: 'Pin a chat message',
                    details: 'Adds a message to the highlights list. Body: { ts, user, message, messageHtml, avatar, session }. A pinnedAt timestamp is added automatically.',
                    body: '{ "ts": 1234567890, "user": "viewer", "message": "hello", "session": "current" }'
                },
                {
                    method: 'DELETE', path: '/api/highlights',
                    desc: 'Unpin a chat message',
                    details: 'Removes a highlight by ts and user. Body: { ts, user }.',
                    body: '{ "ts": 1234567890, "user": "viewer" }'
                },
                {
                    method: 'POST', path: '/api/highlights/pin-last',
                    desc: 'Pin the last chat message',
                    details: 'Pins the most recent message from the current session chat log. No request body needed. Ideal for Bitfocus Companion or Stream Deck integration. Returns the pinned user and message, or "already_pinned" if duplicate.'
                },
                {
                    method: 'GET', path: '/api/highlights/export',
                    desc: 'Export highlights',
                    details: 'Download highlights in TXT, TSV, or PDF format. Supports optional session filter.',
                    params: [
                        { name: 'format', desc: 'Export format', values: 'txt, tsv, pdf', default: '— (required)' },
                        { name: 'session', desc: 'Filter by session name', values: 'session filename', default: '— (all)' }
                    ]
                }
            ]
        },
        {
            section: 'Clips (Beta)',
            items: [
                {
                    method: 'GET', path: '/api/clip-candidates',
                    desc: 'List detected and manual clip candidates',
                    details: 'Returns clip candidates in newest-first order. Supports optional session and status filters.',
                    params: [
                        { name: 'session', desc: 'Filter by session filename', values: 'session filename', default: '— (all)' },
                        { name: 'status', desc: 'Filter by candidate status', values: 'candidate, created, failed', default: '— (all)' }
                    ]
                },
                {
                    method: 'POST', path: '/api/clip-candidates',
                    desc: 'Add a manual clip marker',
                    details: 'Adds a candidate to the active session. Body: { reason, details, timestamp, score }. This beta feature records candidates but does not create Twitch clips automatically.',
                    body: '{ "reason": "funny moment", "score": 0.9 }'
                },
                {
                    method: 'GET/PUT', path: '/api/clip-candidates/config',
                    desc: 'Read or update beta detection settings',
                    details: 'Controls chat-spike thresholds, cooldowns, event toggles, and minimum event amounts. Settings are persisted in config.json and hot-reloaded.',
                    body: '{ "chat_spike_messages": 20, "chat_spike_window_seconds": 60, "cooldown_seconds": 30, "include_highlights": true }'
                },
                {
                    method: 'POST', path: '/api/clip-candidates/backfill',
                    desc: 'Rebuild candidates from current and archived chat logs',
                    details: 'Body: { rebuild: true }. Removes uncreated automatic candidates, preserves manual markers and created Twitch clips, then creates reviewable candidates using the current beta detection settings.'
                },
                {
                    method: 'POST', path: '/api/clip-candidates/:id/create',
                    desc: 'Request a Twitch clip',
                    details: 'Uses the live Create Clip API for current candidates or Twitch’s open-beta Create Clip From VOD API for past candidates. A successful response stores Twitch’s temporary edit_url and the published clip URL. Requires clips:edit for live clips and channel:manage:clips (or editor:manage:clips) for VOD clips.',
                    body: '(no body)'
                },
                {
                    method: 'DELETE', path: '/api/clip-candidates/:id',
                    desc: 'Delete a clip candidate',
                    details: 'Removes a detected or manual clip candidate without affecting Twitch clips that were already created.'
                }
            ]
        },
        {
            section: 'Music (Beta)',
            items: [
                {
                    method: 'GET', path: '/api/music/now-playing',
                    desc: 'Current track info and player state (JSON)',
                    details: 'Returns the current music state: { state, track, artist, album, year, duration, position, artworkUrl }. State is "playing", "paused", or "stopped". Supports Apple Music (macOS) and VLC (cross-platform).'
                },
                {
                    method: 'GET', path: '/api/music/field/{field}',
                    desc: 'Single field as plain text',
                    details: 'Returns a single music field as plain text — ideal for Bitfocus Companion or tools that can\'t parse JSON. Available fields: state, track, artist, album, year, duration, position, artwork. Example: /api/music/field/track → "Song Name"'
                },
                {
                    method: 'POST', path: '/api/music/overlay',
                    desc: 'Show/hide the music overlay',
                    details: 'Control overlay visibility. Send JSON body { "action": "on"|"off"|"toggle" } or use query param ?action=toggle. GET returns current state { visible: true/false }. All connected overlay instances respond instantly via WebSocket.'
                },
                {
                    method: 'GET', path: '/api/music/artwork',
                    desc: 'Album artwork image (PNG)',
                    details: 'Serves the album art of the currently playing track as a PNG image. Returns 404 if no artwork is available. Cache-busted automatically by the overlay.'
                },
                {
                    method: 'GET', path: '/api/music/vlc-test',
                    desc: 'Test VLC connection',
                    details: 'Tests connectivity to VLC\'s HTTP interface. Query params: host, port, password. Returns { ok, state, track, artist } on success or { ok: false, error } on failure.'
                }
            ]
        },
        {
            section: 'Timers',
            items: [
                {
                    method: 'GET', path: '/api/timers',
                    desc: 'List timer settings and all named timers',
                    companion: true,
                    details: 'Returns { settings, timers } for the shared timer subsystem. Timers are keyed by slug ID and include computed countdown/stopwatch state for overlays and dashboards.'
                },
                {
                    method: 'POST', path: '/api/timers',
                    desc: 'Create or replace a named timer',
                    details: 'Creates or updates a timer definition. Countdown payloads support { id, label, kind:"countdown", mode:"duration"|"date", days, hours, minutes, seconds, targetAt, startAt (optional, enables progress % for date countdowns), timezone, progress, showOnEnd, endMessage, httpActions }. Stopwatch payloads support { id, label, kind:"stopwatch", days, hours, minutes, seconds, httpActions }. Each httpActions entry is keyed by countdown_started, countdown_complete, stopwatch_started, or stopwatch_paused and can include { enabled, method:"GET"|"POST", url }. Saving resets the timer to its base state.'
                },
                {
                    method: 'GET', path: '/api/timers/{id}',
                    desc: 'Get one named timer snapshot',
                    companion: true,
                    details: 'Returns the current computed snapshot for a single timer, including remaining or elapsed time and current running state.'
                },
                {
                    method: 'POST', path: '/api/timers/{id}/control',
                    desc: 'Control a timer (start/pause/resume/reset/visibility/set_time/add_time/subtract_time)',
                    companion: true,
                    details: 'Accepts JSON body or query params. Examples: /api/timers/starting-soon/control?action=start, /api/timers/starting-soon/control?action=pause, /api/timers/starting-soon/control?action=resume, /api/timers/run-clock/control?action=set_time&minutes=5, /api/timers/starting-soon/control?action=add_time&seconds=30, /api/timers/starting-soon/control?action=subtract_time&seconds=10, /api/timers/starting-soon/control?action=visibility&value=toggle. Countdown subtraction clamps at zero and completes the timer when it reaches zero. Date/time countdowns can also be paused and resumed; resuming shifts the target forward to preserve the paused remaining time.'
                },
                {
                    method: 'GET', path: '/api/timers/{id}/field/{field}',
                    desc: 'Plain-text timer field endpoint',
                    companion: true,
                    details: 'Returns a single field as plain text for Companion or macro tools. Available fields: state, visible, remaining, remaining_ms, elapsed, elapsed_ms, title.'
                },
                {
                    method: 'GET', path: '/api/timers/settings',
                    desc: 'Get global timer settings',
                    details: 'Returns global timer sound settings. Per-timer outgoing HTTP callbacks are stored on each timer definition, not here.'
                },
                {
                    method: 'PUT', path: '/api/timers/settings',
                    desc: 'Update global timer settings',
                    details: 'Saves timer-wide countdown completion sound settings.'
                }
            ]
        },
        {
            section: 'Analytics & Subscribers',
            items: [
                {
                    method: 'GET', path: '/api/analytics',
                    desc: 'Per-session analytics and totals for a date range',
                    details: 'Returns { range, sessions, totals }. Each session row includes messages, chatters, subs, gift subs, followers, bits, donations, raids, emotes, hashtags, categories, and viewer stats. Powers the Analytics page and CSV export.',
                    params: [
                        { name: 'from', desc: 'Start date (inclusive)', values: 'YYYY-MM-DD', default: 'all time' },
                        { name: 'to', desc: 'End date (inclusive)', values: 'YYYY-MM-DD', default: 'today' }
                    ]
                },
                {
                    method: 'GET', path: '/api/subscribers/current',
                    desc: 'Current subscribers, tenure, gifters and growth history',
                    details: 'Returns summary (totals, tier split, gifted count, longest/average tenure, top gifters), history (one snapshot per day with total, tiers, gifted, joined and left) and subscribers (name, tier, plan, isGift, gifter, tenureMonths, firstSeen, lastSeen, observedDays). Twitch does not expose subscription length, so tenureMonths is the highest month count seen on chat badges or resub alerts. A user can appear more than once if Twitch returns multiple entries for them.'
                },
                {
                    method: 'GET', path: '/api/categories',
                    desc: 'Time spent per Twitch category',
                    details: 'Aggregates category time across the current and archived sessions.',
                    params: [
                        { name: 'from', desc: 'Start date', values: 'YYYY-MM-DD', default: 'all time' },
                        { name: 'to', desc: 'End date', values: 'YYYY-MM-DD', default: 'today' }
                    ]
                }
            ]
        },
        {
            section: 'Custom Overlays & Assets',
            items: [
                {
                    method: 'GET', path: '/api/custom-overlays',
                    desc: 'List custom overlays',
                    details: 'Returns each overlay with id, name, canvas size, revision, createdAt, updatedAt and elementCount.'
                },
                {
                    method: 'POST', path: '/api/custom-overlays',
                    desc: 'Create a custom overlay',
                    details: 'Creates an overlay and returns it. Responds 409 if the id already exists. To duplicate an overlay, GET it and POST its canvas and elements under a new id.',
                    body: '{ "id": "my-overlay", "name": "My Overlay", "canvas": { "width": 1920, "height": 1080 }, "elements": [] }'
                },
                {
                    method: 'GET', path: '/api/custom-overlays/:id',
                    desc: 'Read one custom overlay',
                    details: 'Returns the full definition including every element.'
                },
                {
                    method: 'PUT', path: '/api/custom-overlays/:id',
                    desc: 'Update an overlay and push it live',
                    details: 'Saves the definition, keeps the replaced version in revision history (last 30), and broadcasts a custom-overlay-update message to connected overlays.'
                },
                {
                    method: 'DELETE', path: '/api/custom-overlays/:id',
                    desc: 'Delete an overlay and its revision history',
                    details: 'Removes the overlay. Its asset files are not deleted.'
                },
                {
                    method: 'GET', path: '/api/custom-overlays/:id/page',
                    desc: 'Current page of a multipage overlay',
                    details: 'Returns {enabled, page, name, index, count, auto, pages}. Add ?page=<id|name|number> to the overlay URL to pin a browser source to one page.'
                },
                {
                    method: 'POST', path: '/api/custom-overlays/:id/page',
                    desc: 'Switch pages on a multipage overlay',
                    body: '{ "action": "next" | "prev" | "first" | "last" | "goto" | "auto", "page": "id, name or 1-based number (goto)", "auto": true|false }',
                    details: 'Pushes the change live to every browser source. Returns 400 if pages are not enabled. A control panel is available at /overlay-control.html?id=<id>.'
                },
                {
                    method: 'GET', path: '/api/alerts',
                    desc: 'Alert rules, settings and queue state',
                    details: 'Returns { settings, rules, queue: { pending, current, paused, history }, meta }.'
                },
                {
                    method: 'PUT', path: '/api/alerts',
                    desc: 'Replace alert rules and settings',
                    details: 'Send the full { settings, rules } object. It is validated and normalized, then saved to data/alerts.json.',
                    body: '{ "settings": { "enabled": true, "gapSeconds": 2 }, "rules": [ { "trigger": "bits", "conditions": { "minAmount": 100 }, "variants": [ { "title": "{{alert.user}} cheered {{alert.amount}}!" } ] } ] }'
                },
                {
                    method: 'POST', path: '/api/alerts/test',
                    desc: 'Queue a test alert for one saved rule',
                    details: 'Skips conditions and cooldowns. Timer and HTTP actions are not run.',
                    body: '{ "ruleId": "bits-big", "variantId": "v1" }'
                },
                {
                    method: 'POST', path: '/api/alerts/test-event',
                    desc: 'Simulate a stream event through the saved rules',
                    details: 'Uses real matching (thresholds, tiers, milestones). Returns { alert } or { alert: null } when nothing matched.',
                    body: '{ "type": "bits", "user": "Viewer", "amount": 500 }'
                },
                {
                    method: 'POST', path: '/api/alerts/replay',
                    desc: 'Replay a past event or alert',
                    details: 'eventId re-runs a stored event (GET /api/alerts returns the latest 100 under queue.events) through your current rules. alertId re-shows the exact alert from history.',
                    body: '{ "eventId": "..." }'
                },
                {
                    method: 'POST', path: '/api/alerts/queue',
                    desc: 'Control the alert queue',
                    details: 'Actions: skip, clear, pause, resume.',
                    body: '{ "action": "skip" }'
                },
                {
                    method: 'GET', path: '/api/custom-overlays/assets',
                    desc: 'List uploaded assets',
                    details: 'Returns every asset (images, video, audio, fonts) with name, kind, url, size, modifiedAt, and usedBy (overlays and timer sounds that reference it).'
                },
                {
                    method: 'POST', path: '/api/custom-overlays/assets',
                    desc: 'Upload an asset',
                    details: 'Send the raw file bytes as the body with a Content-Type and an X-Asset-Name header. Maximum 100 MB. Images, video, audio (mp3, wav, m4a, aac, oga) and fonts (ttf, otf, woff, woff2) are accepted.',
                    body: '(raw file bytes)  Headers: Content-Type: image/png, X-Asset-Name: logo.png'
                },
                {
                    method: 'POST', path: '/api/custom-overlays/:id/rename-id',
                    desc: 'Change an overlay id',
                    details: 'Moves the overlay and its revision history to a new id. The OBS URL changes, so browser sources using the old id go blank until updated.',
                    body: '{ "newId": "game-schedule" }'
                },
                {
                    method: 'GET', path: '/api/custom-overlays/text-source?mode=file&path=/full/path.md',
                    desc: 'Read a text or Markdown source',
                    details: 'Used by Text, Random Text and Markdown elements. mode is "file" (an absolute path on this computer) or "library" (an uploaded asset URL). Only .txt and .md files up to 512 KB are served. Other computers can only read files that a saved overlay already references. Returns text, mtimeMs and name.'
                },
                {
                    method: 'POST', path: '/api/system/choose-file',
                    desc: 'Open the macOS file chooser',
                    details: 'Opens a native file dialog on the StreamPulse computer and returns { path } or { cancelled: true }. Loopback requests only; macOS only.'
                },
                {
                    method: 'POST', path: '/api/custom-overlays/assets/:name/rename',
                    desc: 'Rename an asset',
                    details: 'Renames the file and rewrites every overlay and timer reference to it.',
                    body: '{ "name": "new-name" }'
                },
                {
                    method: 'DELETE', path: '/api/custom-overlays/assets/:name',
                    desc: 'Delete an asset',
                    details: 'Returns 409 if the asset is still in use, unless ?force=1 is supplied.',
                    params: [
                        { name: 'force', desc: 'Delete even when overlays or timers use it', values: '1', default: 'off' }
                    ]
                }
            ]
        },
        {
            section: 'Game Plan & QR',
            items: [
                {
                    method: 'GET', path: '/api/game-plan',
                    desc: 'Read the game plan',
                    details: 'Returns scheduled, backlog, played and custom-list games plus list definitions.'
                },
                {
                    method: 'PUT', path: '/api/game-plan',
                    desc: 'Save the game plan',
                    details: 'Replaces the stored game plan with the normalized payload and pushes the update to overlays.'
                },
                {
                    method: 'GET', path: '/api/game-search',
                    desc: 'Search IGDB for games',
                    details: 'Returns up to 12 matches with id, name, year, platforms and cover. Requires Twitch client credentials; returns an empty list otherwise.',
                    params: [
                        { name: 'q', desc: 'Search text (2+ characters)', values: 'string', default: '—' }
                    ]
                },
                {
                    method: 'GET', path: '/api/game',
                    desc: 'Game details for a category',
                    details: 'Returns cached IGDB details for the named game, or for the current stream category when no name is given.',
                    params: [
                        { name: 'name', desc: 'Game or category name', values: 'string', default: 'current category' }
                    ]
                },
                {
                    method: 'GET', path: '/api/qr',
                    desc: 'Generate a QR code (SVG)',
                    details: 'Returns an SVG QR code for the given text. Used by the QR element in custom overlays.',
                    params: [
                        { name: 'text', desc: 'Text or URL to encode', values: 'string', default: '—' },
                        { name: 'fg', desc: 'Foreground hex color', values: 'hex, no #', default: '000000' },
                        { name: 'bg', desc: 'Background hex color, or transparent', values: 'hex | transparent', default: 'ffffff' },
                        { name: 'margin', desc: 'Quiet-zone modules', values: 'number', default: '2' },
                        { name: 'ecc', desc: 'Error correction level', values: 'L | M | Q | H', default: 'M' }
                    ]
                }
            ]
        },
        {
            section: 'System & Updates',
            items: [
                {
                    method: 'GET', path: '/api/restart',
                    desc: 'Restart StreamPulse',
                    details: 'Saves session data, restarts the server, and resumes the active session.',
                    companion: true
                },
                {
                    method: 'GET', path: '/api/update/check',
                    desc: 'Check for a newer version',
                    details: 'Compares the installed version with the latest release or nightly build.',
                    params: [
                        { name: 'mode', desc: 'Update channel', values: 'release | nightly', default: 'release' }
                    ]
                },
                {
                    method: 'POST', path: '/api/update/apply',
                    desc: 'Apply an available update',
                    details: 'Downloads and applies the update. Responds 409 if the update cannot be applied.',
                    body: '{ "mode": "release" }'
                },
                {
                    method: 'GET', path: '/api/backups',
                    desc: 'List automatic backups',
                    details: 'Returns { backups: [{ name, size, created }] } from the backups folder.'
                },
                {
                    method: 'GET', path: '/api/backups/:name',
                    desc: 'Download an automatic backup',
                    details: 'Streams the named backup ZIP.'
                },
                {
                    method: 'GET', path: '/api/music/fallback-art',
                    desc: 'Fallback album art image',
                    details: 'Serves the uploaded fallback image used when a track has no artwork.'
                }
            ]
        },
        {
            section: 'WebSocket',
            items: [
                {
                    method: 'WS', path: '/',
                    desc: 'Live chatData push to overlay clients',
                    details: 'Connect via WebSocket to receive live overlay updates. On connect, clients receive { type: "snapshot", data: chatData } for chat, { type: "timers-snapshot", data: { settings, timers } } for named timers, and music/visibility state when available. Timer changes are pushed as { type: "timer-update", data: { timer, settings } } and timer setting changes as { type: "timer-settings", data: settings }.',
                    wsUrl: true
                }
            ]
        }
    ];

    const sectionId = name => 'sec-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    let methodFilter = '';

    function render() {
        const container = document.getElementById('endpoints');
        container.innerHTML = endpoints.map(section => `
            <div class="section-title" id="${sectionId(section.section)}">${section.section} <small>${section.items.length}</small></div>
            ${section.items.map((ep, i) => {
                const id = `ep-${section.section.replace(/\s/g, '')}-${i}`;
                const methodClass = ep.method.toLowerCase();
                const fullUrl = ep.wsUrl ? BASE.replace('http', 'ws') + ep.path : BASE + ep.path;
                return `
                <div class="endpoint" id="${id}">
                    <div class="endpoint-header" onclick="toggleEndpoint('${id}')">
                        <span class="method ${methodClass}">${ep.method}</span>
                        <span class="endpoint-path">${ep.path}</span>
                        <span class="endpoint-desc">${ep.desc}${ep.companion ? '<span class=companion-badge>Companion</span>' : ''}</span>
                        <span class="endpoint-chevron">▶</span>
                    </div>
                    <div class="endpoint-body">
                        <div class="detail-label">Description</div>
                        <div class="detail-text">${ep.details}</div>

                        ${ep.companion ? `
                        <div class="detail-label">Bitfocus Companion URL</div>
                        <div class="url-box">
                            <code>${fullUrl}</code>
                            <button class="copy-btn" onclick="copyUrl(this, '${fullUrl}')">Copy</button>
                        </div>
                        ` : !ep.wsUrl ? `
                        <div class="detail-label">URL</div>
                        <div class="url-box">
                            <code>${fullUrl}</code>
                            <button class="copy-btn" onclick="copyUrl(this, '${fullUrl}')">Copy</button>
                        </div>
                        ` : `
                        <div class="detail-label">WebSocket URL</div>
                        <div class="url-box">
                            <code>${fullUrl}</code>
                            <button class="copy-btn" onclick="copyUrl(this, '${fullUrl}')">Copy</button>
                        </div>
                        `}

                        ${ep.params ? `
                        <div class="detail-label">Query Parameters</div>
                        <table class="param-table">
                            <tr><th>Param</th><th>Description</th><th>Values</th><th>Default</th></tr>
                            ${ep.params.map(p => `<tr><td><code>${p.name}</code></td><td>${p.desc}</td><td>${p.values}</td><td>${p.default}</td></tr>`).join('')}
                        </table>
                        ` : ''}

                        ${ep.body ? `
                        <div class="detail-label">Request Body</div>
                        <div class="url-box" style="white-space: pre; font-size: 0.8rem;">
                            <code>${ep.body}</code>
                            <button class="copy-btn" onclick="copyUrl(this, \`${ep.body.replace(/`/g, '\\`')}\`)">Copy</button>
                        </div>
                        ` : ''}
                    </div>
                </div>`;
            }).join('')}
        `).join('');
        buildSidebar();
    }

    function buildSidebar() {
        document.getElementById('toc').innerHTML = '<h2>Sections</h2>' + endpoints.map(section => `<a href="#${sectionId(section.section)}" data-id="${sectionId(section.section)}">${section.section}<span>${section.items.length}</span></a>`).join('');
        const methods = [...new Set(endpoints.flatMap(section => section.items.map(ep => ep.method)))];
        document.getElementById('chips').innerHTML = ['All', ...methods].map(m => `<button class="chip${m === 'All' ? ' active' : ''}" data-method="${m === 'All' ? '' : m}">${m}</button>`).join('');
    }

    function applyFilters() {
        const query = document.getElementById('search').value.trim().toLowerCase();
        let anyVisible = false;
        document.querySelectorAll('.section-title').forEach(title => {
            let visible = 0;
            for (let el = title.nextElementSibling; el && !el.classList.contains('section-title'); el = el.nextElementSibling) {
                if (!el.classList.contains('endpoint')) continue;
                const method = el.querySelector('.method').textContent.trim();
                const match = (!methodFilter || method === methodFilter) && (!query || el.textContent.toLowerCase().includes(query));
                el.classList.toggle('hidden', !match);
                if (match) { visible++; if (query) el.classList.add('open'); }
            }
            title.classList.toggle('hidden', !visible);
            document.querySelector(`#toc a[data-id="${title.id}"]`)?.classList.toggle('dim', !visible);
            if (visible) anyVisible = true;
        });
        document.getElementById('no-results').style.display = anyVisible ? 'none' : 'block';
    }

    function setupScrollSpy() {
        const links = [...document.querySelectorAll('#toc a')];
        const update = () => {
            let current = links[0];
            for (const link of links) {
                const title = document.getElementById(link.dataset.id);
                if (title && !title.classList.contains('hidden') && title.getBoundingClientRect().top < window.innerHeight * 0.3) current = link;
            }
            links.forEach(link => link.classList.toggle('active', link === current));
        };
        window.addEventListener('scroll', update, { passive: true });
        update();
    }

    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('chips').addEventListener('click', event => {
        const chip = event.target.closest('.chip');
        if (!chip) return;
        methodFilter = chip.dataset.method;
        document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
        applyFilters();
    });
    document.getElementById('expand-all').addEventListener('click', () => document.querySelectorAll('.endpoint:not(.hidden)').forEach(el => el.classList.add('open')));
    document.getElementById('collapse-all').addEventListener('click', () => document.querySelectorAll('.endpoint').forEach(el => el.classList.remove('open')));
    document.addEventListener('keydown', event => {
        if (event.key === '/' && !event.target.matches('input, textarea')) { event.preventDefault(); document.getElementById('search').focus(); }
        if (event.key === 'Escape' && event.target.id === 'search') { event.target.value = ''; applyFilters(); event.target.blur(); }
    });

    function toggleEndpoint(id) {
        document.getElementById(id).classList.toggle('open');
    }

    function copyUrl(btn, text) {
        navigator.clipboard.writeText(text).then(() => {
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = 'Copy';
                btn.classList.remove('copied');
            }, 1500);
        });
    }

    render();
    setupScrollSpy();
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    </script>
</body>
</html>

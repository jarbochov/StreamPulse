<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse Game Plan Overlay</title>
    <style>
        :root {
            --gp-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --gp-bg: rgba(13, 17, 23, 0.88);
            --gp-border: rgba(255, 255, 255, 0.12);
            --gp-text: #f0f6fc;
            --gp-muted: #8b949e;
            --gp-accent: #3b82f6;
            --gp-now-bg: rgba(35, 134, 54, 0.25);
            --gp-now-border: #238636;
            --gp-now-text: #3fb950;
            --gp-font-scale: 1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: var(--gp-font);
            color: var(--gp-text);
            -webkit-font-smoothing: antialiased;
        }

        /* Container */
        #container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(6px, 1.8vmin, 18px);
            box-sizing: border-box;
            min-width: 0;
            min-height: 0;
        }

        /* Theme Variants */
        body.theme-glass {
            --gp-bg: rgba(15, 23, 42, 0.72);
            --gp-border: rgba(255, 255, 255, 0.16);
        }
        body.theme-glass .card, body.theme-glass .ticker-bar, body.theme-glass .schedule-card, body.theme-glass .checklist-item {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }
        body.theme-transparent {
            --gp-bg: transparent;
            --gp-border: transparent;
        }
        body.theme-transparent .card, body.theme-transparent .ticker-bar, body.theme-transparent .schedule-card, body.theme-transparent .checklist-item {
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
        }
        body.theme-dark {
            --gp-bg: #0d1117;
            --gp-border: #30363d;
        }
        body.theme-light {
            --gp-bg: #ffffff;
            --gp-border: #d0d7de;
            --gp-text: #1f2328;
            --gp-muted: #656d76;
            --gp-now-bg: #dafbe1;
            --gp-now-border: #1a7f37;
            --gp-now-text: #1a7f37;
        }

        /* Common Elements */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: calc(clamp(0.62rem, 1.8vmin, 1.05rem) * var(--gp-font-scale));
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: clamp(2px, 0.5vmin, 5px) clamp(6px, 1.4vmin, 12px);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--gp-muted);
            white-space: nowrap;
        }
        .badge-now {
            background: var(--gp-now-bg);
            border: 1px solid var(--gp-now-border);
            color: var(--gp-now-text);
            animation: pulse-glow 2s infinite ease-in-out;
        }
        .badge-next {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #60a5fa;
        }
        .badge-done {
            background: rgba(139, 148, 158, 0.2);
            color: var(--gp-muted);
            text-decoration: line-through;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.03); }
        }

        .cover-img {
            width: clamp(38px, 6vmin, 72px);
            height: clamp(52px, 8vmin, 96px);
            object-fit: cover;
            border-radius: clamp(4px, 1vmin, 8px);
            flex-shrink: 0;
            background: #161b22;
            border: 1px solid var(--gp-border);
        }
        .cover-img.small {
            width: clamp(26px, 4.5vmin, 48px);
            height: clamp(34px, 6vmin, 64px);
            border-radius: clamp(3px, 0.8vmin, 6px);
        }

        /* VIEW 1: TICKER (Lower-Third bar) */
        .view-ticker {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
        }
        .ticker-bar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 2vmin, 20px);
            background: var(--gp-bg);
            border: 1px solid var(--gp-border);
            border-radius: clamp(8px, 1.8vmin, 16px);
            padding: clamp(6px, 1.6vmin, 14px) clamp(12px, 2.5vmin, 24px);
            max-width: 100%;
            box-sizing: border-box;
            flex-wrap: wrap;
        }
        .ticker-segment {
            display: flex;
            align-items: center;
            gap: clamp(6px, 1.5vmin, 14px);
            min-width: 0;
        }
        .ticker-divider {
            width: 1px;
            height: clamp(20px, 4vmin, 36px);
            background: var(--gp-border);
            margin: 0 clamp(2px, 0.6vmin, 6px);
            flex-shrink: 0;
        }
        .ticker-title {
            font-size: calc(clamp(0.85rem, 2.6vmin, 1.8rem) * var(--gp-font-scale));
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ticker-sub {
            font-size: calc(clamp(0.68rem, 1.8vmin, 1.25rem) * var(--gp-font-scale));
            color: var(--gp-muted);
            white-space: nowrap;
        }

        /* VIEW 2: SCHEDULE (Horizontal Cards Strip) */
        .view-schedule {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: clamp(8px, 2vmin, 18px);
            width: 100%;
            height: 100%;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            box-sizing: border-box;
            flex-wrap: wrap;
        }
        .schedule-card {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vmin, 16px);
            background: var(--gp-bg);
            border: 1px solid var(--gp-border);
            border-radius: clamp(8px, 1.8vmin, 14px);
            padding: clamp(8px, 2vmin, 18px) clamp(10px, 2.2vmin, 20px);
            flex: 1 1 clamp(180px, 24vmin, 340px);
            max-width: 440px;
            min-width: 0;
            position: relative;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .schedule-card.active {
            border-color: var(--gp-now-border);
            background: color-mix(in srgb, var(--gp-now-bg) 35%, var(--gp-bg));
            box-shadow: 0 0 16px rgba(35, 134, 54, 0.3);
        }
        .schedule-card.played {
            opacity: 0.65;
        }
        .schedule-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
            min-width: 0;
            flex: 1;
        }
        .schedule-title {
            font-size: calc(clamp(0.82rem, 2.5vmin, 1.6rem) * var(--gp-font-scale));
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .schedule-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* VIEW 3: CHECKLIST (Vertical Stack) */
        .view-checklist {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(6px, 1.6vmin, 12px);
            width: 100%;
            height: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        .checklist-item {
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vmin, 14px);
            background: var(--gp-bg);
            border: 1px solid var(--gp-border);
            border-radius: clamp(6px, 1.5vmin, 12px);
            padding: clamp(6px, 1.8vmin, 14px) clamp(10px, 2vmin, 18px);
            position: relative;
            box-sizing: border-box;
        }
        .checklist-item.active {
            border-color: var(--gp-now-border);
            background: color-mix(in srgb, var(--gp-now-bg) 40%, var(--gp-bg));
            box-shadow: 0 0 14px rgba(35, 134, 54, 0.35);
        }
        .checklist-item.played {
            opacity: 0.6;
        }
        .checklist-idx {
            font-size: calc(clamp(0.75rem, 2vmin, 1.15rem) * var(--gp-font-scale));
            font-weight: 700;
            color: var(--gp-muted);
            min-width: 20px;
        }
        .checklist-info {
            flex: 1;
            overflow: hidden;
            min-width: 0;
        }
        .checklist-title {
            font-size: calc(clamp(0.82rem, 2.4vmin, 1.5rem) * var(--gp-font-scale));
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .checklist-note {
            font-size: calc(clamp(0.68rem, 1.8vmin, 1.2rem) * var(--gp-font-scale));
            color: var(--gp-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .checklist-status {
            flex-shrink: 0;
        }

        .empty-placeholder {
            font-size: calc(clamp(0.82rem, 2.2vmin, 1.3rem) * var(--gp-font-scale));
            color: var(--gp-muted);
            padding: 8px 14px;
            background: var(--gp-bg);
            border: 1px dashed var(--gp-border);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <script src="/overlay-visibility.js" data-key="game-plan"></script>
    <script src="/url-params.js"></script>
    <script src="/overlay-theme.js"></script>
    <script>
    (function() {
        const params = overlayParams();
        const container = document.getElementById('container');

        const view = (params.get('view') || 'schedule').toLowerCase();
        const listFilter = params.get('list') || 'scheduled';
        const periodFilter = params.get('period') || '';
        const maxItems = Math.max(1, parseInt(params.get('max') || '5', 10));
        const showCovers = params.get('covers') !== '0';
        const showNotes = params.get('notes') !== '0';
        const theme = (params.get('theme') || 'glass').toLowerCase();
        const accent = params.get('accent') || '';
        const fontScaleParam = parseFloat(params.get('fontscale') || params.get('fontScale') || params.get('scale') || '1');
        const align = (params.get('align') || 'center').toLowerCase();

        if (['glass', 'dark', 'light', 'transparent'].includes(theme)) {
            document.body.className = `theme-${theme}`;
        }
        if (align === 'left' || align === 'start') {
            container.style.justifyContent = 'flex-start';
        } else if (align === 'right' || align === 'end') {
            container.style.justifyContent = 'flex-end';
        }
        if (accent) {
            document.documentElement.style.setProperty('--gp-accent', accent.startsWith('#') ? accent : `#${accent}`);
        }
        if (!isNaN(fontScaleParam) && fontScaleParam > 0) {
            document.documentElement.style.setProperty('--gp-font-scale', fontScaleParam);
        }

        // Apply shared overlay theme from server config
        fetch('/api/config', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(cfg => {
            if (cfg?.theme) {
                applyOverlayTheme(cfg.theme, {
                    font: '--gp-font',
                    text: '--gp-text',
                    accent: '--gp-accent',
                    scale: '--gp-font-scale'
                }, { defaultFont: 'Segoe UI', fontFallback: 'system-ui, sans-serif' });
                if (accent) {
                    document.documentElement.style.setProperty('--gp-accent', accent.startsWith('#') ? accent : `#${accent}`);
                }
            }
        let currentPlan = null;

        function esc(str) {
            return String(str || '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function renderTicker(items, playing) {
            if (!items.length && !playing) {
                container.innerHTML = '<div class="empty-placeholder">No games scheduled</div>';
                return;
            }

            const upNext = items.find(i => !i.playingNow && i.status !== 'played');
            let html = '<div class="view-ticker"><div class="ticker-bar">';

            if (playing) {
                html += `
                    <div class="ticker-segment">
                        <span class="badge badge-now">▶ Playing Now</span>
                        ${showCovers && playing.cover ? `<img class="cover-img small" src="${esc(playing.cover)}" alt="">` : ''}
                        <div>
                            <div class="ticker-title">${esc(playing.name)}</div>
                            ${playing.period ? `<div class="ticker-sub">${esc(playing.period)}</div>` : ''}
                        </div>
                    </div>
                `;
            }

            if (playing && upNext) {
                html += '<div class="ticker-divider"></div>';
            }

            if (upNext) {
                html += `
                    <div class="ticker-segment">
                        <span class="badge badge-next">⏭ Up Next</span>
                        ${showCovers && upNext.cover ? `<img class="cover-img small" src="${esc(upNext.cover)}" alt="">` : ''}
                        <div>
                            <div class="ticker-title">${esc(upNext.name)}</div>
                            ${upNext.period ? `<div class="ticker-sub">${esc(upNext.period)}</div>` : ''}
                        </div>
                    </div>
                `;
            }

            html += '</div></div>';
            container.innerHTML = html;
        }

        function renderSchedule(items, playing) {
            if (!items.length) {
                container.innerHTML = '<div class="empty-placeholder">No games scheduled</div>';
                return;
            }

            let html = '<div class="view-schedule">';
            items.slice(0, maxItems).forEach(item => {
                const isNow = Boolean(item.playingNow);
                const isPlayed = item.status === 'played';
                html += `
                    <div class="schedule-card${isNow ? ' active' : ''}${isPlayed ? ' played' : ''}">
                        ${showCovers && item.cover ? `<img class="cover-img" src="${esc(item.cover)}" alt="">` : ''}
                        <div class="schedule-info">
                            <div class="schedule-meta">
                                ${isNow ? '<span class="badge badge-now">▶ Playing</span>' : (isPlayed ? '<span class="badge badge-done">Done</span>' : '<span class="badge">Scheduled</span>')}
                                ${item.period ? `<span class="badge">${esc(item.period)}</span>` : ''}
                            </div>
                            <div class="schedule-title" title="${esc(item.name)}">${esc(item.name)}</div>
                            ${showNotes && item.note ? `<div class="checklist-note">${esc(item.note)}</div>` : ''}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function renderChecklist(items, playing) {
            if (!items.length) {
                container.innerHTML = '<div class="empty-placeholder">No games scheduled</div>';
                return;
            }

            let html = '<div class="view-checklist">';
            items.slice(0, maxItems).forEach((item, idx) => {
                const isNow = Boolean(item.playingNow);
                const isPlayed = item.status === 'played';
                html += `
                    <div class="checklist-item${isNow ? ' active' : ''}${isPlayed ? ' played' : ''}">
                        <span class="checklist-idx">${idx + 1}</span>
                        ${showCovers && item.cover ? `<img class="cover-img small" src="${esc(item.cover)}" alt="">` : ''}
                        <div class="checklist-info">
                            <div class="checklist-title">${esc(item.name)}</div>
                            ${showNotes && (item.note || item.period) ? `<div class="checklist-note">${esc([item.period, item.note].filter(Boolean).join(' · '))}</div>` : ''}
                        </div>
                        <div class="checklist-status">
                            ${isNow ? '<span class="badge badge-now">▶ Now</span>' : (isPlayed ? '<span class="badge badge-done">✓</span>' : '<span class="badge">Next</span>')}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function render() {
            if (!currentPlan || !Array.isArray(currentPlan.items)) return;

            let items = currentPlan.items;

            // Filter by list (e.g. 'scheduled', 'backlog', or custom list id)
            if (listFilter) {
                items = items.filter(i => i.status === listFilter || (i.extraLists || []).includes(listFilter));
            }

            // Filter by period if specified
            if (periodFilter) {
                items = items.filter(i => (i.period || '').toLowerCase() === periodFilter.toLowerCase());
            }

            // Determine playing now game
            const playing = currentPlan.items.find(i => Boolean(i.playingNow)) || null;

            if (view === 'ticker') {
                renderTicker(items, playing);
            } else if (view === 'checklist') {
                renderChecklist(items, playing);
            } else {
                renderSchedule(items, playing);
            }
        }

        async function fetchPlan() {
            try {
                const res = await fetch('/api/game-plan', { cache: 'no-store' });
                if (res.ok) {
                    currentPlan = await res.json();
                    render();
                }
            } catch (e) {
                console.warn('[Game Plan Overlay] Fetch error:', e);
            }
        }

        function connectWs() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${proto}//${location.host}`);
            ws.onmessage = evt => {
                try {
                    const msg = JSON.parse(evt.data);
                    if (msg.type === 'game-plan-update') {
                        currentPlan = msg.plan;
                        render();
                    }
                } catch {}
            };
            ws.onclose = () => {
                setTimeout(connectWs, 5000);
            };
        }

        fetchPlan();
        connectWs();
        setInterval(fetchPlan, 10000); // Polling heartbeat
    })();
    </script>
</body>
</html>

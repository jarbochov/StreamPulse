<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/admin.css">
    <script src="/appearance.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Chat Commands</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg-page); color: var(--text); min-height: 100vh; }
        .wrap { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; display: grid; gap: 1rem; }
        h1 { font-size: 1.4rem; } h1 span { color: var(--accent); }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1.1rem; }
        .card h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-bottom: .6rem; }
        .muted { color: var(--text-muted); font-size: .82rem; line-height: 1.5; }
        table.help { border-collapse: collapse; width: 100%; font-size: .85rem; }
        table.help td { padding: .35rem .5rem; border-bottom: 1px solid var(--bg-raised); vertical-align: top; }
        table.help td:first-child { white-space: nowrap; }
        code { background: var(--bg-inset); padding: .1rem .35rem; border-radius: 4px; }
        input { width: 100%; padding: .55rem .7rem; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font: inherit; }
        .quote { display: grid; grid-template-columns: 3rem 1fr; gap: .6rem; padding: .6rem 0; border-bottom: 1px solid var(--bg-raised); }
        .b { padding: .45rem .8rem; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 6px; color: var(--text); cursor: pointer; font: inherit; }
        .row { padding: .6rem 0; border-bottom: 1px solid var(--bg-raised); display: grid; gap: .2rem; }
        ul { margin-left: 1.2rem; font-size: .88rem; }
        .num { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
        .meta { font-size: .72rem; color: var(--text-muted); margin-top: .1rem; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>StreamPulse <span>Chat Commands</span></h1>
    <div class="card" style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;">
        <label class="muted">Show commands for <select id="audience" class="b"><option value="viewers">Viewers</option><option value="subscribers">Subscribers</option><option value="mods">Mods (everything)</option></select></label><button class="b" id="copy">Copy Markdown</button><button class="b" id="md">Download Markdown</button>
        <span style="display:flex;gap:.9rem;align-items:center;"><label class="muted"><input type="checkbox" id="inc-quotes" style="width:auto"> Include all quotes</label><label class="muted" id="details-wrap" hidden><input type="checkbox" id="inc-details" style="width:auto"> with details</label></span>
        <span class="muted" style="flex:1;text-align:right">Generated live. Read only.</span>
    </div>
    <div id="out"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = v => { const d = document.createElement('div'); d.textContent = v ?? ''; return d.innerHTML; };
let state = null;
const who = a => ({ everyone: 'Everyone', subs: 'Subscribers only', mods: 'Mods only' })[a] || 'Everyone';
const badge = x => x.who === 'Everyone' ? '' : ` <span class="meta" style="border:1px solid var(--border);border-radius:4px;padding:0 .35rem;">${x.who}</span>`;
const lines = t => String(t || '').split(/\\n|\n/).map(l => l.trim()).filter(Boolean);

// One model feeds both the page and the Markdown so they never drift apart.
function model() {
    const s = state.settings, p = s.prefix || '!', b = s.builtins || {};
        const builtin = [
        ['quote [number or word]', 'A random quote, a numbered quote, or one matching a word.', 'quote'],
        ['quotes', 'How many quotes are saved.', 'quotes'],
        ['addquote text', 'Add a quote.', 'addquote'],
        ['delquote number', 'Remove a quote.', 'delquote']
    ].map(([cmd, desc, k]) => ({ cmd: p + cmd, desc, who: who(b[k]?.access) }));
    const commands = state.commands.map(c => ({
        cmd: [c.name, ...(c.aliases || [])].map(n => p + n).join(' / '), enabled: c.enabled !== false, who: who(c.access),
        random: !!c.random, replies: c.random ? lines(c.response) : [String(c.response || '')]
    }));
    const triggers = state.triggers.map(t => ({ name: t.name || t.words[0], words: t.words, enabled: t.enabled !== false, who: who(t.access), random: !!t.random, replies: t.random ? lines(t.text) : [t.text] }));
    const rank = { 'Everyone': 0, 'Subscribers only': 1, 'Mods only': 2 }, level = { viewers: 0, subscribers: 1, mods: 2 }[$('audience').value] ?? 0;
    const pub = x => (rank[x.who] ?? 0) <= level;
    return { p, builtin: builtin.filter(pub), commands: commands.filter(pub), triggers: triggers.filter(pub) };
}

function renderPage() {
    const m = model();
    const reply = x => x.random ? `<div class="muted">Random, one of:</div><ul>${x.replies.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : `<div>${esc(x.replies[0])}</div>`;
    const off = x => x.enabled ? '' : ' <span class="muted">(disabled)</span>';
    let html = `<div class="card"><h2>Built-in commands</h2>${m.builtin.map(c => `<div class="row"><code>${esc(c.cmd)}</code>${badge(c)}<div class="muted">${esc(c.desc)}</div></div>`).join('')}</div>`;
    html += `<div class="card"><h2>Custom commands (${m.commands.length})</h2>${m.commands.map(c => `<div class="row"><code>${esc(c.cmd)}</code>${badge(c)}${off(c)}${reply(c)}</div>`).join('') || '<div class="muted">None.</div>'}</div>`;
    html += `<div class="card"><h2>Word triggers (${m.triggers.length})</h2>${m.triggers.map(t => `<div class="row"><b>${esc(t.name)}</b>${badge(t)}${off(t)}<div class="muted">When chat says: ${t.words.map(esc).join(', ')}</div>${reply(t)}</div>`).join('') || '<div class="muted">None.</div>'}</div>`;
    if ($('inc-quotes').checked) html += `<div class="card"><h2>Quotes (${state.quotes.length})</h2>${state.quotes.map(q => `<div class="row"><b>#${q.id}</b> ${esc(q.text)}${$('inc-details').checked ? `<div class="meta">${[q.game, q.by && 'Added by ' + q.by].filter(Boolean).map(esc).join(' · ')}</div>` : ''}</div>`).join('')}</div>`;
    $('out').innerHTML = html;
}

function markdown() {
    const m = model(), cell = v => String(v ?? '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ').trim();
    const who2 = x => x.who === 'Everyone' ? '' : x.who;
    const nice = r => cell(r).replace(/\{\{\s*(?:user|sender)\s*\}\}|\$\((?:user|sender)\)/gi, '(name)');
    const rep = x => x.random ? 'Random, one of:<br>' + x.replies.map(r => '• ' + nice(r)).join('<br>') : x.replies.map(nice).join('<br>');
    let md = '# Chat commands\n\n## Built-in\n\n| Command | What it does | Who |\n|---|---|---|\n';
    md += m.builtin.map(c => `| \`${cell(c.cmd)}\` | ${cell(c.desc)} | ${who2(c)} |`).join('\n');
    md += '\n\n## Custom commands\n\n';
    const cmds = m.commands.filter(c => c.enabled);
    md += cmds.length ? '| Command | Reply | Who |\n|---|---|---|\n' + cmds.map(c => `| \`${cell(c.cmd)}\` | ${rep(c)} | ${who2(c)} |`).join('\n') : '_None._';
    const trigs = m.triggers.filter(t => t.enabled);
    md += '\n\n## Word triggers\n\n';
    md += trigs.length ? '| Trigger | When chat says | Reply | Who |\n|---|---|---|---|\n' + trigs.map(t => `| ${cell(t.name)} | ${cell(t.words.join(', '))} | ${rep(t)} | ${who2(t)} |`).join('\n') : '_None._';
    if ($('inc-quotes').checked) md += `\n\n## Quotes\n\n${$('inc-details').checked ? '| # | Quote | Game | Added by |\n|---|---|---|---|' : '| # | Quote |\n|---|---|'}\n${state.quotes.map(q => $('inc-details').checked ? `| ${q.id} | ${cell(q.text)} | ${cell(q.game)} | ${cell(q.by)} |` : `| ${q.id} | ${cell(q.text)} |`).join('\n')}`;
    return md + '\n';
}

$('inc-quotes').onchange = () => { $('details-wrap').hidden = !$('inc-quotes').checked; if (!$('inc-quotes').checked) $('inc-details').checked = false; renderPage(); };
$('inc-details').onchange = renderPage;
$('audience').value = new URLSearchParams(location.search).get('for') || 'viewers';
$('audience').onchange = renderPage;
$('copy').onclick = async () => { try { await navigator.clipboard.writeText(markdown()); $('copy').textContent = 'Copied'; } catch { const t = document.createElement('textarea'); t.value = markdown(); document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); $('copy').textContent = 'Copied'; } setTimeout(() => $('copy').textContent = 'Copy Markdown', 1500); };
$('md').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([markdown()], { type: 'text/markdown' })); a.download = 'streampulse-chat-commands.md'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
fetch('/api/chatbot', { cache: 'no-store' }).then(r => r.json()).then(d => { state = d; renderPage(); });
</script>
</body>
</html>

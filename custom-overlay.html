<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse Custom Overlay</title>
    <link rel="stylesheet" href="/alert-box.css">
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        body { display: flex; align-items: flex-start; justify-content: flex-start; }
        #overlay-root { position: relative; flex: 0 0 auto; overflow: hidden; }
        .overlay-element { position: absolute; overflow: hidden; box-sizing: border-box; white-space: pre-wrap; word-break: break-word; }
        .overlay-markdown { white-space: normal; }
.overlay-markdown li, .overlay-markdown h1, .overlay-markdown h2, .overlay-markdown h3 { break-inside: avoid; } .overlay-markdown h1, .overlay-markdown h2, .overlay-markdown h3, .overlay-markdown h4 { break-after: avoid; }
.overlay-markdown.md-cols > * { margin-top: 0; margin-bottom: .6em; } .overlay-markdown.md-cols h1, .overlay-markdown.md-cols h2, .overlay-markdown.md-cols h3, .overlay-markdown.md-cols h4, .overlay-markdown.md-cols h5, .overlay-markdown.md-cols h6 { margin-bottom: .25em; }
        .overlay-markdown.md-cols > :is(h1, h2, h3, h4, h5, h6):first-child { column-span: all; margin-bottom: .4em; }
        .overlay-markdown p { margin: 0 0 0.5em; }
        .overlay-markdown p:last-child { margin-bottom: 0; }
        .overlay-markdown img { max-width: 100%; max-height: 100%; }
        .overlay-markdown a { color: inherit; }
        .overlay-markdown pre, .overlay-markdown code { white-space: pre-wrap; }
        .overlay-markdown table { border-collapse: collapse; margin: 0 0 .5em; }
        .overlay-markdown th, .overlay-markdown td { border: 1px solid currentColor; padding: .25em .6em; }
        .overlay-markdown th { font-weight: 700; }
        .overlay-markdown hr { border: 0; border-top: 1px solid currentColor; opacity: .5; margin: .6em 0; }
        .overlay-image, .overlay-video { overflow: hidden; }
        .overlay-embed iframe { width: 100%; height: 100%; border: 0; }
        .overlay-marquee { white-space: nowrap; overflow: hidden; }
        .overlay-marquee::after { content: ''; }
        .overlay-marquee { animation: overlay-marquee var(--marquee-duration, 60s) linear infinite; }
        @keyframes overlay-marquee { from { text-indent: 100%; } to { text-indent: -100%; } }
        .overlay-caret { display: inline-block; max-width: 100%; vertical-align: top; overflow: hidden; white-space: nowrap; border-right: .15em solid currentColor; animation: overlay-blink-caret .5s step-end infinite; }
        @keyframes overlay-blink-caret { from, to { border-right-color: transparent; } 50% { border-right-color: currentColor; } }
    </style>
</head>
<body>
    <div id="overlay-root"></div>
    <script src="/vendor/marked.umd.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script src="/overlay-shared.js"></script>
    <script src="/overlay-runtime.js"></script>
</body>
</html>

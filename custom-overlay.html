<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse Custom Overlay</title>
    <link rel="stylesheet" href="/alert-box.css">
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        body { display: flex; align-items: flex-start; justify-content: flex-start; }
        #overlay-root { position: relative; flex: 0 0 auto; overflow: hidden; }
        @keyframes pg-fade-in { from { opacity: 0; } }
        @keyframes pg-fade-out { to { opacity: 0; } }
        @keyframes pg-slide-in { from { opacity: 0; transform: translate(var(--pg-x, 120px), var(--pg-y, 0)); } }
        @keyframes pg-slide-out { to { opacity: 0; transform: translate(calc(var(--pg-x, 120px) * -1), calc(var(--pg-y, 0px) * -1)); } }
        .overlay-element { position: absolute; overflow: hidden; box-sizing: border-box; white-space: pre-wrap; word-break: break-word; }
        .overlay-markdown { white-space: normal; }
.overlay-markdown li, .overlay-markdown h1, .overlay-markdown h2, .overlay-markdown h3 { break-inside: avoid; } .overlay-markdown h1, .overlay-markdown h2, .overlay-markdown h3, .overlay-markdown h4 { break-after: avoid; }
.overlay-markdown.md-cols > * { margin-top: 0; margin-bottom: .6em; } .overlay-markdown.md-cols h1, .overlay-markdown.md-cols h2, .overlay-markdown.md-cols h3, .overlay-markdown.md-cols h4, .overlay-markdown.md-cols h5, .overlay-markdown.md-cols h6 { margin-bottom: .25em; }
        .overlay-markdown.md-cols[data-span="1"] > h1 { column-span: all; margin-bottom: .4em; }
        .overlay-markdown.md-cols[data-span="1"] > h1:not(:first-child) { margin-top: .5em; }
        .overlay-markdown.md-cols[data-span="2"] > h1, .overlay-markdown.md-cols[data-span="2"] > h2 { column-span: all; margin-bottom: .4em; }
        .overlay-markdown.md-cols[data-span="2"] > h1:not(:first-child), .overlay-markdown.md-cols[data-span="2"] > h2:not(:first-child) { margin-top: .5em; }
        .overlay-markdown.md-cols[data-span="3"] > h1, .overlay-markdown.md-cols[data-span="3"] > h2, .overlay-markdown.md-cols[data-span="3"] > h3 { column-span: all; margin-bottom: .4em; }
        .overlay-markdown.md-cols[data-span="3"] > h1:not(:first-child), .overlay-markdown.md-cols[data-span="3"] > h2:not(:first-child), .overlay-markdown.md-cols[data-span="3"] > h3:not(:first-child) { margin-top: .5em; }
        .overlay-markdown.md-cols[data-span="4"] > h1, .overlay-markdown.md-cols[data-span="4"] > h2, .overlay-markdown.md-cols[data-span="4"] > h3, .overlay-markdown.md-cols[data-span="4"] > h4 { column-span: all; margin-bottom: .4em; }
        .overlay-markdown.md-cols[data-span="4"] > h1:not(:first-child), .overlay-markdown.md-cols[data-span="4"] > h2:not(:first-child), .overlay-markdown.md-cols[data-span="4"] > h3:not(:first-child), .overlay-markdown.md-cols[data-span="4"] > h4:not(:first-child) { margin-top: .5em; }
        .overlay-markdown.md-cols[data-span="5"] > h1, .overlay-markdown.md-cols[data-span="5"] > h2, .overlay-markdown.md-cols[data-span="5"] > h3, .overlay-markdown.md-cols[data-span="5"] > h4, .overlay-markdown.md-cols[data-span="5"] > h5 { column-span: all; margin-bottom: .4em; }
        .overlay-markdown.md-cols[data-span="5"] > h1:not(:first-child), .overlay-markdown.md-cols[data-span="5"] > h2:not(:first-child), .overlay-markdown.md-cols[data-span="5"] > h3:not(:first-child), .overlay-markdown.md-cols[data-span="5"] > h4:not(:first-child), .overlay-markdown.md-cols[data-span="5"] > h5:not(:first-child) { margin-top: .5em; }
        .overlay-markdown.md-cols[data-span="6"] > h1, .overlay-markdown.md-cols[data-span="6"] > h2, .overlay-markdown.md-cols[data-span="6"] > h3, .overlay-markdown.md-cols[data-span="6"] > h4, .overlay-markdown.md-cols[data-span="6"] > h5, .overlay-markdown.md-cols[data-span="6"] > h6 { column-span: all; margin-bottom: .4em; }
        .overlay-markdown.md-cols[data-span="6"] > h1:not(:first-child), .overlay-markdown.md-cols[data-span="6"] > h2:not(:first-child), .overlay-markdown.md-cols[data-span="6"] > h3:not(:first-child), .overlay-markdown.md-cols[data-span="6"] > h4:not(:first-child), .overlay-markdown.md-cols[data-span="6"] > h5:not(:first-child), .overlay-markdown.md-cols[data-span="6"] > h6:not(:first-child) { margin-top: .5em; }
        .overlay-markdown h1 { font-size: calc(2em * var(--hs, 1)); }
        .overlay-markdown h2 { font-size: calc(1.5em * var(--hs, 1)); }
        .overlay-markdown h3 { font-size: calc(1.17em * var(--hs, 1)); }
        .overlay-markdown h4 { font-size: calc(1em * var(--hs, 1)); }
        .overlay-markdown h5 { font-size: calc(.83em * var(--hs, 1)); }
        .overlay-markdown h6 { font-size: calc(.67em * var(--hs, 1)); }
        .overlay-markdown ul, .overlay-markdown ol { padding-inline-start: 1.5em; }
        .overlay-markdown.md-right ul, .overlay-markdown.md-right ol { direction: ltr; list-style: none; padding: 0 1.5em 0 0; margin-right: 0; }
        .overlay-markdown.md-right ol { counter-reset: mdn; }
        .overlay-markdown.md-right li { position: relative; text-align: right; }
        .overlay-markdown.md-right li::after { position: absolute; right: -1.5em; top: 0; width: 1.5em; text-align: left; padding-left: .35em; box-sizing: border-box; content: '\2022'; }
        .overlay-markdown.md-right ul ul > li::after { content: '\25E6'; }
        .overlay-markdown.md-right ul ul ul > li::after { content: '\25AA'; }
        .overlay-markdown.md-right ol > li { counter-increment: mdn; }
        .overlay-markdown.md-right ol > li::after { content: counter(mdn) '.'; }
        .overlay-markdown.md-right .li-t, .overlay-markdown.md-right li > p { text-align: right; }
        .overlay-markdown .li-t { display: block; }
        .overlay-markdown p { margin: 0 0 0.5em; }
        .overlay-markdown p:last-child { margin-bottom: 0; }
        .overlay-markdown img { max-width: 100%; max-height: 100%; }
        .overlay-markdown a { color: inherit; }
        .overlay-markdown pre, .overlay-markdown code { white-space: pre-wrap; }
        .overlay-markdown table { border-collapse: collapse; margin: 0 0 .5em; }
        .overlay-markdown th, .overlay-markdown td { border: 1px solid currentColor; padding: .25em .6em; }
        .overlay-markdown th { font-weight: 700; }
        .overlay-markdown hr { border: 0; border-top: 1px solid currentColor; opacity: .5; margin: .6em 0; }
        .overlay-image, .overlay-video { overflow: hidden; }
        .overlay-embed iframe { width: 100%; height: 100%; border: 0; }
        .overlay-marquee { white-space: nowrap; overflow: hidden; }
        .overlay-marquee::after { content: ''; }
        .overlay-marquee { animation: overlay-marquee var(--marquee-duration, 60s) linear infinite; }
        @keyframes overlay-marquee { from { text-indent: 100%; } to { text-indent: -100%; } }
        .overlay-caret { display: inline-block; max-width: 100%; vertical-align: top; overflow: hidden; white-space: nowrap; border-right: .15em solid currentColor; animation: overlay-blink-caret .5s step-end infinite; }
        @keyframes overlay-blink-caret { from, to { border-right-color: transparent; } 50% { border-right-color: currentColor; } }
    </style>
</head>
<body>
    <div id="overlay-root"></div>
    <script src="/vendor/marked.umd.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script src="/overlay-shared.js"></script>
    <script src="/overlay-runtime.js"></script>
</body>
</html>

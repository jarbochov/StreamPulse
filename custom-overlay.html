<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse Custom Overlay</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
        body { display: flex; align-items: flex-start; justify-content: flex-start; }
        #overlay-root { position: relative; flex: 0 0 auto; overflow: hidden; }
        .overlay-element { position: absolute; overflow: hidden; box-sizing: border-box; white-space: pre-wrap; word-break: break-word; }
        .overlay-markdown { white-space: normal; }
        .overlay-markdown p { margin: 0 0 0.5em; }
        .overlay-markdown p:last-child { margin-bottom: 0; }
        .overlay-markdown img { max-width: 100%; max-height: 100%; }
        .overlay-markdown a { color: inherit; }
        .overlay-markdown pre, .overlay-markdown code { white-space: pre-wrap; }
        .overlay-image, .overlay-video { overflow: hidden; }
        .overlay-embed iframe { width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <div id="overlay-root"></div>
    <script src="/vendor/marked.umd.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script src="/overlay-runtime.js"></script>
</body>
</html>

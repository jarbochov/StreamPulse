<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Documentation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; }

        .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.3rem; font-weight: 600; }
        .header h1 span { color: #58a6ff; }
        .nav { display: flex; gap: 0.75rem; }
        .nav a { color: #8b949e; text-decoration: none; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s; }
        .nav a:hover { color: #e1e4e8; background: #21262d; }
        .nav a.active { color: #58a6ff; background: #1a2332; }

        .container { max-width: 960px; margin: 0 auto; padding: 1.5rem 2rem; }

        .toc { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
        .toc h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: #8b949e; margin-bottom: 0.5rem; }
        .toc a { color: #58a6ff; text-decoration: none; font-size: 0.85rem; display: block; padding: 0.2rem 0; }
        .toc a:hover { text-decoration: underline; }

        .section-title { font-size: 1rem; font-weight: 600; color: #e1e4e8; margin: 2rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid #30363d; scroll-margin-top: 1rem; }
        .section-title:first-of-type { margin-top: 0.5rem; }

        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 0.75rem; overflow: hidden; }
        .card-header { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; cursor: pointer; user-select: none; }
        .card-header:hover { background: #1c2128; }
        .card-header .chevron { color: #484f58; font-size: 0.7rem; transition: transform 0.2s; margin-left: auto; flex-shrink: 0; }
        .card.open .chevron { transform: rotate(90deg); }
        .card-body { display: none; padding: 0 1rem 1rem; border-top: 1px solid #21262d; }
        .card.open .card-body { display: block; padding-top: 0.75rem; }

        .param-name { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.85rem; color: #79c0ff; font-weight: 600; }
        .param-desc { color: #8b949e; font-size: 0.8rem; }

        .badge { font-size: 0.65rem; padding: 0.15rem 0.45rem; border-radius: 4px; font-weight: 600; vertical-align: middle; margin-left: 0.4rem; }
        .badge.default { background: #1a2332; color: #58a6ff; border: 1px solid #30363d; }
        .badge.required { background: #5a1e23; color: #f85149; border: 1px solid #f8514930; }
        .badge.page { background: #1a3a1a; color: #3fb950; border: 1px solid #3fb95030; }
        .badge.hot { background: #4a2f05; color: #d29922; border: 1px solid #d2992230; }

        .detail-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: #8b949e; margin-bottom: 0.3rem; margin-top: 0.6rem; }
        .detail-label:first-child { margin-top: 0; }
        .detail-text { font-size: 0.85rem; color: #c9d1d9; line-height: 1.5; }

        .code-block { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 0.6rem 0.75rem; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; color: #e1e4e8; margin-top: 0.35rem; overflow-x: auto; white-space: pre; }

        .url-box { display: flex; align-items: center; gap: 0.5rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 0.5rem 0.75rem; margin-top: 0.35rem; }
        .url-box code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; flex: 1; word-break: break-all; color: #e1e4e8; }
        .copy-btn { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .copy-btn:hover { border-color: #58a6ff; color: #e1e4e8; }
        .copy-btn.copied { border-color: #3fb950; color: #3fb950; }

        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.8rem; }
        table th { text-align: left; color: #8b949e; font-weight: 600; padding: 0.5rem 0.75rem; background: #0d1117; border-bottom: 1px solid #30363d; }
        table td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #21262d; }
        table code { background: #21262d; padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.8rem; }

        .checklist { list-style: none; padding: 0; }
        .checklist li { padding: 0.3rem 0; font-size: 0.85rem; }
        .checklist li::before { content: '✅ '; }

        .nav .dropdown { position: relative; display: flex; align-items: center; }
        .nav .dropdown-toggle { color: #8b949e; text-decoration: none; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s; cursor: pointer; display: block; }
        .nav .dropdown-toggle:hover { color: #e1e4e8; background: #21262d; }
        .nav .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 0.4rem 0; min-width: 180px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .nav .dropdown::after { content: ''; position: absolute; top: 100%; left: 0; right: 0; height: 8px; }
        .nav .dropdown:hover .dropdown-menu { display: block; }
        .nav .dropdown-menu a { display: block; padding: 0.5rem 1rem; color: #8b949e; text-decoration: none; font-size: 0.85rem; transition: all 0.15s; }
        .nav .dropdown-menu a:hover { color: #e1e4e8; background: #21262d; }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>StreamPulse <span>Documentation</span></h1>
        <div id="main-nav" class="nav"></div>
        <script src="/nav.js"></script>
    </div>

    <div class="container">
        <div class="toc">
            <h2>Contents</h2>
            <a href="#url-params">URL Parameters</a>
            <a href="#config">config.json Reference</a>
            <a href="#obs-setup">OBS Browser Source Setup</a>
            <a href="#websocket">WebSocket Connection</a>
            <a href="#data-files">Data Files & Persistence</a>
            <a href="#timers">Named Timers</a>
            <a href="#music">Music Now-Playing (Beta)</a>
            <a href="#companion">Bitfocus Companion Setup</a>
        </div>

        <div id="content"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    const BASE = window.location.origin;

    const sections = [
        {
            id: 'url-params',
            title: 'URL Parameters',
            groups: [
                {
                    name: 'credits.html — Credits Overlay',
                    items: [
                        { param: 'duration', type: 'number', default: '82', desc: 'Total scroll duration in seconds. Overrides speed parameter.', example: '?duration=120' },
                        { param: 'speed', type: 'number', default: '1.0', desc: 'Speed multiplier. Scroll duration = 82 / speed. Ignored if duration is set.', example: '?speed=0.8' },
                        { param: 'days', type: 'number', default: '30', desc: 'Filter credits data to the last N days.', example: '?days=7' },
                        { param: 'datapath', type: 'string', default: './data', desc: 'Path to data directory. Rarely needed — server handles this.', example: '?datapath=./data' },
                        { param: 'preview', type: 'boolean', default: 'false', desc: 'Show full credits layout without scrolling. Great for testing in OBS.', example: '?preview=true' }
                    ]
                },
                {
                    name: 'stats.html — Stats Overlay',
                    items: [
                        { param: 'days', type: 'number', default: '0 (all time)', desc: 'Filter stats to last N days.', example: '?days=30' },
                        { param: 'date', type: 'string', default: '—', desc: 'Filter to a single date.', example: '?date=2026-03-14' },
                        { param: 'from', type: 'string', default: '—', desc: 'Start date for date range filter.', example: '?from=2026-03-01' },
                        { param: 'to', type: 'string', default: '—', desc: 'End date for date range filter.', example: '?to=2026-03-14' },
                        { param: 'limit', type: 'number', default: '20', desc: 'Max items shown per category (chatters, emotes, hashtags).', example: '?limit=10' },
                        { param: 'refresh', type: 'number', default: '60', desc: 'Auto-refresh interval in seconds.', example: '?refresh=30' }
                    ]
                },
                {
                    name: '/api/export — CSV Export',
                    items: [
                        { param: 'type', type: 'string', default: 'all', desc: 'Data type to export: chatters, emotes, hashtags, or all.', example: '?type=chatters' },
                        { param: 'days', type: 'number', default: '0 (all time)', desc: 'Limit export to last N days.', example: '?days=30' },
                        { param: 'date', type: 'string', default: '—', desc: 'Export single date.', example: '?date=2026-03-14' },
                        { param: 'from', type: 'string', default: '—', desc: 'Start date for range export.', example: '?from=2026-03-01' },
                        { param: 'to', type: 'string', default: '—', desc: 'End date for range export.', example: '?to=2026-03-14' }
                    ]
                },
                {
                    name: 'hashtags.html — Hashtags Overlay',
                    items: [
                        { param: 'view', type: 'string', default: 'scroll', desc: 'Display mode: "scroll" (credits-style) or "grid" (tag cloud).', example: '?view=grid' },
                        { param: 'sort', type: 'string', default: 'count', desc: 'Sort order: "count" (most used), "alpha" (A-Z), "recent" (newest first).', example: '?sort=alpha' },
                        { param: 'columns', type: 'number', default: '3', desc: 'Number of columns (1–6). Used in scroll view.', example: '?columns=2' },
                        { param: 'limit', type: 'number', default: '0 (all)', desc: 'Max hashtags to show. 0 = show all.', example: '?limit=50' },
                        { param: 'min', type: 'number', default: '0 (all)', desc: 'Minimum usage count to display a hashtag. Great for filtering noise.', example: '?min=3' },
                        { param: 'days', type: 'number', default: '0 (all time)', desc: 'Filter to last N days.', example: '?days=30' },
                        { param: 'date', type: 'string', default: '—', desc: 'Filter to a single date.', example: '?date=2026-03-14' },
                        { param: 'from', type: 'string', default: '—', desc: 'Start date for range.', example: '?from=2026-03-01' },
                        { param: 'to', type: 'string', default: '—', desc: 'End date for range.', example: '?to=2026-03-14' },
                        { param: 'size', type: 'string', default: 'md', desc: 'Font size: "sm", "md", or "lg".', example: '?size=lg' },
                        { param: 'weight', type: 'boolean', default: 'false', desc: 'Grid only: continuous font scaling by count (true tag cloud). Default uses 3 tiers.', example: '?weight=true' },
                        { param: 'scroll', type: 'boolean', default: 'false', desc: 'Grid only: auto-scroll if content overflows.', example: '?scroll=true' },
                        { param: 'counts', type: 'boolean', default: 'true', desc: 'Show usage count next to each hashtag.', example: '?counts=false' },
                        { param: 'title', type: 'string', default: 'All Hashtags', desc: 'Custom title text (scroll view only).', example: '?title=Tonight%27s%20Tags' },
                        { param: 'duration', type: 'number', default: '0 (auto)', desc: 'Scroll duration in seconds. 0 = auto-calculated based on content length.', example: '?duration=60' },
                        { param: 'refresh', type: 'number', default: '60', desc: 'Auto-refresh interval in seconds (grid view only).', example: '?refresh=30' }
                    ]
                },
                {
                    name: 'countdown.html / stopwatch.html — Timer Overlays',
                    items: [
                        { param: 'timer', type: 'string', default: '—', desc: 'Named timer slug managed by Timer Manager. Recommended for production use.', example: '?timer=starting-soon' },
                        { param: 'display', type: 'string', default: 'standard', desc: 'Layout mode: "standard" or "compact".', example: '?display=compact' },
                        { param: 'theme', type: 'string', default: 'dark', desc: 'Theme preset: "dark" or "light".', example: '?theme=light' },
                        { param: 'title', type: 'string', default: 'timer label', desc: 'Override the timer label shown above the overlay.', example: '?title=Be%20Right%20Back' },
                        { param: 'showtitle', type: 'boolean', default: 'true', desc: 'Show or hide the timer title area entirely.', example: '?showtitle=false' },
                        { param: 'units', type: 'string', default: 'auto', desc: 'Show only necessary units ("auto") or always show days/hours/minutes/seconds ("full").', example: '?units=full' },
                        { param: 'milliseconds', type: 'boolean', default: 'false', desc: 'Append smaller trailing hundredths to the seconds value with no label or decimal.', example: '?milliseconds=true' },
                        { param: 'autostart', type: 'boolean', default: 'false', desc: 'Named timers only: start a stopped timer, or resume a paused stopwatch, when the overlay loads. Running timers are left alone.', example: '?autostart=true' },
                        { param: 'progress', type: 'boolean', default: 'timer default', desc: 'Countdown only: show or hide the progress bar.', example: '?progress=false' },
                        { param: 'sound', type: 'boolean', default: 'true', desc: 'Named countdown only: allow completion beep if globally enabled.', example: '?sound=false' },
                        { param: 'fontscale', type: 'number', default: '1', desc: 'Scale overlay font sizing.', example: '?fontscale=1.4' },
                        { param: 'bgcolor', type: 'string', default: 'transparent', desc: 'Optional page background hex without #. Leave blank for transparent OBS output.', example: '?bgcolor=000000' },
                        { param: 'timercolor', type: 'string', default: '000000B8', desc: 'Timer box background hex without #. Supports alpha with 8-digit hex.', example: '?timercolor=101820CC' },
                        { param: 'textcolor', type: 'string', default: 'F8FAFC', desc: 'Main numbers text color.', example: '?textcolor=FFFFFF' },
                        { param: 'labelcolor', type: 'string', default: 'CBD5E1', desc: 'Unit label/status color.', example: '?labelcolor=94A3B8' },
                        { param: 'progresscolor', type: 'string', default: '58A6FF', desc: 'Progress bar fill color.', example: '?progresscolor=3FB950' },
                        { param: 'titlecolor', type: 'string', default: 'F8FAFC', desc: 'Overlay title color.', example: '?titlecolor=FDE68A' }
                    ]
                }
            ]
        },
        {
            id: 'config',
            title: 'config.json Reference',
            groups: [
                {
                    name: 'Server & Connections',
                    items: [
                        { param: 'port', type: 'number', default: '8080', desc: 'HTTP and WebSocket server port.', restart: true },
                        { param: 'broadcaster_id', type: 'string', default: '—', desc: 'Your Twitch broadcaster/channel ID. Required for Twitch API.', required: true, restart: true },
                        { param: 'broadcaster_name', type: 'string', default: '""', desc: 'Display name (used in dashboard/logs).', restart: true },
                        { param: 'twitch.client_id', type: 'string', default: '—', desc: 'Twitch application client ID for OAuth.', required: true, restart: true },
                        { param: 'twitch.client_secret', type: 'string', default: '—', desc: 'Twitch application client secret.', required: true, restart: true },
                        { param: 'ssn.session_id', type: 'string', default: '""', desc: 'SocialStream Ninja session ID. Required for live chat data.', restart: true },
                        { param: 'ssn.server', type: 'string', default: 'wss://io.socialstream.ninja', desc: 'SSN WebSocket server URL. Rarely needs changing.', restart: true },
                        { param: 'twitch_refresh_minutes', type: 'number', default: '10', desc: 'Auto-refresh interval for Twitch API data (subs, followers, bits).', restart: true }
                    ]
                },
                {
                    name: 'Filters & Behavior',
                    note: 'These can be edited live from the dashboard config editor.',
                    items: [
                        { param: 'days_filter', type: 'number', default: '30', desc: 'Default days for filtering followers and stats. Can be overridden per-page via ?days= URL param.', hot: true },
                        { param: 'subs_source', type: 'string', default: 'twitch', desc: 'Where to get subscriber data: "twitch" (API), "ssn" (live chat), or "both".', hot: true },
                        { param: 'active_subs_only', type: 'boolean', default: 'false', desc: 'If true, only show subscribers who also sent a chat message this session.', hot: true },
                        { param: 'exclude_users', type: 'array', default: '[]', desc: 'Usernames to exclude from all tracking. Case-insensitive. Comma-separated in dashboard.', hot: true }
                    ]
                },
                {
                    name: 'Credits Header',
                    note: 'All hot-reloadable via dashboard config editor.',
                    items: [
                        { param: 'credits.header.title', type: 'string', default: '"Thank you for your support!"', desc: 'Main title displayed at the top of the credits roll.', hot: true },
                        { param: 'credits.header.subtitle', type: 'string', default: '""', desc: 'Subtitle displayed below the title.', hot: true },
                        { param: 'credits.header.image', type: 'string', default: '""', desc: 'URL to an image shown above the title (logo, avatar, etc).', hot: true }
                    ]
                },
                {
                    name: 'Credits Closing',
                    items: [
                        { param: 'credits.closing', type: 'string', default: '"Thanks for watching!"', desc: 'Closing text shown at the bottom of credits. Use \\n for line breaks.', hot: true }
                    ]
                },
                {
                    name: 'Credits Sections',
                    note: 'Each section has enabled, title, and subtitle. Available sections: subscribers, followers, donations, gift_subs, cheerers, raids, emotes, hashtags, chatters.',
                    items: [
                        { param: 'credits.sections.{name}.enabled', type: 'boolean', default: 'true', desc: 'Show or hide this section in the credits roll.', hot: true },
                        { param: 'credits.sections.{name}.title', type: 'string', default: '(varies)', desc: 'Display title for this credits section.', hot: true },
                        { param: 'credits.sections.{name}.subtitle', type: 'string', default: '""', desc: 'Optional subtitle shown below the section title.', hot: true }
                    ]
                },
                {
                    name: 'Social Links',
                    items: [
                        { param: 'credits.social.title', type: 'string', default: '""', desc: 'Title shown above social links (e.g., "Find me online!").', hot: true },
                        { param: 'credits.social.subtitle', type: 'string', default: '""', desc: 'Subtitle below the social title.', hot: true },
                        { param: 'credits.social.links', type: 'array', default: '[]', desc: 'Array of { icon, handle } objects. Icon is a FontAwesome class (e.g., "fab fa-twitch") or an emoji.', hot: true }
                    ]
                }
            ]
        },
        {
            id: 'obs-setup',
            title: 'OBS Browser Source Setup',
            custom: true
        },
        {
            id: 'websocket',
            title: 'WebSocket Connection',
            custom: true
        },
        {
            id: 'data-files',
            title: 'Data Files & Persistence',
            custom: true
        },
        {
            id: 'timers',
            title: 'Named Timers',
            custom: true
        },
        {
            id: 'music',
            title: 'Music Now-Playing (Beta)',
            custom: true
        },
        {
            id: 'companion',
            title: 'Bitfocus Companion Setup',
            custom: true
        }
    ];

    function render() {
        const container = document.getElementById('content');
        let html = '';

        for (const section of sections) {
            html += `<h2 class="section-title" id="${section.id}">${section.title}</h2>`;

            if (section.custom) {
                html += renderCustomSection(section.id);
                continue;
            }

            for (const group of section.groups) {
                html += `<div class="card open">
                    <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
                        <strong style="font-size:0.9rem;">${group.name}</strong>
                        ${group.note ? `<span class="param-desc" style="margin-left:0.5rem;">${group.note}</span>` : ''}
                        <span class="chevron">▶</span>
                    </div>
                    <div class="card-body">
                        <table>
                            <tr>
                                <th>Parameter</th>
                                <th>Type</th>
                                <th>Default</th>
                                <th>Description</th>
                            </tr>
                            ${group.items.map(item => `
                                <tr>
                                    <td>
                                        <code>${item.param}</code>
                                        ${item.required ? '<span class="badge required">Required</span>' : ''}
                                        ${item.hot ? '<span class="badge hot">Hot-reload</span>' : ''}
                                        ${item.restart ? '<span class="badge default">Restart</span>' : ''}
                                    </td>
                                    <td style="color:#8b949e;">${item.type}</td>
                                    <td><code>${item.default}</code></td>
                                    <td>${item.desc}${item.example ? `<div class="url-box" style="margin-top:0.3rem;"><code>${BASE}${item.example.replace('?', group.name.includes('credits.html') ? '/credits.html?' : group.name.includes('stats.html') ? '/stats.html?' : group.name.includes('hashtags.html') ? '/hashtags.html?' : group.name.includes('export') ? '/api/export?' : '?')}</code><button class="copy-btn" onclick="copyUrl(this,'${BASE}${item.example.replace('?', group.name.includes('credits.html') ? '/credits.html?' : group.name.includes('stats.html') ? '/stats.html?' : group.name.includes('hashtags.html') ? '/hashtags.html?' : group.name.includes('export') ? '/api/export?' : '?')}')">Copy</button></div>` : ''}</td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                </div>`;
            }
        }

        container.innerHTML = html;
    }

    function renderCustomSection(id) {
        switch (id) {
            case 'obs-setup': return `
                <div class="card open">
                    <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
                        <strong style="font-size:0.9rem;">Credits Overlay</strong>
                        <span class="chevron">▶</span>
                    </div>
                    <div class="card-body">
                        <ul class="checklist">
                            <li>In OBS → Scene → Add <strong>Browser</strong> source</li>
                            <li>Set Width: <code>1920</code> and Height: <code>1080</code></li>
                            <li>Set URL (copy below)</li>
                            <li>Uncheck "Shutdown source when not visible" if triggering externally</li>
                            <li>Use <code>?preview=true</code> to test layout without scrolling</li>
                        </ul>
                        <div class="detail-label">Basic URL</div>
                        <div class="url-box"><code>${BASE}/credits.html</code><button class="copy-btn" onclick="copyUrl(this,'${BASE}/credits.html')">Copy</button></div>
                        <div class="detail-label">With Custom Duration (120s) and 7-day filter</div>
                        <div class="url-box"><code>${BASE}/credits.html?duration=120&days=7</code><button class="copy-btn" onclick="copyUrl(this,'${BASE}/credits.html?duration=120&days=7')">Copy</button></div>
                        <div class="detail-label">Preview Mode (no scroll)</div>
                        <div class="url-box"><code>${BASE}/credits.html?preview=true</code><button class="copy-btn" onclick="copyUrl(this,'${BASE}/credits.html?preview=true')">Copy</button></div>
                    </div>
                </div>
                <div class="card open">
                    <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
                        <strong style="font-size:0.9rem;">Stats Overlay</strong>
                        <span class="chevron">▶</span>
                    </div>
                    <div class="card-body">
                        <ul class="checklist">
                            <li>Add another <strong>Browser</strong> source</li>
                            <li>Set Width: <code>1920</code> and Height: <code>1080</code></li>
                            <li>Shows top chatters, emotes, and hashtags in a 3-column layout</li>
                            <li>Auto-refreshes every 60 seconds by default</li>
                        </ul>
                        <div class="detail-label">Basic URL</div>
                        <div class="url-box"><code>${BASE}/stats.html</code><button class="copy-btn" onclick="copyUrl(this,'${BASE}/stats.html')">Copy</button></div>
                        <div class="detail-label">Top 10, last 7 days, refresh every 30s</div>

    function copyUrl(btn, text) {
        navigator.clipboard.writeText(text).then(() => {
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
        });

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/admin.css">
    <script src="/appearance.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse — Documentation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg-page); color: var(--text); min-height: 100vh; }

        .header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.3rem; font-weight: 600; }
        .header h1 span { color: var(--accent); }
        .nav { display: flex; gap: 0.75rem; }
        .nav a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s; }
        .nav a:hover { color: var(--text); background: var(--bg-raised); }
        .nav a.active { color: var(--accent); background: var(--accent-bg); }

        .container { max-width: 1240px; margin: 0 auto; padding: 1.5rem 2rem; }
        .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 2rem; align-items: start; }
        .side { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; display: grid; gap: 0.7rem; }
        .search { width: 100%; padding: 0.55rem 0.75rem; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font: inherit; font-size: 0.85rem; }
        .search:focus { outline: none; border-color: var(--accent); }
        .toc { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem; }
        .toc h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin: 0.2rem 0.5rem 0.4rem; }
        .toc h3 { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint); margin: 0.7rem 0.5rem 0.2rem; }
        .toc a { color: var(--text-muted); text-decoration: none; font-size: 0.84rem; display: block; padding: 0.38rem 0.6rem; border-radius: 6px; border-left: 2px solid transparent; }
        .toc a:hover { color: var(--text); background: var(--bg-raised); }
        .toc a.active { color: var(--accent); background: var(--accent-bg); border-left-color: var(--accent); }
        .toc a.dim { opacity: 0.35; }
        .side-actions { display: flex; gap: 0.5rem; }
        .side-actions button { flex: 1; background: var(--bg-raised); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 0.4rem; font: inherit; font-size: 0.78rem; cursor: pointer; }
        .side-actions button:hover { border-color: var(--accent); }
        .no-results { color: var(--text-muted); text-align: center; padding: 3rem 1rem; display: none; }
        .hidden { display: none !important; }
        .card-header strong { font-size: 0.9rem; }
        td .url-box { margin-top: 0.3rem; }
        .kbd-hint { color: var(--text-muted); font-size: 0.72rem; }
        html { scroll-behavior: smooth; }

        .section-title { font-size: 1.05rem; font-weight: 600; color: var(--text); margin: 2rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); scroll-margin-top: 1rem; }
        .section-title:first-of-type { margin-top: 0; }

        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.75rem; overflow: hidden; }
        .card-header { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; cursor: pointer; user-select: none; }
        .card-header:hover { background: var(--bg-raised); }
        .card-header .chevron { color: var(--border-strong); font-size: 0.7rem; transition: transform 0.2s; margin-left: auto; flex-shrink: 0; }
        .card.open .chevron { transform: rotate(90deg); }
        .card-body { display: none; padding: 0 1rem 1rem; border-top: 1px solid var(--bg-raised); }
        .card.open .card-body { display: block; padding-top: 0.75rem; }

        .param-name { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.85rem; color: var(--accent-soft); font-weight: 600; }
        .param-desc { color: var(--text-muted); font-size: 0.8rem; }

        .badge { font-size: 0.65rem; padding: 0.15rem 0.45rem; border-radius: 4px; font-weight: 600; vertical-align: middle; margin-left: 0.4rem; }
        .badge.default { background: var(--accent-bg); color: var(--accent); border: 1px solid var(--border); }
        .badge.required { background: var(--danger-bg); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 19%, transparent); }
        .badge.page { background: color-mix(in srgb, var(--success) 18%, var(--bg-card)); color: var(--success); border: 1px solid color-mix(in srgb, var(--success) 19%, transparent); }
        .badge.hot { background: var(--warn-bg); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 19%, transparent); }

        .detail-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.3rem; margin-top: 0.6rem; }
        .detail-label:first-child { margin-top: 0; }
        .detail-text { font-size: 0.85rem; color: var(--text); line-height: 1.5; }

        .code-block { background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.75rem; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; color: var(--text); margin-top: 0.35rem; overflow-x: auto; white-space: pre; }

        .url-box { display: flex; align-items: center; gap: 0.5rem; background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.75rem; margin-top: 0.35rem; }
        .url-box code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; flex: 1; word-break: break-all; color: var(--text); }
        .copy-btn { background: var(--bg-raised); border: 1px solid var(--border); color: var(--text-muted); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .copy-btn:hover { border-color: var(--accent); color: var(--text); }
        .copy-btn.copied { border-color: var(--success); color: var(--success); }

        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.8rem; }
        table th { text-align: left; color: var(--text-muted); font-weight: 600; padding: 0.5rem 0.75rem; background: var(--bg-inset); border-bottom: 1px solid var(--border); }
        table td { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--bg-raised); }
        table code { background: var(--bg-raised); padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.8rem; }

        .checklist { list-style: none; padding: 0; }
        .checklist li { padding: 0.3rem 0; font-size: 0.85rem; }
        .checklist li::before { content: '✅ '; }

        .nav .dropdown { position: relative; display: flex; align-items: center; }
        .nav .dropdown-toggle { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: all 0.2s; cursor: pointer; display: block; }
        .nav .dropdown-toggle:hover { color: var(--text); background: var(--bg-raised); }
        .nav .dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.4rem 0; min-width: 180px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .nav .dropdown::after { content: ''; position: absolute; top: 100%; left: 0; right: 0; height: 8px; }
        .nav .dropdown:hover .dropdown-menu { display: block; }
        .nav .dropdown-menu a { display: block; padding: 0.5rem 1rem; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; transition: all 0.15s; }
        .nav .dropdown-menu a:hover { color: var(--text); background: var(--bg-raised); }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .side { position: static; max-height: none; }
        }
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>StreamPulse <span>Documentation</span></h1>
        <div id="main-nav" class="nav"></div>
        <script src="/nav.js"></script>
    </div>

    <div class="container">
        <div class="layout">
        <aside class="side">
            <input id="search" class="search" type="search" placeholder="Search docs…  ( / )" aria-label="Search documentation">
            <nav class="toc" id="toc"><h2>Contents</h2></nav>
            <div class="side-actions"><button id="expand-all">Expand all</button><button id="collapse-all">Collapse all</button></div>
        </aside>
        <main>
        <div id="content"></div>
        <div class="no-results" id="no-results">No documentation matches your search.</div>
        </main>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    const BASE = window.location.origin;

    const sections = [
        {
            id: 'getting-started',
            group: 'Getting Started',
            title: 'Installation & Prerequisites',
            custom: true
        },
        {
            id: 'how-it-works',
            group: 'Getting Started',
            title: 'How It Works & Features',
            custom: true
        },
        {
            id: 'obs-setup',
            group: 'Getting Started',
            title: 'OBS Browser Source Setup',
            custom: true
        },
        {
            id: 'url-params',
            group: 'Overlays & Features',
            title: 'URL Parameters',
            groups: [
                {
                    name: 'credits.html — Credits Overlay',
                    items: [
                        { param: 'duration', type: 'number', default: '82', desc: 'Base credits duration in seconds before socials appear. Overrides speed parameter.', example: '?duration=120' },
                        { param: 'speed', type: 'number', default: '1.0', desc: 'Speed multiplier. Total pre-social credits duration = 82 / speed. Ignored if duration is set.', example: '?speed=0.8' },
                        { param: 'days', type: 'number', default: '30', desc: 'Filter credits data to the last N days.', example: '?days=7' },
                        { param: 'datapath', type: 'string', default: './data', desc: 'Path to data directory. Rarely needed — server handles this.', example: '?datapath=./data' },
                        { param: 'preview', type: 'boolean', default: 'false', desc: 'Show full credits layout without scrolling. Great for testing in OBS.', example: '?preview=true' }
                    ]
                },
                {
                    name: 'goal.html — Goal Overlay',
                    items: [
                        { param: 'goal', type: 'string', default: 'first enabled goal', desc: 'Goal ID for single-goal mode.', example: '?goal=follower-goal' },
                        { param: 'mode', type: 'string', default: 'single', desc: 'Overlay mode: "single" or "cycle".', example: '?mode=cycle' },
                        { param: 'ids', type: 'string', default: 'all enabled goals', desc: 'Optional comma-separated subset of goal IDs to show in cycle mode.', example: '?mode=cycle&ids=follower-goal,community-goal' },
                        { param: 'interval', type: 'number', default: 'saved config', desc: 'Cycle interval override in seconds.', example: '?mode=cycle&interval=6' },
                        { param: 'skipcompleted', type: 'boolean', default: 'saved config', desc: 'Override whether completed goals are skipped in cycle mode.', example: '?mode=cycle&skipcompleted=false' },
                        { param: 'pausecomplete', type: 'number', default: 'saved config', desc: 'Extra hold time in seconds for completed goals during cycle mode.', example: '?mode=cycle&pausecomplete=2' },
                        { param: 'showlabel', type: 'string', default: 'auto', desc: 'Show the goal type label (e.g. Donations) under the title. auto hides it when the title already says the same thing; true always shows, false always hides.', example: '?showlabel=false' },
                        { param: 'fontscale', type: 'number', default: 'theme font scale', desc: 'Scale overlay font sizing.', example: '?fontscale=1.25' }
                    ]
                },
                {
                    name: 'stats.html — Stats Overlay',
                    items: [
                        { param: 'days', type: 'number', default: '0 (all time)', desc: 'Filter stats to last N days.', example: '?days=30' },
                        { param: 'date', type: 'string', default: '—', desc: 'Filter to a single date.', example: '?date=2026-03-14' },
                        { param: 'from', type: 'string', default: '—', desc: 'Start date for date range filter.', example: '?from=2026-03-01' },
                        { param: 'to', type: 'string', default: '—', desc: 'End date for date range filter.', example: '?to=2026-03-14' },
                        { param: 'limit', type: 'number', default: '20', desc: 'Max items shown per category (chatters, emotes, hashtags).', example: '?limit=10' },
                        { param: 'refresh', type: 'number', default: '60', desc: 'Auto-refresh interval in seconds.', example: '?refresh=30' }
                    ]
                },
                {
                    name: '/api/export — CSV Export',
                    items: [
                        { param: 'type', type: 'string', default: 'all', desc: 'Data type to export: chatters, emotes, hashtags, or all.', example: '?type=chatters' },
                        { param: 'days', type: 'number', default: '0 (all time)', desc: 'Limit export to last N days.', example: '?days=30' },
                        { param: 'date', type: 'string', default: '—', desc: 'Export single date.', example: '?date=2026-03-14' },
                        { param: 'from', type: 'string', default: '—', desc: 'Start date for range export.', example: '?from=2026-03-01' },
                        { param: 'to', type: 'string', default: '—', desc: 'End date for range export.', example: '?to=2026-03-14' }
                    ]
                },
                {
                    name: 'hashtags.html — Hashtags Overlay',
                    items: [
                        { param: 'view', type: 'string', default: 'scroll', desc: 'Display mode: "scroll" (credits-style list), "grid" (even tiles) or "cloud" (spiral word cloud sized by count).', example: '?view=cloud' },
                        { param: 'sort', type: 'string', default: 'count', desc: 'Sort order: "count" (most used), "alpha" (A-Z), "recent" (newest first).', example: '?sort=alpha' },
                        { param: 'columns', type: 'number', default: '3', desc: 'Number of columns (1–6 for scroll, 1–8 for grid; grid defaults to 4).', example: '?columns=2' },
                        { param: 'limit', type: 'number', default: '0 (all)', desc: 'Max hashtags to show. 0 = all (cloud shows the top 60; grid without scroll shows what fits).', example: '?limit=50' },
                        { param: 'min', type: 'number', default: '0 (all)', desc: 'Minimum usage count to display a hashtag. Great for filtering noise.', example: '?min=3' },
                        { param: 'days', type: 'number', default: '0 (all time)', desc: 'Filter to last N days.', example: '?days=30' },
                        { param: 'date', type: 'string', default: '—', desc: 'Filter to a single date.', example: '?date=2026-03-14' },
                        { param: 'from', type: 'string', default: '—', desc: 'Start date for range.', example: '?from=2026-03-01' },
                        { param: 'to', type: 'string', default: '—', desc: 'End date for range.', example: '?to=2026-03-14' },
                        { param: 'size', type: 'string', default: 'md', desc: 'Font size: "sm", "md", or "lg".', example: '?size=lg' },
                        { param: 'weight', type: 'boolean', default: 'false', desc: 'Cloud only: continuous font scaling by count. Default uses 3 tiers.', example: '?weight=true' },
                        { param: 'scroll', type: 'boolean', default: 'false', desc: 'Grid only: auto-scroll through every tag instead of showing only what fits.', example: '?scroll=true' },
                        { param: 'counts', type: 'boolean', default: 'true', desc: 'Show usage count next to each hashtag.', example: '?counts=false' },
                        { param: 'title', type: 'string', default: 'All Hashtags', desc: 'Custom title text (scroll view only).', example: '?title=Tonight%27s%20Tags' },
                        { param: 'duration', type: 'number', default: '0 (auto)', desc: 'Scroll duration in seconds. 0 = auto-calculated based on content length.', example: '?duration=60' },
                        { param: 'refresh', type: 'number', default: '60', desc: 'Auto-refresh interval in seconds (grid and cloud views).', example: '?refresh=30' }
                    ]
                },
                {
                    name: 'countdown.html / stopwatch.html — Timer Overlays',
                    items: [
                        { param: 'timer', type: 'string', default: '—', desc: 'Named timer slug managed by Timer Manager. Recommended for production use.', example: '?timer=starting-soon' },
                        { param: 'display', type: 'string', default: 'standard', desc: 'Layout: "standard", "compact", "stacked", "ring" (circular progress), "flip" (flip clock) or "banner" (full-width bar).', example: '?display=ring' },
                        { param: 'gradient', type: 'string', default: '—', desc: 'Animated gradient for the timer box: comma-separated hex colors (no #).', example: '?gradient=ff6a00,ee0979,6a11cb' },
                        { param: 'gradientspeed', type: 'number', default: '8', desc: 'Seconds per gradient animation cycle.', example: '?gradient=ff6a00,ee0979&gradientspeed=5' },
                        { param: 'gradientangle', type: 'number', default: '135', desc: 'Gradient angle in degrees.', example: '?gradient=ff6a00,ee0979&gradientangle=90' },
                        { param: 'theme', type: 'string', default: 'dark', desc: 'Theme preset: "dark" or "light".', example: '?theme=light' },
                        { param: 'title', type: 'string', default: 'timer label', desc: 'Override the timer label shown above the overlay.', example: '?title=Be%20Right%20Back' },
                        { param: 'showtitle', type: 'boolean', default: 'true', desc: 'Show or hide the timer title area entirely.', example: '?showtitle=false' },
                        { param: 'units', type: 'string', default: 'auto', desc: 'Show only necessary units ("auto") or always show days/hours/minutes/seconds ("full").', example: '?units=full' },
                        { param: 'milliseconds', type: 'boolean', default: 'false', desc: 'Append smaller trailing hundredths to the seconds value with no label or decimal.', example: '?milliseconds=true' },
                        { param: 'autostart', type: 'boolean', default: 'false', desc: 'Named timers only: start a stopped timer, or resume a paused stopwatch, when the overlay loads. Running timers are left alone.', example: '?autostart=true' },
                        { param: 'progress', type: 'boolean', default: 'timer default', desc: 'Countdown only: show or hide the progress bar.', example: '?progress=false' },
                        { param: 'sound', type: 'boolean', default: 'true', desc: 'Named countdown only: allow completion beep if globally enabled.', example: '?sound=false' },
                        { param: 'fontscale', type: 'number', default: '1', desc: 'Scale overlay font sizing.', example: '?fontscale=1.4' },
                        { param: 'bgcolor', type: 'string', default: 'transparent', desc: 'Optional page background hex without #. Leave blank for transparent OBS output.', example: '?bgcolor=000000' },
                        { param: 'timercolor', type: 'string', default: '000000B8', desc: 'Timer box background hex without #. Supports alpha with 8-digit hex.', example: '?timercolor=101820CC' },
                        { param: 'textcolor', type: 'string', default: 'F8FAFC', desc: 'Main numbers text color.', example: '?textcolor=FFFFFF' },
                        { param: 'labelcolor', type: 'string', default: 'CBD5E1', desc: 'Unit label/status color.', example: '?labelcolor=94A3B8' },
                        { param: 'progresscolor', type: 'string', default: '58A6FF', desc: 'Progress bar fill color.', example: '?progresscolor=3FB950' },

        {

        {
            id: 'music',

        {

        {

            group: 'Overlays & Features',
            title: 'Custom Overlays & Assets',

        },
        {
            id: 'alerts',
            group: 'Overlays & Features',

            custom: true
        },
        {
            id: 'game-plan',
            group: 'Overlays & Features',
            title: 'Game Plan',
            custom: true
        },
        {
            id: 'theme',
            group: 'Overlays & Features',
            title: 'Overlay Theme',

        },
        {
            id: 'config',
            group: 'Configuration & Data',

            groups: [
                {
                    name: 'Server & Connections',

                        { param: 'broadcaster_id', type: 'string', default: '—', desc: 'Your Twitch broadcaster/channel ID. Required for Twitch API.', required: true, restart: true },
                        { param: 'broadcaster_name', type: 'string', default: '""', desc: 'Display name (used in dashboard/logs).', restart: true },

                {

                        { param: 'viewer_tracking.source', type: 'string', default: '"best_available"', desc: 'Viewer count source preference. Uses recent SocialStream data first, then Twitch as a fallback.', hot: true },

    function render() {
        const container = document.getElementById('content');
        let html = '';

        for (const section of sections) {
            html += `<h2 class="section-title" id="${section.id}">${section.title}</h2>`;

            if (section.custom) {
                html += renderCustomSection(section.id);
                continue;
            }

            for (const group of section.groups) {
                html += `<div class="card open">
                    <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
                        <strong style="font-size:0.9rem;">${group.name}</strong>
                        ${group.note ? `<span class="param-desc" style="margin-left:0.5rem;">${group.note}</span>` : ''}
                        <span class="chevron">▶</span>
                    </div>
                    <div class="card-body">
                        <table>
                            <tr>
                                <th>Parameter</th>
                                <th>Type</th>
                                <th>Default</th>
                                <th>Description</th>
                            </tr>
                            ${group.items.map(item => `
                                <tr>
                                    <td>
                                        <code>${item.param}</code>
                                        ${item.required ? '<span class="badge required">Required</span>' : ''}
                                        ${item.hot ? '<span class="badge hot">Hot-reload</span>' : ''}
                                        ${item.restart ? '<span class="badge default">Restart</span>' : ''}
                                    </td>
                                    <td style="color:var(--text-muted);">${item.type}</td>
                                    <td><code>${item.default}</code></td>
                                    <td>${item.desc}${item.example ? `<div class="url-box" style="margin-top:0.3rem;"><code>${BASE}${item.example.replace('?', examplePathPrefix(group.name))}</code><button class="copy-btn" onclick="copyUrl(this,'${BASE}${item.example.replace('?', examplePathPrefix(group.name))}')">Copy</button></div>` : ''}</td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                </div>`;
            }
        }

        container.innerHTML = html;
        buildToc();
    }

    function buildToc() {
        const toc = document.getElementById('toc');
        let last = '';
        toc.innerHTML = '<h2>Contents</h2>' + sections.map(section => {
            const head = section.group !== last ? `<h3>${section.group}</h3>` : '';
            last = section.group;
            return head + `<a href="#${section.id}" data-id="${section.id}">${section.title}</a>`;
        }).join('');
    }

    function sectionBlocks() {
        return [...document.querySelectorAll('.section-title')].map(title => {
            const cards = [];
            for (let el = title.nextElementSibling; el && !el.classList.contains('section-title'); el = el.nextElementSibling) if (el.classList.contains('card')) cards.push(el);
            return { title, cards };
        });
    }

    function applySearch() {
        const query = document.getElementById('search').value.trim().toLowerCase();
        let anyVisible = false;
        for (const { title, cards } of sectionBlocks()) {
            let visible = 0;
            for (const card of cards) {
                const rows = [...card.querySelectorAll('tr')].filter(row => row.querySelector('td'));
                rows.forEach(row => row.classList.remove('hidden'));
                if (!query) { card.classList.remove('hidden'); visible++; continue; }
                const headerMatch = card.querySelector('.card-header').textContent.toLowerCase().includes(query);
                const bodyMatch = card.textContent.toLowerCase().includes(query);
                if (!headerMatch && !bodyMatch) { card.classList.add('hidden'); continue; }
                card.classList.remove('hidden'); card.classList.add('open'); visible++;
                if (!headerMatch && rows.length) rows.forEach(row => row.classList.toggle('hidden', !row.textContent.toLowerCase().includes(query)));
            }
            title.classList.toggle('hidden', !visible);
            document.querySelector(`#toc a[data-id="${title.id}"]`)?.classList.toggle('dim', !visible);
            if (visible) anyVisible = true;
        }
        document.getElementById('no-results').style.display = anyVisible ? 'none' : 'block';
    }

    function setupScrollSpy() {
        const links = [...document.querySelectorAll('#toc a')];
        const update = () => {
            let current = links[0];
            for (const link of links) {
                const title = document.getElementById(link.dataset.id);
                if (title && !title.classList.contains('hidden') && title.getBoundingClientRect().top < window.innerHeight * 0.3) current = link;
            }
            links.forEach(link => link.classList.toggle('active', link === current));
        };
        window.addEventListener('scroll', update, { passive: true });
        update();
    }

    document.getElementById('search').addEventListener('input', applySearch);
    document.getElementById('expand-all').addEventListener('click', () => document.querySelectorAll('.card:not(.hidden)').forEach(card => card.classList.add('open')));
    document.getElementById('collapse-all').addEventListener('click', () => document.querySelectorAll('.card').forEach(card => card.classList.remove('open')));
    document.addEventListener('keydown', event => {
        if (event.key === '/' && !event.target.matches('input, textarea')) { event.preventDefault(); document.getElementById('search').focus(); }
        if (event.key === 'Escape' && event.target.id === 'search') { event.target.value = ''; applySearch(); event.target.blur(); }
    });

    function examplePathPrefix(groupName) {
        if (groupName.includes('credits.html')) return '/credits.html?';
        if (groupName.includes('goal.html')) return '/goal.html?';
        if (groupName.includes('stats.html')) return '/stats.html?';
        if (groupName.includes('hashtags.html')) return '/hashtags.html?';
        if (groupName.includes('countdown.html')) return '/countdown.html?';
        if (groupName.includes('export')) return '/api/export?';
        return '?';
    }

        </div>
        <div class="card-body"><div class="detail-text">
            Alerts turn stream events into on-screen pop-ups. Each <strong>rule</strong> says <em>when</em> (a trigger and optional conditions) and <em>what</em> (one or more variants, plus optional timer or HTTP actions). Manage rules at <a href="/alerts.html">Alerts</a>.<br><br>

                <strong>Windows / Linux:</strong> Tools → Preferences<br><br>
                Then in all platforms:<br>
                • Click <strong>Show All</strong> (bottom-left) to enter advanced preferences<br>
                • Navigate to <strong>Interface → Main interfaces</strong><br>
                • Check <strong>Web</strong><br>
                • Expand <strong>Main interfaces → Lua</strong><br>
                • Set a <strong>Lua HTTP password</strong> (required for API access)<br>
                • Click <strong>Save</strong> and <strong>restart VLC</strong>
            </div>
            <div class="detail-label">2. Verify VLC is Responding</div>
            <div class="detail-text">
                Open <code>http://localhost:8080/requests/status.json</code> in your browser.<br>
                When prompted, leave the username blank and enter your password.<br>
                If you see JSON data, the HTTP interface is working.
            </div>
            <div class="detail-label">3. Configure StreamPulse</div>
            <div class="detail-text">
                Go to <a href="/music-editor.html" style="color:var(--accent);">Music Settings</a>, select <strong>VLC Media Player</strong> as the source, enter your host, port, and password, then click <strong>Test</strong> to verify the connection.
            </div>
            <div class="detail-label">Port Conflicts</div>
            <div class="detail-text">
                VLC defaults to port <strong>8080</strong>. If StreamPulse also runs on 8080, change one of them:<br>
                • Change StreamPulse's port in <code>config.json</code> → <code>"port"</code><br>
                • Or change VLC's port in its preferences under <strong>Lua HTTP</strong> settings
            </div>
            <div class="detail-label">Troubleshooting</div>
            <div class="detail-text">
                <strong>Connection refused:</strong> VLC isn't running, or the HTTP interface isn't enabled. Restart VLC after enabling Web.<br>
                <strong>401 Unauthorized:</strong> Wrong password. Check the password in VLC → Lua HTTP and in StreamPulse settings.<br>
                <strong>No artwork:</strong> Some files (e.g. WAV) may not have embedded artwork. VLC will serve art if the file's metadata includes it.<br>
                <strong>No metadata:</strong> Some file formats have limited tags. VLC will fall back to the filename for the track title.
            </div>
        </div>
    </div>
    <div class="card open">
        <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
            <strong style="font-size:0.9rem;">OBS Setup — Music Overlays</strong>
            <span class="chevron">▶</span>
        </div>
        <div class="card-body">
            <div class="detail-text">Add each mode as a separate <strong>Browser Source</strong> in OBS. Set the Width and Height to match the overlay sizes configured in <a href="/music-editor.html" style="color:var(--accent);">Music Settings</a>.</div>
            <div class="detail-label">Full Player (default: 420×120)</div>
            <div class="detail-text">Album art + song title, artist, and album in a horizontal layout.</div>
            <div class="url-box"><code>${BASE}/music.html?mode=full</code><button class="copy-btn" onclick="copyUrl(this,'${BASE}/music.html?mode=full')">Copy</button></div>
            <div class="detail-label">Art Only (default: 200×200)</div>
            <div class="detail-text">Album artwork with optional info overlay. Great for a corner display.</div>
            <div class="url-box"><code>${BASE}/music.html?mode=art</code><button class="copy-btn" onclick="copyUrl(this,'${BASE}/music.html?mode=art')">Copy</button></div>
            <div class="detail-label">Mini Bar (default: 400×40)</div>
            <div class="detail-text">Compact text-only bar. Configurable layout: single line, two lines, or two lines with album.</div>
            <div class="url-box"><code>${BASE}/music.html?mode=mini</code><button class="copy-btn" onclick="copyUrl(this,'${BASE}/music.html?mode=mini')">Copy</button></div>
        </div>
    </div>
    <div class="card open">
        <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
            <strong style="font-size:0.9rem;">config.json — Music Settings</strong>
            <span class="chevron">▶</span>
        </div>
        <div class="card-body">
            <table>
                <tr><th>Parameter</th><th>Type</th><th>Default</th><th>Description</th></tr>
                <tr><td><code>music.enabled</code> <span class="badge hot">Hot-reload</span></td><td>boolean</td><td><code>false</code></td><td>Enable or disable music polling. Starts/stops without server restart.</td></tr>
                <tr><td><code>music.source</code> <span class="badge hot">Hot-reload</span></td><td>string</td><td><code>"apple_music"</code></td><td>Music source: <code>"apple_music"</code> (macOS) or <code>"vlc"</code> (cross-platform). Changing restarts polling automatically.</td></tr>
                <tr><td><code>music.poll_seconds</code> <span class="badge hot">Hot-reload</span></td><td>number</td><td><code>5</code></td><td>How often to poll the music player (seconds).</td></tr>
                <tr><td><code>music.vlc.host</code></td><td>string</td><td><code>"localhost"</code></td><td>VLC HTTP interface hostname.</td></tr>
                <tr><td><code>music.vlc.port</code></td><td>number</td><td><code>8080</code></td><td>VLC HTTP interface port.</td></tr>
                <tr><td><code>music.vlc.password</code></td><td>string</td><td><code>""</code></td><td>VLC HTTP interface password (set in VLC → Lua HTTP).</td></tr>
                <tr><td><code>music.theme.font_family</code></td><td>string</td><td><code>"Segoe UI"</code></td><td>Font for overlay text.</td></tr>
                <tr><td><code>music.theme.text_color</code></td><td>string</td><td><code>"#ffffff"</code></td><td>Primary text color.</td></tr>
                <tr><td><code>music.theme.accent_color</code></td><td>string</td><td><code>"#58a6ff"</code></td><td>Artist name / accent color.</td></tr>
                <tr><td><code>music.theme.bg_color</code></td><td>string</td><td><code>"rgba(0,0,0,0.7)"</code></td><td>Background color (supports transparency).</td></tr>
                <tr><td><code>music.theme.sizes</code></td><td>object</td><td>—</td><td>Per-mode overlay dimensions: art {width,height}, full {width,height}, mini {width,height}. Match in OBS.</td></tr>
                <tr><td><code>music.theme.fields</code></td><td>object</td><td>all true</td><td>Toggle visibility: { track, artist, album, year, progress }.</td></tr>
                <tr><td><code>music.theme.art_persist_info</code></td><td>boolean</td><td><code>false</code></td><td>Keep track info permanently visible in Art Only mode.</td></tr>
                <tr><td><code>music.theme.mini_layout</code></td><td>string</td><td><code>"single"</code></td><td>Mini bar layout: "single", "two", or "two-album".</td></tr>
            </table>
        </div>
    </div>`;

            case 'companion': return `
                <div class="card open">
                    <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
                        <strong style="font-size:0.9rem;">Setup Guide</strong>
                        <span class="chevron">▶</span>
                    </div>
                    <div class="card-body">
                        <div class="detail-text">
                            Use the <strong>Generic HTTP</strong> module in Bitfocus Companion to trigger API endpoints from physical buttons.
                        </div>
                        <div class="detail-label">Steps</div>
                        <div class="detail-text">
                            1. Add a <strong>Generic HTTP</strong> connection<br>
                            2. Set Base URL to <code>${BASE}</code><br>
                            3. Create buttons with <strong>GET</strong> requests to the paths below<br>
                            4. Or use full URLs (copy from below)
                        </div>
                    </div>
                </div>
                <div class="card open">
                    <div class="card-header" onclick="this.parentElement.classList.toggle('open')">
                        <strong style="font-size:0.9rem;">Recommended Buttons</strong>
                        <span class="chevron">▶</span>
                    </div>
                    <div class="card-body">
                        <table>
                            <tr><th>Button Label</th><th>URL</th><th></th></tr>
                            <tr><td>▶ Start Session</td><td><code>/api/start-session</code></td><td><button class="copy-btn" onclick="copyUrl(this,'${BASE}/api/start-session')">Copy URL</button></td></tr>
                            <tr><td>🏁 End Session</td><td><code>/api/end-session</code></td><td><button class="copy-btn" onclick="copyUrl(this,'${BASE}/api/end-session')">Copy URL</button></td></tr>
                            <tr><td>🔄 Refresh Twitch</td><td><code>/api/fetch</code></td><td><button class="copy-btn" onclick="copyUrl(this,'${BASE}/api/fetch')">Copy URL</button></td></tr>

                            <tr><td>📊 Reset Stats</td><td><code>/api/stats/reset</code></td><td><button class="copy-btn" onclick="copyUrl(this,'${BASE}/api/stats/reset')">Copy URL</button></td></tr>
                            <tr><td>⏻ Shutdown</td><td><code>/api/shutdown</code></td><td><button class="copy-btn" onclick="copyUrl(this,'${BASE}/api/shutdown')">Copy URL</button></td></tr>

                </div>`;

            default: return '';
        }
    }

    function copyUrl(btn, text) {
        navigator.clipboard.writeText(text).then(() => {
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
        });
    }

    render();
    setupScrollSpy();
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    </script>
